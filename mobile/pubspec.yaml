name: gabo_live
description: GABO LIVE Flutter application migration.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.0.3
  google_fonts: ^6.3.2
  cached_network_image: ^3.4.1
  image_picker: ^1.2.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.1
  intl: ^0.20.2
  livekit_client: ^2.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
