<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090810">
<title>المنشورات | GABO LIVE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090810;--gold:#f1d28c;--purple:#8654dc;--muted:#aaa3b4;--line:#e7bd6330}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0%,#32204466,transparent 48%),var(--bg);color:#fff;font-family:Tajawal,system-ui}
.top{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#0d0b12;position:sticky;top:0;z-index:10}.brand{font-size:19px;font-weight:900;letter-spacing:1px;color:var(--gold)}.page{width:min(100%,620px);margin:auto;padding:18px 14px}h1{font-size:25px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin:0 0 18px}.card{border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#211a2c,#100e17);box-shadow:0 14px 40px #0005}
.composer{padding:14px;margin-bottom:16px}.composerHead,.postHead{display:flex;align-items:center;gap:10px;margin-bottom:10px}.avatar{width:42px;height:42px;border-radius:50%;background:#34264d;object-fit:cover;display:grid;place-items:center;overflow:hidden;flex:none;font-weight:900;color:var(--gold)}.avatar img{width:100%;height:100%;object-fit:cover}.identity{min-width:0;flex:1}.name{font-weight:900;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-size:11px;color:var(--muted);margin-top:2px}
textarea,input{width:100%;border:1px solid #ffffff1c;border-radius:12px;background:#0c0a12;color:#fff;padding:12px;font:inherit;outline:none}textarea{resize:vertical;min-height:86px;line-height:1.6}textarea:focus,input:focus{border-color:var(--purple)}.mediaRow{margin-top:9px}.mediaRow input{direction:ltr;text-align:left;font-size:12px}.composerFoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.hint{font-size:11px;color:var(--muted)}button{font:inherit;cursor:pointer}.primary{border:0;border-radius:12px;background:linear-gradient(120deg,#f1d28c,#b9863a);color:#211707;font-weight:900;padding:11px 18px}.primary:disabled{opacity:.5;cursor:wait}
.feed{display:flex;flex-direction:column;gap:13px}.post{padding:14px}.postText{font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;margin:13px 0}.postMedia{width:100%;max-height:440px;object-fit:contain;border-radius:13px;background:#08070c;display:block;margin-top:10px}.actions{display:flex;gap:8px;border-top:1px solid #ffffff12;padding-top:10px;margin-top:12px}.action{flex:1;border:1px solid #ffffff14;border-radius:10px;background:#ffffff08;color:#ddd4e9;padding:9px 5px;font-size:12px}.action.liked{color:#ff7da5;border-color:#ff477b44;background:#ff477b12}.comments{margin-top:12px;padding-top:10px;border-top:1px solid #ffffff12;display:none}.comments.open{display:block}.comment{font-size:12px;line-height:1.7;padding:7px 0;border-bottom:1px solid #ffffff0d}.comment b{color:var(--gold);margin-left:5px}.commentForm{display:flex;gap:7px;margin-top:9px}.commentForm input{min-width:0;flex:1;font-size:12px}.commentForm button{border:0;border-radius:10px;background:#34234e;color:#fff;padding:0 13px;font-weight:800}.empty,.status{padding:25px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8}.error{color:#ff8b9c}.success{color:#82e0b1}.delete{border:0;background:none;color:#ff8798;font-size:12px;padding:5px}
</style></head>
<body><header class="top"><div class="brand">GABO LIVE ✦</div><span id="feedState" class="hint">جاري التحميل...</span></header>
<main class="page"><h1>المنشورات</h1><p class="sub">شارك لحظاتك وأفكارك مع مجتمع GABO LIVE.</p>
<section class="card composer"><div class="composerHead"><div class="avatar" id="myAvatar">G</div><b id="myName">حسابك</b></div>
<textarea id="postText" maxlength="3000" placeholder="وش حاب تشارك اليوم؟"></textarea><div class="mediaRow"><input id="mediaUrl" type="url" placeholder="رابط صورة أو فيديو (اختياري)" autocomplete="url"></div>
<div class="composerFoot"><span class="hint">نص أو رابط صورة/فيديو.</span><button class="primary" id="publishBtn">نشر</button></div><div id="composerStatus" class="hint" role="status"></div></section>
<section id="feed" class="feed" aria-live="polite"><div class="card empty">جاري تحميل المنشورات...</div></section></main>
<script type="module">
import{auth,db}from'/firebase-config.js';
import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import{doc,getDoc,collection,addDoc,setDoc,deleteDoc,query,orderBy,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v);return['https:','http:'].includes(u.protocol)?u.href:''}catch{return''}};
let user=null,profile={},feedStop=null,childStops=new Map(),cache=new Map(),childState=new Map();
function status(t,c=''){$('composerStatus').textContent=t;$('composerStatus').className='hint '+c}
function makeAvatar(url,name){const u=safeUrl(url);return u?'<img alt="" src="'+esc(u)+'">':esc((name||'G').trim().charAt(0)||'G')}
function draw(id,d){const s=childState.get(id)||{likes:[],comments:[]},mine=d.uid===user.uid||d.userId===user.uid,liked=s.likes.includes(user.uid),name=d.name||d.displayName||'عضو GABO',photo=d.photoURL||d.avatar||'',txt=d.text||d.caption||'',media=safeUrl(d.mediaUrl||d.imageUrl||d.image||d.videoUrl||''),video=!!(d.videoUrl||d.type==='video'),date=d.createdAt?.toDate?d.createdAt.toDate().toLocaleString('ar-SA',{dateStyle:'medium',timeStyle:'short'}):'الآن';
const comments=s.comments.map(c=>'<div class="comment"><b>'+esc(c.name||'عضو')+'</b>'+esc(c.text)+'</div>').join('');
return'<article class="card post" data-post="'+esc(id)+'"><div class="postHead"><div class="avatar">'+makeAvatar(photo,name)+'</div><div class="identity"><div class="name">'+esc(name)+'</div><div class="time">'+esc(date)+'</div></div>'+(mine?'<button class="delete" data-delete="'+esc(id)+'">حذف</button>':'')+'</div>'+(txt?'<div class="postText">'+esc(txt)+'</div>':'')+(media?(video?'<video class="postMedia" controls playsinline preload="metadata" src="'+esc(media)+'"></video>':'<img class="postMedia" loading="lazy" alt="مرفق المنشور" src="'+esc(media)+'">'):'')+'<div class="actions"><button class="action '+(liked?'liked':'')+'" data-like="'+esc(id)+'">'+(liked?'♥ أعجبك':'♡ إعجاب')+' · '+s.likes.length+'</button><button class="action" data-comments="'+esc(id)+'">💬 التعليقات · '+s.comments.length+'</button></div><div class="comments" id="comments-'+esc(id)+'">'+comments+'<form class="commentForm" data-comment="'+esc(id)+'"><input maxlength="2000" required placeholder="اكتب تعليقاً..."><button>إرسال</button></form></div></article>'}
function redraw(id){const d=cache.get(id);if(!d)return;const old=document.querySelector('[data-post="'+CSS.escape(id)+'"]');if(old){const wrap=document.createElement('div');wrap.innerHTML=draw(id,d);old.replaceWith(wrap.firstElementChild)}}
function watchChildren(id){const state={likes:[],comments:[]};childState.set(id,state);const a=onSnapshot(collection(db,'posts',id,'likes'),s=>{state.likes=s.docs.map(x=>x.id);redraw(id)});const b=onSnapshot(query(collection(db,'posts',id,'comments'),orderBy('createdAt','asc')),s=>{state.comments=s.docs.map(x=>x.data());redraw(id)});childStops.set(id,()=>{a();b();childState.delete(id)})}
function startFeed(){feedStop?.();feedStop=onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc')),snap=>{const ids=snap.docs.map(d=>d.id),live=new Set(ids);for(const[id,stop]of childStops)if(!live.has(id)){stop();childStops.delete(id);cache.delete(id)}$('feedState').textContent=snap.size+' منشور';if(!ids.length){$('feed').innerHTML='<div class="card empty">لا توجد منشورات بعد. كن أول من يشارك ✨</div>';return}$('feed').innerHTML=ids.map(id=>{const d=snap.docs.find(x=>x.id===id);cache.set(id,d.data());if(!childState.has(id))childState.set(id,{likes:[],comments:[]});return draw(id,d.data())}).join('');for(const id of ids)if(!childStops.has(id))watchChildren(id)},err=>{$('feed').innerHTML='<div class="card empty error">تعذر تحميل المنشورات: '+esc(err.message)+'</div>'})}
onAuthStateChanged(auth,async u=>{if(!u){location.replace('/login/');return}user=u;try{const s=await getDoc(doc(db,'users',u.uid));profile=s.exists()?s.data():{}}catch(e){console.error(e)}const name=profile.displayName||profile.name||u.displayName||'عضو GABO';$('myName').textContent=name;$('myAvatar').innerHTML=makeAvatar(profile.photoURL||profile.photo||u.photoURL,name);startFeed()});
$('publishBtn').addEventListener('click',async()=>{if(!user)return;const text=$('postText').value.trim(),raw=$('mediaUrl').value.trim(),media=safeUrl(raw);if(!text&&!raw){status('اكتب شيئاً أو أضف رابط صورة/فيديو.','error');return}if(raw&&!media){status('الرابط غير صحيح. استخدم رابطاً صالحاً.','error');return}const btn=$('publishBtn');btn.disabled=true;status('جاري نشر المنشور...');try{const video=media&&/\.(mp4|webm|mov)(\?|$)/i.test(new URL(media).pathname);await addDoc(collection(db,'posts'),{uid:user.uid,userId:user.uid,name:profile.displayName||profile.name||user.displayName||'عضو GABO',photoURL:profile.photoURL||profile.photo||user.photoURL||'',text,mediaUrl:media,type:video?'video':'image',visibility:'public',createdAt:serverTimestamp(),likesCount:0,commentsCount:0});$('postText').value='';$('mediaUrl').value='';status('تم نشر منشورك بنجاح.','success')}catch(e){status('تعذر النشر: '+e.message,'error')}finally{btn.disabled=false}});
$('feed').addEventListener('click',async e=>{const like=e.target.closest('[data-like]'),del=e.target.closest('[data-delete]'),comments=e.target.closest('[data-comments]');if(like){const ref=doc(db,'posts',like.dataset.like,'likes',user.uid);try{const s=await getDoc(ref);if(s.exists())await deleteDoc(ref);else await setDoc(ref,{uid:user.uid,createdAt:serverTimestamp()})}catch(err){alert('تعذر تحديث الإعجاب: '+err.message)}return}if(del){const id=del.dataset.delete;if(confirm('هل تريد حذف هذا المنشور؟'))try{await deleteDoc(doc(db,'posts',id))}catch(err){alert('تعذر حذف المنشور: '+err.message)}return}if(comments)$('comments-'+comments.dataset.comments)?.classList.toggle('open')});
$('feed').addEventListener('submit',async e=>{const form=e.target.closest('[data-comment]');if(!form)return;e.preventDefault();const input=form.querySelector('input'),text=input.value.trim();if(!text)return;const btn=form.querySelector('button');btn.disabled=true;try{await addDoc(collection(db,'posts',form.dataset.comment,'comments'),{uid:user.uid,text,name:profile.displayName||profile.name||user.displayName||'عضو GABO',photoURL:profile.photoURL||profile.photo||user.photoURL||'',createdAt:serverTimestamp()});input.value=''}catch(err){alert('تعذر إرسال التعليق: '+err.message)}finally{btn.disabled=false}});
addEventListener('pagehide',()=>{feedStop?.();for(const stop of childStops.values())stop()});
</script><script type="module" src="/js/unified-bottom-nav.js"></script></body></html>
