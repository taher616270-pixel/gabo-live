<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GABO LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#08050f}
body{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  background:radial-gradient(900px 600px at 50% 0%,rgba(124,58,237,.4),#08050f);
  font-family:system-ui,-apple-system,sans-serif;
}

.stage{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  animation:stageIn 4.5s cubic-bezier(.16,1,.3,1) forwards;
}

.word{
  font-size:38px;
  font-weight:900;
  letter-spacing:6px;
  line-height:1;
  will-change:transform;
}
.gabo{
  color:#fff;
  animation:toLeft 4.5s cubic-bezier(.16,1,.3,1) forwards;
}
.live{
  background:linear-gradient(90deg,#a78bfa,#f59e0b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:toRight 4.5s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes stageIn{
  0%{transform:scale(0.2);opacity:0}
  20%{transform:scale(0.7);opacity:1}
  45%{transform:scale(1.2)}
  65%{transform:scale(1.2)}
  100%{transform:scale(1.2)}
}
@keyframes toLeft{
  0%,55%{transform:translateX(0)}
  100%{transform:translateX(-160%)}
}
@keyframes toRight{
  0%,55%{transform:translateX(0)}
  100%{transform:translateX(160%)}
}

.door{
  position:fixed;inset:0;
  display:flex;
  pointer-events:none;
}
.door span{
  flex:1;
  background:#08050f;
  transition:none;
}
.door .l{animation:doorL 4.5s forwards}
.door .r{animation:doorR 4.5s forwards}
@keyframes doorL{0%,65%{transform:translateX(0)}100%{transform:translateX(-100%)}}
@keyframes doorR{0%,65%{transform:translateX(0)}100%{transform:translateX(100%)}}

.flash{
  position:fixed;inset:0;
  background:#fff;
  opacity:0;
  animation:flash 4.5s forwards;
  pointer-events:none;
}
@keyframes flash{0%,84%{opacity:0}100%{opacity:1}}
</style>
</head>
<body>

<div class="stage">
  <div class="word gabo">GABO</div>
  <div class="word live">LIVE</div>
</div>

<div class="door"><span class="l"></span><span class="r"></span></div>
<div class="flash"></div>

<script>
setTimeout(()=> location.replace('/login/'), 4200);
</script>
</body>
</html>
