<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GABO LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#08050f;
  height:100vh;
  height:100dvh;
  display:grid;
  place-items:center;
  overflow:hidden;
  font-family:system-ui;
}
.intro{
  text-align:center;
  animation:introAnim 5s cubic-bezier(.16,1,.3,1) forwards;
}
.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:6px;
  color:#fff;
}
.logo b{color:#8b5cf6}
.sub{
  margin-top:10px;
  color:#ffffff70;
  letter-spacing:4px;
  font-size:11px;
}

/* الحركة */
@keyframes introAnim{
  0%{transform:scale(0.2);opacity:0}
  20%{transform:scale(0.6);opacity:1}
  50%{transform:scale(1.1)} /* نصف الشاشة */
  80%{transform:scale(1.6)} /* يكبر */
  100%{transform:scale(20);opacity:0} /* يملي الصفحة ويختفي */
}

/* خلفية تتمدد */
.bg{
  position:fixed;inset:0;
  background:#08050f;
  z-index:-1;
  animation:bgAnim 5s forwards;
}
@keyframes bgAnim{
  80%{background:#08050f}
  100%{background:#ffffff} /* يصير أبيض ويدخل صفحة الدخول */
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="intro">
  <div class="logo">GABO <b>LIVE</b></div>
  <div class="sub">LIVE AUDIO COMMUNITY</div>
</div>

<script>
// بعد 5 ثواني يروح تسجيل الدخول
setTimeout(()=>{
  location.href='/login/';
},5000);
</script>
</body>
</html>
