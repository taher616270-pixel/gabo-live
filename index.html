<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>GABO LIVE</title>
<style>
body{margin:0;height:100vh;background:#08050f;display:grid;place-items:center;overflow:hidden;font-family:system-ui}
.splash{animation:grow 4.5s cubic-bezier(.2,1,.2,1) forwards;text-align:center}
.logo{font-size:24px;font-weight:900;letter-spacing:6px;color:#fff}
.logo b{color:#8b5cf6}
@keyframes grow{
0%{transform:scale(.2);opacity:0}
30%{transform:scale(.8);opacity:1}
60%{transform:scale(1.3)}
100%{transform:scale(25);opacity:0}
}
</style>
</head>
<body>
<div class="splash" id="s">
<div class="logo">GABO <b>LIVE</b></div>
</div>
<script>
setTimeout(()=>{location.href='/login/?v='+Date.now()},4500);
</script>
</body>
</html>
