<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<title>GABO LIVE</title>
<link rel="prefetch" href="/login/" as="document">
<noscript><meta http-equiv="refresh" content="0;url=/login/"></noscript>
<style>
:root{--bg:#08070d;--v:#7c3aed;--vl:#a78bfa}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{position:fixed;inset:0;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
.flood{position:absolute;top:0;bottom:0;left:50%;width:70vw;margin-left:-35vw;background:radial-gradient(ellipse at center,rgba(167,139,250,.55),rgba(124,58,237,.25) 40%,transparent 70%);opacity:0;transform:scaleX(.2);will-change:transform,opacity}
.open .flood{animation:flood 1s cubic-bezier(.22,1,.36,1) forwards}
@keyframes flood{0%{opacity:0;transform:scaleX(.2)}30%{opacity:1}100%{opacity:0;transform:scaleX(1.6)}}
.panel{position:absolute;top:0;bottom:0;width:50%;background:var(--bg);display:flex;align-items:center;will-change:transform;transition:transform .85s cubic-bezier(.76,0,.24,1)}
.l{left:0;justify-content:flex-end;padding-right:.2em}.r{right:0;justify-content:flex-start;padding-left:.2em}
.open .l{transform:translate3d(-101%,0,0)}.open .r{transform:translate3d(101%,0,0)}
.word{font-size:clamp(34px,11vw,60px);font-weight:900;letter-spacing:.14em;line-height:1;opacity:0;will-change:transform,opacity;animation:pop 1s cubic-bezier(.16,1,.3,1) .1s forwards}
.gabo{color:#fff;transform-origin:100% 50%;margin-right:-.07em}
.live{color:var(--v);transform-origin:0 50%;margin-left:-.07em;text-shadow:0 0 18px rgba(124,58,237,.9),0 0 42px rgba(124,58,237,.55);animation:pop 1s cubic-bezier(.16,1,.3,1) .1s forwards,beat 1s ease-in-out 1.1s infinite}
@keyframes pop{0%{opacity:0;transform:scale(.2)}35%{opacity:1}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1.08)}}@keyframes beat{0%,100%{opacity:1}50%{opacity:.72}}
.glow{position:absolute;left:50%;top:50%;width:90vmin;height:90vmin;margin:-45vmin 0 0 -45vmin;background:radial-gradient(circle,rgba(124,58,237,.38),transparent 62%);pointer-events:none;opacity:0;will-change:opacity,transform;animation:glowIn 1.2s ease-out .2s forwards}
.open .glow{animation:glowOut .35s ease-in forwards}
@keyframes glowIn{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}@keyframes glowOut{to{opacity:0;transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){.word{animation:none;opacity:1;transform:none}.live{animation:none}.glow{animation:none;opacity:1}.panel{transition:none}.open .flood{animation:none}}
</style>
</head>
<body>
<div class="flood"></div>
<div class="panel l"><div class="word gabo">GABO</div></div>
<div class="panel r"><div class="word live">LIVE</div></div>
<div class="glow"></div>

<script>
(function () {
  var LOGIN = '/login/';
  var target = LOGIN;
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var done = false;

  var warm = fetch(LOGIN, { credentials: 'same-origin' }).catch(function () {});

  // هذا السطر الجديد اللي يصلح المشكلة - يفحص هل المستخدم مسجل دخول
  var ready = import('/firebase-config.js').then(function (m) {
    return m.auth.authStateReady().then(function () {
      if (m.auth.currentUser) target = '/app/';
    });
  }).catch(function () {});

  function go() {
    if (done) return;
    done = true;
    Promise.race([Promise.all([warm, ready]), new Promise(function (r) { setTimeout(r, 900); })])
      .then(function () { location.replace(target); });
  }

  function open() {
    if (done) return;
    document.body.classList.add('open');
  }

  document.querySelector('.r').addEventListener('transitionend', go, { once: true });
  setTimeout(open, reduce ? 300 : 1500);
  setTimeout(go, reduce ? 900 : 3200);
  addEventListener('pointerdown', go, { once: true });
  addEventListener('keydown', go, { once: true });
})();
</script>
</body>
</html>
