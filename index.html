<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GABO LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  position:fixed;inset:0;
  background:#08070d;
  overflow:hidden;
  font-family:system-ui,-apple-system;
  display:flex;align-items:center;justify-content:center;
}
.word{font-size:42px;font-weight:900;letter-spacing:6px}
.gabo{color:#fff}.live{color:#7c3aed}

.center{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:#08070d;
  z-index:5;
  animation:pop 1.8s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes pop{
  0%{transform:scale(.2);opacity:0}
  25%{opacity:1}
  65%{transform:scale(1.15)}
  100%{transform:scale(1.15)}
}

.split{
  position:fixed;inset:0;
  z-index:6;
  display:flex;
  pointer-events:none;
}
.side{flex:1;background:#08070d;display:flex;align-items:center}
.side.l{justify-content:flex-end;padding-right:6px}
.side.r{justify-content:flex-start;padding-left:6px}

.open .l{animation:goL .9s cubic-bezier(.76,0,.24,1) forwards}
.open .r{animation:goR .9s cubic-bezier(.76,0,.24,1) forwards}
@keyframes goL{to{transform:translateX(-100%)}}
@keyframes goR{to{transform:translateX(100%)}}
</style>
</head>
<body>

<div class="center" id="c">
  <div class="word gabo">GABO</div>
  <div class="word live">LIVE</div>
</div>

<div class="split" id="s">
  <div class="side l"><div class="word gabo">GABO</div></div>
  <div class="side r"><div class="word live">LIVE</div></div>
</div>

<script>
const c=document.getElementById('c');
const s=document.getElementById('s');

setTimeout(()=>{
  c.style.opacity='0';
  c.style.transition='opacity .3s';
  s.classList.add('open');
},1500);

setTimeout(()=>{
  location.replace('/login/');
},2400);
</script>
</body>
</html>
