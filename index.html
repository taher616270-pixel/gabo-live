<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>GABO LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#08050f}
body{
  height:100vh;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,.35),transparent 55%),#08050f;
  font-family:system-ui,-apple-system,Segoe UI;
}
.stage{
  text-align:center;
  animation:zoomStage 4.8s cubic-bezier(0.16,1,0.3,1) forwards;
  will-change:transform,opacity;
}
.logo{
  font-weight:900;
  letter-spacing:0.22em;
  line-height:1;
  font-size:22px;
  color:#fff;
  text-shadow:0 10px 40px rgba(124,58,237,.6);
}
.logo b{
  color:#a78bfa;
  background:linear-gradient(90deg,#8b5cf6,#f59e0b);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.sub{
  margin-top:14px;
  font-size:10px;
  letter-spacing:0.4em;
  color:rgba(255,255,255,.55);
  opacity:0;
  animation:fadeSub 0.8s 0.6s forwards;
}

@keyframes zoomStage{
  0%{transform:scale(0.18);opacity:0;filter:blur(10px)}
  18%{transform:scale(0.55);opacity:1;filter:blur(0)}
  45%{transform:scale(1.05)}
  68%{transform:scale(1.45)}
  85%{transform:scale(2.2);opacity:1}
  100%{transform:scale(18);opacity:0;filter:blur(12px)}
}
@keyframes fadeSub{to{opacity:1}}

/* خلفية تبيض في النهاية */
.flash{
  position:fixed;inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
  animation:flash 4.8s forwards;
}
@keyframes flash{
  0%,88%{opacity:0}
  100%{opacity:1}
}
</style>
</head>
<body>
<div class="stage">
  <div class="logo">GABO <b>LIVE</b></div>
  <div class="sub">LIVE AUDIO COMMUNITY</div>
</div>
<div class="flash"></div>

<script>
// منع الكاش + انتقال تلقائي
if(location.search.includes('v=')){
  // جاي من كاش قديم - امسح
  history.replaceState(null,'','/');
}
setTimeout(()=>{
  location.replace('/login/?t='+Date.now());
},4800);
</script>
</body>
</html>
