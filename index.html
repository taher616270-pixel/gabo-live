<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070d">
<meta name="description" content="GABO LIVE — عالمك يبدأ هنا">
<title>GABO LIVE | عالمك يبدأ هنا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#08070d;--gold:#e8c779;--gold2:#a77a32;--purple:#8b5cf6;--muted:#aaa4b8}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{font-family:"Tajawal",system-ui,sans-serif;background:var(--bg);color:#fff;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 38%,rgba(111,65,184,.22),transparent 38%),radial-gradient(ellipse at 18% 82%,rgba(194,145,65,.10),transparent 32%),radial-gradient(ellipse at 85% 15%,rgba(111,65,184,.12),transparent 30%);z-index:-2}
.ambient{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.orb{position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(75px);opacity:.18;animation:drift 12s ease-in-out infinite alternate}
.orb.one{background:#7c3aed;top:8%;right:-100px}
.orb.two{background:#b8893d;bottom:0;left:-120px;animation-delay:-5s}
@keyframes drift{to{transform:translate3d(35px,-28px,0) scale(1.18)}}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 22px calc(30px + env(safe-area-inset-bottom));text-align:center}
.brand{position:relative;display:grid;place-items:center;margin-bottom:34px;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.emblem{width:112px;height:112px;border:1px solid rgba(232,199,121,.65);border-radius:32px;display:grid;place-items:center;position:relative;transform:rotate(45deg);background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.015));box-shadow:0 0 0 8px rgba(232,199,121,.035),0 0 48px rgba(139,92,246,.23),inset 0 0 28px rgba(232,199,121,.08)}
.emblem:before,.emblem:after{content:"";position:absolute;inset:9px;border:1px solid rgba(139,92,246,.55);border-radius:25px}
.emblem:after{inset:-10px;border-color:rgba(232,199,121,.18);border-radius:39px}
.emblem span{transform:rotate(-45deg);font-size:37px;font-weight:900;letter-spacing:-4px;background:linear-gradient(110deg,#fff4d4 10%,#d7aa55 48%,#fff0c1 80%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 8px 25px rgba(232,199,121,.12)}
.wordmark{margin-top:32px;font-size:clamp(36px,10vw,58px);font-weight:900;letter-spacing:4px;direction:ltr;line-height:1}
.wordmark .gabo{color:#fff}
.wordmark .live{background:linear-gradient(100deg,#b99aff,#8b5cf6,#e4c078);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin:18px 0 0;color:#d8d2e2;font-size:18px;font-weight:600;letter-spacing:.3px;animation:rise 1s .12s both}
.description{max-width:420px;margin:10px auto 0;color:var(--muted);font-size:14px;line-height:1.9;animation:rise 1s .2s both}
.actions{width:min(100%,350px);display:grid;gap:12px;margin-top:34px;animation:rise 1s .3s both}
.btn{min-height:54px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;font:800 16px "Tajawal",sans-serif;transition:transform .2s,box-shadow .2s}
.btn:active{transform:scale(.98)}
.primary{color:#21170a;background:linear-gradient(110deg,#f0d99b,#c99b4c 55%,#f3dfa8);box-shadow:0 10px 30px rgba(201,155,76,.18),inset 0 1px rgba(255,255,255,.6)}
.primary:hover{box-shadow:0 12px 38px rgba(201,155,76,.3)}
.secondary{color:#eee8fa;border:1px solid rgba(160,126,220,.38);background:rgba(255,255,255,.035);backdrop-filter:blur(12px)}
.secondary:hover{border-color:rgba(232,199,121,.6)}
.foot{margin-top:38px;color:#777184;font-size:12px;letter-spacing:1.4px;animation:rise 1s .4s both}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#f3d58f;box-shadow:0 0 14px 3px rgba(243,213,143,.55);animation:twinkle 2.8s ease-in-out infinite}
.s1{top:4%;right:23%;animation-delay:.2s}.s2{top:23%;left:18%;animation-delay:1.1s}.s3{bottom:18%;right:15%;animation-delay:1.8s}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.5)}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i class="orb one"></i><i class="orb two"></i><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i></div>
<main>
  <section class="brand" aria-label="GABO LIVE">
    <div class="emblem"><span>G</span></div>
    <div class="wordmark"><span class="gabo">GABO</span> <span class="live">LIVE</span></div>
    <p class="tagline">عالمك يبدأ هنا</p>
    <p class="description">مساحتك للتواصل، اكتشاف المجتمعات وصناعة لحظاتك — كل شيء يجمعك بعالم GABO LIVE.</p>
  </section>
  <nav class="actions" aria-label="روابط الدخول">
    <a class="btn primary" href="/login/">ابدأ الآن <span aria-hidden="true">←</span></a>
    <a class="btn secondary" href="/login/">تسجيل الدخول</a>
  </nav>
  <footer class="foot">GABO LIVE <span aria-hidden="true">·</span> YOUR WORLD, YOUR MOMENT</footer>
</main>
</body>
</html>
