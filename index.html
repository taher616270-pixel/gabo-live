<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GABO LIVE</title>
<style>
:root{--bg:#08070d;--v:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{position:fixed;inset:0;overflow:hidden;font-family:system-ui}

.stage{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}

.word{
  font-size:clamp(18px, 5vw, 28px);
  font-weight:900;letter-spacing:.18em;
  opacity:0;
  /* 1- يبدأ صغير ويكبر لنص الشاشة */
  animation: grow 1.2s cubic-bezier(.16,1,.3,1) forwards;
}
.gabo{color:#fff;margin-right:4px}
.live{color:var(--v);text-shadow:0 0 20px rgba(124,58,237,.9);animation: grow 1.2s cubic-bezier(.16,1,.3,1) forwards, glow 1s ease 1.2s infinite}

@keyframes grow{
  0%{opacity:0;transform:scale(.2)}
  40%{opacity:1}
  100%{opacity:1;transform:scale(2.8)} /* يكبر لنص الشاشة واضح */
}

.panel{
  position:absolute;top:0;bottom:0;width:50%;background:var(--bg);
  display:flex;align-items:center;
  transition:transform .9s cubic-bezier(.76,0,.24,1);
  z-index:10;
}
.l{left:0;justify-content:flex-end;padding-right:.2em}
.r{right:0;justify-content:flex-start;padding-left:.2em}
.open .l{transform:translate3d(-102%,0,0)}
.open .r{transform:translate3d(102%,0,0)}

.panel .word{animation:none;opacity:1;transform:scale(2.8);font-size:clamp(18px, 5vw, 28px)}

@keyframes glow{0%,100%{opacity:1}50%{opacity:.6}}

.glow-bg{
  position:absolute;left:50%;top:50%;width:80vmin;height:80vmin;margin:-40vmin 0 0 -40vmin;
  background:radial-gradient(circle,rgba(124,58,237,.35),transparent 65%);
  opacity:0;animation: glowIn 1s ease .3s forwards;
}
@keyframes glowIn{to{opacity:1}}
.open .glow-bg{opacity:0;transition:.4s}
</style>
</head>
<body>

<div class="glow-bg"></div>

<!-- المرحلة 1: في النص صغير يكبر -->
<div class="stage" id="stage">
  <div class="word gabo">GABO</div>
  <div class="word live">LIVE</div>
</div>

<!-- المرحلة 2: ينقسم يسار يمين -->
<div class="panel l" id="panelL" style="opacity:0"><div class="word gabo">GABO</div></div>
<div class="panel r" id="panelR" style="opacity:0"><div class="word live">LIVE</div></div>

<script>
(function(){
  var LOGIN='/login/';
  var stage=document.getElementById('stage');
  var pl=document.getElementById('panelL');
  var pr=document.getElementById('panelR');
  var done=false;

  var warm=fetch(LOGIN,{credentials:'same-origin'}).catch(function(){});

  function go(){
    if(done) return;
    done=true;
    Promise.race([warm,new Promise(r=>setTimeout(r,400))]).then(()=>location.replace(LOGIN));
  }

  // بعد 1.3 ثانية: صار كبير وواضح في النص
  setTimeout(function(){
    stage.style.opacity='0';
    stage.style.transition='opacity .3s';
    pl.style.opacity='1';
    pr.style.opacity='1';
  },1300);

  // بعد 1.6 ثانية: يروح يسار ويمين
  setTimeout(function(){
    document.body.classList.add('open');
  },1600);

  // بعد 2.5 ثانية: يفتح تسجيل دخول
  setTimeout(go,2500);

  addEventListener('pointerdown',go,{once:true});
})();
</script>
</body>
</html>
