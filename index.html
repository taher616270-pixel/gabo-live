<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GABO LIVE - دخول</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(1200px 600px at 50% -20%,rgba(124,58,237,.42),transparent 60%),
    radial-gradient(700px 400px at 90% 100%,rgba(245,158,11,.22),transparent 60%),
    #08050f;
  font-family:system-ui,-apple-system;
  padding:18px;
  overflow:hidden;
}
.glow{
  position:fixed;
  width:600px;height:600px;
  background:radial-gradient(circle,rgba(124,58,237,.22),transparent 70%);
  filter:blur(40px);
  animation:float 6s ease-in-out infinite;
  pointer-events:none;
}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,20px)}}

.card{
  width:100%;max-width:380px;
  background:linear-gradient(180deg,rgba(26,20,42,.9),rgba(18,14,30,.9));
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  padding:28px 22px 22px;
  box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(24px);
  animation:cardIn .9s cubic-bezier(.16,1,.3,1);
}
@keyframes cardIn{from{transform:translateY(30px) scale(.96);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}

.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.logo{font-weight:900;letter-spacing:4px;color:#fff;font-size:14px}
.logo b{color:#a78bfa}
.badge{font-size:10px;padding:6px 10px;border-radius:99px;background:rgba(124,58,237,.18);color:#a78bfa;border:1px solid rgba(124,58,237,.3)}

.tabs{display:flex;background:rgba(0,0,0,.3);border-radius:14px;padding:4px;gap:4px;margin-bottom:22px}
.tab{flex:1;height:40px;border-radius:10px;border:0;font-weight:800;font-size:13px;cursor:pointer;transition:.25s}
.tab.on{background:#fff;color:#000}
.tab.off{background:transparent;color:rgba(255,255,255,.5)}

.title{color:#fff;font-size:18px;font-weight:800;text-align:center}
.sub{color:rgba(255,255,255,.45);font-size:12px;text-align:center;margin:6px 0 20px}

.field{position:relative;margin-bottom:12px}
.field input{
  width:100%;height:50px;
  background:rgba(255,255,255,.05);
  border:1.5px solid rgba(255,255,255,.08);
  border-radius:14px;
  color:#fff;
  padding:0 44px 0 14px;
  outline:none;
  font-size:14px;
  transition:.2s;
}
.field input:focus{border-color:#7c3aed;background:rgba(124,58,237,.08)}
.field i{position:absolute;right:14px;top:50%;transform:translateY(-50%);opacity:.5}

.btn{
  width:100%;height:50px;
  background:linear-gradient(90deg,#7c3aed,#a78bfa);
  border:0;border-radius:14px;
  color:#fff;font-weight:900;font-size:15px;
  margin-top:8px;
  box-shadow:0 10px 30px rgba(124,58,237,.4);
  cursor:pointer;
  transition:.2s;
}
.btn:active{transform:scale(.98)}

.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:rgba(255,255,255,.25);font-size:11px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.08)}

.social{display:flex;gap:10px}
.soc{flex:1;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;display:grid;place-items:center;font-size:13px}

.foot{text-align:center;margin-top:16px;color:rgba(255,255,255,.35);font-size:11px}
.foot a{color:#a78bfa;text-decoration:none}
</style>
</head>
<body>
<div class="glow" style="top:-100px;left:-100px"></div>
<div class="glow" style="bottom:-150px;right:-100px;background:radial-gradient(circle,rgba(245,158,11,.18),transparent 70%)"></div>

<div class="card">
  <div class="top">
    <div class="logo">GABO <b>LIVE</b></div>
    <div class="badge">● LIVE</div>
  </div>

  <div class="tabs">
    <button class="tab off">حساب جديد</button>
    <button class="tab on">دخول</button>
  </div>

  <div class="title">مرحباً بعودتك 👋</div>
  <div class="sub">ادخل وشارك صوتك مع العالم</div>

  <div class="field"><i>✉️</i><input placeholder="البريد الإلكتروني"></div>
  <div class="field"><i>🔒</i><input placeholder="كلمة السر" type="password"></div>

  <button class="btn">دخول إلى المنصة 🚀</button>

  <div class="divider">أو المتابعة عبر</div>
  <div class="social"><div class="soc">Google</div><div class="soc">Apple</div></div>

  <div class="foot">نسيت كلمة السر؟ <a href="#">استعادة</a></div>
</div>

</body>
</html>
