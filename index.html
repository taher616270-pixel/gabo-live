<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080710">
<meta name="description" content="GABO LIVE">
<title>GABO LIVE</title>
<style>
:root{color-scheme:dark;--gold:#e8c878;--gold-light:#fff0bd;--violet:#9a68ff;--bg:#080710}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{position:fixed;inset:0;font-family:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff}
.splash{position:relative;isolation:isolate;display:grid;place-items:center;width:100%;height:100%;min-height:100svh;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,rgba(91,54,151,.24),transparent 38%),radial-gradient(ellipse at 50% 110%,rgba(171,126,48,.12),transparent 48%),linear-gradient(145deg,#090812 0%,#100d1b 52%,#07070c 100%)}
.splash:before,.splash:after{content:"";position:absolute;inset:-30%;z-index:-1;pointer-events:none}
.splash:before{background:conic-gradient(from 0deg,transparent 0 28%,rgba(206,170,99,.07) 34%,transparent 43% 70%,rgba(142,93,255,.08) 77%,transparent 86%);animation:ambient 18s linear infinite}
.splash:after{background-image:radial-gradient(1px 1px at 12% 22%,#f4dca4 98%,transparent),radial-gradient(1px 1px at 78% 18%,#fff 98%,transparent),radial-gradient(2px 2px at 86% 72%,#b99aff 98%,transparent),radial-gradient(1px 1px at 22% 81%,#fff 98%,transparent),radial-gradient(1px 1px at 66% 88%,#e8c878 98%,transparent);opacity:.45}
.aurora{position:absolute;width:min(88vw,620px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(126,78,219,.16),rgba(199,158,82,.045) 42%,transparent 68%);filter:blur(12px);animation:breathe 3.4s ease-in-out infinite}
.content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px;transform:translateY(-2vh)}
.mark-wrap{position:relative;width:clamp(116px,30vw,164px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:28px;opacity:0;transform:scale(.62) translateY(22px);animation:markIn 1.05s cubic-bezier(.16,1,.3,1) .12s forwards}
.mark-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(232,200,120,.48);box-shadow:0 0 28px rgba(193,151,75,.12),inset 0 0 26px rgba(154,104,255,.1)}
.mark-ring:before,.mark-ring:after{content:"";position:absolute;border-radius:50%;inset:9px;border:1px solid rgba(154,104,255,.35)}
.mark-ring:after{inset:-8px;border-color:rgba(232,200,120,.15);border-style:dashed;animation:orbit 24s linear infinite}
.mark-core{width:76%;height:76%;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#241b36,#0c0a13 68%);border:1px solid rgba(255,236,185,.42);box-shadow:0 0 42px rgba(133,83,226,.28),0 0 70px rgba(207,166,85,.1),inset 0 1px 1px rgba(255,255,255,.18)}
.mark-letter{font-family:Georgia,serif;font-size:clamp(62px,16vw,92px);font-weight:700;line-height:1;color:var(--gold-light);text-shadow:0 0 20px rgba(232,200,120,.34);transform:translateX(-2px)}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold-light);box-shadow:0 0 12px 3px rgba(232,200,120,.45)}
.spark.one{top:10%;right:14%;animation:twinkle 1.8s ease-in-out infinite}
.spark.two{bottom:16%;left:9%;width:4px;height:4px;animation:twinkle 2.2s ease-in-out .4s infinite}
.spark.three{top:48%;left:-2%;width:3px;height:3px;animation:twinkle 1.6s ease-in-out .7s infinite}
.wordmark{display:flex;direction:ltr;align-items:baseline;gap:.16em;letter-spacing:.12em;font-size:clamp(34px,9vw,54px);font-weight:900;line-height:1;opacity:0;transform:translateY(16px);animation:textIn .8s ease .55s forwards}
.wordmark .gabo{color:#fff;text-shadow:0 2px 22px rgba(255,255,255,.12)}
.wordmark .live{background:linear-gradient(110deg,#fff0bd 0%,#d8b66b 38%,#a77bfa 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{margin-top:17px;color:rgba(255,255,255,.72);font-size:clamp(14px,3.8vw,17px);letter-spacing:.025em;opacity:0;animation:fadeUp .7s ease .9s forwards}
.tagline strong{color:var(--gold-light);font-weight:700}
.loading{display:flex;align-items:center;gap:10px;margin-top:42px;color:rgba(255,255,255,.48);font-size:12px;letter-spacing:.08em;opacity:0;animation:fadeUp .6s ease 1.2s forwards}
.loading-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(232,200,120,.7);animation:dotPulse 1s ease-in-out infinite}
.progress{position:absolute;bottom:max(34px,env(safe-area-inset-bottom));left:50%;width:min(190px,48vw);height:2px;overflow:hidden;transform:translateX(-50%);background:rgba(255,255,255,.1);border-radius:5px}
.progress span{display:block;width:0;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--violet),var(--gold-light));box-shadow:0 0 12px rgba(232,200,120,.65);animation:load 3.7s linear forwards}
.fade-out{animation:exit .42s ease forwards}
@keyframes ambient{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(.88);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes markIn{to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes textIn{to{opacity:1;transform:translateY(0)}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.5)}}
@keyframes dotPulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.3)}}
@keyframes load{to{width:100%}}
@keyframes exit{to{opacity:0;transform:scale(1.025)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="splash" id="splash" aria-label="GABO LIVE">
  <div class="aurora" aria-hidden="true"></div>
  <section class="content">
    <div class="mark-wrap" aria-hidden="true">
      <div class="mark-ring"></div>
      <div class="mark-core"><span class="mark-letter">G</span></div>
      <i class="spark one"></i><i class="spark two"></i><i class="spark three"></i>
    </div>
    <h1 class="wordmark"><span class="gabo">GABO</span><span class="live">LIVE</span></h1>
    <p class="tagline">عالمك يبدأ <strong>هنا</strong></p>
    <div class="loading"><span class="loading-dot"></span><span>جارٍ تجهيز تجربتك</span></div>
  </section>
  <div class="progress" aria-hidden="true"><span></span></div>
</main>
<script>
(function(){
  var LOGIN='/login/';
  var started=Date.now();
  var warm=fetch(LOGIN,{credentials:'same-origin'}).catch(function(){});
  var done=false;
  function go(){
    if(done)return;
    done=true;
    var splash=document.getElementById('splash');
    if(splash)splash.classList.add('fade-out');
    var remaining=Math.max(0,3900-(Date.now()-started));
    setTimeout(function(){
      Promise.race([warm,new Promise(function(resolve){setTimeout(resolve,250)})])
        .then(function(){location.replace(LOGIN)});
    },Math.min(remaining,450));
  }
  setTimeout(go,3900);
  window.addEventListener('pageshow',function(event){
    if(event.persisted){done=false;started=Date.now();setTimeout(go,3900)}
  });
})();
</script>
</body>
</html>
