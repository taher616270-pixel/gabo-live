<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GABO LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#08050f}
body{position:fixed;inset:0;overflow:hidden}
iframe{
  position:fixed;inset:0;
  width:100%;height:100%;
  border:0;
  background:#08050f;
}
#cover{
  position:fixed;inset:0;
  z-index:10;
  display:flex;
  background:#08050f;
}
.side{flex:1;background:#08050f;display:flex;align-items:center}
.side.l{justify-content:flex-end;padding-right:6px}
.side.r{justify-content:flex-start;padding-left:6px}
.word{font-size:40px;font-weight:900;letter-spacing:5px}
.gabo{color:#fff}.live{color:#a78bfa}

#center{
  position:fixed;inset:0;z-index:11;
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:#08050f;
}

.open .l{animation:toL 1s cubic-bezier(.76,0,.24,1) forwards}
.open .r{animation:toR 1s cubic-bezier(.76,0,.24,1) forwards}
@keyframes toL{to{transform:translateX(-100%)}}
@keyframes toR{to{transform:translateX(100%)}}

@keyframes pop{
  0%{transform:scale(.2);opacity:0}
  20%{opacity:1}
  60%{transform:scale(1.2)}
  100%{transform:scale(1.2)}
}
</style>
</head>
<body>

<iframe src="/login/" id="loginFrame"></iframe>

<div id="center" style="animation:pop 1.8s cubic-bezier(.16,1,.3,1) forwards">
  <div class="word gabo">GABO</div>
  <div class="word live">LIVE</div>
</div>

<div id="cover">
  <div class="side l"><div class="word gabo">GABO</div></div>
  <div class="side r"><div class="word live">LIVE</div></div>
</div>

<script>
const cover = document.getElementById('cover');
const center = document.getElementById('center');

// بعد ما يكبر في الوسط
setTimeout(()=>{
  center.style.opacity='0';
  center.style.transition='opacity .3s';
  cover.classList.add('open');
},1600);

setTimeout(()=>{
  center.remove();
  cover.remove();
},2800);
</script>
</body>
</html>
