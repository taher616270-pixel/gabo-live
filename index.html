<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08050f">
<title>GABO LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
:root{--bg:#08050f;--violet:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:var(--bg)}
body{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:
    radial-gradient(1200px 600px at 50% -10%,rgba(124,58,237,.38),transparent 60%),
    radial-gradient(800px 400px at 80% 120%,rgba(245,158,11,.18),transparent 60%),
    var(--bg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}

/* الحاوية */
.splash{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transform:translateZ(0);
  animation:splashZoom 5000ms cubic-bezier(0.16,1,0.3,1) forwards;
}

.brand{
  display:flex;
  align-items:baseline;
  gap:0.18em;
  font-weight:900;
  letter-spacing:0.14em;
  font-size:24px;
  line-height:1;
  color:#fff;
}
.brand span:last-child{
  background:linear-gradient(90deg,#a78bfa 0%,#f59e0b 55%,#c084fc 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.tagline{
  margin-top:14px;
  font-size:10px;
  font-weight:600;
  letter-spacing:0.42em;
  color:rgba(255,255,255,.42);
  animation:tagIn 800ms 400ms both;
}

.dot{
  margin-top:26px;
  width:36px;
  height:3px;
  border-radius:99px;
  background:rgba(255,255,255,.18);
  overflow:hidden;
}
.dot i{
  display:block;
  height:100%;
  width:100%;
  background:linear-gradient(90deg,var(--violet),#f59e0b);
  transform:translateX(-100%);
  animation:bar 4200ms 300ms cubic-bezier(.16,1,.3,1) forwards;
}

/* خلفية بيضاء في النهاية */
.curtain{
  position:fixed;
  inset:0;
  background:#ffffff;
  opacity:0;
  pointer-events:none;
  animation:curtain 5000ms forwards;
}

/* Animations */
@keyframes splashZoom{
  0%{transform:scale(0.22) translateZ(0);opacity:0;filter:blur(12px)}
  12%{opacity:1;filter:blur(0)}
  25%{transform:scale(0.72)}
  50%{transform:scale(1.08)}
  72%{transform:scale(1.7)}
  88%{transform:scale(3.2);opacity:1}
  100%{transform:scale(22);opacity:0;filter:blur(16px)}
}
@keyframes tagIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes bar{to{transform:translateX(0)}}
@keyframes curtain{0%,86%{opacity:0}92%{opacity:1}100%{opacity:1}}
</style>
</head>
<body>
  <div class="splash">
    <div class="brand"><span>GABO</span><span>LIVE</span></div>
    <div class="tagline">LIVE AUDIO COMMUNITY</div>
    <div class="dot"><i></i></div>
  </div>
  <div class="curtain"></div>
