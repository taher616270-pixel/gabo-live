<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<meta name="description" content="GABO LIVE — عالمك، لحظتك، وصوتك">
<title>GABO LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#d9b66c;--gold2:#fff0c5;--purple:#a77bff;--ink:#07070b}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--ink)}
body{position:fixed;inset:0;color:#fff;font-family:'Tajawal',sans-serif;-webkit-font-smoothing:antialiased}
.splash{position:relative;isolation:isolate;width:100%;height:100%;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(ellipse at 50% 42%,#211735 0%,#100d19 32%,#09090f 68%,#050508 100%)}
.splash:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.2;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.92' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.24'/%3E%3C/svg%3E")}
.sparkles{position:absolute;inset:0;pointer-events:none;opacity:.55;background-image:radial-gradient(2px 2px at 18% 24%,rgba(255,235,190,.9) 45%,transparent 60%),radial-gradient(1.5px 1.5px at 78% 19%,rgba(190,158,255,.9) 45%,transparent 60%),radial-gradient(1px 1px at 84% 72%,rgba(255,235,190,.8) 45%,transparent 60%),radial-gradient(2px 2px at 23% 78%,rgba(190,158,255,.75) 45%,transparent 60%),radial-gradient(1px 1px at 62% 12%,rgba(255,255,255,.8) 45%,transparent 60%);animation:twinkle 3.8s ease-in-out infinite alternate}
.ambient{position:absolute;z-index:-1;width:min(105vw,780px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(125,83,190,.19),rgba(188,145,75,.07) 37%,transparent 69%);filter:blur(24px);animation:ambient 6s ease-in-out infinite}
.halo{position:absolute;z-index:0;top:50%;left:50%;width:128%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(222,190,128,.08);border-radius:50%;box-shadow:0 0 90px rgba(142,99,217,.07),inset 0 0 90px rgba(142,99,217,.045);animation:halo 16s linear infinite}
.halo:before,.halo:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.045);border-radius:50%;inset:8%}
.halo:after{inset:17%;border-color:rgba(218,184,112,.08)}
.orbit{position:absolute;z-index:0;top:50%;left:50%;width:148%;aspect-ratio:1;transform:translate(-50%,-50%);border:1px dashed rgba(229,199,140,.12);border-radius:50%;animation:halo 42s linear infinite reverse}
.orbit:before{content:"";position:absolute;top:14%;left:20%;width:5px;height:5px;border-radius:50%;background:#f8e4b2;box-shadow:0 0 15px 5px rgba(248,228,178,.4)}
.content{position:relative;z-index:2;width:100%;display:flex;align-items:center;flex-direction:column;text-align:center;padding:28px 22px;transform:translateY(-1.5vh)}
.brand-emblem{position:relative;width:clamp(148px,39vw,194px);aspect-ratio:1;margin-bottom:30px;display:grid;place-items:center;opacity:0;transform:translateY(24px) scale(.78);animation:emblemIn 1.25s cubic-bezier(.16,1,.3,1) .1s forwards}
.emblem-shadow{position:absolute;inset:13%;border-radius:50%;background:rgba(168,120,255,.22);filter:blur(26px);animation:shadowPulse 3.5s ease-in-out infinite}
.emblem-frame{position:absolute;inset:0;animation:frameTurn 18s linear infinite;border-radius:50%;background:conic-gradient(from 205deg,#7d5a34 0deg,#f7e4b0 72deg,#8b6b3f 132deg,#60448e 205deg,#e8cb8c 276deg,#7d5a34 360deg);padding:1.5px;box-shadow:0 12px 45px rgba(0,0,0,.5),0 0 38px rgba(210,174,105,.17)}
.emblem-frame:before{content:"";position:absolute;inset:5px;border-radius:50%;background:linear-gradient(145deg,#171321,#08080d 72%);box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.emblem-inner{position:absolute;z-index:1;inset:13px;animation:emblemBreath 3.2s ease-in-out infinite;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 36% 25%,#38294c 0%,#171321 43%,#0a0910 78%);border:1px solid rgba(255,235,190,.19);box-shadow:inset 0 0 24px rgba(180,132,255,.1),inset 0 2px 4px rgba(255,255,255,.1)}
.emblem-inner:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid rgba(225,194,130,.13)}
.letter{position:relative;z-index:2;animation:letterGlow 3s ease-in-out infinite;font-family:'Alexandria',serif;font-size:clamp(82px,21vw,112px);font-weight:800;line-height:1;letter-spacing:-.1em;padding-right:.1em;background:linear-gradient(145deg,#fff7dc 8%,#e8cb8c 34%,#9c7544 57%,#fff0c8 76%,#b78e53 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 10px rgba(0,0,0,.7))}
.glint{position:absolute;z-index:2;top:5%;left:14%;width:34%;height:1px;transform:rotate(-48deg);background:linear-gradient(90deg,transparent,#fff7dc,transparent);filter:drop-shadow(0 0 5px #f4dba4);animation:glint 3.4s ease-in-out 1.4s infinite}
.wordmark{display:flex;direction:ltr;align-items:baseline;gap:.12em;font-family:'Alexandria',sans-serif;font-size:clamp(35px,9vw,54px);font-weight:900;line-height:1;letter-spacing:.095em;opacity:0;transform:translateY(16px);animation:rise .8s ease .55s forwards}
.gabo{color:#f8f6f2;text-shadow:0 3px 24px rgba(255,255,255,.12)}
.live{background:linear-gradient(100deg,#fff1c8 0%,#d9b66c 42%,#b28af7 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark{filter:drop-shadow(0 8px 22px rgba(174,133,255,.12))}
.rule{width:68px;height:1px;margin:21px 0 15px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;animation:fade .7s ease .8s forwards}
.tagline{font-size:clamp(17px,4.6vw,21px);font-weight:700;letter-spacing:.01em;color:#f4eee3;opacity:0;transform:translateY(10px);animation:rise .7s ease .9s forwards}
.tagline span{color:var(--gold2)}
.subline{margin-top:8px;color:rgba(238,231,220,.47);font-size:13px;letter-spacing:.035em;opacity:0;animation:fade .7s ease 1.15s forwards}
.loading-area{position:absolute;bottom:max(55px,calc(env(safe-area-inset-bottom) + 38px));left:50%;width:min(230px,58vw);transform:translateX(-50%);text-align:center;opacity:0;animation:fade .6s ease 1.25s forwards}
.loading-label{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:13px;color:rgba(255,255,255,.58);font-size:11px;letter-spacing:.04em}.loading-label strong{font:700 10px Alexandria,sans-serif;color:#e9d39f;min-width:30px}
.live-dot{width:5px;height:5px;border-radius:50%;background:#d9b66c;box-shadow:0 0 9px rgba(217,182,108,.8);animation:blink 1.2s ease infinite}
.track{height:2px;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden}
.track span{display:block;width:0;height:100%;background:linear-gradient(90deg,#9470df,#e6c982,#fff0c5);box-shadow:0 0 12px rgba(225,194,130,.7);animation:progress 3.7s linear forwards}
.version{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:rgba(255,255,255,.2);font:9px 'Alexandria',sans-serif;letter-spacing:.22em;opacity:0;animation:fade .7s ease 1.5s forwards}
.exit{animation:exit .45s ease forwards}
@keyframes ambient{0%,100%{transform:scale(.9);opacity:.65}50%{transform:scale(1.08);opacity:1}}
@keyframes halo{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes emblemIn{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes frameTurn{to{transform:rotate(360deg)}}
@keyframes emblemBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes letterGlow{0%,100%{filter:drop-shadow(0 5px 10px rgba(0,0,0,.7))}50%{filter:drop-shadow(0 0 18px rgba(232,203,140,.45)) drop-shadow(0 5px 10px rgba(0,0,0,.7))}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:1}}
@keyframes shadowPulse{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.08)}}
@keyframes glint{0%,100%{opacity:0;transform:translate(-18px,12px) rotate(-48deg)}35%{opacity:.9}65%{opacity:0;transform:translate(45px,-25px) rotate(-48deg)}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes twinkle{from{opacity:.25;transform:scale(.99)}to{opacity:.75;transform:scale(1.015)}}
@keyframes progress{to{width:100%}}
@keyframes exit{to{opacity:0;transform:scale(1.025)}}
@media(max-height:650px){.brand-emblem{width:clamp(112px,29vh,145px);margin-bottom:18px}.content{transform:translateY(-2vh)}.rule{margin:14px 0 10px}.loading-area{bottom:max(42px,calc(env(safe-area-inset-bottom) + 25px))}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="splash" id="splash" aria-label="GABO LIVE">
  <div class="ambient" aria-hidden="true"></div>
  <div class="sparkles" aria-hidden="true"></div>
  <section class="content">
    <div class="brand-emblem" aria-hidden="true">
      <div class="halo"></div>
      <div class="orbit"></div>
      <div class="emblem-shadow"></div>
      <div class="emblem-frame"></div>
      <div class="emblem-inner"><span class="letter">G</span></div>
      <i class="glint"></i>
    </div>
    <h1 class="wordmark"><span class="gabo">GABO</span><span class="live">LIVE</span></h1>
    <div class="rule"></div>
    <p class="tagline">عالمك... <span>بلحظتك</span></p>
    <p class="subline">مساحتك للتواصل واكتشاف عالم جديد</p>
  </section>
  <div class="loading-area" aria-hidden="true">
    <div class="loading-label"><i class="live-dot"></i><span id="loadingText">نجهّز لك تجربة GABO</span><strong id="loadingPercent">0%</strong></div>
    <div class="track"><span></span></div>
  </div>
  <div class="version" aria-hidden="true">YOUR WORLD · YOUR MOMENT</div>
</main>
<script>
(function(){
  var LOGIN='/login/';
  var started=Date.now();
  var done=false;
  var duration=3900;
  var percent=document.getElementById('loadingPercent');
  var ticker=setInterval(function(){var n=Math.min(100,Math.floor((Date.now()-started)/duration*100));if(percent)percent.textContent=n+'%';if(n>=100)clearInterval(ticker)},35);
  var warm=fetch(LOGIN,{credentials:'same-origin'}).catch(function(){});
  function go(){
    if(done)return;
    done=true;
    var splash=document.getElementById('splash');
    if(splash)splash.classList.add('exit');
    var wait=Math.max(0,duration-(Date.now()-started));
    setTimeout(function(){
      Promise.race([warm,new Promise(function(resolve){setTimeout(resolve,350)})])
        .then(function(){location.replace(LOGIN)});
    },Math.min(wait,350));
  }
  setTimeout(go,duration);
  window.addEventListener('pageshow',function(e){
    if(e.persisted){done=false;started=Date.now();setTimeout(go,duration)}
  });
})();
</script>
</body>
</html>
