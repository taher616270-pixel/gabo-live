<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GABO LIVE</title>
<!-- Vercel Speed Insights -->
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#08070d;overflow:hidden}
body{position:fixed;inset:0;font-family:system-ui,Arial}

.stage{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;gap:.25em;
  z-index:2;
}
.word{
  font-weight:900;letter-spacing:.12em;line-height:1;
  font-size:clamp(28px,8vw,60px);
  white-space:nowrap;
}
.gabo{color:#fff}
.live{color:#7c3aed;text-shadow:0 0 30px rgba(124,58,237,.8)}

/* يكبر من صغير لنص الشاشة */
.stage .word{opacity:0;transform:scale(.15);animation:grow 1s cubic-bezier(.16,1,.3,1) forwards}
.stage .live{animation-delay:.05s}

@keyframes grow{
  to{opacity:1;transform:scale(1)}
}

.panel{
  position:absolute;top:0;bottom:0;width:50%;background:#08070d;
  display:flex;align-items:center;z-index:5;
  transition:transform .85s cubic-bezier(.76,0,.24,1);
}
.l{left:0;justify-content:flex-end;padding-right:8px}
.r{right:0;justify-content:flex-start;padding-left:8px}

.open .l{transform:translateX(-101%)}
.open .r{transform:translateX(101%)}

.glow{
  position:absolute;left:50%;top:50%;width:90vmin;height:90vmin;
  margin:-45vmin 0 0 -45vmin;
  background:radial-gradient(circle,rgba(124,58,237,.4),transparent 60%);
  opacity:0;animation:glowIn .6s ease .2s forwards;
}
@keyframes glowIn{to{opacity:1}}
.open .glow{opacity:0;transition:.3s}
</style>
</head>
<body>
<div class="glow"></div>

<div class="stage" id="stage">
  <div class="word gabo">GABO</div>
  <div class="word live">LIVE</div>
</div>

<div class="panel l" id="pl"><div class="word gabo">GABO</div></div>
<div class="panel r" id="pr"><div class="word live">LIVE</div></div>

<script>
(function(){
  var LOGIN='/login/';
  var warm=fetch(LOGIN,{credentials:'same-origin'}).catch(()=>{});
  var done=false;
  function go(){
    if(done) return; done=true;
    Promise.race([warm,new Promise(r=>setTimeout(r,200))]).then(()=>location.replace(LOGIN));
  }
  setTimeout(()=>document.body.classList.add('open'),1400);
  setTimeout(go,2300);
})();
</script>
</body>
</html>
