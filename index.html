<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GABO LIVE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{position:fixed;inset:0;background:#08050f;overflow:hidden;font-family:system-ui;display:flex;align-items:center;justify-content:center}

.center{
  display:flex;gap:10px;
  animation:pop 2s cubic-bezier(.16,1,.3,1) forwards;
  z-index:2;
}
.word{font-size:42px;font-weight:900;letter-spacing:6px}
.gabo{color:#fff}.live{color:#a78bfa}

@keyframes pop{
  0%{transform:scale(.2);opacity:0}
  25%{opacity:1}
  65%{transform:scale(1.2)}
  100%{transform:scale(1.2)}
}

.cover{
  position:fixed;inset:0;z-index:3;
  display:flex;
}
.side{flex:1;background:#08050f;display:flex;align-items:center;transition:transform .9s cubic-bezier(.76,0,.24,1)}
.side.l{justify-content:flex-end;padding-right:6px}
.side.r{justify-content:flex-start;padding-left:6px}

.open .l{transform:translateX(-100%)}
.open .r{transform:translateX(100%)}
</style>
</head>
<body>

<div class="center" id="c">
  <div class="word gabo">GABO</div>
  <div class="word live">LIVE</div>
</div>

<div class="cover" id="cover">
  <div class="side l"><div class="word gabo">GABO</div></div>
  <div class="side r"><div class="word live">LIVE</div></div>
</div>

<script>
setTimeout(()=>{
  document.getElementById('c').style.opacity='0';
  document.getElementById('cover').classList.add('open');
},1500);
setTimeout(()=>{
  location.replace('/login/');
},2400);
</script>
</body>
</html>
