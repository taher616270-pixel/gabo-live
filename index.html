</style><style id="gabo-inline-fallback">:root{color-scheme:dark;--bg:#08070d;--text:#f8f7ff;--muted:#aaa3bd;--purple:#7c3aed;--purple2:#a78bfa}*{box-sizing:border-box}html{min-height:100%;background:#08070d}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,.22),transparent 48%),linear-gradient(145deg,#050407,#10091d 55%,#08060e)!important;color:#f8f7ff!important;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6}a{color:#c4b5fd;text-decoration:none}button,input,select,textarea{font:inherit}button,.btn{cursor:pointer;border-radius:12px;padding:10px 15px;border:1px solid #ffffff22;color:#fff;background:#211638}.btn.primary,.login-submit{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0}.glass,.mainpanel,.sidebar,.login-card,.room-card,.feature,.redirect-card{background:rgba(17,12,29,.82)!important;border:1px solid rgba(196,181,253,.18)!important;border-radius:20px;backdrop-filter:blur(18px);color:#f8f7ff}.mainpanel{padding:20px}.brand,.gradient-text{color:#c4b5fd}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.input,input,select,textarea{max-width:100%;background:#0d0b15;color:#fff;border:1px solid #ffffff22;border-radius:12px;padding:12px}.muted,.footer{color:#aaa3bd}.empty,.notice{padding:18px;border:1px solid #ffffff20;border-radius:14px;color:#d8d2e8;background:#ffffff06}.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:36px 0}.app-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;padding:20px 0 100px}.sidebar{padding:16px}.side-link{display:block;padding:10px;color:#d8d2e8}.page-title,.between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.list,.chat-messages{display:flex;flex-direction:column;gap:10px}.list-item,.message{padding:12px;border:1px solid #ffffff18;border-radius:14px;background:#ffffff08}.bottom-nav{position:fixed;z-index:1000;bottom:10px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 20px));display:flex;justify-content:space-around;gap:5px;padding:8px;background:rgba(15,12,24,.95);border:1px solid #ffffff20;border-radius:18px;backdrop-filter:blur(20px)}.bottom-nav a{display:flex;flex-direction:column;align-items:center;color:#d8d2e8;padding:5px 8px;font-size:12px}.hidden{display:none!important}.login-shell{min-height:100vh;display:grid;place-items:center;padding:22px}.login-card{width:min(470px,100%);padding:28px}.login-field{display:block;width:100%;margin:8px 0 16px}.login-submit,.google-submit{width:100%;margin-top:10px;padding:13px}.login-links{display:flex;flex-direction:column;gap:10px;margin-top:16px}.admin-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.footer{padding:20px 0}@media(max-width:700px){.hero,.app-layout{grid-template-columns:1fr}.sidebar{display:none}.admin-grid{grid-template-columns:1fr}.mainpanel{padding:14px}.bottom-nav a{font-size:10px;padding:5px}.login-card{padding:20px}}</style></head><body data-page="login"><main class="login-shell"><section class="login-card"><div class="login-brand"><span class="login-mark">✦</span><span>GABO <span class="gradient-text">LIVE</span></span></div><h1 class="login-title">أهلاً بعودتك</h1><p class="login-sub">سجّل دخولك لمتابعة عالمك</p><form id="loginForm"><label for="loginEmail">البريد الإلكتروني</label><input class="login-field" id="loginEmail" type="email" autocomplete="email" placeholder="name@example.com" required><label for="loginPassword">كلمة السر</label><input class="login-field" id="loginPassword" type="password" autocomplete="current-password" placeholder="أدخل كلمة السر" minlength="6" required><button class="login-submit" type="submit">دخول</button></form><button id="googleLogin" class="google-submit" type="button">◎　الدخو
