name: Backend CI

on:
  push:
    branches:
      - flutter-laravel-rebuild
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - flutter-laravel-rebuild
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, mbstring, pdo_mysql, redis
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish backend/composer.json

      - name: PHP syntax check
        shell: bash
        run: |
          find backend -type f -name "*.php" -print0 | xargs -0 -n1 php -l
