<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مجتمع الجنوب العربي</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed;--muted:#8b8ba7;--msg:#1e1c32}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* الهيدر ثابت ما يتحرك ابدا */
.header{
  height:64px;background:#0f0e18;border-bottom:1px solid var(--b);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;position:fixed;top:0;left:0;right:0;z-index:1000;
  flex-shrink:0;
}
.headerLeft{display:flex;align-items:center;gap:10px}
.backBtn{width:36px;height:36px;border-radius:10px;background:#161426;border:1px solid var(--b);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.commFlag{width:48px;height:32px;border-radius:8px;overflow:hidden;border:1px solid var(--b);flex-shrink:0;display:block}
.commFlag svg,.commFlag img{width:100%;height:100%;object-fit:cover;display:block}
.headerInfo{display:flex;flex-direction:column;gap:2px}
.headerInfo b{font-size:14px;display:flex;align-items:center;gap:6px}
.headerInfo small{font-size:11px;color:var(--muted)}
.headerRight{display:flex;align-items:center;gap:8px}
.onlineDot{width:8px;height:8px;background:#22c55e;border-radius:50%}

/* منطقة الرسائل تتحرك لحالها */
.messages{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:76px 12px 120px 12px;
  display:flex;flex-direction:column;gap:10px;
  -webkit-overflow-scrolling:touch;
}
.msgRow{display:flex;gap:8px;align-items:flex-end;max-width:85%}
.msgRow.me{align-self:flex-end;flex-direction:row-reverse}
.msgRow.other{align-self:flex-start}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#161426;border:1px solid var(--b);flex-shrink:0;display:block}
.avatar img{width:100%;height:100%;object-fit:cover}
.msgContent{display:flex;flex-direction:column;gap:4px}
.nameLine{display:flex;align-items:center;gap:4px;font-size:12px;color:#d1c7ff;font-weight:700}
.nameLine .check{width:14px;height:14px;background:#1d9bf0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.nameLine .time{font-size:10px;color:var(--muted);font-weight:400}
.bubble{background:var(--msg);border:1px solid var(--b);padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:14px;line-height:1.4;word-break:break-word}
.msgRow.other .bubble{border-radius:18px 18px 18px 4px;background:#161426}
.msgRow.me .bubble{background:var(--v);border-color:var(--v);color:#fff}

/* يكتب الآن فوق زر الكتابة */
.typingBar{
  position:fixed;bottom:72px;left:12px;right:12px;
  font-size:11px;color:var(--muted);display:none;z-index:50;
  background:rgba(15,14,24,.9);padding:6px 10px;border-radius:10px;border:1px solid var(--b);
}
.typingBar.on{display:block}

/* شريط الكتابة ثابت تحت */
.inputBar{
  position:fixed;bottom:0;left:0;right:0;
  background:#0f0e18;border-top:1px solid var(--b);
  padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;z-index:1000;
}
.inputWrap{flex:1;background:#161426;border:1px solid var(--b);border-radius:24px;display:flex;align-items:center;gap:6px;padding:6px 10px}
.inputWrap input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:14px}
.iconBtn{width:36px;height:36px;border-radius:50%;background:#1e1c2e;border:1px solid var(--b);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0}
.sendBtn{width:42px;height:42px;border-radius:50%;background:var(--v);border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;flex-shrink:0}

/* لوحة الايموجي */
.emojiPanel{
  position:fixed;bottom:72px;left:8px;right:8px;
  background:#161426;border:1px solid var(--b);border-radius:18px;
  max-height:320px;display:none;flex-direction:column;z-index:2000;overflow:hidden;
}
.emojiPanel.on{display:flex}
.emojiTabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--b);overflow-x:auto}
.emojiTabs button{background:#0f0e18;border:1px solid var(--b);color:#fff;padding:6px 10px;border-radius:10px;font-size:14px;white-space:nowrap}
.emojiTabs button.on{background:var(--v);border-color:var(--v)}
.emojiGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px;overflow-y:auto}
.emojiGrid span{font-size:22px;padding:6px;text-align:center;cursor:pointer;border-radius:8px}
.emojiGrid span:hover{background:#1e1c2e}
.emojiGrid span.flagCustom{width:28px;height:20px;display:inline-flex;border-radius:4px;overflow:hidden;border:1px solid #333}
.emojiGrid span.flagCustom svg{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>

<!-- هيدر ثابت -->
<div class="header" id="header">
  <div class="headerLeft">
    <div class="backBtn" onclick="history.back()">‹</div>
    <div class="commFlag" id="commFlag"></div>
    <div class="headerInfo">
      <b><span id="commName">مجتمع الجنوب العربي</span> <span id="commMiniFlag" style="width:18px;height:12px;border-radius:3px;overflow:hidden;display:inline-flex;border:1px solid #333"></span></b>
      <small><span id="memberCount">0 عضو</span> • <span class="onlineDot"></span> <span id="onlineCount">12k متصل</span> • رسمي</small>
    </div>
  </div>
  <div class="headerRight">
    <div class="iconBtn" onclick="location.href='/app/'">☰</div>
  </div>
</div>

<!-- الرسائل -->
<div class="messages" id="messages"></div>

<!-- يكتب الآن -->
<div class="typingBar" id="typingBar">👤 أحمد يكتب...</div>

<!-- لوحة ايموجي كاملة فيها اعلام الدول ومن ضمنها علم الجنوب -->
<div class="emojiPanel" id="emojiPanel">
  <div class="emojiTabs">
    <button class="on" onclick="showEmojiCat('smile')">😊</button>
    <button onclick="showEmojiCat('flags')">🏳️</button>
    <button onclick="showEmojiCat('hearts')">❤️</button>
    <button onclick="showEmojiCat('hands')">👍</button>
  </div>
  <div class="emojiGrid" id="emojiGrid"></div>
</div>

<!-- شريط كتابة ثابت -->
<div class="inputBar">
  <button class="iconBtn" onclick="toggleEmoji()">😊</button>
  <div class="inputWrap">
    <input id="msgInput" placeholder="اكتب رسالة..." oninput="onTyping()" onkeydown="if(event.key==='Enter')sendMsg()">
  </div>
  <button class="sendBtn" onclick="sendMsg()">➤</button>
</div>

<script type="module">
import { auth, db } from '/firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { collection, doc, onSnapshot, addDoc, serverTimestamp, getDoc, setDoc, updateDoc, arrayUnion, increment } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const SOUTH_SVG=`<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="200" y="0" fill="#D71921"/><rect width="900" height="200" y="200" fill="#FFF"/><rect width="900" height="200" y="400" fill="#000"/><path d="M0 0 L380 300 L0 600 Z" fill="#5EB6E4"/><g transform="translate(125,300)"><path d="M0 -70 L20 -22 L75 -22 L32 10 L48 65 L0 32 L-48 65 L-32 10 L-75 -22 L-20 -22 Z" fill="#D71921" stroke="white" stroke-width="10" stroke-linejoin="round"/></g></svg>`;

const FLAG_EMOJIS=['🇸🇦','🇾🇪','🇦🇪','🇴🇲','🇶🇦','🇰🇼','🇧🇭','🇪🇬','🇯🇴','🇱🇧','🇸🇾','🇮🇶','🇵🇸','🇺🇸','🇬🇧','🇹🇷'];
const SMILE_EMOJIS=['😀','😂','❤️','🔥','👍','👏','😍','😭','🙏','💪','😎','🤣','🥺','😊','✨','🫡','😅','😢','🤔','👌'];
const HEART_EMOJIS=['❤️','🧡','💛','💚','💙','💜','🤍','🖤','💔','❣️','💖','💝','💘'];
const HAND_EMOJIS=['👍','👎','👏','🙏','💪','👌','✌️','🤝','👋','🤲','☝️'];

let params=new URLSearchParams(location.search);
let communityId=params.get('id')||'south';
let uid=null, userData=null;
let typingTimeout=null;

const commFlagEl=document.getElementById('commFlag');
const commMiniFlagEl=document.getElementById('commMiniFlag');
const commNameEl=document.getElementById('commName');
const memberCountEl=document.getElementById('memberCount');
const messagesEl=document.getElementById('messages');
const msgInput=document.getElementById('msgInput');
const typingBar=document.getElementById('typingBar');
const emojiPanel=document.getElementById('emojiPanel');
const emojiGrid=document.getElementById('emojiGrid');

// علم ثابت
function setHeaderFlag(){
  if(communityId==='south'){
    commFlagEl.innerHTML=SOUTH_SVG;
    commMiniFlagEl.innerHTML=SOUTH_SVG;
    commNameEl.textContent='مجتمع الجنوب العربي';
  }else{
    commFlagEl.innerHTML=`<img src="https://flagcdn.com/w80/${communityId}.png" style="width:100%;height:100%;object-fit:cover">`;
    commMiniFlagEl.innerHTML=`<img src="https://flagcdn.com/w80/${communityId}.png" style="width:100%;height:100%;object-fit:cover">`;
    commNameEl.textContent='مجتمع '+communityId;
  }
}
setHeaderFlag();

// جلب بيانات المستخدم - صورة واسم كامل
onAuthStateChanged(auth, async (u)=>{
  if(u){
    uid=u.uid;
    localStorage.setItem('gabo_uid',uid);
    try{
      const snap=await getDoc(doc(db,'users',uid));
      if(snap.exists()) userData=snap.data();
      else userData={displayName:u.displayName||'مستخدم', photoURL:u.photoURL||'', verified:false};
    }catch{ userData={displayName:'مستخدم', photoURL:'', verified:false}; }
    // انضمام للمجتمع
    try{
      await setDoc(doc(db,'communities',communityId),{membersCount:increment(1), members:arrayUnion(uid)}, {merge:true});
    }catch{}
  }
});

// عرض الرسائل مع صورة الملف الشخصي والاسم فوق علامة الصح
onSnapshot(collection(db,'communities',communityId,'messages'), (snap)=>{
  const msgs=[];
  snap.forEach(d=>msgs.push({id:d.id,...d.data()}));
  msgs.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  messagesEl.innerHTML='';
  msgs.forEach(m=>{
    const isMe=m.uid===uid;
    const row=document.createElement('div');
    row.className='msgRow '+(isMe?'me':'other');
    const photo=m.photoURL||'https://i.pravatar.cc/100?u='+m.uid;
    const name=m.displayName||'مستخدم';
    const verified=m.verified?`<span class="check">✓</span>`:'';
    const time=m.createdAt?new Date(m.createdAt.seconds*1000).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
    row.innerHTML=`
      <div class="avatar"><img src="${photo}" onerror="this.src='https://i.pravatar.cc/100'"></div>
      <div class="msgContent">
        <div class="nameLine">${name} ${verified} <span class="time">${time}</span></div>
        <div class="bubble">${escapeHtml(m.text||'')}</div>
      </div>
    `;
    messagesEl.appendChild(row);
  });
  messagesEl.scrollTop=messagesEl.scrollHeight;
});

// عدد الأعضاء
onSnapshot(doc(db,'communities',communityId), (snap)=>{
  if(snap.exists()){
    const data=snap.data();
    const count=data.membersCount|| (data.members?data.members.length:0) || 0;
    memberCountEl.textContent=count+' عضو';
    if(data.name) commNameEl.textContent=data.name;
  }
});

function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

window.sendMsg=async ()=>{
  const text=msgInput.value.trim();
  if(!text||!uid) return;
  if(!userData){ alert('سجل دخول'); location.href='/login/'; return; }
  msgInput.value='';
  emojiPanel.classList.remove('on');
  try{
    await addDoc(collection(db,'communities',communityId,'messages'),{
      text:text,
      uid:uid,
      displayName:userData.displayName||userData.name||'مستخدم',
      photoURL:userData.photoURL||userData.avatar||'',
      verified:userData.verified||false,
      createdAt:serverTimestamp()
    });
  }catch(e){ alert(e.message); }
}

window.onTyping=()=>{
  typingBar.classList.remove('on');
  clearTimeout(typingTimeout);
  // هنا تقدر ترسل حالة كتابة للفايربيس لو تبغى
  typingTimeout=setTimeout(()=>{ typingBar.classList.remove('on'); },2000);
}

// ايموجي
window.toggleEmoji=()=>{
  emojiPanel.classList.toggle('on');
  if(emojiPanel.classList.contains('on')) showEmojiCat('smile');
}
window.showEmojiCat=(cat)=>{
  document.querySelectorAll('.emojiTabs button').forEach(b=>b.classList.remove('on'));
  event?.target?.classList.add('on');
  emojiGrid.innerHTML='';
  let list=[];
  if(cat==='smile') list=SMILE_EMOJIS;
  if(cat==='flags') list=FLAG_EMOJIS;
  if(cat==='hearts') list=HEART_EMOJIS;
  if(cat==='hands') list=HAND_EMOJIS;

  list.forEach(e=>{
    const span=document.createElement('span');
    span.textContent=e;
    span.onclick=()=>{ msgInput.value+=e; msgInput.focus(); };
    emojiGrid.appendChild(span);
  });
  if(cat==='flags'){
    // اضافة علم الجنوب العربي كايموجي خاص
    const span=document.createElement('span');
    span.className='flagCustom';
    span.innerHTML=SOUTH_SVG;
    span.title='علم الجنوب العربي';
    span.onclick=()=>{ msgInput.value+=' [علم الجنوب] '; msgInput.focus(); };
    emojiGrid.appendChild(span);
  }
}

// اغلاق الايموجي عند الضغط خارج
document.addEventListener('click',(e)=>{
  if(!emojiPanel.contains(e.target) && !e.target.closest('.iconBtn')){
    // emojiPanel.classList.remove('on');
  }
});
</script>
</body>
</html>
