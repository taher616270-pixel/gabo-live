<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed;--muted:#8b8ba7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{height:68px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px;padding:0 12px;position:fixed;top:0;left:0;right:0;z-index:1000}
.backBtn{width:38px;height:38px;border-radius:12px;background:#161426;border:1px solid var(--b);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
.commFlag{width:52px;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--b);flex-shrink:0;background:#000}
.commFlag svg,.commFlag img{width:100%;height:100%;object-fit:cover;display:block}
.headerInfo{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.headerInfo b{font-size:14px;display:flex;align-items:center;gap:6px}
.headerInfo small{font-size:11px;color:var(--muted)}
.miniFlagInHeader{width:18px;height:12px;border-radius:3px;overflow:hidden;display:inline-flex;border:1px solid #333}
.messages{flex:1;overflow-y:auto;padding:80px 12px 130px 12px;display:flex;flex-direction:column;gap:14px}
.msgRow{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msgRow.me{align-self:flex-end;flex-direction:row-reverse}
.msgRow.other{align-self:flex-start}
.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#161426;border:1px solid var(--b);flex-shrink:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.nameLine{display:flex;align-items:center;gap:5px;font-size:12px;color:#c4b5fd;font-weight:800}
.nameLine .check{width:14px;height:14px;background:#1d9bf0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.nameLine .time{font-size:10px;color:var(--muted);font-weight:400}
.bubble{padding:10px 14px;border-radius:18px;font-size:14px;border:1px solid var(--b);background:#1e1c2e}
.msgRow.me .bubble{background:var(--v);border-color:var(--v);color:#fff}
.inputBar{position:fixed;bottom:0;left:0;right:0;background:#0f0e18;border-top:1px solid var(--b);padding:10px 12px;display:flex;gap:8px;z-index:1000}
.inputWrap{flex:1;background:#1a182a;border:1px solid var(--b);border-radius:24px;padding:8px 14px;display:flex}
.inputWrap input{flex:1;background:transparent;border:0;outline:0;color:#fff;font-size:14px}
.iconBtn{width:40px;height:40px;border-radius:50%;background:#1e1c2e;border:1px solid var(--b);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
.sendBtn{width:44px;height:44px;border-radius:50%;background:var(--v);border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
.emojiPanel{position:fixed;bottom:76px;left:8px;right:8px;background:#161426;border:1px solid var(--b);border-radius:18px;max-height:340px;display:none;flex-direction:column;z-index:2000;overflow:hidden}
.emojiPanel.on{display:flex}
.emojiTabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--b);overflow-x:auto}
.emojiTabs button{background:#0f0e18;border:1px solid var(--b);color:#fff;padding:6px 12px;border-radius:10px;cursor:pointer}
.emojiTabs button.on{background:var(--v)}
.emojiGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:10px;overflow-y:auto}
.emojiGrid span{font-size:24px;padding:8px;text-align:center;cursor:pointer;border-radius:8px}
.flagCustom{width:30px;height:20px;border-radius:4px;overflow:hidden;border:1px solid #444;display:inline-flex!important}
.profileModal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);z-index:5000;display:none;align-items:center;justify-content:center;padding:16px}
.profileModal.on{display:flex}
.profileBox{width:100%;max-width:360px;background:#161426;border:1px solid #2a2840;border-radius:22px;overflow:hidden}
.pCover{width:100%;height:140px;background:linear-gradient(135deg,#1a2a4a,#0f3460,#161426);position:relative;overflow:hidden}
.pCover img{width:100%;height:100%;object-fit:cover;display:block}
.pAvatar{width:90px;height:90px;border-radius:22px;border:3px solid #161426;background:#6d28d9;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;position:absolute;bottom:-30px;right:16px;overflow:hidden}
.pAvatar img{width:100%;height:100%;object-fit:cover}
.pInfo{padding:40px 16px 16px 16px}
.pName{font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.pCountry{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px;color:#c4c4d0}
.pCountry img{width:26px;height:18px;border-radius:3px;border:1px solid rgba(255,255,255,.2)}
.pMeta{margin-top:6px;font-size:12px;color:#8b8ba7;display:flex;gap:10px;flex-wrap:wrap}
.pBio{margin-top:10px;background:#1e1c2e;border:1px solid var(--b);border-radius:12px;padding:10px;font-size:13px;color:#d0d0e0;line-height:1.6;min-height:40px}
.pActions{display:flex;gap:8px;margin-top:14px}
.pBtn{flex:1;padding:12px;border-radius:12px;border:0;font-weight:800;font-size:13px;cursor:pointer}
.pBtn.primary{background:var(--v);color:#fff}
.pBtn.secondary{background:#1e1c2e;border:1px solid var(--b);color:#fff}
.pClose{position:absolute;top:10px;left:10px;width:32px;height:32px;background:rgba(0,0,0,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.joinGate{position:fixed;bottom:0;left:0;right:0;z-index:1100;padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(135deg,#171526f5,#101b22f5);border-top:1px solid #a88be755;box-shadow:0 -12px 35px #0008;display:flex;align-items:center;gap:12px;backdrop-filter:blur(18px)}.joinGate>div{flex:1;min-width:0}.joinGate b{display:block;font-size:13px;color:#f2eaff}.joinGate small{display:block;color:#aaa4bd;font-size:10px;line-height:1.5;margin-top:3px}.joinGate button{border:1px solid #a88be7;color:#fff;background:linear-gradient(135deg,#6650a5,#3a5d72);border-radius:13px;padding:12px 15px;font:800 12px system-ui;box-shadow:0 5px 18px #51427d66;white-space:nowrap}.joinGate button:disabled{opacity:.6}.inputBar{bottom:0}.messages{padding-bottom:145px}body.generalPublicChat .commFlag{width:48px;height:48px;border-radius:50%;border:1px solid #78e6dc88;background:radial-gradient(circle at 32% 25%,#8df7ed 0,#287f91 24%,#172d57 58%,#101322 100%);box-shadow:0 0 0 4px #5ce1d51c,0 0 24px #3dd6ca55;overflow:visible;position:relative}body.generalPublicChat .commFlag svg{width:100%;height:100%;filter:drop-shadow(0 4px 9px #0008)}body.generalPublicChat #commMiniFlag{display:none}body.generalPublicChat .headerInfo b{color:#f0eaff}body.generalPublicChat .headerInfo small{color:#73d9b7}body.generalPublicChat .header{background:linear-gradient(100deg,#101020,#14222d 65%,#101020)}body.generalPublicChat .inputBar{background:linear-gradient(120deg,#101020,#14222d);border-top-color:#4acfc455}body.generalPublicChat .inputWrap{border-color:#4acfc455}body.generalPublicChat .sendBtn{background:linear-gradient(135deg,#27b9ad,#3478a7);box-shadow:0 4px 15px #24b8aa55}.globalStatsFab{position:fixed;top:82px;left:13px;z-index:1200;width:44px;height:44px;border-radius:15px;border:1px solid #58d8d077;color:#c9fff4;background:linear-gradient(145deg,#202b42ee,#171426ee);box-shadow:0 7px 22px #0008,0 0 18px #40cbb522;font-size:22px;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(14px)}.globalStatsFab i{position:absolute;width:7px;height:7px;border-radius:50%;background:#63e5b3;right:7px;top:7px;box-shadow:0 0 8px #63e5b3}.globalStatsShade{position:fixed;inset:0;background:#05061199;backdrop-filter:blur(3px);z-index:2400}.globalStatsPanel{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);z-index:2401;background:linear-gradient(160deg,#171a2c,#11111d 60%,#14272b);border-right:1px solid #56d6cf55;box-shadow:18px 0 55px #0009;padding:calc(18px + env(safe-area-inset-top)) 15px calc(18px + env(safe-area-inset-bottom));transform:translateX(-105%);transition:transform .28s ease;overflow-y:auto;direction:rtl}.globalStatsPanel.open{transform:translateX(0)}.globalStatsHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.globalStatsHead small{display:block;color:#6fe1ce;font-size:10px;letter-spacing:1.5px}.globalStatsHead b{display:block;font-size:17px;margin-top:4px}.globalStatsHead button{width:34px;height:34px;border-radius:11px;background:#ffffff0c;border:1px solid #ffffff20;color:#fff}.globalStatCard{display:flex;align-items:center;gap:12px;padding:16px;border:1px solid #5ad4ca44;border-radius:18px;background:linear-gradient(125deg,#233b4b99,#24203c99);box-shadow:inset 0 1px #ffffff12}.globalStatIcon{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:#42c8b522;font-size:25px}.globalStatCard div{flex:1}.globalStatCard small,.globalMembersBtn small{display:block;color:#a8adbd;font-size:11px;margin-top:4px}.globalStatCard strong{display:block;font-size:25px;color:#a8fff0;margin-top:3px}.livePill{font-size:9px;color:#6fe5b5;border:1px solid #6fe5b566;border-radius:20px;padding:4px 7px}.globalMembersBtn{width:100%;display:flex;align-items:center;gap:11px;text-align:right;margin-top:14px;padding:14px 12px;border-radius:16px;background:#ffffff09;border:1px solid #ffffff18;color:#fff}.globalMembersBtn>span:first-child{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:#8061ce33;font-size:21px}.globalMembersBtn>span:nth-child(2){flex:1}.globalMembersBtn b{font-size:13px}.membersChevron{font-size:24px;color:#80e6d8}.globalMembersList{margin-top:10px;max-height:42vh;overflow:auto;border:1px solid #ffffff15;border-radius:14px;padding:5px}.globalMemberRow{display:flex;align-items:center;gap:10px;padding:9px 7px;border-bottom:1px solid #ffffff0d;cursor:pointer}.globalMemberRow:last-child{border-bottom:0}.globalMemberRow img,.globalMemberAvatar{width:37px;height:37px;border-radius:50%;object-fit:cover;background:#393354;display:grid;place-items:center}.globalMemberRow b{font-size:12px}.globalMemberRow small{display:block;color:#9ea5b8;font-size:10px;margin-top:3px}.globalLeaveBtn{width:100%;margin-top:17px;padding:13px;border-radius:14px;border:1px solid #f17d8b66;background:#9e344322;color:#ff9ba8;font-weight:800;font-size:13px}.globalMembersEmpty{text-align:center;color:#aeb3c3;padding:18px;font-size:12px}body.generalPublicChat .globalStatsFab{display:flex!important}body.generalPublicChat .messages{padding-bottom:145px}</style>

  bottom:calc(56px + env(safe-area-inset-bottom))!important;

<body>
<div class="header">

<div class="headerInfo"><b><span id="commName">تحميل...</span> <span class="miniFlagInHeader" id="commMiniFlag"></span></b><small><span id="memberCount">0 عضو</span> • 12k متصل • رسمي</small></div>
</div>
<div class="messages" id="messages"></div><div class="actionDock" id="actionDock"><div class="joinGate" id="joinGate"><div><b id="joinGateTitle">انضم إلى المجتمع</b><small id="joinGateHint">انضم لتتمكن من المشاركة والكتابة في المجتمع</small></div><button id="joinPublicChat" type="button">انضم الآن <span>←</span></button></div><div class="inputBar"><button class="iconBtn" onclick="toggleEmoji()">😊</button><div class="inputWrap"><input id="msgInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendMsg()"></div><button class="sendBtn" onclick="sendMsg()">➤</button></div></div>
<button class="globalStatsFab" id="globalStatsFab" type="button" aria-label="عدادات الشات العام" style="display:none">☷<i></i></button>

<aside class="globalStatsPanel" id="globalStatsPanel" aria-hidden="true">
 <div class="globalStatsHead"><div><small>GABO LIVE</small><b>إحصائيات الشات العام</b></div><button id="closeGlobalStats" type="button">✕</button></div>
 <div class="globalStatCard"><span class="globalStatIcon">🌍</span><div><small>إجمالي الأعضاء المنضمين</small><strong id="globalTotalMembers">0</strong></div><span class="livePill">مباشر</span></div>
 <button class="globalMembersBtn" id="showGlobalMembers" type="button"><span>👥</span><span><b>جميع أعضاء الشات العام</b><small>استعرض الأعضاء وافتح ملفاتهم الشخصية</small></span><span class="membersChevron">‹</span></button>
 <div class="globalMembersList" id="globalMembersList" style="display:none"></div>
 <button class="globalLeaveBtn" id="leaveGlobalChat" type="button" style="display:none">↩ خروج من الشات العام</button>
</aside>
<div class="profileModal" id="profileModal" onclick="if(event.target===this)closeProfile()"><div class="profileBox"><div class="pCover" id="pCover"><img id="pCoverImg" style="display:none"><div class="pClose" onclick="closeProfile()">✕</div><div class="pAvatar" id="pAvatar"><span id="pAvatarLetter">T</span><img id="pAvatarImg" style="display:none"></div></div><div class="pInfo"><div class="pName"><span id="pName">تحميل...</span></div><div class="pCountry"><span id="pFlag"></span><span id="pCountryName">الجنوب العربي</span></div><div class="pMeta"><span id="pGender"></span><span id="pAge"></span><span id="pId">ID: --------</span></div><div class="pBio" id="pBio">...</div><div class="pActions"><button class="pBtn primary" id="pChatBtn">💬 دردشة خاصة</button><button class="pBtn secondary" id="pViewBtn">👁️ عرض الملف</button></div></div></div></div>
<div class="emojiPanel" id="emojiPanel"><div class="emojiTabs"><button class="on" onclick="showEmojiCat(event,'smile')">😊</button><button onclick="showEmojiCat(event,'flags')">🏳️</button></div><div class="emojiGrid" id="emojiGrid"></div></div>

<script type="module">
import { auth, db } from '/firebase-config.js';
import { getSouthArabiaFlag,getCountryRegistry } from '/assets/country-flags.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { collection, doc, onSnapshot, addDoc, serverTimestamp, getDoc, setDoc, arrayUnion, arrayRemove, increment, decrement } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
let SOUTH_FLAG='/assets/south-arabia.png.JPG';
const GLOBAL_GLOBE=`<svg viewBox="0 0 64 64" role="img" aria-label="الشات العام"><defs><radialGradient id="ocean" cx="30%" cy="24%"><stop stop-color="#a8fff4"/><stop offset=".3" stop-color="#37c9c0"/><stop offset=".72" stop-color="#246a9b"/><stop offset="1" stop-color="#18234c"/></radialGradient><linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8ffe8"/><stop offset="1" stop-color="#4bd3a5"/></linearGradient></defs><circle cx="32" cy="32" r="27" fill="url(#ocean)" stroke="#b6fff2" stroke-width="1.5"/><path d="M17 14l7-4 7 3 1 6-5 4-1 7-7-2-4-6 2-8zm20-3 9 3 5 8-5 4-2 8-6-2-3-7 3-5-4-4zm-20 29 7-3 7 4 3 8-6 8-8-4-4-8zm23 3 7-5 7 4-2 9-8 5-5-6z" fill="url(#land)" opacity=".95"/><path d="M6 32h52M32 5c-9 9-12 18-12 27s3 18 12 27M32 5c9 9 12 18 12 27s-3 18-12 27" fill="none" stroke="#d4fff8" stroke-opacity=".45" stroke-width="1"/><ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#d4fff8" stroke-opacity=".38"/></svg>`;
let SOUTH_SVG=`<img src="${SOUTH_FLAG}" alt="علم الجنوب العربي" style="width:100%;height:100%;object-fit:cover">`
const COMM_DATA={
south:{name:'مجتمع الجنوب العربي',flag:SOUTH_SVG,mini:SOUTH_SVG},
sa:{name:'مجتمع السعودية',flag:`<img src="https://flagcdn.com/w80/sa.png" alt="علم السعودية">`,mini:`<img src="https://flagcdn.com/w80/sa.png" alt="">`},
ae:{name:'مجتمع الإمارات',flag:`<img src="https://flagcdn.com/w80/ae.png" alt="علم الإمارات">`,mini:`<img src="https://flagcdn.com/w80/ae.png" alt="">`},
om:{name:'مجتمع عُمان',flag:`<img src="https://flagcdn.com/w80/om.png" alt="علم عُمان">`,mini:`<img src="https://flagcdn.com/w80/om.png" alt="">`},
ye:{name:'مجتمع اليمن',flag:`<img src="https://flagcdn.com/w80/ye.png" alt="علم اليمن">`,mini:`<img src="https://flagcdn.com/w80/ye.png" alt="">`}
};
const params=new URLSearchParams(location.search);
let communityId=params.get('id')||'south';
const isGeneralPublicChat=communityId==='global';
let hasJoinedGeneralChat=false;
let globalMembers=[];
let uid=localStorage.getItem('gabo_uid')||null;
let userData=null;
let lastOpenedUid=null;
function genId(uid){let h=0;for(let i=0;i<uid.length;i++){h=(h*31+uid.charCodeAt(i))%1000000000;}return (10000000+(h%90000000)).toString().padStart(8,'0');}
const commFlagEl=document.getElementById('commFlag');
const commMiniFlagEl=document.getElementById('commMiniFlag');
const commNameEl=document.getElementById('commName');
const memberCountEl=document.getElementById('memberCount');
const messagesEl=document.getElementById('messages');
const msgInput=document.getElementById('msgInput');
function setHeaderInstant(){
  if(isGeneralPublicChat){document.body.classList.add('generalPublicChat');commFlagEl.innerHTML=GLOBAL_GLOBE;commNameEl.textContent='الشات العام';document.querySelector('.headerInfo small').textContent='دردشة عامة • عالم GABO LIVE';return;}
  const data=COMM_DATA[communityId] || {name:'جاري تحميل المجتمع', flag:'', mini:''};
  commFlagEl.innerHTML=data.flag || '<span style="display:grid;place-items:center;width:100%;height:100%;font-size:22px">🌐</span>';
  commMiniFlagEl.innerHTML=data.mini || '';
  commNameEl.textContent=data.name;
}
setHeaderInstant();
let communityData=null;
async function loadCommunity(){
  const currentUser=auth.currentUser;
  if(!currentUser) throw new Error('يجب تسجيل الدخول أولاً');
  uid=currentUser.uid;
  const ref=doc(db,'communities',communityId);
  let snap=await getDoc(ref);
  if(!snap.exists()&&!isGeneralPublicChat){
    const fallback=COMM_DATA[communityId]||{name:'مجتمع '+communityId};
    await setDoc(ref,{name:fallback.name||('مجتمع '+communityId),flag:communityId,members:[],membersCount:0,createdAt:serverTimestamp()},{merge:true});
    snap=await getDoc(ref);
  }
  communityData=snap.exists()?snap.data():{name:isGeneralPublicChat?'الشات العام':(COMM_DATA[communityId]?.name||('مجتمع '+communityId))};
  const communityName=isGeneralPublicChat?'الشات العام':(communityData.name||COMM_DATA[communityId]?.name||('مجتمع '+communityId));
  commNameEl.textContent=communityName;
  const joinTitle=document.getElementById('joinGateTitle');
  if(joinTitle) joinTitle.textContent='انضم إلى '+communityName;
  if(!isGeneralPublicChat){
    const fallback=COMM_DATA[communityId]||{};
    const flagCode=String(communityData.flag||communityId).toLowerCase();
    const flagUrl=flagCode==='south'?SOUTH_FLAG:(/^[a-z]{2}$/.test(flagCode)?'https://flagcdn.com/w160/'+flagCode+'.png':'');
    if(communityData.img){
      commFlagEl.innerHTML='';
      const cover=document.createElement('img');cover.src=communityData.img;cover.alt='صورة المجتمع';cover.style.cssText='width:100%;height:100%;object-fit:cover';commFlagEl.appendChild(cover);
    }else if(flagCode==='south'){
      commFlagEl.innerHTML=fallback.flag||SOUTH_SVG;
    }else if(flagUrl){
      commFlagEl.innerHTML='<img src="'+flagUrl+'" alt="علم المجتمع" style="width:100%;height:100%;object-fit:cover">';
    }else{
      commFlagEl.textContent='🌐';
    }
    commMiniFlagEl.innerHTML=flagUrl?'<img src="'+flagUrl+'" alt="علم الدولة" style="width:100%;height:100%;object-fit:cover">':(flagCode==='south'?(fallback.mini||SOUTH_SVG):'');
  }
  const members=Array.isArray(communityData.members)?communityData.members:[];
  hasJoinedGeneralChat=communityData.ownerUid===uid||members.includes(uid);
  updateGeneralChatGate();
  return communityData;
}
onAuthStateChanged(auth,async u=>{
  if(!u){location.replace('/login/');return;}
  try{
    uid=u.uid;localStorage.setItem('gabo_uid',uid);
    const userSnap=await getDoc(doc(db,'users',uid)).catch(()=>null);
    userData=userSnap?.exists()?userSnap.data():{displayName:localStorage.getItem('gabo_name')||'مستخدم',photoURL:localStorage.getItem('gabo_photo')||'',verified:false};
    await loadCommunity();
  }catch(error){
    console.error('loadCommunity failed:',error);
    commNameEl.textContent='تعذر تحميل المجتمع';
    messagesEl.innerHTML='<div style="text-align:center;color:#fca5a5;padding:24px">تعذر تحميل بيانات المجتمع. تحقق من صلاحيات Firestore.</div>';
  }
});
function updateGeneralChatGate(){const fab=document.getElementById('globalStatsFab');if(fab)fab.style.display=isGeneralPublicChat?'flex':'none';const leave=document.getElementById('leaveGlobalChat');if(leave)leave.style.display=isGeneralPublicChat&&hasJoinedGeneralChat?'block':'none';const gate=document.getElementById('joinGate');const bar=document.querySelector('.inputBar');const title=document.getElementById('joinGateTitle');const hint=document.getElementById('joinGateHint');const communityName=commNameEl.textContent||'المجتمع';if(title)title.textContent=isGeneralPublicChat?'انضم إلى الشات العام':'انضم إلى '+communityName;if(hint)hint.textContent='انضم لتتمكن من المشاركة والكتابة في المجتمع';if(gate)gate.style.display=hasJoinedGeneralChat?'none':'flex';if(bar){bar.style.display=hasJoinedGeneralChat?'flex':'none';bar.setAttribute('aria-hidden',hasJoinedGeneralChat?'false':'true');}if(msgInput){msgInput.disabled=!hasJoinedGeneralChat;msgInput.placeholder=hasJoinedGeneralChat?'اكتب رسالتك...':'انضم للمجتمع للكتابة';}const send=document.querySelector('.sendBtn');if(send)send.disabled=!hasJoinedGeneralChat;const emoji=document.querySelector('.inputBar .iconBtn');if(emoji)emoji.disabled=!hasJoinedGeneralChat;}
updateGeneralChatGate();

function closeGlobalStats(){document.getElementById('globalStatsShade').style.display='none';document.getElementById('globalStatsPanel').classList.remove('open');document.getElementById('globalStatsPanel').setAttribute('aria-hidden','true');}

document.getElementById('closeGlobalStats')?.addEventListener('click',closeGlobalStats);
document.getElementById('globalStatsShade')?.addEventListener('click',closeGlobalStats);
document.getElementById('showGlobalMembers')?.addEventListener('click',()=>{const box=document.getElementById('globalMembersList');box.style.display=box.style.display==='none'?'block':'none';if(box.style.display==='block')renderGlobalMembers(globalMembers);});
async function renderGlobalMembers(ids){
 const box=document.getElementById('globalMembersList');if(!box)return;
 document.getElementById('globalTotalMembers').textContent=String(ids.length);
 box.innerHTML='<div class="globalMembersEmpty">جاري تحميل قائمة الأعضاء...</div>';
 if(!ids.length){box.innerHTML='<div class="globalMembersEmpty">لا يوجد أعضاء منضمون حالياً</div>';return;}
 const rows=await Promise.all(ids.map(async id=>{try{const snap=await getDoc(doc(db,'users',id));const d=snap.exists()?snap.data():{};return {uid:id,name:d.displayName||d.name||'عضو GABO',photo:d.photoURL||d.photo||d.avatar||'',gaboId:d.gaboId||genId(id)};}catch{return {uid:id,name:'عضو GABO',photo:'',gaboId:genId(id)};}}));
 box.innerHTML='';
 rows.forEach(m=>{const row=document.createElement('button');row.type='button';row.className='globalMemberRow';const avatar=m.photo?'<img src="'+m.photo.replace(/"/g,'&quot;')+'" alt="">':'<span class="globalMemberAvatar">'+(m.name[0]||'؟')+'</span>';row.innerHTML=avatar+'<span><b></b><small></small></span>';row.querySelector('b').textContent=m.name;row.querySelector('small').textContent='ID: '+m.gaboId;row.addEventListener('click',()=>{closeGlobalStats();window.openUserProfile(m.uid,m.photo,m.name);});box.appendChild(row);});
}
document.getElementById('leaveGlobalChat')?.addEventListener('click',async()=>{if(!uid||!hasJoinedGeneralChat)return;if(!confirm('هل تريد الخروج من الشات العام؟'))return;const btn=document.getElementById('leaveGlobalChat');btn.disabled=true;try{const ref=doc(db,'communities','global');const snap=await getDoc(ref);const members=snap.exists()&&Array.isArray(snap.data().members)?snap.data().members:[];if(members.includes(uid)){await setDoc(ref,{members:arrayRemove(uid),membersCount:Math.max(0,members.length-1)},{merge:true});}hasJoinedGeneralChat=false;updateGeneralChatGate();closeGlobalStats();document.getElementById('globalMembersList').style.display='none';}catch(e){alert('تعذر الخروج حالياً، حاول مرة ثانية.');}finally{btn.disabled=false;}});

document.getElementById('joinPublicChat')?.addEventListener('click',async()=>{
  const btn=document.getElementById('joinPublicChat');
  const currentUser=auth.currentUser;
  if(!currentUser){alert('انتهت جلسة الدخول، سجل الدخول من جديد.');location.href='/login/';return;}
  if(hasJoinedGeneralChat)return;
  uid=currentUser.uid;
  const originalHtml='انضم الآن <span>←</span>';
  const withTimeout=(promise,label,ms=12000)=>Promise.race([
    promise,
    new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms))
  ]);
  btn.disabled=true;
  btn.textContent='جارٍ الانضمام...';
  try{
    const ref=doc(db,'communities',communityId);
    const snap=await withTimeout(getDoc(ref),'انتهت مهلة الاتصال بقاعدة البيانات أثناء قراءة المجتمع');
    if(!snap.exists()){
      throw new Error(isGeneralPublicChat
        ? 'وثيقة الشات العام غير موجودة في قاعدة البيانات. يجب إنشاء communities/global من حساب الإدارة أولاً.'
        : 'وثيقة المجتمع غير موجودة في قاعدة البيانات. أعد تحميل الصفحة أو تحقق من إعداد المجتمع.');
    }
    const data=snap.data()||{};
    const members=Array.isArray(data.members)?data.members:[];
    if(!members.includes(uid)){
      const today=new Date().toISOString().slice(0,10);
      const sameDay=data.activityDay===today;
      const name=isGeneralPublicChat?'الشات العام':(data.name||COMM_DATA[communityId]?.name||commNameEl.textContent||communityId);
      await withTimeout(setDoc(ref,{
        name,
        type:isGeneralPublicChat?'public-chat':'community',
        members:arrayUnion(uid),
        membersCount:increment(1),
        joinsToday:sameDay?increment(1):1,
        activityScore:sameDay?increment(2):2,
        activityDay:today
      },{merge:true}),'انتهت مهلة حفظ العضوية في قاعدة البيانات');
    }
    const verify=await withTimeout(getDoc(ref),'انتهت مهلة التحقق من العضوية');
    const verifiedMembers=verify.exists()&&Array.isArray(verify.data().members)?verify.data().members:[];
    if(!verifiedMembers.includes(uid)){
      throw new Error('تم إرسال طلب الانضمام لكن قاعدة البيانات لم تؤكد إضافة عضويتك.');
    }
    hasJoinedGeneralChat=true;
    communityData=verify.data();
    updateGeneralChatGate();
    if(msgInput){msgInput.disabled=false;msgInput.focus();}
    if(!isGeneralPublicChat){
      try{
        await withTimeout(setDoc(doc(db,'users',uid),{joinedCommunityIds:arrayUnion(communityId)},{merge:true}),'تعذرت مزامنة قائمة المجتمعات في الملف الشخصي',8000);
      }catch(profileError){
        console.warn('Membership saved; profile community mirror could not be updated:',profileError);
      }
    }
  }catch(e){
    console.error('Community join failed:',e);
    const detail=e?.code?e.code+': '+(e.message||''):((e?.message)||'خطأ غير معروف');
    alert('تعذر الانضمام: '+detail);
  }finally{
    btn.disabled=false;
    if(!hasJoinedGeneralChat)btn.innerHTML=originalHtml;
  }
});
messagesEl.innerHTML='<div style="text-align:center;color:#aaa;padding:18px">جارٍ تحميل الرسائل...</div>';
onSnapshot(collection(db,'communities',communityId,'messages'), (snap)=>{
  const msgs=[]; snap.forEach(d=>msgs.push({id:d.id,...d.data()}));
  msgs.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
  messagesEl.innerHTML='';
  msgs.forEach(m=>{
    const isMe=m.uid===uid;
    const row=document.createElement('div'); row.className='msgRow '+(isMe?'me':'other');
    let photo=m.photoURL||m.photo||m.avatar||localStorage.getItem('gabo_photo_'+m.uid)||'';
    let name=m.displayName||m.name||'مستخدم';
    const verified=!!m.verified;
    const time=m.createdAt?new Date(m.createdAt.seconds*1000).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
    const avatar=document.createElement('button');avatar.type='button';avatar.className='avatar';avatar.setAttribute('aria-label','عرض ملف '+name);
    if(photo){const image=document.createElement('img');image.src=photo;image.alt='صورة '+name;image.onerror=()=>{image.remove();avatar.textContent=(name.trim()[0]||'م');};avatar.appendChild(image);}
    else avatar.textContent=(name.trim()[0]||'م');
    avatar.addEventListener('click',()=>window.openUserProfile(m.uid,photo,name));
    const content=document.createElement('div');content.className='msgContent';
    const nameLine=document.createElement('div');nameLine.className='nameLine';nameLine.appendChild(document.createTextNode(name+' '));
    if(verified){const badge=document.createElement('span');badge.className='check';badge.textContent='✓';nameLine.appendChild(badge);}
    const timeEl=document.createElement('span');timeEl.className='time';timeEl.textContent=time;nameLine.appendChild(timeEl);
    const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=String(m.text||'');
    content.append(nameLine,bubble);row.append(avatar,content);messagesEl.appendChild(row);
  });
  messagesEl.scrollTop=messagesEl.scrollHeight;
},error=>{
  console.error('Community messages listener:',error);
  messagesEl.innerHTML='<div style="text-align:center;color:#fca5a5;padding:24px">تعذر تحميل الرسائل بسبب صلاحيات Firestore</div>';
});
onSnapshot(doc(db,'communities',communityId), (snap)=>{
  if(isGeneralPublicChat&&snap.exists()&&uid){const members=Array.isArray(snap.data().members)?snap.data().members:[];globalMembers=members;document.getElementById('globalTotalMembers').textContent=String(members.length);const joined=members.includes(uid);if(joined!==hasJoinedGeneralChat){hasJoinedGeneralChat=joined;updateGeneralChatGate();}if(isGeneralPublicChat&&document.getElementById('globalMembersList').style.display!=='none')renderGlobalMembers(members);}
  if(snap.exists()){
    const data=snap.data();
    if(data.name) commNameEl.textContent=isGeneralPublicChat?'الشات العام':data.name;
    if(!isGeneralPublicChat){
      const flagCode=String(data.flag||communityId).toLowerCase();
      const flagUrl=flagCode==='south'?SOUTH_FLAG:(/^[a-z]{2}$/.test(flagCode)?'https://flagcdn.com/w160/'+flagCode+'.png':'');
      if(data.img){
        commFlagEl.innerHTML='<img src="'+String(data.img).replace(/"/g,'&quot;')+'" alt="صورة المجتمع" style="width:100%;height:100%;object-fit:cover">';
      }else if(flagCode==='south'){
        commFlagEl.innerHTML=SOUTH_SVG;
      }else if(flagUrl){
        commFlagEl.innerHTML='<img src="'+flagUrl+'" alt="علم المجتمع" style="width:100%;height:100%;object-fit:cover">';
      }
      commMiniFlagEl.innerHTML=flagUrl?'<img src="'+flagUrl+'" alt="علم الدولة" style="width:100%;height:100%;object-fit:cover">':(flagCode==='south'?SOUTH_SVG:'');
    }
    const count=data.membersCount|| (data.members?data.members.length:0) || 0;
    memberCountEl.textContent=isGeneralPublicChat?count+' عضو • شات مفتوح':' '+count+' عضو';
  }
});
window.openUserProfile=async (targetUid, fallbackPhoto, fallbackName)=>{
  lastOpenedUid=targetUid;
  const modal=document.getElementById('profileModal');
  modal.classList.add('on');
  document.getElementById('pName').textContent=fallbackName||'تحميل...';
  document.getElementById('pAvatarLetter').textContent=(fallbackName||'T')[0];
  document.getElementById('pId').textContent='ID: '+genId(targetUid);
  if(fallbackPhoto){ document.getElementById('pAvatarImg').src=fallbackPhoto; document.getElementById('pAvatarImg').style.display='block'; document.getElementById('pAvatarLetter').style.display='none'; }
  document.getElementById('pBio').textContent='جاري التحميل...';
  try{
    const snap=await getDoc(doc(db,'users',targetUid));
    if(snap.exists()){
      const d=snap.data();
      const photo=d.photoURL||d.photo||d.avatar||fallbackPhoto||'';
      const name=d.displayName||d.name||fallbackName||'مستخدم';
      const bio=d.bio||'مرحبا بكم في ملفي الشخصي 👋';
      const countryInfo=(await getCountryRegistry()).find(c=>c.code===String(d.country||'').toLowerCase());
      const countryName=countryInfo?.name||(d.country?'غير محدد':(d.countryName||'غير محدد'));
      const flagImg=countryInfo?.code==='south-arabia'?await getSouthArabiaFlag():(countryInfo?.flag||(d.country?'':(d.countryFlagImg||'')));
      const cover=d.cover||'';
      const gender=d.gender||'';
      const gaboId=d.gaboId||genId(targetUid);
      document.getElementById('pName').textContent=name;
      document.getElementById('pAvatarLetter').textContent=name[0];
      if(photo){ const img=document.getElementById('pAvatarImg'); img.src=photo; img.style.display='block'; document.getElementById('pAvatarLetter').style.display='none'; }
      if(cover){ const cImg=document.getElementById('pCoverImg'); cImg.src=cover; cImg.style.display='block'; }
      document.getElementById('pCountryName').textContent=countryName;
      document.getElementById('pFlag').innerHTML=flagImg?`<img src="${flagImg}" style="width:26px;height:18px;border-radius:3px">`:'';
      document.getElementById('pGender').textContent=gender;
      document.getElementById('pId').textContent='ID: '+gaboId;
      document.getElementById('pBio').textContent=bio;
    }
  }catch{}
}
window.closeProfile=()=>{ document.getElementById('profileModal').classList.remove('on'); }
document.getElementById('pChatBtn').onclick=()=>{ if(!lastOpenedUid) return; location.href=`/dm/?uid=${lastOpenedUid}`; }
document.getElementById('pViewBtn').onclick=()=>{ if(!lastOpenedUid) return; location.href=`/profile/view/?uid=${lastOpenedUid}`; }
window.sendMsg=async ()=>{
  const text=msgInput.value.trim();
  if(!text)return;
  const currentUser=auth.currentUser;
  if(!currentUser){alert('انتهت جلسة الدخول، سجل الدخول من جديد.');location.href='/login/';return;}
  uid=currentUser.uid;
  if(!hasJoinedGeneralChat){alert('انضم إلى المجتمع أولاً قبل إرسال الرسائل.');return;}
  const btn=document.querySelector('.sendBtn');
  if(btn)btn.disabled=true;
  try{
    const displayName=userData?.displayName||userData?.name||userData?.fullName||currentUser.displayName||currentUser.email?.split('@')[0]||localStorage.getItem('gabo_name')||'مستخدم';
    const photoURL=userData?.photoURL||userData?.photoUrl||userData?.photo||userData?.avatar||userData?.avatarUrl||currentUser.photoURL||localStorage.getItem('gabo_photo')||'';
    await addDoc(collection(db,'communities',communityId,'messages'),{text,uid:currentUser.uid,displayName,name:displayName,photoURL,avatar:photoURL,photo:photoURL,verified:userData?.verified||false,createdAt:serverTimestamp()});
    msgInput.value='';
    const commRef=doc(db,'communities',communityId);
    const today=new Date().toISOString().slice(0,10);
    try{
      const commSnap=await getDoc(commRef);
      const sameDay=commSnap.exists()&&commSnap.data().activityDay===today;
      await setDoc(commRef,{messagesToday:sameDay?increment(1):1,activityScore:sameDay?increment(3):3,activityDay:today,lastActivityAt:serverTimestamp()},{merge:true});
    }catch(activityError){
      console.warn('Message sent; activity counter update failed:',activityError);
    }
  }catch(error){
    console.error('sendMsg failed:',error);
    alert(error?.code==='permission-denied'?'لا تملك صلاحية الإرسال. تأكد أنك عضو في المجتمع وأن قواعد Firestore تسمح بذلك.':'تعذر إرسال الرسالة، حاول مرة أخرى.');
  }finally{if(btn)btn.disabled=false;}
}
window.toggleEmoji=()=>{ const p=document.getElementById('emojiPanel'); p.classList.toggle('on'); if(p.classList.contains('on')) showEmojiCat(null,'smile'); }
window.showEmojiCat=(e,cat)=>{
  if(e) e.target.closest('.emojiTabs').querySelectorAll('button').forEach(b=>b.classList.remove('on'));
  if(e) e.target.classList.add('on');
  const grid=document.getElementById('emojiGrid'); grid.innerHTML='';
  const list=cat==='flags'?['🇸🇦','🇾🇪','🇦🇪','🇴🇲','🇶🇦','🇰🇼','🇧🇭']:['😀','😂','❤️','🔥','👍','😍','🙏','💪'];
  list.forEach(em=>{ const s=document.createElement('span'); s.textContent=em; s.onclick=()=>{ msgInput.value+=em; msgInput.focus(); }; grid.appendChild(s); });
  if(cat==='flags'){ const s=document.createElement('span'); s.className='flagCustom'; s.innerHTML=SOUTH_SVG; s.onclick=()=>{ msgInput.value+=' 🏴 '; }; grid.appendChild(s); }
}
