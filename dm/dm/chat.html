<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دردشة - GABO LIVE</title>
<style>
:root{--bg:#050507;--b:#232334}
*{margin:0;padding:0;box-sizing:border-box}
body{height:100dvh;background:var(--bg);color:#fff;font-family:system-ui;display:flex;flex-direction:column;position:fixed;inset:0}
.header{height:60px;background:#11111a;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px;padding:0 12px}
.back{width:40px;height:40px;background:#1e1c2e;border:1px solid var(--b);border-radius:50%;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#fbbf24);display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;display:none}
.info b{font-size:14px}.info small{color:#22c55e;font-size:11px}
.messages{flex:1;overflow:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14px}
.bubble.in{align-self:flex-start;background:#1e1e2e;border:1px solid var(--b)}
.bubble.out{align-self:flex-end;background:#7c3aed}
.dateSep{align-self:center;background:#222;padding:4px 12px;border-radius:20px;font-size:11px;color:#888;margin:8px 0}
.inputBar{background:#11111a;border-top:1px solid var(--b);padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}
.inputWrap{flex:1;background:#1e1e2e;border:1px solid var(--b);border-radius:24px;padding:4px 12px;display:flex}
.inputWrap input{flex:1;background:transparent;border:0;color:#fff;outline:none;padding:8px 0}
.sendBtn{width:44px;height:44px;border-radius:50%;background:#7c3aed;border:0;color:#fff;font-size:18px}
</style>
</head>
<body>
<div class="header"><div class="back" onclick="location.href='/dm/'">›</div><div class="avatar"><span id="avL">U</span><img id="avImg"></div><div class="info"><b id="name">...</b><small>● متصل الآن</small></div></div>
<div class="messages" id="messages"><div class="dateSep">جاري التحميل...</div></div>
<div class="inputBar"><div class="inputWrap"><input id="msgInput" placeholder="اكتب رسالة..."></div><button class="sendBtn" id="sendBtn">➤</button></div>

<script type="module">
import { db } from '/firebase-config.js';
import { doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const chatId = new URLSearchParams(location.search).get('id');
const messagesEl = document.getElementById('messages');
const input = document.getElementById('msgInput');
if(!chatId) location.href='/dm/';

// 1- نجيب الـ UID بأي طريقة حتى لو auth null
function getMyUid(){
  // من localStorage اللي حفظناه
  let uid = localStorage.getItem('gabo_uid') || localStorage.getItem('uid') || localStorage.getItem('userId');
  if(uid) return uid;
  // من مفاتيح firebase الداخلية في سفاري
  for(let i=0;i<localStorage.length;i++){
    let k=localStorage.key(i);
    if(k && k.includes('firebase:authUser')){
      try{
        let v=JSON.parse(localStorage.getItem(k));
        if(v && v.uid) return v.uid;
      }catch(e){}
    }
  }
  return null;
}

let myUid = getMyUid();
if(!myUid){
  messagesEl.innerHTML='<div class="dateSep">سجل دخول مرة واحدة من <a href="/login/" style="color:#7c3aed">هنا</a> وبعدها لن يطلب منك مرة ثانية</div>';
}else{
  loadChat(myUid);
}

async function loadChat(uid){
  const snap=await getDoc(doc(db,'chats',chatId));
  if(!snap.exists()){ messagesEl.innerHTML='<div class="dateSep">الدردشة غير موجودة</div>'; return; }
  const data=snap.data();
  const otherId=data.users.find(id=>id!==uid) || data.users[0];
  const other=data.usersInfo?.[otherId] || {name:'مستخدم'};
  document.getElementById('name').textContent=other.name;
  document.getElementById('avL').textContent=(other.name[0]||'U').toUpperCase();
  if(other.photo){ const img=document.getElementById('avImg'); img.src=other.photo; img.style.display='block'; }

  const q=query(collection(db,'chats',chatId,'messages'), orderBy('createdAt','asc'));
  onSnapshot(q, s=>{
    messagesEl.innerHTML='';
    if(s.empty){ messagesEl.innerHTML='<div class="dateSep">ابدأ المحادثة 👋</div>'; return; }
    s.forEach(d=>{
      const m=d.data();
      const isMe=m.senderId===uid;
      messagesEl.innerHTML+=`<div class="bubble ${isMe?'out':'in'}">${(m.text||'').replace(/</g,'&lt;')}</div>`;
    });
    messagesEl.scrollTop=messagesEl.scrollHeight;
  });
}

async function send(){
  const text=input.value.trim();
  if(!text) return;
  myUid = getMyUid();
  if(!myUid){ alert('سجل دخولك مرة واحدة'); location.href='/login/'; return; }
  input.value='';
  try{
    await addDoc(collection(db,'chats',chatId,'messages'),{text:text,senderId:myUid,createdAt:serverTimestamp()});
    await updateDoc(doc(db,'chats',chatId),{lastMsg:text.slice(0,30),lastAt:serverTimestamp()});
  }catch(e){ alert(e.message); }
}
document.getElementById('sendBtn').onclick=send;
input.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } };
</script>
</body>
</html>
