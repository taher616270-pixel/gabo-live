<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دردشة خاصة</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed;--muted:#8b8ba7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{height:64px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px;padding:0 12px;position:fixed;top:0;left:0;right:0;z-index:10}
.back{width:36px;height:36px;background:#161426;border:1px solid var(--b);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.headerIcon{width:38px;height:38px;border-radius:50%;background:#1e1c32;border:1px solid var(--b);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.hInfo{flex:1;overflow:hidden}
.hInfo b{font-size:14px;display:flex;align-items:center;gap:6px}
.hInfo small{font-size:11px;color:var(--muted)}
.tabs{position:fixed;top:64px;left:0;right:0;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;z-index:9;padding:0 12px;gap:12px}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:12px 0;font-size:13px;font-weight:800;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:var(--v)}
.searchBox{position:fixed;top:106px;left:0;right:0;background:var(--bg);padding:8px 12px;z-index:8}
.searchBox input{width:100%;background:#1a182a;border:1px solid var(--b);border-radius:20px;padding:10px 14px;color:#fff;outline:0;font-size:13px}
.list{flex:1;overflow:auto;padding:156px 10px 90px 10px;display:flex;flex-direction:column;gap:8px}
.chatItem{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.chatItem:hover{border-color:var(--v)}
.userItem{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.userItem .info{flex:1;overflow:hidden}
.userItem b{font-size:13px;display:block}
.userItem small{color:var(--muted);font-size:11px}
.actionBtn{background:var(--v);border:0;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0}
.actionBtn.outline{background:transparent;border:1px solid var(--b);color:#fff}
.chat{flex:1;overflow:auto;padding:76px 12px 90px 12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:10px 14px;border-radius:18px;background:#1e1c2e;border:1px solid var(--b);font-size:14px;word-break:break-word}
.bubble.me{align-self:flex-end;background:var(--v);border-color:var(--v)}
.inputBar{position:fixed;bottom:84px;left:0;right:0;background:#0f0e18;border-top:1px solid var(--b);padding:10px;display:flex;gap:8px;z-index:20}
.inputBar input{flex:1;background:#1a182a;border:1px solid var(--b);border-radius:20px;padding:12px 14px;color:#fff;outline:0;font-size:14px}
.send{width:44px;height:44px;border-radius:50%;background:var(--v);border:0;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.bottomNav{position:fixed;bottom:0;left:0;right:0;height:84px;background:#0f0e18;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;padding-bottom:env(safe-area-inset-bottom);z-index:1000;direction:ltr}
.bottomNav a{flex:1;text-decoration:none;color:#6b6b7a;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.bottomNav a.on{color:#fff}
.bottomNav a .ic{font-size:22px;line-height:1;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.bottomNav a.plus .ic{background:var(--v);color:#fff;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-16px;box-shadow:0 4px 12px rgba(124,58,237,.4)}
.fab{position:fixed;bottom:96px;left:16px;width:56px;height:56px;border-radius:50%;background:var(--v);border:0;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;z-index:50;box-shadow:0 4px 16px rgba(124,58,237,.5);cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:10000;display:none;padding:0}
.modal.on{display:flex;flex-direction:column}
.modalTop{height:60px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px;padding:0 12px}
.modalList{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<div class="header">
<div class="back" onclick="handleBack()">‹</div>
<div class="headerIcon" id="hIcon">💬</div>
<div class="hInfo"><b><span id="hName">دردشة خاصة</span> <span id="notifBadge" style="display:none;background:#ff3b30;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px">0</span></b><small id="hStatus">محادثاتي</small></div>
</div>

<div class="tabs" id="tabs">
<button id="tabChats" class="on" onclick="switchTab('chats')">💬 محادثاتي</button>
<button id="tabFriends" onclick="switchTab('friends')">👥 أصدقائي</button>
</div>

<div class="searchBox" id="searchBox"><input id="searchInput" placeholder="🔍 بحث باسم الشخص..." oninput="onSearch()"></div>

<div class="list" id="listView"></div>
<div class="chat" id="chatView" style="display:none"></div>
<div class="inputBar" id="inputBar" style="display:none"><input id="msgInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="send" onclick="sendMsg()">➤</button></div>

<button class="fab" id="fabBtn" onclick="openAddPeople()" title="إضافة أشخاص">+</button>

<div class="bottomNav">
  <a href="/profile/"><span class="ic">👤</span><span>حسابي</span></a>
  <a href="/dm/" class="on"><span class="ic">🔒</span><span>خاص</span></a>
  <a href="/create/" class="plus"><span class="ic">+</span></a>
  <a href="/posts/"><span class="ic">📄</span><span>منشورات</span></a>
  <a href="/app/"><span class="ic">🏠</span><span>الرئيسية</span></a>
</div>

<!-- مودال إضافة أشخاص -->
<div class="modal" id="addModal">
  <div class="modalTop">
    <div class="back" onclick="closeAddPeople()">‹</div>
    <b>إضافة أشخاص</b>
    <small style="margin-right:auto;color:#8b8ba7">تابع وارسل لهم</small>
  </div>
  <div style="padding:10px"><input id="addSearch" placeholder="🔍 ابحث..." oninput="filterAdd()" style="width:100%;background:#1a182a;border:1px solid #2a2840;border-radius:20px;padding:10px 14px;color:#fff;outline:0"></div>
  <div class="modalList" id="addList"></div>
</div>

<script type="module">
import {auth,db} from '/firebase-config.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {doc,getDoc,setDoc,collection,addDoc,serverTimestamp,onSnapshot,query,orderBy,where,getDocs,limit,arrayUnion} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

let uid=null, targetUid=null, chatId=null, currentTab='chats', allUsersCache=[], friendsCache=[], chatsCache=[];
function getTargetUid(){
  const p=new URLSearchParams(location.search);
  return p.get('uid') || p.get('id') || localStorage.getItem('last_dm_uid');
}
targetUid=getTargetUid();

window.handleBack=()=>{
  if(document.getElementById('chatView').style.display==='flex'){
    localStorage.removeItem('last_dm_uid');
    location.href='/dm/';
  }else if(history.length>1) history.back();
  else location.href='/app/';
}

window.switchTab=(tab)=>{
  currentTab=tab;
  document.getElementById('tabChats').classList.toggle('on', tab==='chats');
  document.getElementById('tabFriends').classList.toggle('on', tab==='friends');
  if(tab==='chats') renderChats();
  if(tab==='friends') renderFriends();
}

window.onSearch=()=>{
  if(currentTab==='chats') renderChats();
  if(currentTab==='friends') renderFriends();
}

function filterBySearch(arr){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  if(!q) return arr;
  return arr.filter(u=> (u.name||'').toLowerCase().includes(q) || (u.gaboId||'').includes(q) );
}

function renderChats(){
  const list=document.getElementById('listView');
  const filtered=filterBySearch(chatsCache);
  list.innerHTML='';
  if(filtered.length===0){
    list.innerHTML='<div style="text-align:center;color:#8b8ba7;margin-top:80px;line-height:1.8">لا يوجد محادثات بعد<br><button onclick="openAddPeople()" style="margin-top:12px;background:#7c3aed;border:0;color:#fff;padding:10px 18px;border-radius:20px">+ إضافة أشخاص</button></div>';
    return;
  }
  filtered.forEach(c=>{
    const item=document.createElement('div');
    item.className='chatItem';
    item.innerHTML=`<div style="width:42px;height:42px;border-radius:50%;overflow:hidden;background:#222"><img src="${c.photo}" style="width:100%;height:100%;object-fit:cover"></div><div style="flex:1;overflow:hidden"><b style="font-size:13px">${c.name}</b><br><small style="color:#8b8ba7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${c.lastText||'اضغط لفتح المحادثة'}</small></div><div style="color:#6b6b7a">‹</div>`;
    item.onclick=()=>{localStorage.setItem('last_dm_uid', c.otherUid); location.href='/dm/?uid='+c.otherUid;};
    list.appendChild(item);
  });
}

function renderFriends(){
  const list=document.getElementById('listView');
  const filtered=filterBySearch(friendsCache);
  list.innerHTML='';
  if(filtered.length===0){
    list.innerHTML='<div style="text-align:center;color:#8b8ba7;margin-top:80px;line-height:1.8">لا يوجد أصدقاء بعد<br>الأصدقاء هم اللي ضايفين بعض<br><small>تابع شخص وهو يتابعك</small><br><button onclick="openAddPeople()" style="margin-top:12px;background:#7c3aed;border:0;color:#fff;padding:10px 18px;border-radius:20px">+ إضافة أشخاص</button></div>';
    return;
  }
  filtered.forEach(u=>{
    const div=document.createElement('div');
    div.className='userItem';
    div.innerHTML=`<div style="width:42px;height:42px;border-radius:50%;overflow:hidden;background:#222"><img src="${u.photo}" style="width:100%;height:100%;object-fit:cover"></div><div class="info"><b>${u.name}</b><small>${u.country} • صديق ✓</small><br><small style="font-family:monospace">ID: ${u.gaboId}</small></div><button class="actionBtn" onclick="startChat('${u.uid}')">💬 راسل</button>`;
    list.appendChild(div);
  });
}

window.openAddPeople=()=>{
  document.getElementById('addModal').classList.add('on');
  loadAddPeople();
}
window.closeAddPeople=()=>{document.getElementById('addModal').classList.remove('on');}

let addPeopleCache=[];
async function loadAddPeople(){
  const list=document.getElementById('addList');
  list.innerHTML='<div style="text-align:center;color:#8b8ba7;margin-top:40px">جاري التحميل...</div>';
  try{
    const snap=await getDocs(query(collection(db,'users'), limit(80)));
    addPeopleCache=[];
    snap.forEach(d=>{
      if(d.id===uid) return;
      const data=d.data();
      // لا تطلع اللي هم اصدقاء بالفعل
      if(friendsCache.find(f=>f.uid===d.id)) return;
      addPeopleCache.push({
        uid:d.id,
        name:data.displayName||data.name||'مستخدم',
        photo:data.photoURL||data.photo||data.avatar||'https://i.pravatar.cc/100?u='+d.id,
        country:data.countryName||'',
        gaboId:data.gaboId||d.id.slice(0,8),
        following:data.following||0
      });
    });
    renderAddPeople(addPeopleCache);
  }catch(e){
    list.innerHTML='<div style="color:#ef4444;text-align:center">خطأ: '+e.message+'</div>';
  }
}
function renderAddPeople(arr){
  const list=document.getElementById('addList');
  list.innerHTML='';
  arr.forEach(u=>{
    const div=document.createElement('div');
    div.className='userItem';
    div.innerHTML=`<div style="width:42px;height:42px;border-radius:50%;overflow:hidden"><img src="${u.photo}" style="width:100%;height:100%;object-fit:cover"></div><div class="info"><b>${u.name}</b><small>${u.country}</small><br><small style="font-family:monospace">ID: ${u.gaboId}</small></div><div style="display:flex;gap:6px"><button class="actionBtn outline" onclick="followUser('${u.uid}')">+ تابع</button><button class="actionBtn" onclick="startChat('${u.uid}')">💬</button></div>`;
    list.appendChild(div);
  });
}
window.filterAdd=()=>{
  const q=document.getElementById('addSearch').value.toLowerCase().trim();
  if(!q) renderAddPeople(addPeopleCache);
  else renderAddPeople(addPeopleCache.filter(u=>u.name.toLowerCase().includes(q)));
}

window.followUser=async(otherUid)=>{
  try{
    const myRef=doc(db,'users',uid);
    await setDoc(myRef,{following:arrayUnion(otherUid), followingCount:1},{merge:true});
    const otherRef=doc(db,'users',otherUid);
    await setDoc(otherRef,{followers:arrayUnion(uid)},{merge:true});
    alert('تمت المتابعة ✅');
    // اعادة تحميل الاصدقاء
    loadFriendsData();
  }catch(e){alert(e.message)}
}

window.startChat=(otherUid)=>{
  localStorage.setItem('last_dm_uid', otherUid);
  location.href='/dm/?uid='+otherUid;
}

async function loadChatsData(){
  try{
    const q=query(collection(db,'privateChats'), where('participants','array-contains', uid));
    onSnapshot(q, async snap=>{
      chatsCache=[];
      for(const d of snap.docs){
        const data=d.data();
        const other=data.participants?.find(x=>x!==uid);
        if(!other) continue;
        let name=other.slice(0,8), photo='https://i.pravatar.cc/100?u='+other;
        try{
          const us=await getDoc(doc(db,'users',other));
          if(us.exists()){name=us.data().displayName||us.data().name||name; photo=us.data().photoURL||us.data().photo||photo;}
        }catch{}
        chatsCache.push({otherUid:other, name, photo, lastText:data.lastText||'', lastAt:data.lastAt?.seconds||0});
      }
      chatsCache.sort((a,b)=>b.lastAt-a.lastAt);
      if(currentTab==='chats') renderChats();
      // اشعار عدد المحادثات
      const badge=document.getElementById('notifBadge');
      if(chatsCache.length>0){badge.textContent=chatsCache.length; badge.style.display='inline-block';}
    });
  }catch{}
}

async function loadFriendsData(){
  try{
    const mySnap=await getDoc(doc(db,'users',uid));
    if(!mySnap.exists()) return;
    const myData=mySnap.data();
    const myFollowing=myData.following||[];
    friendsCache=[];
    for(const fid of myFollowing){
      try{
        const fSnap=await getDoc(doc(db,'users',fid));
        if(!fSnap.exists()) continue;
        const fData=fSnap.data();
        const theirFollowing=fData.following||[];
        // اذا هو متابعك انت كمان => صديق
        if(theirFollowing.includes(uid)){
          friendsCache.push({
            uid:fid,
            name:fData.displayName||fData.name||'مستخدم',
            photo:fData.photoURL||fData.photo||'https://i.pravatar.cc/100?u='+fid,
            country:fData.countryName||'',
            gaboId:fData.gaboId||fid.slice(0,8)
          });
        }
      }catch{}
    }
    if(currentTab==='friends') renderFriends();
  }catch{}
}

onAuthStateChanged(auth, async u=>{
  if(!u){location.href='/login/';return}
  uid=u.uid;
  
  // تحميل البيانات
  loadChatsData();
  loadFriendsData();

  if(targetUid){
    // وضع محادثة مباشرة - هذا يصلح مشكلة عدم الحفظ
    document.getElementById('tabs').style.display='none';
    document.getElementById('searchBox').style.display='none';
    document.getElementById('fabBtn').style.display='none';
    document.getElementById('hIcon').textContent='💬';
    chatId=[uid,targetUid].sort().join('_');
    document.getElementById('listView').style.display='none';
    document.getElementById('chatView').style.display='flex';
    document.getElementById('inputBar').style.display='flex';
    
    try{
      const snap=await getDoc(doc(db,'users',targetUid));
      if(snap.exists()){
        const d=snap.data();
        document.getElementById('hName').textContent=d.displayName||d.name||'مستخدم';
        document.getElementById('hStatus').textContent='متصل • اضغط للرجوع';
        document.getElementById('hStatus').style.cursor='pointer';
        document.getElementById('hStatus').onclick=()=>{localStorage.removeItem('last_dm_uid'); location.href='/dm/';}
      }
    }catch{}

    // مهم: انشاء المحادثة حتى تنحفظ في محادثاتي
    await setDoc(doc(db,'privateChats',chatId),{
      participants:[uid,targetUid],
      participantsSorted:[uid,targetUid].sort(),
      createdAt:serverTimestamp(),
      lastAt:serverTimestamp(),
      lastText:''
    },{merge:true});
    
    const q=query(collection(db,'privateChats',chatId,'messages'),orderBy('createdAt','asc'));
    onSnapshot(q, s=>{
      const box=document.getElementById('chatView');
      box.innerHTML='';
      if(s.empty){
        box.innerHTML='<div style="text-align:center;color:#6b6b7a;margin-top:60px">ابدأ المحادثة 👋</div>';
      }else{
        s.forEach(d=>{
          const m=d.data();
          const div=document.createElement('div');
          div.className='bubble '+(m.uid===uid?'me':'');
          div.textContent=m.text||'';
          box.appendChild(div);
        });
      }
      box.scrollTop=box.scrollHeight;
    });
  }else{
    document.getElementById('tabs').style.display='flex';
    document.getElementById('searchBox').style.display='block';
    document.getElementById('chatView').style.display='none';
    document.getElementById('inputBar').style.display='none';
    document.getElementById('listView').style.display='flex';
    document.getElementById('hIcon').textContent='💬';
    document.getElementById('hName').textContent='دردشة خاصة';
    document.getElementById('hStatus').textContent='محادثاتي • أصدقائي';
    switchTab('chats');
  }
});

window.sendMsg=async()=>{
  const input=document.getElementById('msgInput');
  const t=input.value.trim();
  if(!t || !chatId) return;
  input.value='';
  // حفظ الرسالة
  await addDoc(collection(db,'privateChats',chatId,'messages'),{text:t, uid:uid, createdAt:serverTimestamp()});
  // تحديث اخر رسالة عشان تطلع في محادثاتي - هذا كان الخطأ
  await setDoc(doc(db,'privateChats',chatId),{
    lastText:t,
    lastAt:serverTimestamp(),
    participants:[uid,targetUid],
    participantsSorted:[uid,targetUid].sort()
  },{merge:true});
}
</script>
</body>
</html>
