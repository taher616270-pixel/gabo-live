<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دردشة خاصة - GABO LIVE</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;height:100dvh;overflow:hidden;position:fixed;inset:0;display:flex;flex-direction:column}
.top{height:56px;background:var(--bg);border-bottom:1px solid var(--b);display:flex;align-items:center;gap:12px;padding:0 14px;flex-shrink:0}
.back{width:40px;height:40px;background:#1e1c2e;border:1px solid var(--b);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer}
.listView{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column}
.chatView{flex:1;display:none;flex-direction:column;background:#050507}
.chatView.on{display:flex}
.item{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item img{width:48px;height:48px;border-radius:50%;background:#2a2840;object-fit:cover}
.messages{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:radial-gradient(ellipse at top,#1a1a2e 0%,#050507 60%)}
.bubble{max-width:78%;padding:10px 14px;border-radius:18px;font-size:14px;word-break:break-word}
.bubble.in{align-self:flex-start;background:#1e1e2e;border:1px solid var(--b);border-bottom-right-radius:6px}
.bubble.out{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#4f46e5);border-bottom-left-radius:6px}
.inputBar{background:#11111a;border-top:1px solid var(--b);padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;flex-shrink:0}
.inputWrap{flex:1;background:#1e1e2e;border:1px solid var(--b);border-radius:24px;display:flex;padding:4px 12px}
.inputWrap input{flex:1;background:transparent;border:0;color:#fff;outline:none;padding:8px 0;font-size:14px}
.sendBtn{width:44px;height:44px;border-radius:50%;background:var(--v);border:0;color:#fff;font-size:18px;cursor:pointer}
.fab{position:fixed;bottom:90px;left:16px;width:56px;height:56px;background:#fff;color:#000;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;cursor:pointer;z-index:20;border:0}
.bottomNav{height:68px;background:#0f0e18;border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));direction:ltr;flex-shrink:0}
.bottomNav a{flex:1;text-decoration:none;color:#6b6b7a;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottomNav a.on{color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;flex-direction:column}
.modal.on{display:flex}
.userRow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px}
.userRow img{width:50px;height:50px;border-radius:50%;background:#2a2840}
.chatBtn{background:var(--v);color:#fff;border:0;padding:8px 14px;border-radius:10px;font-weight:700;cursor:pointer;margin-right:auto}
</style>
</head>
<body>
<!-- قائمة الدردشات -->
<div class="top" id="listTop"><div class="back" onclick="location.href='/profile/'">›</div><b>🔒 دردشة خاصة</b></div>
<div class="listView" id="listView"><div id="chatList">جاري التحميل...</div></div>

<!-- شاشة الدردشة (نفس الصفحة) -->
<div class="chatView" id="chatView">
  <div class="top"><div class="back" id="backToList">›</div><img id="chatAvatar" style="width:40px;height:40px;border-radius:50%;background:#2a2840"><b id="chatName">...</b></div>
  <div class="messages" id="messages"></div>
  <div class="inputBar"><div class="inputWrap"><input id="msgInput" placeholder="اكتب رسالة..."></div><button class="sendBtn" id="sendBtn">➤</button></div>
</div>

<button class="fab" id="newChatBtn">+</button>
<div class="bottomNav"><a href="/profile/">👤 حسابي</a><a class="on">🔒 دردشة</a><a href="/create/">+ منشور</a><a href="/app/">🏠</a></div>

<div class="modal" id="usersModal">
  <div class="top"><input id="searchUser" placeholder="ابحث..." style="flex:1;background:#1e1c2e;border:1px solid var(--b);border-radius:12px;padding:12px;color:#fff"><button id="closeModal" style="width:40px;height:40px;border-radius:50%;background:#1e1c2e;border:1px solid var(--b);color:#fff">✕</button></div>
  <div style="flex:1;overflow:auto;padding:12px" id="usersList"></div>
</div>

<script type="module">
import { auth, db } from '/firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { collection, query, where, getDocs, onSnapshot, addDoc, doc, orderBy, serverTimestamp, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

let myUid=null, currentChatId=null, unsubscribe=null;
const chatList=document.getElementById('chatList');
const chatView=document.getElementById('chatView');
const listView=document.getElementById('listView');
const listTop=document.getElementById('listTop');
let allUsers=[];

function saveUid(uid){ myUid=uid; localStorage.setItem('gabo_uid',uid); }

onAuthStateChanged(auth, u=>{
  if(u){ saveUid(u.uid); loadChats(u.uid); loadUsers(u.uid); }
  else{
    const s=localStorage.getItem('gabo_uid');
    if(s){ myUid=s; loadChats(s); loadUsers(s); }
  }
});

function loadChats(uid){
  const q=query(collection(db,'chats'), where('users','array-contains', uid));
  onSnapshot(q, snap=>{
    if(snap.empty){ chatList.innerHTML='<div style="text-align:center;padding:60px;color:#888">لا توجد دردشات<br>اضغط + لبدء محادثة</div>'; return; }
    chatList.innerHTML='';
    snap.forEach(d=>{
      const data=d.data();
      const otherId=data.users.find(id=>id!==uid);
      const other=data.usersInfo?.[otherId]||{name:'مستخدم',photo:''};
      const el=document.createElement('div');
      el.className='item';
      el.innerHTML=`<img src="${other.photo}"><div><b>${other.name}</b><br><small>${data.lastMsg||''}</small></div>`;
      el.onclick=()=>openChat(d.id, other);
      chatList.appendChild(el);
    });
  });
}

function openChat(chatId, other){
  currentChatId=chatId;
  document.getElementById('chatName').textContent=other.name;
  document.getElementById('chatAvatar').src=other.photo||'';
  listView.style.display='none';
  listTop.style.display='none';
  document.getElementById('newChatBtn').style.display='none';
  chatView.classList.add('on');
  const messagesEl=document.getElementById('messages');
  messagesEl.innerHTML='جاري التحميل...';
  if(unsubscribe) unsubscribe();
  const q=query(collection(db,'chats',chatId,'messages'), orderBy('createdAt','asc'));
  unsubscribe=onSnapshot(q, s=>{
    messagesEl.innerHTML='';
    if(s.empty){ messagesEl.innerHTML='<div style="align-self:center;background:#222;padding:6px 12px;border-radius:20px;font-size:12px;color:#888">ابدأ المحادثة 👋</div>'; return; }
    s.forEach(docSnap=>{
      const m=docSnap.data();
      const isMe=m.senderId===myUid;
      messagesEl.innerHTML+=`<div class="bubble ${isMe?'out':'in'}">${(m.text||'').replace(/</g,'&lt;')}</div>`;
    });
    messagesEl.scrollTop=messagesEl.scrollHeight;
  });
}

document.getElementById('backToList').onclick=()=>{
  chatView.classList.remove('on');
  listView.style.display='flex';
  listTop.style.display='flex';
  document.getElementById('newChatBtn').style.display='flex';
  if(unsubscribe) unsubscribe();
};

async function send(){
  const inp=document.getElementById('msgInput');
  const text=inp.value.trim();
  if(!text||!currentChatId||!myUid) return;
  inp.value='';
  await addDoc(collection(db,'chats',currentChatId,'messages'),{text, senderId:myUid, createdAt:serverTimestamp()});
  await updateDoc(doc(db,'chats',currentChatId),{lastMsg:text.slice(0,30), lastAt:serverTimestamp()});
}
document.getElementById('sendBtn').onclick=send;
document.getElementById('msgInput').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } };

async function loadUsers(uid){
  const snap=await getDocs(collection(db,'users'));
  allUsers=[];
  snap.forEach(d=>{ if(d.id!==uid){ const dd=d.data(); allUsers.push({id:d.id, name:dd.displayName||dd.name||'مستخدم', photo:dd.photo||''}); }});
  renderUsers(allUsers);
}
function renderUsers(arr){
  document.getElementById('usersList').innerHTML=arr.map(u=>`<div class="userRow"><img src="${u.photo}"><b>${u.name}</b><button class="chatBtn" onclick="startChat('${u.id}')">راسل</button></div>`).join('');
}
document.getElementById('searchUser').oninput=e=>{ const v=e.target.value.toLowerCase(); renderUsers(allUsers.filter(u=>u.name.toLowerCase().includes(v))); };
document.getElementById('newChatBtn').onclick=()=>document.getElementById('usersModal').classList.add('on');
document.getElementById('closeModal').onclick=()=>document.getElementById('usersModal').classList.remove('on');
window.startChat=async(targetId)=>{
  if(!myUid) return;
  const q=query(collection(db,'chats'), where('users','array-contains', myUid));
  const snap=await getDocs(q);
  let existing=null;
  snap.forEach(d=>{ if(d.data().users.includes(targetId)) existing=d.id; });
  if(existing){ const target=allUsers.find(u=>u.id===targetId); document.getElementById('usersModal').classList.remove('on'); openChat(existing, target); return; }
  const target=allUsers.find(u=>u.id===targetId);
  const newChat=await addDoc(collection(db,'chats'),{users:[myUid,targetId], usersInfo:{[myUid]:{name:'انا',photo:''}, [targetId]:{name:target.name,photo:target.photo}}, lastMsg:'بدأت المحادثة', lastAt:serverTimestamp(), createdAt:serverTimestamp()});
  document.getElementById('usersModal').classList.remove('on');
  openChat(newChat.id, target);
};
</script>
</body>
</html>
