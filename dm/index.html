<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دردشة خاصة</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed;--muted:#8b8ba7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{height:64px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px;padding:0 12px;position:fixed;top:0;left:0;right:0;z-index:10}
.back{width:36px;height:36px;background:#161426;border:1px solid var(--b);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}
.headerAvatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#222;flex-shrink:0;border:1px solid var(--b)}
.headerAvatar img{width:100%;height:100%;object-fit:cover}
.hInfo{flex:1;overflow:hidden}
.badge{font-size:11px;background:#ff3b30;color:#fff;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;font-weight:900}
.tabs{position:fixed;top:64px;left:0;right:0;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;z-index:9;padding:0 12px;gap:12px}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:12px 0;font-size:13px;font-weight:800;cursor:pointer}
.tabs button.on{color:#fff;border-bottom-color:var(--v)}
.searchBox{position:fixed;top:106px;left:0;right:0;background:var(--bg);padding:8px 12px;z-index:8}
.searchBox input{width:100%;background:#1a182a;border:1px solid var(--b);border-radius:20px;padding:10px 14px;color:#fff;outline:0;font-size:13px}
.list{flex:1;overflow:auto;padding:156px 10px 90px 10px;display:flex;flex-direction:column;gap:8px}
.chatItem{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer}
.userItem{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.actionBtn{background:var(--v);border:0;color:#fff;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;flex-shrink:0}
.actionBtn.outline{background:transparent;border:1px solid var(--b);color:#fff}
.chat{flex:1;overflow:auto;padding:76px 12px 130px 12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:10px 14px;border-radius:18px;background:#1e1c2e;border:1px solid var(--b);font-size:14px;word-break:break-word;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.bubble.me{align-self:flex-end;background:var(--v);border-color:var(--v)}
.southFlag{width:28px;height:18px;border-radius:3px;overflow:hidden;display:inline-flex;border:1px solid rgba(255,255,255,.3);flex-shrink:0}
.southFlag svg{width:100%;height:100%;display:block}
.inputBar{position:fixed;bottom:84px;left:0;right:0;background:#0f0e18;border-top:1px solid var(--b);padding:10px;display:flex;gap:8px;z-index:20;align-items:center}
.inputWrap{flex:1;background:#1a182a;border:1px solid var(--b);border-radius:20px;padding:10px 12px;min-height:44px;max-height:90px;overflow-y:auto;outline:0;font-size:16px;line-height:22px;color:#fff;white-space:pre-wrap;word-break:break-word}
.inputWrap:empty:before{content:attr(data-placeholder);color:#6b6b7a}
.emoji-south{width:1.3em;height:1.3em;display:inline-block;vertical-align:-0.2em;margin:0 1px;flex-shrink:0;border-radius:2px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.emoji-south svg{width:100%;height:100%;display:block}
.iconBtn{width:40px;height:40px;border-radius:50%;background:#1e1c2e;border:1px solid var(--b);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;flex-shrink:0}
.send{width:44px;height:44px;border-radius:50%;background:var(--v);border:0;color:#fff;font-size:20px;cursor:pointer;flex-shrink:0}
.emojiPanel{position:fixed;bottom:130px;left:8px;right:8px;background:#161426;border:1px solid var(--b);border-radius:18px;max-height:340px;display:none;flex-direction:column;z-index:2000;overflow:hidden}
.emojiPanel.on{display:flex}
.emojiTabs{display:flex;gap:6px;padding:10px;border-bottom:1px solid var(--b);overflow-x:auto}
.emojiTabs button{background:#0f0e18;border:1px solid var(--b);color:#fff;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:13px;white-space:nowrap}
.emojiTabs button.on{background:var(--v)}
.emojiGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:8px;overflow-y:auto}
.emojiGrid .eItem{font-size:22px;padding:8px;text-align:center;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;min-height:40px}
.emojiGrid .eItem:hover{background:#1e1c2e}
.flagBox{width:28px;height:19px;border-radius:3px;overflow:hidden;border:1px solid #555;background:#000;display:block}
.flagBox svg{width:100%;height:100%;display:block}
.bottomNav{position:fixed;bottom:0;left:0;right:0;height:84px;background:#0f0e18;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;z-index:1000;direction:ltr}
.bottomNav a{flex:1;text-decoration:none;color:#6b6b7a;font-size:10px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.bottomNav a.on{color:#fff}
.bottomNav a .ic{font-size:22px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.bottomNav a.plus .ic{background:var(--v);color:#fff;width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-16px}
.bottomNav .badgeNav{position:absolute;top:-2px;right:10px;background:#ff3b30;color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #0f0e18}
.fab{position:fixed;bottom:96px;left:16px;width:56px;height:56px;border-radius:50%;background:var(--v);border:0;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;z-index:50}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);z-index:10000;display:none;flex-direction:column}
.modal.on{display:flex}
.modalTop{height:60px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px;padding:0 12px}
.modalList{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
</style>
<link rel="stylesheet" href="/assets/style/gabo-theme.css">
</head>
<body>
<div class="header"><div class="back" onclick="handleBack()">‹</div><div class="headerAvatar" id="hAvatarWrap" style="display:none"><img id="hImg"></div><div class="headerIcon" id="hIcon">💬</div><div class="hInfo"><b><span id="hName">دردشة خاصة</span> <span id="countBadge" class="badge" style="display:none">0</span></b><small id="hStatus">محادثاتي • أصدقائي</small></div></div>
<div class="tabs" id="tabs"><button id="tabChats" class="on" onclick="switchTab('chats')">💬 محادثاتي <span id="tabCount"></span></button><button id="tabFriends" onclick="switchTab('friends')">👥 أصدقائي</button></div>
<div class="searchBox" id="searchBox"><input id="searchInput" placeholder="🔍 بحث..." oninput="onSearch()"></div>
<div class="list" id="listView"><div style="text-align:center;color:#8b8ba7;margin-top:60px">جاري التحميل...</div></div>
<div class="chat" id="chatView" style="display:none"></div>
<div class="emojiPanel" id="emojiPanel"><div class="emojiTabs"><button class="on" onclick="showEmojiCat(event,'smile')">😊 وجوه</button><button onclick="showEmojiCat(event,'flags')">🏳️ أعلام</button><button onclick="showEmojiCat(event,'love')">❤️ حب</button></div><div class="emojiGrid" id="emojiGrid"></div></div>
<div class="inputBar" id="inputBar" style="display:none"><button class="iconBtn" onclick="toggleEmoji()">😊</button><div id="inputWrap" class="inputWrap" contenteditable="true" data-placeholder="اكتب رسالة..."></div><button class="send" onclick="sendMsg()">➤</button></div>
<button class="fab" id="fabBtn" onclick="openAddPeople()">+</button>
<div class="bottomNav"><a href="/profile/"><span class="ic">👤</span><span>حسابي</span></a><a href="/dm/" class="on"><span class="ic">🔒</span><span>خاص</span><span id="navCount" class="badgeNav" style="display:none">0</span></a><a href="/create/" class="plus"><span class="ic">+</span></a><a href="/posts/"><span class="ic">📄</span><span>منشورات</span></a><a href="/app/"><span class="ic">🏠</span><span>الرئيسية</span></a></div>
<div class="modal" id="addModal"><div class="modalTop"><div class="back" onclick="closeAddPeople()">‹</div><b>إضافة أشخاص</b></div><div style="padding:10px"><input id="addSearch" placeholder="🔍 ابحث..." oninput="filterAdd()" style="width:100%;background:#1a182a;border:1px solid #2a2840;border-radius:20px;padding:10px 14px;color:#fff;outline:0"></div><div class="modalList" id="addList"></div></div>
<script type="module">
import {auth,db} from '/firebase-config.js';
import {getSouthArabiaFlag} from '/assets/country-flags.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {doc,getDoc,setDoc,collection,addDoc,serverTimestamp,onSnapshot,query,orderBy,where,getDocs,limit,arrayUnion,increment,runTransaction} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const SOUTH_FLAG=await getSouthArabiaFlag();
const SOUTH_SVG=`<img src="${SOUTH_FLAG}" alt="علم الجنوب العربي" style="width:100%;height:100%;object-fit:cover">`
const SOUTH_PH='[[SOUTH_FLAG]]';
let uid=null,targetUid=null,chatId=null,currentTab='chats',chatsCache=[],friendsCache=[],addCache=[];
function getTargetUid(){const p=new URLSearchParams(location.search);return p.get('uid')||p.get('id')||localStorage.getItem('last_dm_uid');}
targetUid=getTargetUid();
window.handleBack=()=>{if(document.getElementById('chatView').style.display==='flex'){localStorage.removeItem('last_dm_uid');location.href='/dm/';}else location.href='/app/';}
window.switchTab=(tab)=>{currentTab=tab;document.getElementById('tabChats').classList.toggle('on',tab==='chats');document.getElementById('tabFriends').classList.toggle('on',tab==='friends');if(tab==='chats')renderChats();if(tab==='friends')renderFriends();}
window.onSearch=()=>{if(currentTab==='chats')renderChats();if(currentTab==='friends')renderFriends();}
function filterBySearch(arr){const q=document.getElementById('searchInput').value.toLowerCase().trim();if(!q)return arr;return arr.filter(u=>(u.name||'').toLowerCase().includes(q));}
window.toggleEmoji=()=>{const p=document.getElementById('emojiPanel');p.classList.toggle('on');if(p.classList.contains('on'))showEmojiCat(null,'smile');}
window.showEmojiCat=(e,cat)=>{
  if(e){e.target.closest('.emojiTabs').querySelectorAll('button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');}
  const grid=document.getElementById('emojiGrid');grid.innerHTML='';
  let flags=['🇸🇦','🇾🇪','🇦🇪','🇴🇲','🇶🇦','🇰🇼','🇧🇭','🇪🇬','🇯🇴','🇱🇧','🇵🇸','🇮🇶','🇸🇾','🇹🇷','🇵🇰','🇺🇸','🇬🇧','🇩🇪','🇫🇷','🇮🇹','🇪🇸','🇨🇦','🇦🇺','🇧🇷','🇷🇺','🇨🇳','🇯🇵','🇰🇷','🇮🇳'];
  let smile=['😀','😂','😍','🥰','😊','😎','🤩','😭','😢','😡','🤔','👍','👎','👏','🙏','💪','🔥','❤️','💜','✨','🎉','🥳'];
  let love=['❤️','🧡','💛','💚','💙','💜','🖤','🤍','💔','❣️','💕','💞','💓','💗','💖','💝','😘','🥰','😍','🤗','💋','💌','🌹'];
  let list = cat==='smile'?smile : cat==='love'?love : flags;
  list.forEach(em=>{
    const d=document.createElement('div');d.className='eItem';d.textContent=em;
    d.onclick=()=>{const w=document.getElementById('inputWrap');w.focus();document.execCommand('insertText',false,em);};
    grid.appendChild(d);
  });
  if(cat==='flags'){
    const south=document.createElement('div');south.className='eItem';south.innerHTML=`<span class="flagBox">${SOUTH_SVG}</span>`;
    south.onclick=()=>{
      const w=document.getElementById('inputWrap');w.focus();
      document.execCommand('insertHTML',false,`<span class="emoji-south" data-south="1">${SOUTH_SVG}</span>\u00A0`);
    };
    grid.insertBefore(south, grid.children[2]||null);
  }
}
async function loadChatsData(){
  const q=query(collection(db,'privateChats'),where('participants','array-contains',uid));
  onSnapshot(q,async snap=>{
    chatsCache=[];
    for(const d of snap.docs){
      const data=d.data();const other=data.participants?.find(x=>x!==uid);if(!other)continue;
      let name=other.slice(0,8),photo='https://i.pravatar.cc/100?u='+other;
      try{const us=await getDoc(doc(db,'users',other));if(us.exists()){name=us.data().displayName||us.data().name||name;photo=us.data().photoURL||us.data().photo||us.data().avatar||photo;}}catch{}
      const unread=data.unread?.[uid]||0;
      const time=data.lastAt?new Date(data.lastAt.seconds*1000).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
      chatsCache.push({otherUid:other,name,photo,lastText:data.lastText||'',time,lastAt:data.lastAt?.seconds||0,count:unread});
    }
    chatsCache.sort((a,b)=>b.lastAt-a.lastAt);
    const totalUnread=chatsCache.reduce((s,c)=>s+c.count,0);const count=chatsCache.length;
    // العداد في القائمة العامة فقط، مو في الهيدر داخل المحادثة
    document.getElementById('navCount').textContent=totalUnread>0?totalUnread:count;
    document.getElementById('navCount').style.display=(totalUnread>0||count>0)?'flex':'none';
    document.getElementById('tabCount').textContent= totalUnread>0?`(${totalUnread})`:(count>0?`(${count})`:'');
    if(currentTab==='chats')renderChats();
  });
}
function renderChats(){
  const list=document.getElementById('listView');const filtered=filterBySearch(chatsCache);list.innerHTML='';
  if(filtered.length===0){list.innerHTML='<div style="text-align:center;color:#8b8ba7;margin-top:80px">لا يوجد محادثات</div>';return;}
  filtered.forEach(c=>{
    const item=document.createElement('div');item.className='chatItem';
    const preview=c.lastText.includes('علم الجنوب')?'🏴 علم الجنوب':c.lastText;
    const badge=c.count>0?`<span style="background:#ff3b30;color:#fff;font-size:10px;font-weight:900;padding:3px 8px;border-radius:12px;min-width:22px;text-align:center">${c.count}</span>`:'';
    item.innerHTML=`<div style="width:42px;height:42px;border-radius:50%;overflow:hidden;background:#222"><img src="${c.photo}" style="width:100%;height:100%;object-fit:cover"></div><div style="flex:1;overflow:hidden"><b style="font-size:13px">${c.name}</b><br><small style="color:#8b8ba7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block">${preview||'محادثة جديدة'}</small></div><div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:65px"><small style="color:#8b8ba7;font-size:11px">${c.time||''}</small>${badge}<div style="color:#6b6b7a">›</div></div>`;
    item.onclick=async()=>{const tmp=[uid,c.otherUid].sort().join('_');try{await setDoc(doc(db,'privateChats',tmp),{unread:{[uid]:0}},{merge:true});}catch{}localStorage.setItem('last_dm_uid',c.otherUid);location.href='/dm/?uid='+c.otherUid;};
    list.appendChild(item);
  });
}
function renderFriends(){const list=document.getElementById('listView');const f=filterBySearch(friendsCache);list.innerHTML='';if(f.length===0){list.innerHTML='<div style="text-align:center;color:#8b8ba7;margin-top:80px">لا يوجد أصدقاء</div>';return;}f.forEach(u=>{const div=document.createElement('div');div.className='userItem';div.innerHTML=`<div style="width:42px;height:42px;border-radius:50%;overflow:hidden;background:#222"><img src="${u.photo}" style="width:100%;height:100%;object-fit:cover"></div><div class="info"><b>${u.name}</b><small>${u.country} • صديق ✓</small></div><button class="actionBtn" onclick="startChat('${u.uid}')">💬 راسل</button>`;list.appendChild(div);});}
window.openAddPeople=()=>{document.getElementById('addModal').classList.add('on');loadAddPeople();}
window.closeAddPeople=()=>document.getElementById('addModal').classList.remove('on');
async function loadAddPeople(){const list=document.getElementById('addList');list.innerHTML='<div style="text-align:center;color:#8b8ba7;margin-top:40px">جاري التحميل...</div>';try{const snap=await getDocs(query(collection(db,'users'),limit(80)));addCache=[];snap.forEach(d=>{if(d.id===uid)return;const data=d.data();addCache.push({uid:d.id,name:data.displayName||data.name||'مستخدم',photo:data.photoURL||data.photo||data.avatar||'https://i.pravatar.cc/100?u='+d.id,country:data.countryName||''});});renderAddPeople(addCache);}catch(e){list.innerHTML='<div style="color:#ef4444;text-align:center">'+e.message+'</div>';}}
function renderAddPeople(arr){const list=document.getElementById('addList');list.innerHTML='';arr.forEach(u=>{const div=document.createElement('div');div.className='userItem';div.innerHTML=`<div style="width:42px;height:42px;border-radius:50%;overflow:hidden"><img src="${u.photo}" style="width:100%;height:100%;object-fit:cover"></div><div class="info"><b>${u.name}</b><small>${u.country}</small></div><div style="display:flex;gap:6px"><button class="actionBtn outline" id="btn_${u.uid}" onclick="followUser('${u.uid}')">+ تابع</button><button class="actionBtn" onclick="startChat('${u.uid}')">💬</button></div>`;list.appendChild(div);});}
window.filterAdd=()=>{const q=document.getElementById('addSearch').value.toLowerCase().trim();if(!q)renderAddPeople(addCache);else renderAddPeople(addCache.filter(u=>u.name.toLowerCase().includes(q)));}
window.followUser=async(otherUid)=>{
 const btn=document.getElementById('btn_'+otherUid);
 if(btn){btn.textContent='...';btn.disabled=true;}
 try{
  const didFollow=await runTransaction(db,async tx=>{
   const myRef=doc(db,'users',uid), otherRef=doc(db,'users',otherUid);
   const [mySnap,otherSnap]=await Promise.all([tx.get(myRef),tx.get(otherRef)]);
   if(!mySnap.exists()||!otherSnap.exists()) throw new Error('المستخدم غير موجود');
   const mine=mySnap.data(), theirs=otherSnap.data();
   const myList=Array.isArray(mine.followingList)?mine.followingList:(Array.isArray(mine.following)?mine.following:[]);
   const theirList=Array.isArray(theirs.followersList)?theirs.followersList:(Array.isArray(theirs.followers)?theirs.followers:[]);
   if(myList.includes(otherUid)) return false;
   const myCount=typeof mine.following==='number'?mine.following+1:myList.length+1;
   const theirCount=typeof theirs.followers==='number'?theirs.followers+1:theirList.length+1;
   tx.set(myRef,{followingList:[...myList,otherUid],following:myCount},{merge:true});
   tx.set(otherRef,{followersList:[...theirList,uid],followers:theirCount},{merge:true});
   return true;
  });
  if(btn){btn.textContent=didFollow?'✓ تم':'✓ تتابعه';btn.style.background='#22c55e';}
  await loadFriendsData();
 }catch(e){alert(e.message);if(btn){btn.textContent='+ تابع';btn.disabled=false;}}
}
window.startChat=(otherUid)=>{localStorage.setItem('last_dm_uid',otherUid);location.href='/dm/?uid='+otherUid;}
async function loadFriendsData(){try{const mySnap=await getDoc(doc(db,'users',uid));if(!mySnap.exists())return;const myData=mySnap.data();const myFollowing=Array.isArray(myData.followingList)?myData.followingList:(Array.isArray(myData.following)?myData.following:[]);friendsCache=[];for(const fid of myFollowing){try{const fSnap=await getDoc(doc(db,'users',fid));if(!fSnap.exists())continue;const fData=fSnap.data();const theirFollowing=Array.isArray(fData.followingList)?fData.followingList:(Array.isArray(fData.following)?fData.following:[]);if(theirFollowing.includes(uid)){friendsCache.push({uid:fid,name:fData.displayName||fData.name||'مستخدم',photo:fData.photoURL||fData.photo||fData.avatar||'https://i.pravatar.cc/100?u='+fid,country:fData.countryName||''});}}catch{}}if(currentTab==='friends')renderFriends();}catch{}}

onAuthStateChanged(auth,async u=>{
  if(!u){location.href='/login/';return}uid=u.uid;loadChatsData();loadFriendsData();
  if(targetUid){
    document.getElementById('tabs').style.display='none';
    document.getElementById('searchBox').style.display='none';
    document.getElementById('fabBtn').style.display='none';
    document.getElementById('listView').style.display='none';
    document.getElementById('chatView').style.display='flex';
    document.getElementById('inputBar').style.display='flex';
    document.getElementById('hAvatarWrap').style.display='flex';
    document.getElementById('hIcon').style.display='none';
    // هنا اخفاء العداد 2 والسعودية - يبقى الاسم فقط
    document.getElementById('countBadge').style.display='none';
    document.getElementById('hStatus').style.display='none';
    try{
      const snap=await getDoc(doc(db,'users',targetUid));
      if(snap.exists()){
        const d=snap.data();
        document.getElementById('hName').textContent=d.displayName||d.name||'مستخدم';
        document.getElementById('hImg').src=d.photoURL||d.photo||d.avatar||'https://i.pravatar.cc/100?u='+targetUid;
      }
    }catch{}
    chatId=[uid,targetUid].sort().join('_');
    await setDoc(doc(db,'privateChats',chatId),{participants:[uid,targetUid],lastAt:serverTimestamp(),createdAt:serverTimestamp(),lastText:'',unread:{[uid]:0}},{merge:true});
    const q=query(collection(db,'privateChats',chatId,'messages'),orderBy('createdAt','asc'));
    onSnapshot(q,s=>{
      const box=document.getElementById('chatView');box.innerHTML='';
      if(s.empty){box.innerHTML='<div style="text-align:center;color:#6b6b7a;margin-top:60px">ابدأ المحادثة 👋</div>';}
      else{s.forEach(d=>{const m=d.data();const div=document.createElement('div');div.className='bubble '+(m.uid===uid?'me':'');if(m.text&&m.text.includes(SOUTH_PH)){div.innerHTML=m.text.replaceAll(SOUTH_PH,`<span class="southFlag">${SOUTH_SVG}</span>`);}else{div.textContent=m.text||'';}box.appendChild(div);});}
      box.scrollTop=box.scrollHeight;
    });
  }else{
    document.getElementById('tabs').style.display='flex';
    document.getElementById('searchBox').style.display='block';
    document.getElementById('chatView').style.display='none';
    document.getElementById('inputBar').style.display='none';
    document.getElementById('listView').style.display='flex';
    document.getElementById('hAvatarWrap').style.display='none';
    document.getElementById('hIcon').style.display='flex';
    document.getElementById('hIcon').textContent='💬';
    document.getElementById('hName').textContent='دردشة خاصة';
    document.getElementById('hStatus').textContent='محادثاتي • أصدقائي';
    document.getElementById('hStatus').style.display='block';
    switchTab('chats');
  }
});

window.sendMsg=async()=>{
  const wrap=document.getElementById('inputWrap');
  if(!wrap||!chatId)return;
  const clone=wrap.cloneNode(true);
  clone.querySelectorAll('[data-south]').forEach(el=>el.replaceWith(SOUTH_PH));
  let text=clone.innerText.replace(/\u00A0/g,' ').trim();
  if(!text) return;
  wrap.innerHTML='';document.getElementById('emojiPanel').classList.remove('on');
  let preview=text.includes(SOUTH_PH)?'🏴 علم الجنوب':text;
  await addDoc(collection(db,'privateChats',chatId,'messages'),{text:text,uid:uid,createdAt:serverTimestamp()});
  await setDoc(doc(db,'privateChats',chatId),{lastText:preview,lastAt:serverTimestamp(),participants:[uid,targetUid],unread:{[targetUid]:increment(1),[uid]:0}},{merge:true});
  wrap.focus();
}
</script>
