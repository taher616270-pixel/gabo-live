<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دردشة خاصة</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed;--muted:#8b8ba7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;height:100dvh;display:flex;flex-direction:column}
.header{height:60px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px;padding:0 12px;position:fixed;top:0;left:0;right:0;z-index:10}
.back{width:36px;height:36px;background:#161426;border:1px solid var(--b);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;background:#222}
.avatar img{width:100%;height:100%;object-fit:cover}
.list{flex:1;overflow:auto;padding:70px 10px 10px 10px;display:flex;flex-direction:column;gap:8px}
.chatItem{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
.chat{flex:1;overflow:auto;padding:70px 12px 80px 12px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:75%;padding:10px 14px;border-radius:18px;background:#1e1c2e;border:1px solid var(--b);font-size:14px;word-break:break-word}
.me{align-self:flex-end;background:var(--v);border-color:var(--v)}
.inputBar{position:fixed;bottom:0;left:0;right:0;background:#0f0e18;border-top:1px solid var(--b);padding:10px;display:flex;gap:8px}
.inputBar input{flex:1;background:#1a182a;border:1px solid var(--b);border-radius:20px;padding:10px 14px;color:#fff;outline:0}
.send{width:44px;height:44px;border-radius:50%;background:var(--v);border:0;color:#fff;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div class="back" onclick="location.href='/app/'">›</div>
<div class="avatar" id="hAvatar"><img id="hImg"></div>
<div style="flex:1"><b id="hName">دردشة خاصة</b><br><small id="hStatus" style="color:var(--muted)">جاري التحميل...</small></div>
</div>
<div class="list" id="listView"></div>
<div class="chat" id="chatView" style="display:none"></div>
<div class="inputBar" id="inputBar" style="display:none"><input id="msgInput" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')send()"><button class="send" onclick="send()">➤</button></div>
<script type="module">
import {auth,db} from '/firebase-config.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {doc,getDoc,setDoc,collection,addDoc,serverTimestamp,onSnapshot,query,orderBy} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
let uid=null, targetUid=null, chatId=null;
const params=new URLSearchParams(location.search);
targetUid=params.get('uid');
onAuthStateChanged(auth, async u=>{
  if(!u){location.href='/login/';return}
  uid=u.uid;
  if(targetUid){
    chatId=[uid,targetUid].sort().join('_');
    document.getElementById('listView').style.display='none';
    document.getElementById('chatView').style.display='flex';
    document.getElementById('inputBar').style.display='flex';
    const snap=await getDoc(doc(db,'users',targetUid));
    if(snap.exists()){
      const d=snap.data();
      document.getElementById('hName').textContent=d.displayName||d.name||'مستخدم';
      document.getElementById('hImg').src=d.photoURL||d.photo||'https://i.pravatar.cc/100?u='+targetUid;
      document.getElementById('hStatus').textContent=d.countryName||'متصل الآن';
    }else{
      document.getElementById('hName').textContent='مستخدم';
      document.getElementById('hStatus').textContent=targetUid;
    }
    await setDoc(doc(db,'privateChats',chatId),{participants:[uid,targetUid], lastAt:serverTimestamp()},{merge:true});
    onSnapshot(query(collection(db,'privateChats',chatId,'messages'),orderBy('createdAt')), s=>{
      const box=document.getElementById('chatView'); box.innerHTML='';
      s.forEach(d=>{
        const m=d.data();
        const div=document.createElement('div'); div.className='bubble '+(m.uid===uid?'me':''); div.textContent=m.text; box.appendChild(div);
      });
      box.scrollTop=box.scrollHeight;
    });
  }else{
    document.getElementById('hName').textContent='دردشة خاصة';
    document.getElementById('hStatus').textContent='محادثاتي';
    onSnapshot(collection(db,'privateChats'), snap=>{
      const list=document.getElementById('listView'); list.innerHTML='';
      snap.forEach(d=>{
        if(!d.id.includes(uid)) return;
        const data=d.data();
        const other=data.participants?.find(x=>x!==uid);
        if(!other) return;
        const item=document.createElement('div'); item.className='chatItem';
        item.innerHTML=`<div class="avatar"><img src="https://i.pravatar.cc/100?u=${other}"></div><div><b>${other.slice(0,12)}</b><br><small style="color:#8b8ba7">${data.lastText||'اضغط للدردشة'}</small></div>`;
        item.onclick=()=>location.href='/dm/?uid='+other;
        list.appendChild(item);
      });
      if(list.innerHTML==='') list.innerHTML='<div style="text-align:center;color:#8b8ba7;margin-top:40px">لا يوجد محادثات بعد<br>ادخل أي مجتمع واضغط على صورة شخص</div>';
    });
  }
});
window.send=async()=>{
  const t=document.getElementById('msgInput').value.trim(); if(!t) return;
  document.getElementById('msgInput').value='';
  await addDoc(collection(db,'privateChats',chatId,'messages'),{text:t, uid, createdAt:serverTimestamp()});
  await setDoc(doc(db,'privateChats',chatId),{lastText:t, lastAt:serverTimestamp()},{merge:true});
}
</script>
</body>
</html>
