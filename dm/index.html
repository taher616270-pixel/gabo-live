<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دردشة خاصة - GABO LIVE</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;font-family:system-ui;height:100dvh;overflow:hidden;position:fixed;inset:0;display:flex;flex-direction:column}
.top{height:60px;min-height:60px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;gap:10px;padding:0 12px;flex-shrink:0}
.back{width:42px;height:42px;background:#1e1c2e;border:1px solid var(--b);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;background:#2a2840;object-fit:cover}
.nameBox{flex:1;display:flex;flex-direction:column;gap:2px}
.nameBox b{font-size:15px}.nameBox small{font-size:11px;color:#8b8ba7}
.nameBox small.online{color:#25d366}.nameBox small.typing{color:#a78bfa;font-weight:700}
.listView{flex:1;overflow:auto;padding:12px 12px 120px;display:flex;flex-direction:column}
.chatView{flex:1;display:none;flex-direction:column;background:#050507;position:relative;overflow:hidden}
.chatView.on{display:flex}
.item{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;position:relative;flex-shrink:0}
.item img{width:52px;height:52px;border-radius:50%;background:#2a2840;object-fit:cover}
.item b{font-size:14px;display:block}.item small{color:#8b8ba7;font-size:12px}
.badge{position:absolute;left:12px;background:#ff3b30;color:#fff;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.badge.hide{display:none}
.messages{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:78%;padding:8px 12px 6px;border-radius:18px;font-size:14.5px;line-height:1.4;word-break:break-word}
.bubble.in{align-self:flex-start;background:#1e1c2e;border:1px solid var(--b);border-top-right-radius:4px}
.bubble.out{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#6d28d9);border-top-left-radius:4px}
.bubble .time{font-size:9px;opacity:.6;margin-top:4px;display:block;text-align:left;direction:ltr}
.typingBubble{align-self:flex-start;background:#1e1c2e;padding:10px 14px;border-radius:18px;border-top-right-radius:4px;display:flex;gap:4px}
.typingBubble span{width:5px;height:5px;background:#8b8ba7;border-radius:50%;animation:bounce 1.4s infinite}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
.inputBar{height:64px;min-height:64px;flex-shrink:0;background:#11111a;border-top:1px solid var(--b);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:center}
.inputWrap{flex:1;background:#1e1e2e;border:1px solid var(--b);border-radius:24px;display:flex;align-items:center;padding:4px 14px}
.inputWrap input{flex:1;background:transparent;border:0;color:#fff;outline:none;padding:10px 0;font-size:15px}
.sendBtn{width:44px;height:44px;min-width:44px;border-radius:50%;background:var(--v);border:0;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);height:52px;background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;border-radius:26px;display:flex;align-items:center;gap:8px;padding:0 22px;font-size:15px;font-weight:800;z-index:19;border:0}
.fab.hide{display:none}
/* نفس الشريط السفلي في كل الموقع بالضبط */
.bottomNav{position:fixed;bottom:0;left:0;right:0;height:82px;min-height:82px;background:#0f0e18;border-top:1px solid #2a2840;display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;padding-bottom:env(safe-area-inset-bottom);direction:ltr;z-index:30}
.bottomNav.hide{display:none}
.bottomNav a{flex:1;text-decoration:none;color:#6b6b7a;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;position:relative}
.bottomNav a.on{color:#fff}
.bottomNav a .ic{font-size:22px;width:24px;height:24px;display:flex;align-items:center;justify-content:center}
.bottomNav a.plus .ic{background:var(--v);color:#fff;width:56px;height:56px;border-radius:16px;font-size:32px;margin-top:-18px;box-shadow:0 4px 12px rgba(124,58,237,.4)}
.navBadge{position:absolute;top:0;left:50%;transform:translateX(8px);background:#ff3b30;color:#fff;min-width:18px;height:18px;border-radius:9px;font-size:10px;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #0f0e18}
.navBadge.hide{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;flex-direction:column}.modal.on{display:flex}
</style>
</head>
<body>
<div class="top" id="listTop"><div class="back" onclick="location.href='/profile/'">‹</div><b>🔒 دردشة خاصة</b></div>
<div class="listView" id="listView"><div id="chatList">جاري التحميل...</div></div>
<div class="chatView" id="chatView">
  <div class="top"><div class="back" id="backToList">‹</div><img id="chatAvatar" class="avatar" src=""><div class="nameBox"><b id="chatName">...</b><small id="chatStatus"></small></div></div>
  <div class="messages" id="messages"></div>
  <div id="typingIndicator" style="padding:0 12px 6px;display:none"><div class="typingBubble"><span></span><span></span><span></span></div></div>
  <div class="inputBar"><div class="inputWrap"><input id="msgInput" placeholder="اكتب رسالة..." autocomplete="off"></div><button class="sendBtn" id="sendBtn">➤</button></div>
</div>
<button class="fab" id="newChatBtn">💬 دردشة جديدة</button>
<div class="bottomNav" id="bottomNav">
  <a href="/profile/"><span class="ic">👤</span><span>حسابي</span></a>
  <a href="/dm/" class="on"><span class="ic">🔒</span><span>دردشة</span><span class="navBadge hide" id="navBadge">0</span></a>
  <a href="/create/" class="plus"><span class="ic">+</span></a>
  <a href="/app/"><span class="ic">📄</span><span>منشور</span></a>
  <a href="/"><span class="ic">🏠</span><span>الرئيسية</span></a>
</div>
<div class="modal" id="usersModal">
  <div class="top"><input id="searchUser" placeholder="ابحث..." style="flex:1;background:#1e1c2e;border:1px solid var(--b);border-radius:12px;padding:12px;color:#fff"><button id="closeModal" style="width:42px;height:42px;border-radius:50%;background:#1e1c2e;border:1px solid var(--b);color:#fff">✕</button></div>
  <div style="flex:1;overflow:auto;padding:12px" id="usersList"></div>
</div>
<script type="module">
import { auth, db } from '/firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { collection, query, where, getDocs, onSnapshot, addDoc, doc, orderBy, serverTimestamp, updateDoc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
let myUid=null, currentChatId=null, unsubscribe=null, unsubscribeChat=null, typingTimeout=null; let allUsers=[];
function saveUid(uid){ myUid=uid; localStorage.setItem('gabo_uid',uid); }
onAuthStateChanged(auth, async u=>{ if(u){ saveUid(u.uid); await setOnline(u.uid); loadChats(u.uid); loadUsers(u.uid); } else{ const s=localStorage.getItem('gabo_uid'); if(s){ myUid=s; await setOnline(s); loadChats(s); loadUsers(s); } } });
async function setOnline(uid){ try{ await setDoc(doc(db,'users',uid),{isOnline:true, lastSeen:serverTimestamp()}, {merge:true}); }catch(e){} setInterval(()=>{ try{ setDoc(doc(db,'users',uid),{isOnline:true, lastSeen:serverTimestamp()}, {merge:true}); }catch(e){} },30000); }
function loadChats(uid){
  const q=query(collection(db,'chats'), where('users','array-contains', uid));
  onSnapshot(q, snap=>{
    const list=document.getElementById('chatList');
    if(snap.empty){ list.innerHTML='<div style="text-align:center;padding:60px;color:#888">لا توجد دردشات</div>'; document.getElementById('navBadge').classList.add('hide'); return; }
    list.innerHTML=''; let total=0;
    snap.forEach(d=>{ const data=d.data(); const otherId=data.users.find(id=>id!==uid); const other=data.usersInfo?.[otherId]||{name:'مستخدم',photo:''}; const unread=data.unreadCounts?.[uid]||0; total+=unread; const el=document.createElement('div'); el.className='item'; el.innerHTML=`<img src="${other.photo}"><div><b>${other.name}</b><small>${(data.lastMsg||'').slice(0,30)}</small></div><div class="badge ${unread?'':'hide'}">${unread}</div>`; el.onclick=()=>openChat(d.id, other, otherId); list.appendChild(el); });
    const b=document.getElementById('navBadge'); if(total>0){ b.textContent=total>99?'99+':total; b.classList.remove('hide'); } else b.classList.add('hide');
  });
}
async function openChat(chatId, other, otherId){
  currentChatId=chatId; document.getElementById('chatName').textContent=other.name; document.getElementById('chatAvatar').src=other.photo||'';
  document.getElementById('listView').style.display='none'; document.getElementById('listTop').style.display='none'; document.getElementById('newChatBtn').classList.add('hide'); document.getElementById('bottomNav').classList.add('hide'); document.getElementById('chatView').classList.add('on'); document.getElementById('messages').innerHTML='';
  const userRef=doc(db,'users',otherId);
  onSnapshot(userRef, s=>{ if(!s.exists()) return; const data=s.data(); const statusEl=document.getElementById('chatStatus'); if(data.isTyping && data.isTyping[chatId]){ statusEl.textContent='يكتب الآن...'; statusEl.className='typing'; document.getElementById('typingIndicator').style.display='block'; } else if(data.isOnline){ statusEl.textContent='متصل الآن'; statusEl.className='online'; document.getElementById('typingIndicator').style.display='none'; } else{ const last=data.lastSeen?.toDate?.(); if(last){ const diff=Math.floor((Date.now()-last)/60000); if(diff<1) statusEl.textContent='آخر ظهور الآن'; else if(diff<60) statusEl.textContent=`آخر ظهور منذ ${diff} د`; else statusEl.textContent=`آخر ظهور منذ ${Math.floor(diff/60)} س`; } else statusEl.textContent='غير متصل'; statusEl.className=''; document.getElementById('typingIndicator').style.display='none'; } });
  try{ const r=doc(db,'chats',chatId); const s=await getDoc(r); const c=s.data().unreadCounts||{}; c[myUid]=0; await updateDoc(r,{unreadCounts:c}); }catch(e){}
  if(unsubscribe) unsubscribe(); if(unsubscribeChat) unsubscribeChat();
  const chatRef=doc(db,'chats',chatId); unsubscribeChat=onSnapshot(chatRef, snap=>{ const data=snap.data(); if(!data) return; if(data.typing && data.typing[otherId]){ document.getElementById('chatStatus').textContent='يكتب الآن...'; document.getElementById('chatStatus').className='typing'; document.getElementById('typingIndicator').style.display='block'; } });
  const q=query(collection(db,'chats',chatId,'messages'), orderBy('createdAt','asc'));
  unsubscribe=onSnapshot(q, snap=>{ const msgs=document.getElementById('messages'); msgs.innerHTML=''; snap.forEach(d=>{ const m=d.data(); const isMe=m.senderId===myUid; const date=m.createdAt?.toDate?.(); const time=date? `${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}` : ''; if(m.text) msgs.innerHTML+=`<div class="bubble ${isMe?'out':'in'}">${m.text.replace(/</g,'&lt;')}<span class="time">${time} ${isMe?'✓✓':''}</span></div>`; }); msgs.scrollTop=msgs.scrollHeight; });
}
document.getElementById('backToList').onclick=()=>{ document.getElementById('chatView').classList.remove('on'); document.getElementById('listView').style.display='flex'; document.getElementById('listTop').style.display='flex'; document.getElementById('newChatBtn').classList.remove('hide'); document.getElementById('bottomNav').classList.remove('hide'); document.getElementById('messages').innerHTML=''; currentChatId=null; if(unsubscribe) unsubscribe(); if(unsubscribeChat) unsubscribeChat(); };
const input=document.getElementById('msgInput');
input.addEventListener('input', async()=>{ if(!currentChatId||!myUid) return; try{ const ref=doc(db,'chats',currentChatId); await updateDoc(ref,{[`typing.${myUid}`]:true}); clearTimeout(typingTimeout); typingTimeout=setTimeout(async()=>{ try{ await updateDoc(ref,{[`typing.${myUid}`]:false}); }catch(e){} },2000); await setDoc(doc(db,'users',myUid),{isTyping:{[currentChatId]:true}}, {merge:true}); setTimeout(()=>{ setDoc(doc(db,'users',myUid),{isTyping:{[currentChatId]:false}}, {merge:true}); },2000); }catch(e){} });
async function sendText(){ const t=input.value.trim(); if(!t||!currentChatId) return; input.value=''; try{ const ref=doc(db,'chats',currentChatId); await updateDoc(ref,{[`typing.${myUid}`]:false}); const s=await getDoc(ref); const d=s.data(); const otherId=d.users.find(id=>id!==myUid); const counts=d.unreadCounts||{}; counts[otherId]=(counts[otherId]||0)+1; counts[myUid]=0; await addDoc(collection(db,'chats',currentChatId,'messages'),{text:t, senderId:myUid, type:'text', createdAt:serverTimestamp()}); await updateDoc(ref,{lastMsg:t.slice(0,30), lastAt:serverTimestamp(), unreadCounts:counts, [`typing.${myUid}`]:false}); }catch(e){} }
document.getElementById('sendBtn').onclick=sendText; input.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); sendText(); } };
async function loadUsers(uid){ const snap=await getDocs(collection(db,'users')); allUsers=[]; snap.forEach(d=>{ if(d.id!==uid){ const dd=d.data(); allUsers.push({id:d.id, name:dd.displayName||dd.name||'مستخدم', photo:dd.photo||'', isOnline:dd.isOnline}); }}); renderUsers(allUsers); }
function renderUsers(arr){ document.getElementById('usersList').innerHTML=arr.map(u=>`<div style="display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;margin-bottom:10px"><img src="${u.photo}" style="width:50px;height:50px;border-radius:50%"><div><b>${u.name}</b><br><small style="color:${u.isOnline?'#25d366':'#888'}">${u.isOnline?'متصل الآن':'غير متصل'}</small></div><button style="margin-right:auto;background:var(--v);color:#fff;border:0;padding:8px 14px;border-radius:10px" onclick="startChat('${u.id}')">راسل</button></div>`).join(''); }
document.getElementById('searchUser').oninput=e=>{ const v=e.target.value.toLowerCase(); renderUsers(allUsers.filter(u=>u.name.toLowerCase().includes(v))); };
document.getElementById('newChatBtn').onclick=()=>document.getElementById('usersModal').classList.add('on'); document.getElementById('closeModal').onclick=()=>document.getElementById('usersModal').classList.remove('on');
window.startChat=async(targetId)=>{ if(!myUid) return; const q=query(collection(db,'chats'), where('users','array-contains', myUid)); const snap=await getDocs(q); let existing=null; snap.forEach(d=>{ if(d.data().users.includes(targetId)) existing=d.id; }); if(existing){ const target=allUsers.find(u=>u.id===targetId); document.getElementById('usersModal').classList.remove('on'); openChat(existing, target, targetId); return; } const target=allUsers.find(u=>u.id===targetId); const newChat=await addDoc(collection(db,'chats'),{users:[myUid,targetId], usersInfo:{[myUid]:{name:'انا',photo:''}, [targetId]:{name:target.name,photo:target.photo}}, lastMsg:'بدأت المحادثة', lastAt:serverTimestamp(), createdAt:serverTimestamp(), unreadCounts:{[targetId]:1, [myUid]:0}, typing:{}}); document.getElementById('usersModal').classList.remove('on'); openChat(newChat.id, target, targetId); };
</script>
</body>
</html>
