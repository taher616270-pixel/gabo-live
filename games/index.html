<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0911">
<title>الألعاب | GABO LIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090810;color:#fff;font-family:'Tajawal',system-ui}
body{min-height:100vh;padding-bottom:110px;background:radial-gradient(ellipse at 50% 0%,rgba(132,88,210,.24),transparent 48%),radial-gradient(ellipse at 100% 80%,rgba(231,189,99,.08),transparent 40%),#090810}
.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(231,189,99,.18);background:rgba(12,10,17,.76);backdrop-filter:blur(16px)}
.brand{font-size:19px;font-weight:900;letter-spacing:1.5px;color:#f4d99d}.brand span{color:#fff}
.back{color:#f4d99d;text-decoration:none;font-size:13px;font-weight:800;padding:8px 13px;border:1px solid rgba(231,189,99,.25);border-radius:12px}
.wrap{max-width:560px;margin:0 auto;padding:32px 20px 24px}
.eyebrow{text-align:center;color:#e7bd63;font-size:10px;font-weight:900;letter-spacing:3px}
.hero{margin-top:18px;padding:30px 20px 28px;text-align:center;border:1px solid rgba(231,189,99,.22);border-radius:30px;background:linear-gradient(155deg,rgba(39,29,54,.96),rgba(15,12,22,.98));box-shadow:0 25px 70px #0008,inset 0 1px 0 #ffffff12;position:relative;overflow:hidden}
.hero:before,.hero:after{content:'';position:absolute;border-radius:50%;filter:blur(2px);pointer-events:none}
.hero:before{width:190px;height:190px;top:-110px;right:-70px;background:rgba(231,189,99,.13)}
.hero:after{width:180px;height:180px;bottom:-125px;left:-70px;background:rgba(139,99,215,.2)}
.gameOrb{width:116px;height:116px;margin:0 auto 22px;border-radius:34px;display:grid;place-items:center;font-size:58px;background:linear-gradient(145deg,#f4d99d,#a87831);color:#1b1308;box-shadow:0 12px 0 #68491e,0 25px 38px #0008,inset 0 3px 8px #fff9;transform:perspective(400px) rotateX(8deg);animation:float 3.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:perspective(400px) translateY(0) rotateX(8deg)}50%{transform:perspective(400px) translateY(-9px) rotateX(8deg)}}
h1{font-size:35px;line-height:1.2;margin:0;color:#f8e7c0;font-weight:900}
.lead{margin:12px auto 0;max-width:330px;color:#c2bacd;font-size:15px;line-height:1.9}
.soon{display:inline-flex;align-items:center;gap:8px;margin-top:24px;padding:10px 18px;border-radius:30px;border:1px solid rgba(231,189,99,.45);background:linear-gradient(135deg,#f3d58e,#bd8d3e);color:#211707;font-weight:900;font-size:13px;box-shadow:0 8px 25px #bd8d3e30}
.soon i{width:7px;height:7px;border-radius:50%;background:#267b4d;box-shadow:0 0 0 4px #267b4d20}
.note{margin:22px auto 0;color:#92899e;font-size:12px;line-height:1.8}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.feature{padding:14px 8px;border:1px solid rgba(255,255,255,.08);border-radius:17px;background:#ffffff08;text-align:center}
.feature b{display:block;font-size:22px;margin-bottom:5px}.feature span{font-size:11px;color:#b8afc3;font-weight:700}
@media(max-width:370px){h1{font-size:30px}.gameOrb{width:100px;height:100px;font-size:50px}}
</style>
<style>
#gaboUnifiedNav{position:fixed;inset:auto 0 0;z-index:99999;width:100%;height:calc(56px + env(safe-area-inset-bottom));padding:2px 10px calc(3px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;align-items:center;direction:rtl;background:rgba(8,7,13,.985);border-top:1px solid rgba(231,189,99,.16);box-shadow:0 -7px 22px rgba(0,0,0,.28);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
#gaboUnifiedNav .gaboNavItem{position:relative;min-width:0;width:100%;height:48px;display:flex;align-items:center;justify-content:center;border-radius:14px;color:#393641;text-decoration:none;overflow:hidden}
#gaboUnifiedNav .gaboNavIcon{width:48px;height:45px;display:grid;place-items:center}
#gaboUnifiedNav svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#gaboUnifiedNav .gaboNavItem.is-active{color:#e7bd63}
#gaboUnifiedNav .gaboNavItem.is-active:before{content:"";position:absolute;inset:0;border-radius:14px;padding:1.6px;background:linear-gradient(115deg,#bd8d3e,#f3d58e,#8b63d7);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#gaboUnifiedNav .gaboNavBadge{position:absolute;top:1px;right:calc(50% - 26px);min-width:17px;height:17px;padding:0 4px;display:none;align-items:center;justify-content:center;border-radius:20px;background:#e64b63;color:#fff;font:800 9px system-ui;border:2px solid #090711;z-index:3}
@media(max-width:360px){#gaboUnifiedNav{padding-inline:3px;gap:0}#gaboUnifiedNav svg{width:37px;height:37px}}
</style></head>
<body>
<header class="top"><div class="brand">GABO <span>LIVE</span> ✦</div><a class="back" href="/app/">الرئيسية ←</a></header>
<main class="wrap">
<div class="eyebrow">THE NEXT LEVEL OF FUN</div>
<section class="hero">
<div class="gameOrb" aria-hidden="true">🎮</div>
<h1>اللعب له موعد!</h1>
<p class="lead">نجهّز لك عالماً من التحديات والمنافسات الممتعة… ألعاب تجمع الأصدقاء وتصنع لحظات ما تنسى.</p>
<div class="soon"><i></i> قريباً على GABO LIVE</div>
<p class="note">نحن نعمل على تجهيز تجربة ألعاب حقيقية وسلسة — انتظر المفاجأة القادمة.</p>
</section>
<div class="features">
<div class="feature"><b>🏆</b><span>تحديات ومنافسات</span></div>
<div class="feature"><b>🤝</b><span>العب مع أصحابك</span></div>
<div class="feature"><b>✨</b><span>تجربة مميزة</span></div>
</div>
</main>
<nav id="gaboUnifiedNav" aria-label="التنقل الرئيسي">

<a class="gaboNavItem" href="/posts/" data-nav-id="posts" aria-label="منشورات"><span class="gaboNavIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle class="nav-outline" cx="12" cy="12" r="6.9"/><path class="nav-detail" d="M5.5 12h13M12 5.1c2 2 2.8 4.3 2.8 6.9s-.8 4.9-2.8 6.9c-2-2-2.8-4.3-2.8-6.9s.8-4.9 2.8-6.9Z"/><ellipse class="nav-outline" cx="12" cy="12" rx="10.2" ry="4.1" transform="rotate(-28 12 12)"/><path class="nav-detail" d="M18.7 5.2 20.2 3.8"/></svg></span></a>
<a class="gaboNavItem is-active" href="/games/" data-nav-id="games" aria-label="ألعاب" aria-current="page"><span class="gaboNavIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="nav-outline" d="M6.2 6.2h11.6a3.8 3.8 0 0 1 3.7 4.6l-1.2 6.1a2.7 2.7 0 0 1-4.4 1.5L13.7 16h-3.4l-2.2 2.4a2.7 2.7 0 0 1-4.4-1.5l-1.2-6.1a3.8 3.8 0 0 1 3.7-4.6Z"/><path class="nav-detail" d="M7.2 9.5v4.2m-2.1-2.1h4.2m7.1-.8h.1m2.1 2.1h.1"/></svg></span></a>
<a class="gaboNavItem" href="/dm/" data-nav-id="messages" aria-label="رسائل"><span class="gaboNavIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><path class="nav-outline" d="M19.8 11.4a7.6 7.6 0 0 1-7.7 7.5H7l-3.1 2v-5.2a7.5 7.5 0 1 1 15.9-4.3Z"/><path class="nav-detail" d="M10 8.8v5.1m4 0V8.8"/></svg></span><span id="navBadge" class="gaboNavBadge navBadge" style="display:none">0</span></a>
<a class="gaboNavItem" href="/profile/" data-nav-id="profile" aria-label="ملفي الشخصي"><span class="gaboNavIcon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle class="nav-outline" cx="12" cy="7.4" r="4.1"/><path class="nav-outline" d="M4.1 20.5c.4-4 3.5-6.3 7.9-6.3s7.5 2.3 7.9 6.3Z"/></svg></span></a>
</nav>
<script type="module" src="/js/unified-bottom-nav.js"></script>
</body></html>
