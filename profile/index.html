<!-- مربع تاريخ الميلاد - عجلات يحركها بصبعه -->
<div class="modal" id="bdayModal">
  <div class="box" style="max-width:380px">
    <h3>📅 تاريخ الميلاد</h3>
    <div style="display:flex;gap:8px;direction:ltr;margin:14px 0">
      <div style="flex:1;text-align:center"><small style="color:#8b8ba7;font-size:11px">اليوم</small><div class="wheel" id="dayWheel"></div></div>
      <div style="flex:1;text-align:center"><small style="color:#8b8ba7;font-size:11px">الشهر</small><div class="wheel" id="monthWheel"></div></div>
      <div style="flex:1.2;text-align:center"><small style="color:#8b8ba7;font-size:11px">السنة</small><div class="wheel" id="yearWheel"></div></div>
    </div>
    <div style="background:#0f0e18;border:1px solid #2a2840;border-radius:10px;padding:10px;text-align:center;font-size:14px;margin-bottom:12px" id="bdayPreview">2000-01-03</div>
    <div class="actions"><button class="btnCancel" id="cancelBday">إلغاء</button><button class="btnSave" id="confirmBday">حفظ ✅</button></div>
  </div>
</div>

<style>
.wheel{height:150px;overflow-y:auto;scroll-snap-type:y mandatory;background:#0f0e18;border:1px solid #2a2840;border-radius:12px;margin-top:6px;-webkit-overflow-scrolling:touch}
.wheel::-webkit-scrollbar{display:none}
.wheelItem{height:50px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:16px;color:#8b8ba7;transition:.15s}
.wheelItem.on{color:#fff;font-weight:800;background:#1e1c2e;font-size:18px}
</style>

<script>
let selDay=3, selMonth=1, selYear=2000;

function buildWheels(){
  const dayWheel=document.getElementById('dayWheel');
  const monthWheel=document.getElementById('monthWheel');
  const yearWheel=document.getElementById('yearWheel');
  
  // أيام 1-31
  dayWheel.innerHTML=Array.from({length:31},(_,i)=>`<div class="wheelItem ${i+1===selDay?'on':''}" data-v="${i+1}">${i+1}</div>`).join('');
  // شهور
  const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  monthWheel.innerHTML=months.map((m,i)=>`<div class="wheelItem ${i+1===selMonth?'on':''}" data-v="${i+1}">${m}</div>`).join('');
  // سنوات 1950-2010
  yearWheel.innerHTML=Array.from({length:61},(_,i)=>{const y=2010-i; return `<div class="wheelItem ${y===selYear?'on':''}" data-v="${y}">${y}</div>`;}).join('');

  function attach(wheel, setter){
    wheel.querySelectorAll('.wheelItem').forEach(el=>{
      el.onclick=()=>{
        wheel.querySelectorAll('.wheelItem').forEach(x=>x.classList.remove('on'));
        el.classList.add('on');
        setter(parseInt(el.dataset.v));
        updatePreview();
        el.scrollIntoView({block:'center',behavior:'smooth'});
      };
    });
    wheel.onscroll=()=>{
      clearTimeout(wheel._t);
      wheel._t=setTimeout(()=>{
        const items=[...wheel.querySelectorAll('.wheelItem')];
        let closest=items[0], min=Infinity;
        const center=wheel.getBoundingClientRect().top + wheel.offsetHeight/2;
        items.forEach(it=>{
          const d=Math.abs(it.getBoundingClientRect().top + 25 - center);
          if(d<min){min=d; closest=it;}
        });
        if(closest){wheel.querySelectorAll('.wheelItem').forEach(x=>x.classList.remove('on')); closest.classList.add('on'); setter(parseInt(closest.dataset.v)); updatePreview();}
      },100);
    };
  }
  attach(dayWheel, v=>selDay=v);
  attach(monthWheel, v=>selMonth=v);
  attach(yearWheel, v=>selYear=v);
}

function updatePreview(){
  const m=String(selMonth).padStart(2,'0');
  const d=String(selDay).padStart(2,'0');
  document.getElementById('bdayPreview').textContent=`${selYear}-${m}-${d}`;
}

// فتح مربع التاريخ
document.getElementById('rowBday').onclick=()=>{
  const cur=document.getElementById('rowBdayVal').textContent;
  if(cur && cur.includes('-')){const [y,m,d]=cur.split('-').map(Number); if(y){selYear=y; selMonth=m; selDay=d;}}
  buildWheels();
  updatePreview();
  document.getElementById('bdayModal').classList.add('on');
  setTimeout(()=>{ // حرك للوسط
    document.querySelectorAll('.wheelItem.on').forEach(el=>el.scrollIntoView({block:'center'}));
  },100);
};
document.getElementById('cancelBday').onclick=()=>document.getElementById('bdayModal').classList.remove('on');
document.getElementById('confirmBday').onclick=()=>{
  const date=document.getElementById('bdayPreview').textContent;
  pending.bday=date;
  document.getElementById('rowBdayVal').textContent=date;
  document.getElementById('bdayModal').classList.remove('on');
  showStatus('✅ تم اختيار '+date);
};
</script>
