<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابي - GABO LIVE</title>
<style>
:root{--bg:#07060c;--card:#161426;--b:#2a2840;--v:#7c3aed;--m:#a1a1aa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;padding-bottom:110px}
.top{padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:18px}
.card{margin:12px;background:var(--card);border:1px solid var(--b);border-radius:22px;padding:16px}
.head{display:flex;gap:12px;align-items:center;flex-direction:row-reverse}
.avatar{width:74px;height:74px;border-radius:18px;background:#6d28d9;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;position:relative;overflow:hidden;flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.pencil{position:absolute;bottom:-3px;right:-3px;width:26px;height:26px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;border:2px solid var(--card);cursor:pointer;z-index:10}
.info{flex:1;text-align:left;direction:ltr}
.info h2{font-size:16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.info p{font-size:11px;color:var(--m);margin-top:3px;direction:rtl;text-align:right}
.flagImg{width:26px;height:18px;border-radius:4px;object-fit:cover;border:1px solid rgba(255,255,255,.2);vertical-align:middle}
.stats{display:flex;gap:8px;margin-top:14px}
.stat{flex:1;background:#1e1c2e;border:1px solid var(--b);border-radius:12px;padding:8px;text-align:center}
.stat b{font-size:16px;display:block}.stat span{font-size:10px;color:var(--m)}
.bio{margin-top:12px;background:#0f0e18;border:1px solid var(--b);border-radius:12px;padding:10px;font-size:12px;color:var(--m);min-height:44px}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border-radius:11px;border:0;font-weight:800;font-size:12px;cursor:pointer}
.btn.vip{background:#fbbf24;color:#000}.btn.notif{background:#1e1c2e;border:1px solid var(--b);color:#fff}

/* نافذة القلم */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);display:none;align-items:flex-end;z-index:999}
.modal.on{display:flex}
.sheet{background:#1a182c;width:100%;border-radius:22px 22px 0 0;padding:18px;border-top:1px solid var(--b);max-height:88vh;overflow:auto}
.sheet input,.sheet select,.sheet textarea{width:100%;background:#0f0e18;border:1px solid var(--b);border-radius:10px;padding:12px;color:#fff;margin-top:8px;font-family:system-ui}
.sheet label{font-size:11px;color:var(--m);margin-top:12px;display:block}
.upload{border:1px dashed var(--b);border-radius:10px;padding:14px;text-align:center;color:var(--m);cursor:pointer;margin-top:8px}

/* الشريط السفلي الموحد */
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#0f0e18;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:1000;direction:ltr}
.bottomNav a{flex:1;text-decoration:none;color:#6b6b7a;font-size:9px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottomNav a.on{color:#fff}
.bottomNav a .ic{font-size:22px}
.bottomNav a.plus .ic{background:var(--v);color:#fff;width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-20px;box-shadow:0 8px 20px rgba(124,58,237,.5)}
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="avatar" id="avatar"><span id="avL">T</span><div class="pencil" id="openEdit">✏️</div></div>
    <div class="info">
      <h2><span id="name">...</span><span id="flag"></span></h2>
      <p>ملفك في مجتمع GABO LIVE</p>
      <p id="email" style="text-decoration:underline;font-size:10px;color:#8b8ba7"></p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="followers">0</b><span>متابعين</span></div>
    <div class="stat"><b id="following">0</b><span>متابَع</span></div>
    <div class="stat"><b id="visitors">0</b><span>زوار</span></div>
  </div>
  <div class="bio" id="bioView">اكتب نبذة قصيرة عنك...</div>
  <div class="btns">
    <button class="btn vip" onclick="location.href='/vip/'">👑 VIP</button>
    <button class="btn notif" id="notifBtn">🔔 اشتراك الإشعارات</button>
  </div>
</div>

<div class="modal" id="modal">
<div class="sheet">
  <h3>✏️ تعديل الملف الشخصي</h3>
  <div class="upload" id="upBox">📷 تغيير الصورة<input type="file" id="fileInp" accept="image/*" hidden></div>
  <label>الاسم</label><input id="editName" placeholder="اسمك">
  <label>الدولة</label>
  <select id="editCountry">
    <option value="">بدون علم</option>
    <option value="south-arabia">🚩 الجنوب العربي</option>
    <option value="🇸🇦">🇸🇦 السعودية</option>
    <option value="🇾🇪">🇾🇪 اليمن</option>
    <option value="🇦🇪">🇦🇪 الإمارات</option>
    <option value="🇰🇼">🇰🇼 الكويت</option>
    <option value="🇶🇦">🇶🇦 قطر</option>
    <option value="🇧🇭">🇧🇭 البحرين</option>
    <option value="🇴🇲">🇴🇲 عمان</option>
    <option value="🇪🇬">🇪🇬 مصر</option>
  </select>
  <label>نبذة عنك - اكتب هنا داخل القلم</label><textarea id="editBio" rows="3" placeholder="اكتب نبذة قصيرة عنك..."></textarea>
  <div style="display:flex;gap:8px;margin-top:14px">
    <button class="btn" style="background:#2a2840;color:#fff;flex:1" id="closeEdit">إلغاء</button>
    <button class="btn vip" style="flex:1" id="saveEdit">💾 حفظ</button>
  </div>
</div>
</div>

<div class="bottomNav">
  <a href="/profile/" id="nav-profile" class="on"><span class="ic">👤</span>حسابي</a>
  <a href="/dm/" id="nav-dm"><span class="ic">🔒</span>دردشة خاصة</a>
  <a href="/create/" class="plus"><span class="ic">+</span></a>
  <a href="/posts/" id="nav-posts"><span class="ic">📄</span>منشورات</a>
  <a href="/app/" id="nav-home"><span class="ic">🏠</span>الرئيسية</a>
</div>

<script type="module">
import {auth,db} from '/firebase-config.js';
import {onAuthStateChanged,updateProfile} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {doc,getDoc,setDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
let cur=null,newPhoto=null;
const flagEl=document.getElementById('flag');
function renderFlag(v){
  if(!v){flagEl.innerHTML='';return}
  if(v==='south-arabia'){flagEl.innerHTML=`<img src="/assets/south-arabia.png" class="flagImg">`}
  else flagEl.textContent=v;
}
onAuthStateChanged(auth,async u=>{
  if(!u){location.replace('/login/');return}
  cur=u;
  document.getElementById('name').textContent=u.displayName||u.email.split('@')[0];
  document.getElementById('avL').textContent=(u.displayName||'T')[0].toUpperCase();
  document.getElementById('email').textContent=u.email;
  document.getElementById('editName').value=u.displayName||'';
  const ref=doc(db,'users',u.uid);
  const snap=await getDoc(ref);
  if(!snap.exists()){await setDoc(ref,{followers:0,following:0,visitors:0,createdAt:Date.now()})}
  onSnapshot(ref,d=>{if(d.exists()){document.getElementById('followers').textContent=d.data().followers||0;document.getElementById('following').textContent=d.data().following||0;document.getElementById('visitors').textContent=d.data().visitors||0;}});
  const bio=localStorage.getItem('gabo_bio_'+u.uid); if(bio){document.getElementById('bioView').textContent=bio;document.getElementById('editBio').value=bio;}
  const photo=localStorage.getItem('gabo_photo_'+u.uid); if(photo){document.getElementById('avatar').innerHTML=`<img src="${photo}" style="width:100%;height:100%;object-fit:cover"><div class="pencil" id="openEdit">✏️</div>`; document.getElementById('openEdit').onclick=()=>document.getElementById('modal').classList.add('on')}
  const f=localStorage.getItem('gabo_flag_'+u.uid); if(f){document.getElementById('editCountry').value=f;renderFlag(f);}
});
const modal=document.getElementById('modal');
document.getElementById('openEdit').onclick=()=>modal.classList.add('on');
document.getElementById('closeEdit').onclick=()=>modal.classList.remove('on');
modal.onclick=e=>{if(e.target.id==='modal')modal.classList.remove('on')}
document.getElementById('upBox').onclick=()=>document.getElementById('fileInp').click();
document.getElementById('fileInp').onchange=e=>{const fr=new FileReader();fr.onload=()=>{newPhoto=fr.result;document.getElementById('upBox').innerHTML=`<img src="${newPhoto}" style="width:56px;height:56px;border-radius:10px;object-fit:cover"><br>تم`;};fr.readAsDataURL(e.target.files[0]);}
document.getElementById('saveEdit').onclick=async()=>{
  const n=document.getElementById('editName').value.trim();
  const b=document.getElementById('editBio').value.trim();
  const f=document.getElementById('editCountry').value;
  if(n&&n!==cur.displayName) await updateProfile(cur,{displayName:n});
  if(newPhoto) localStorage.setItem('gabo_photo_'+cur.uid,newPhoto);
  if(b) localStorage.setItem('gabo_bio_'+cur.uid,b);
  localStorage.setItem('gabo_flag_'+cur.uid,f);
  location.reload();
};
document.getElementById('notifBtn').onclick=async()=>{if(Notification.permission!=='granted') await Notification.requestPermission(); alert('تم تفعيل الإشعارات 🔔')};
</script>
</body>
</html>
