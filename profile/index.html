<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابي - GABO LIVE</title>
<style>
:root{--bg:#07060c;--card:#13111e;--b:#2a2840;--v:#7c3aed;--t:#fff;--m:#a1a1aa}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:system-ui;min-height:100vh;padding-bottom:120px}
.top{padding:14px 16px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(7,6,12,.9);backdrop-filter:blur(10px);z-index:10}
.card{margin:20px 16px;background:var(--card);border:1px solid var(--b);border-radius:20px;padding:20px;text-align:center}
.inp{width:100%;background:#1b192b;border:1px solid var(--b);border-radius:12px;padding:14px;color:#fff;margin-top:10px;text-align:right}
.btnV{background:var(--v);color:#fff;border:0;width:100%;padding:14px;border-radius:14px;margin-top:16px;font-weight:800;font-size:15px}
.tabs{display:flex;gap:8px;justify-content:center;margin-top:14px}
.tabs button{background:#1b192b;border:1px solid var(--b);color:var(--m);padding:8px 18px;border-radius:20px}
.tabs button.on{background:#fff;color:#000}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#0f0e18;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 0 calc(10px + env(safe-area-inset-bottom));z-index:9999}
.bottomNav a{flex:1;text-decoration:none;color:#6b6b7a;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bottomNav a.on{color:#fff}
.bottomNav a .ic{font-size:22px}
.bottomNav a.plus .ic{background:var(--v);color:#fff;width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-20px;box-shadow:0 8px 24px rgba(124,58,237,.5)}
</style>
</head>
<body>
<div class="top"><a href="/app/" style="background:#1e1c2e;border:1px solid var(--b);color:#fff;padding:6px 12px;border-radius:12px;text-decoration:none">‹ خروج</a><b>GABO LIVE</b><span></span></div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2>حسابي</h2><div style="width:44px;height:44px;background:var(--v);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900">G</div></div>
  <p style="color:var(--m);font-size:12px;text-align:right;margin-top:4px">ملفك في مجتمع GABO LIVE</p>
  <input id="name" class="inp" placeholder="اسمك">
  <label style="display:block;text-align:right;color:var(--m);font-size:11px;margin-top:12px">البريد الإلكتروني</label>
  <input id="email" class="inp" disabled>
  <label style="display:block;text-align:right;color:var(--m);font-size:11px;margin-top:12px">نبذة عنك</label>
  <textarea id="bio" class="inp" rows="3" placeholder="اكتب نبذة قصيرة"></textarea>
  <button class="btnV" id="save">💾 حفظ الملف</button>
  <div class="tabs"><button class="on">الملف</button><button>الإعدادات</button></div>
</div>

<!-- نفس الشريط اللي في الرئيسية بالضبط -->
<div class="bottomNav">
  <a href="/profile/" class="on"><span class="ic">👤</span>حسابي</a>
  <a href="/dm/"><span class="ic">🔒</span>دردشة خاصة</a>
  <a href="/create/" class="plus"><span class="ic">+</span></a>
  <a href="/posts/"><span class="ic">📄</span>منشورات</a>
  <a href="/app/"><span class="ic">🏠</span>الرئيسية</a>
</div>

<script type="module">
import { auth } from '/firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
let authReady=false;
onAuthStateChanged(auth, u=>{
  authReady=true;
  if(!u){
    // انتظر ثانية عشان ما يصير لوب
    setTimeout(()=>{ if(authReady) location.replace('/login/'); }, 800);
    return;
  }
  document.getElementById('name').value = u.displayName || '';
  document.getElementById('email').value = u.email || '';
});
document.getElementById('save').onclick=()=>{ alert('تم الحفظ ✅'); };
</script>
</body>
</html>
