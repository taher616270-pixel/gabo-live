<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الملف الشخصي</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;min-height:100vh;padding-bottom:20px}
.mainCard{margin:12px;background:var(--card);border:1px solid var(--b);border-radius:22px;overflow:hidden}
.coverMain{width:100%;height:200px;background:linear-gradient(135deg,#1a2a4a,#0f3460,#161426);display:flex;align-items:center;justify-content:center}
.coverMain img{width:100%;height:100%;object-fit:cover;display:none}
.head{display:flex;gap:14px;align-items:center;flex-direction:row-reverse;padding:16px;margin-top:-40px;position:relative;z-index:2}
.avatar{width:86px;height:86px;border-radius:22px;background:#6d28d9;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;overflow:hidden;border:3px solid var(--card)}
.avatar img{width:100%;height:100%;object-fit:cover;display:none}
.info{flex:1;text-align:left;direction:ltr}
.nameRow{font-size:17px;font-weight:800}
.idRow{font-size:11px;color:#8b8ba7;margin-top:6px;font-family:monospace}
.bio{margin:12px 16px;background:#1e1c2e;border:1px solid var(--b);border-radius:12px;padding:12px;font-size:13px;color:#c4c4d0;min-height:45px}
.btn{width:calc(100% - 32px);margin:10px 16px;padding:13px;border-radius:14px;border:0;font-weight:800;font-size:14px;cursor:pointer;display:block;text-align:center}
.primary{background:var(--v);color:#fff}
.back{margin:12px;background:#1e1c2e;border:1px solid var(--b);color:#fff;padding:12px;border-radius:12px;text-align:center;cursor:pointer}

/* Public profile header visual polish */
.mainCard{box-shadow:0 14px 38px rgba(0,0,0,.28);border-color:rgba(168,85,247,.24)}
.coverMain{height:218px;background:radial-gradient(circle at 78% 15%,rgba(168,85,247,.34),transparent 38%),linear-gradient(135deg,#17152c,#101a35 58%,#211338);overflow:hidden}
.coverMain img{object-fit:cover}
.head{gap:8px;padding:14px 16px 18px;margin-top:-48px;align-items:center;flex-direction:row}
.avatar{width:94px;height:94px;border-radius:25px;border:4px solid var(--card);box-shadow:0 8px 24px rgba(0,0,0,.48),0 0 0 1px rgba(251,191,36,.25);flex-shrink:0}
.info{min-width:0;text-align:right;direction:rtl;padding-bottom:3px}
.nameRow{font-size:19px;line-height:1.4;display:flex;align-items:center;flex-wrap:wrap;gap:7px;color:#fff}
.idRow{margin-top:7px;font-size:10px;letter-spacing:1.2px;direction:ltr;text-align:right}
.profileMeta{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:9px;font-size:12px;color:#e4e1f0}
.profileMeta span{background:#29243d;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:4px 9px}
.profileMeta img{width:23px;height:16px;object-fit:cover;border-radius:3px;vertical-align:middle}
@media(max-width:380px){.coverMain{height:190px}.avatar{width:82px;height:82px}.nameRow{font-size:17px}.head{gap:11px}}

/* Public profile header: prevent overflow and keep country, age and gender tidy */
.info{min-width:0;width:0;flex:1;text-align:right;direction:rtl}
.nameRow{display:flex;align-items:center;flex-wrap:nowrap;gap:7px;width:100%;min-width:0;overflow:hidden;white-space:nowrap;line-height:1.35}
#name{display:block;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profileMeta{display:flex;align-items:center;flex-wrap:wrap;gap:7px;width:100%;min-width:0;margin-top:8px;direction:rtl}
#country{display:flex;align-items:center;gap:6px;flex:0 0 100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:transparent;border:0;padding:0}
#country img{flex:0 0 auto}
#gender,#age{flex:0 0 auto;white-space:nowrap}
.idRow{max-width:100%;display:flex;align-items:center;justify-content:flex-start;gap:8px;direction:rtl;white-space:nowrap;margin-top:8px;color:#aaa7bd;font-size:11px}\n.idValue{direction:ltr;unicode-bidi:isolate;font-family:monospace;letter-spacing:1px;color:#fff}\n.copyIdBtn{border:1px solid rgba(251,191,36,.35);background:#29243d;color:#fbbf24;border-radius:8px;padding:4px 8px;font-size:11px;font-weight:700;cursor:pointer;flex:0 0 auto}
@media(max-width:380px){.nameRow{font-size:16px}.profileMeta{font-size:11px;gap:5px}.head{gap:10px;padding-left:12px;padding-right:12px}}


/* Centered avatar overlapping the lower edge of the cover */
.head{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:-48px;padding:0 16px 18px}
.avatar{width:104px;height:104px;border-radius:28px;flex:0 0 104px}
.info{width:100%;min-width:0;flex:0 0 auto;text-align:center;direction:rtl;padding:0}
.nameRow{justify-content:center;text-align:center}
.profileMeta{justify-content:center;text-align:center}
#country{justify-content:center;text-align:center;flex:0 0 100%}
.idRow{justify-content:center;direction:rtl;text-align:center;flex-wrap:wrap}
@media(max-width:380px){.avatar{width:96px;height:96px;flex-basis:96px}.head{gap:9px}}

</style>
<link rel="stylesheet" href="/assets/style/gabo-theme.css">
</head>
<body>
<div class="mainCard">
<div class="coverMain" id="coverMain"><img id="coverImg"><span id="coverPH">🖼️</span></div>
<div class="head">
<div class="avatar" id="avatar"><img id="avImg"><span id="avL">T</span></div>
<div class="info">
<div class="nameRow"><span id="name">تحميل...</span></div>
<div class="idRow"><span>ID</span><span class="idValue" id="uidText">--------</span><button class="copyIdBtn" id="copyPublicIdBtn" type="button">نسخ</button></div>
<div class="profileMeta"><span id="country"></span><span id="gender"></span><span id="age"></span></div>
</div>
</div>
<div class="bio" id="bio">...</div>
<button class="btn primary" id="chatBtn">💬 دردشة خاصة</button>
<div class="back" onclick="history.back()">‹ رجوع</div>
</div>

<script type="module">
import {db} from '/firebase-config.js';
import {getSouthArabiaFlag,getCountryRegistry} from '/assets/country-flags.js';
import {doc,getDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
function genId(uid){let h=0;for(let i=0;i<uid.length;i++){h=(h*31+uid.charCodeAt(i))%1000000000;}return (10000000+(h%90000000)).toString().padStart(8,'0');}
const params=new URLSearchParams(location.search);
const targetUid=params.get('uid');
if(!targetUid){
  document.getElementById('name').textContent='معرف غير صحيح';
}else{
  (async()=>{
    try{
      const snap=await getDoc(doc(db,'users',targetUid));
      if(!snap.exists()){
        document.getElementById('name').textContent='الحساب غير موجود';
        return;
      }
      const d=snap.data();
      const name=d.displayName||d.name||'مستخدم';
      const photo=d.photoURL||d.photoUrl||d.photo||d.avatar||'';
      const cover=d.cover||d.coverURL||d.coverUrl||'';
      const bio=d.bio||'مرحبا بكم في ملفي 👋';
      const registry=await getCountryRegistry();
      const code=String(d.country||'south-arabia').toLowerCase();
      const countryInfo=registry.find(x=>String(x.code).toLowerCase()===code);
      const country=d.countryName||countryInfo?.name||'الجنوب العربي';
      const flag=code==='south-arabia'?await getSouthArabiaFlag():(d.countryFlagImg||countryInfo?.flag||'');
      document.getElementById('name').textContent=name;
      document.getElementById('avL').textContent=name.charAt(0);
      document.getElementById('uidText').textContent=d.gaboId||genId(targetUid);
      if(photo){const img=document.getElementById('avImg');img.src=photo;img.style.display='block';document.getElementById('avL').style.display='none';}
      if(cover){const img=document.getElementById('coverImg');img.src=cover;img.style.display='block';document.getElementById('coverPH').style.display='none';}
      document.getElementById('bio').textContent=bio;
      document.getElementById('country').innerHTML=(flag?'<img src="'+flag+'" alt=""> ':'')+country;
      document.getElementById('gender').textContent=d.gender||'';
      if(d.bday){
        const [y,m,day]=String(d.bday).split('-').map(Number);
        if(y&&m&&day){const now=new Date();let age=now.getFullYear()-y;if(now.getMonth()+1<m||(now.getMonth()+1===m&&now.getDate()<day))age--;if(age>=0)document.getElementById('age').textContent=age+' سنة';}
      }
    }catch(err){
      console.error('Public profile load error:',err);
      document.getElementById('name').textContent='تعذر تحميل بيانات الحساب';
    }
  })();
}
document.getElementById('copyPublicIdBtn').onclick=async()=>{const value=document.getElementById('uidText').textContent.trim();if(!value||value==='--------')return;try{await navigator.clipboard.writeText(value);document.getElementById('copyPublicIdBtn').textContent='تم';}catch{const input=document.createElement('textarea');input.value=value;document.body.appendChild(input);input.select();try{document.execCommand('copy');document.getElementById('copyPublicIdBtn').textContent='تم';}catch{}input.remove();}setTimeout(()=>document.getElementById('copyPublicIdBtn').textContent='نسخ',1800);};
document.getElementById('chatBtn').onclick=()=>{ if(targetUid) location.href='/dm/?uid='+targetUid; }
</script>

<script type="module" src="/js/unified-bottom-nav.js"></script>
</body>
</html>
