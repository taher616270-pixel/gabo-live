<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل دخول - GABO LIVE</title>
<style>
:root{--bg:#08070d;--card:#12111a;--v:#7c3aed;--vl:#a78bfa;--text:#fff;--muted:#9ca3af}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:system-ui;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid rgba(124,58,237,.2);border-radius:20px;padding:28px;box-shadow:0 0 40px rgba(124,58,237,.15)}
.logo{text-align:center;margin-bottom:24px}
.logo h1{font-size:28px;letter-spacing:.15em}.logo h1 span{color:var(--v)}
label{display:block;margin:12px 0 6px;color:var(--muted);font-size:14px}
input{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #2a2840;background:#0e0d14;color:#fff;outline:none;font-size:15px}
input:focus{border-color:var(--v)}
.btn{width:100%;margin-top:18px;padding:14px;border:none;border-radius:12px;background:var(--v);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
.btn:active{transform:scale(.98)}
.divider{margin:18px 0;text-align:center;color:var(--muted);font-size:13px}
.error{margin-top:12px;color:#f87171;font-size:13px;text-align:center;min-height:18px}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><h1>GABO <span>LIVE</span></h1><p style="color:var(--muted);font-size:13px;margin-top:6px">سجل دخولك للمتابعة</p></div>
  
  <label>الايميل</label>
  <input id="email" type="email" placeholder="example@email.com">
  
  <label>كلمة المرور</label>
  <input id="pass" type="password" placeholder="••••••••">
  
  <button class="btn" id="loginBtn">تسجيل دخول</button>
  <div class="error" id="err"></div>
  
  <div class="divider">إذا ما عندك حساب؟ سيتم إنشاء حساب تلقائي</div>
</div>

<script type="module">
import { auth, db } from '/firebase-config.js';
import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// إذا مسجل من قبل ودّيه مباشرة لـ app
onAuthStateChanged(auth, async (u) => {
  if(u){
    // فحص هل هو أدمن
    try{
      const snap = await getDoc(doc(db,'admins',u.uid));
      if(snap.exists()){ location.replace('/admin/'); return; }
    }catch(e){}
    location.replace('/app/');
  }
});

const emailEl = document.getElementById('email');
const passEl = document.getElementById('pass');
const errEl = document.getElementById('err');
const btn = document.getElementById('loginBtn');

btn.onclick = async () => {
  const email = emailEl.value.trim();
  const pass = passEl.value.trim();
  if(!email || !pass){ errEl.textContent='عبي الايميل والباسوورد'; return; }
  btn.textContent='جاري الدخول...'; btn.disabled=true; errEl.textContent='';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
    // التحويل يصير تلقائي من onAuthStateChanged -> /app/
  }catch(e){
    // إذا الحساب مو موجود أنشئه
    if(e.code==='auth/invalid-credential' || e.code==='auth/user-not-found' || e.code==='auth/invalid-login-credentials'){
      try{
        await createUserWithEmailAndPassword(auth, email, pass);
      }catch(e2){ errEl.textContent = e2.message; btn.textContent='تسجيل دخول'; btn.disabled=false; return; }
    }else{
      errEl.textContent = 'خطأ: '+e.message;
      btn.textContent='تسجيل دخول'; btn.disabled=false;
    }
  }
};
</script>
</body>
</html>
