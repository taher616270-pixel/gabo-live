<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
<style>body{-webkit-tap-highlight-color:transparent}</style>
</head>
<body class="min-h-screen bg-[#0a0a0f] flex items-center justify-center p-4">

<div class="w-full max-w-[380px] bg-[#15151c] border border-white/10 rounded-[24px] p-6">
  <div class="flex justify-between items-center mb-5">
    <span class="text-[10px] text-purple-300 bg-purple-500/20 px-3 py-1 rounded-full">LIVE ●</span>
    <h1 class="font-black tracking-widest text-white text-sm">GABO LIVE</h1>
  </div>

  <div class="flex bg-black/50 rounded-xl p-1 mb-5">
    <button id="tabLogin" class="flex-1 h-9 rounded-lg bg-white text-black font-bold text-sm">دخول</button>
    <button id="tabSignup" class="flex-1 h-9 rounded-lg text-white/50 text-sm">حساب جديد</button>
  </div>

  <h2 class="text-center text-white font-bold text-[15px]">مرحبا بعودتك 👋</h2>
  <p class="text-center text-white/40 text-[11px] mb-5">ادخل وشارك صوتك مع العالم</p>

  <input id="email" type="email" placeholder="البريد الإلكتروني" class="w-full h-11 px-4 rounded-xl bg-white/[0.06] border border-white/10 text-white text-right text-sm outline-none mb-3">
  <input id="password" type="password" placeholder="كلمة السر" class="w-full h-11 px-4 rounded-xl bg-white/[0.06] border border-white/10 text-white text-right text-sm outline-none mb-4">

  <button id="mainBtn" class="w-full h-12 rounded-xl bg-[#9b6cff] text-white font-bold text-sm active:scale-[0.98] transition">دخول إلى المنصة 🚀</button>

  <div class="flex items-center gap-3 my-4">
    <div class="h-[1px] flex-1 bg-white/10"></div>
    <span class="text-white/30 text-[11px]">أو المتابعة عبر</span>
    <div class="h-[1px] flex-1 bg-white/10"></div>
  </div>

  <div id="social" class="grid gap-3"></div>
  <button id="forgot" class="w-full text-center text-[11px] text-white/40 mt-4">نسيت كلمة السر؟ استعادة</button>
</div>

<script>
// --- حط بياناتك هنا ---
const firebaseConfig = {
  apiKey: "AIzaSy...YOUR_KEY",
  authDomain: "gabo-live.firebaseapp.com",
  projectId: "gabo-live",
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

// عشان يحل مشكلة الشاشة البيضاء
auth.getRedirectResult().then(()=>{}).catch(()=>{});

let isLogin = true;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const emailEl = document.getElementById('email');
const passEl = document.getElementById('password');

// رسم الأزرار - Apple فقط على الايفون
const socialDiv = document.getElementById('social');
if(isIOS){
  socialDiv.className = "grid grid-cols-2 gap-3";
  socialDiv.innerHTML = `
    <button id="aBtn" class="h-12 rounded-xl bg-white/[0.06] border border-white/10 text-white text-sm active:bg-white/10">Apple</button>
    <button id="gBtn" class="h-12 rounded-xl bg-white/[0.06] border border-white/10 text-white text-sm active:bg-white/10">Google</button>`;
} else {
  socialDiv.className = "grid grid-cols-1 gap-3";
  socialDiv.innerHTML = `<button id="gBtn" class="h-12 rounded-xl bg-white/[0.06] border border-white/10 text-white text-sm">Google</button>`;
}

// Google - نستخدم Redirect عشان ما تطلع شاشة بيضاء في الايفون
function loginGoogle(){
  const provider = new firebase.auth.GoogleAuthProvider();
  // في الايفون لازم Redirect مو Popup
  auth.signInWithRedirect(provider);
}
function loginApple(){
  const provider = new firebase.auth.OAuthProvider('apple.com');
  auth.signInWithRedirect(provider);
}

document.getElementById('gBtn').onclick = (e)=>{ e.preventDefault(); loginGoogle(); };
if(isIOS) document.getElementById('aBtn').onclick = (e)=>{ e.preventDefault(); loginApple(); };

// تبديل دخول / حساب جديد
tabLogin.onclick = (e)=>{ e.preventDefault(); isLogin=true; tabLogin.className="flex-1 h-9 rounded-lg bg-white text-black font-bold text-sm"; tabSignup.className="flex-1 h-9 rounded-lg text-white/50 text-sm"; mainBtn.textContent="دخول إلى المنصة 🚀"; };
tabSignup.onclick = (e)=>{ e.preventDefault(); isLogin=false; tabSignup.className="flex-1 h-9 rounded-lg bg-white text-black font-bold text-sm"; tabLogin.className="flex-1 h-9 rounded-lg text-white/50 text-sm"; mainBtn.textContent="إنشاء حساب 🚀"; };

// دخول بالايميل
mainBtn.onclick = async (e)=>{
  e.preventDefault();
  const em = emailEl.value.trim(), pw = passEl.value;
  if(!em||!pw) return alert('اكتب البريد وكلمة السر');
  mainBtn.textContent = "جاري..."; mainBtn.disabled=true;
  try{
    if(isLogin) await auth.signInWithEmailAndPassword(em,pw);
    else await auth.createUserWithEmailAndPassword(em,pw);
    location.href = "/";
  }catch(err){ alert(err.message); mainBtn.textContent = isLogin ? "دخول إلى المنصة 🚀" : "إنشاء حساب 🚀"; mainBtn.disabled=false; }
};

// نسيت
forgot.onclick = async (e)=>{
  e.preventDefault();
  if(!emailEl.value) return alert('اكتب ايميلك في الخانة فوق');
  try{ await auth.sendPasswordResetEmail(emailEl.value); alert('ارسلنا لك رابط باسم GABO LIVE'); }
  catch(err){ alert(err.message); }
};
</script>
</body>
</html>
