<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدخول — GABO LIVE</title>
<link rel="stylesheet" href="/assets/style/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:#08070d;color:#fff;font-family:system-ui;padding:20px}
.card{width:min(440px,100%);background:rgba(17,12,29,.9);border:1px solid #ffffff20;border-radius:20px;padding:26px}
.page{display:none}.page.active{display:block}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff22;background:#0d0b15;color:#fff;margin:8px 0 14px}
.btn{width:100%;padding:13px;border-radius:12px;border:0;cursor:pointer;font-weight:800;margin-top:8px}
.btn.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#fff}
.btn.ghost{background:transparent;border:1px solid #ffffff20;color:#aaa3bd}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1}
.tabs button.active{background:#7c3aed;color:#fff}
.muted{color:#aaa3bd;font-size:13px;text-align:center;margin-top:12px;cursor:pointer}
.error{color:#fb7185;font-size:13px;margin:6px 0}
.success{color:#4ade80;font-size:13px;margin:6px 0}
</style></head><body>
<div class="card">
<div class="tabs">
<button class="btn ghost active" id="t-login" onclick="show('login')">دخول</button>
<button class="btn ghost" id="t-signup" onclick="show('signup')">حساب جديد</button>
</div>

<!-- صفحة 1: دخول -->
<div class="page active" id="p-login">
<h3>مرحباً بعودتك 👋</h3>
<div id="err-login" class="error"></div>
<input id="l-email" type="email" placeholder="البريد">
<input id="l-pass" type="password" placeholder="كلمة السر">
<button class="btn primary" onclick="doLogin()">دخول</button>
<p class="muted" onclick="show('forgot')">نسيت كلمة السر؟</p>
</div>

<!-- صفحة 2: انشاء حساب منعزلة -->
<div class="page" id="p-signup">
<h3>إنشاء حساب جديد ✨</h3>
<div id="err-signup" class="error"></div>
<div id="ok-signup" class="success"></div>
<input id="s-name" placeholder="اسمك">
<input id="s-email" type="email" placeholder="البريد">
<input id="s-pass" type="password" placeholder="كلمة سر (6+ أحرف)">
<button class="btn primary" onclick="doSignup()">إنشاء حساب</button>
<p class="muted" onclick="show('login')">عندك حساب؟ سجل دخول</p>
</div>

<!-- صفحة 3: نسيت كلمة السر منعزلة -->
<div class="page" id="p-forgot">
<h3>إعادة تعيين 🔑</h3>
<div id="err-forgot" class="error"></div>
<div id="ok-forgot" class="success"></div>
<p style="color:#aaa3bd;font-size:14px">سنرسل رابط إعادة التعيين لبريدك</p>
<input id="f-email" type="email" placeholder="بريدك المسجل">
<button class="btn primary" onclick="doForgot()">إرسال الرابط</button>
<p class="muted" onclick="show('login')">← رجوع للدخول</p>
</div>

</div>
<script type="module">
import { auth, db } from "/assets/firebase-config.js";
import { signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

window.show = (id)=>{
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('p-'+id).classList.add('active');
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 const tb = document.getElementById('t-'+id);
 if(tb) tb.classList.add('active');
}

window.doLogin = async()=>{
 const e=document.getElementById('l-email').value.trim();
 const p=document.getElementById('l-pass').value;
 const err=document.getElementById('err-login');
 if(!e||!p){err.textContent='أكمل البيانات';return}
 try{ await signInWithEmailAndPassword(auth,e,p); location.href='/app/public/'; }
 catch(ex){ err.textContent=ex.message; }
}

window.doSignup = async()=>{
 const name=document.getElementById('s-name').value.trim();
 const e=document.getElementById('s-email').value.trim();
 const p=document.getElementById('s-pass').value;
 const err=document.getElementById('err-signup');
 const ok=document.getElementById('ok-signup');
 err.textContent=''; ok.textContent='';
 if(!name||!e||p.length<6){err.textContent='أكمل البيانات (كلمة السر 6+ أحرف)';return}
 try{
  const cred=await createUserWithEmailAndPassword(auth,e,p);
  await updateProfile(cred.user,{displayName:name});
  await setDoc(doc(db,'users',cred.user.uid),{name,email:e,createdAt:serverTimestamp(),role:'user'},{merge:true});
  ok.textContent='تم إنشاء حسابك ✅ جاري الدخول...';
  setTimeout(()=>location.href='/app/public/',900);
 }catch(ex){ err.textContent=ex.message; }
}

window.doForgot = async()=>{
 const e=document.getElementById('f-email').value.trim();
 const err=document.getElementById('err-forgot');
 const ok=document.getElementById('ok-forgot');
 err.textContent=''; ok.textContent='';
 if(!e){err.textContent='أدخل بريدك';return}
 try{
  await sendPasswordResetEmail(auth,e);
  ok.textContent='تم إرسال رابط إعادة التعيين 📩 تفقد بريدك';
 }catch(ex){ err.textContent=ex.message; }
}
</script>
</body></html>
