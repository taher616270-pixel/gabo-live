<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090811">
<title>GABO LIVE | تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090811;--panel:#151222;--gold:#e8c77b;--purple:#8957f5;--text:#fbfaff;--muted:#aaa5ba;--red:#ff718c;--green:#63d9a1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:20px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(119,73,218,.2),transparent 42%),var(--bg);color:var(--text);font-family:Tajawal,Arial,sans-serif}
.shell{width:100%;max-width:460px}
.card{padding:28px;border:1px solid rgba(220,190,255,.13);border-radius:25px;background:linear-gradient(155deg,#1a162a,#0f0d18);box-shadow:0 28px 90px #0008}
.brand{text-align:center;margin-bottom:25px}
.mark{font-size:75px;font-weight:900;color:var(--gold);line-height:1}
.brand h1{font-family:Arial;font-size:30px;letter-spacing:3px}
.brand h1 span{color:var(--gold)}
.brand p{color:var(--muted)}
.tabs{display:flex;gap:5px;padding:5px;margin-bottom:20px;background:#08070c;border-radius:13px}
.tabs button{flex:1;padding:13px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:inherit;font-weight:800;cursor:pointer}
.tabs button.on{background:#30204d;color:var(--gold)}
.field{margin-bottom:15px}
label{display:block;margin-bottom:7px;font-weight:700;font-size:13px}
input{width:100%;height:50px;padding:0 13px;border:1px solid #ffffff20;border-radius:12px;background:#08070c;color:white;font:inherit;outline:none}
input:focus{border-color:var(--purple)}
input[dir=ltr]{text-align:left}
.input-wrap{position:relative}
.pass-toggle{position:absolute;left:10px;top:12px;border:0;background:none;color:var(--gold);cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.forgot{display:block;margin:0 0 12px auto;border:0;background:none;color:var(--gold);font:inherit;cursor:pointer}
.main-btn,.social-btn{width:100%;min-height:50px;margin-top:10px;border-radius:13px;font:inherit;font-weight:800;cursor:pointer}
.main-btn{color:var(--gold);border:1px solid #e8c77b88;background:linear-gradient(110deg,#08070c,#49306f)}
.social-btn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);border:1px solid #e8c77b55;background:linear-gradient(110deg,#08080b,#241936)}
.social-btn img{width:20px;height:20px}
.apple-icon{font-size:22px}
button:disabled{opacity:.55}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:#ffffff20}
.msg{text-align:center;min-height:22px;margin-top:12px;font-size:13px;color:var(--muted)}
.msg.e{color:var(--red)}
.msg.ok{color:var(--green)}
.fieldErr{display:none;color:var(--red);font-size:12px;margin-top:5px}
.fieldErr.show{display:block}
.consent{display:flex;gap:9px;margin-top:18px;font-size:12px;line-height:1.8}
.consent input{width:18px;height:18px;flex:0 0 18px;margin:3px 0}
.consent a{color:#b18aff}
.consentErr{display:none;color:var(--red);font-size:12px}
.consentErr.show{display:block}
.legal{text-align:center;color:#827c91;font-size:11px;margin-top:20px}
.country-wrap{position:relative}
.country-native-select{display:none}
.country-trigger{width:100%;height:50px;padding:0 12px;text-align:right;color:white;background:#08070c;border:1px solid #ffffff20;border-radius:12px;font:inherit}
.country-menu{display:none;position:absolute;z-index:10;top:55px;right:0;left:0;padding:8px;background:#151222;border:1px solid #e8c77b55;border-radius:12px}
.country-menu.open{display:block}
.country-search{margin-bottom:7px}
.country-options{max-height:220px;overflow:auto}
.country-option{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border:0;background:transparent;color:white;text-align:right;font:inherit}
.country-option img{width:25px;height:18px}
.country-option[hidden]{display:none}
.country-empty{display:none;padding:10px}
.country-empty.show{display:block}
@media(max-width:420px){.card{padding:19px}.row{gap:7px}}

/* Compact responsive login: keep every action visible without page scrolling */


html{height:100%;overflow:hidden}
body{height:100vh;min-height:0;overflow:hidden;padding:clamp(6px,2vh,16px);padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
@supports(height:100dvh){body{height:100dvh}}
.shell{width:min(100%,460px);max-height:100%;display:flex;align-items:center}
.card{width:100%;max-height:100%;overflow:hidden;padding:clamp(12px,2.2vh,22px);border-radius:20px}
.brand{margin-bottom:clamp(7px,1.5vh,14px)}
.mark{font-size:clamp(34px,6vh,54px)}
.brand h1{font-size:clamp(20px,3.5vh,26px);margin:4px 0}
.brand p{font-size:12px;margin:3px 0 0}
.tabs{margin-bottom:clamp(7px,1.5vh,13px);padding:3px}
.tabs button{padding:9px 6px}
.field{margin-bottom:clamp(6px,1.2vh,10px)}
label{margin-bottom:4px;font-size:12px}
input{height:42px;padding:0 10px;font-size:14px}
.pass-toggle{top:8px}
.row{gap:8px}
.forgot{font-size:12px;margin:0 0 5px auto}
.main-btn,.social-btn{min-height:42px;margin-top:6px;font-size:13px}
.social-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.social-btn{margin-top:0;padding:4px 6px;white-space:nowrap}
.social-btn img{width:17px;height:17px}
.apple-icon{font-size:18px}
.divider{margin:9px 0;font-size:11px}
.msg{min-height:17px;margin-top:5px;font-size:12px}
.consent{margin-top:9px;gap:7px;font-size:11px;line-height:1.45}
.consent input{width:16px;height:16px;flex-basis:16px;margin:1px 0}
.consentErr{font-size:11px}
.legal{font-size:10px;margin:8px 0 0}
.country-trigger{height:42px;padding:0 9px;font-size:13px}
.country-menu{top:46px}
.country-search{height:38px}
.country-options{max-height:150px}
.country-option{padding:7px;font-size:13px}
#signupFields:not([hidden]){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 9px}
#signupFields .row{display:contents}
#signupFields .field{min-width:0;margin:0}
#signupFields .field label{white-space:nowrap}
#signupFields input{height:40px;min-width:0;font-size:13px}
#signupFields .country-wrap{min-width:0}
#signupFields .country-trigger{height:40px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-height:650px){
 .card{padding:10px 13px}
 .brand{margin-bottom:6px}
 .mark{font-size:34px}
 .brand h1{font-size:20px;margin:2px 0}
 .brand p{font-size:10px;margin:0}
 .tabs{margin-bottom:6px}
 .tabs button{padding:7px 5px}
 .field{margin-bottom:5px}
 input{height:38px}
 #signupFields input,#signupFields .country-trigger{height:36px}
 .main-btn,.social-btn{min-height:38px}
 .divider{margin:6px 0}
 .consent{margin-top:6px}
 .legal{margin-top:5px}
}
@media(max-width:350px){
 .card{padding:9px}
 #signupFields:not([hidden]){gap:5px 6px}
 .social-row{gap:6px}
 .social-btn{font-size:12px}
}
@media(max-height:520px) and (orientation:landscape){
 body{padding:4px}
 .shell{max-width:700px}
 .card{padding:7px 12px}
 .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:4px}
 .mark{font-size:28px}
 .brand h1{font-size:18px;margin:0}
 .brand p{display:none}
 .tabs{margin-bottom:4px}
 .field{margin-bottom:3px}
 .divider{margin:4px 0}
 .legal{display:none}
}

/* Fuller app-like login frame: extend the card toward the top and bottom */
.shell{height:100%;width:min(100%,480px);align-items:stretch}
.card{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,4vh,34px) clamp(18px,4vw,30px);border-radius:24px}
.brand{margin-bottom:clamp(14px,3vh,24px)}
.mark{font-size:clamp(48px,7vh,64px)}
.brand h1{font-size:clamp(24px,4vh,30px);margin:6px 0}
.tabs{margin-bottom:clamp(12px,2.4vh,20px)}
.field{margin-bottom:clamp(9px,1.8vh,14px)}
input{height:46px}
.main-btn,.social-btn{min-height:46px}
.divider{margin:clamp(12px,2.4vh,19px) 0}
.consent{margin-top:clamp(12px,2.2vh,18px)}
.legal{margin-top:clamp(12px,2.2vh,18px)}
@media(max-height:700px){
 .card{padding:12px 14px}
 .brand{margin-bottom:7px}
 .mark{font-size:36px}
 .brand h1{font-size:21px;margin:2px 0}
 .brand p{font-size:10px}
 .tabs{margin-bottom:7px}
 .field{margin-bottom:5px}
 input{height:38px}
 .main-btn,.social-btn{min-height:38px}
 .divider{margin:6px 0}
 .consent{margin-top:6px}
 .legal{margin-top:5px}
}

/* Responsive full-screen layout for iOS and Android */
*,*::before,*::after{-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;
  height:100vh;
  height:100dvh;
  height:100svh;
  margin:0;
  padding:0;
  position:fixed;
  inset:0;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-overflow-scrolling:auto;
}
@supports not (height:100dvh){
  html,body,.shell,.card{height:100vh}
}
body{display:block;touch-action:pan-x pan-y}
.shell{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100vh;
  height:100dvh;
  height:100svh;
  max-width:100%;
  padding:0;
  margin:0;
  box-sizing:border-box;
}
.card{
  width:100%;
  height:100vh;
  height:100dvh;
  height:100svh;
  min-height:100vh;
  min-height:100dvh;
  min-height:100svh;
  max-height:100vh;
  max-height:100dvh;
  max-height:100svh;
  max-width:100%;
  margin:0;
  border-radius:0;
  border:none;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:clamp(12px,4vw,24px);
  padding-top:max(12px,env(safe-area-inset-top));
  padding-right:max(12px,env(safe-area-inset-right));
  padding-bottom:max(12px,env(safe-area-inset-bottom));
  padding-left:max(12px,env(safe-area-inset-left));
  box-sizing:border-box;
  overflow:hidden;
  background:linear-gradient(155deg,#1a162a,#0f0d18);
  box-shadow:none;
}
.brand{margin-bottom:clamp(8px,2.5vh,20px)}
.mark{font-size:clamp(40px,15vw,75px)}
.brand h1{font-size:clamp(20px,6vw,30px)}
.tabs{margin-bottom:clamp(8px,2vh,16px)}
label{font-size:clamp(11px,2.8vw,13px)}
input,.country-trigger{
  height:clamp(44px,11vw,50px)!important;
  font-size:16px!important;
  min-width:0;
  box-sizing:border-box;
}
#signupFields:not([hidden]){
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:clamp(5px,1.4vh,10px) 10px;
  min-width:0;
}
#signupFields .row{display:contents}
#signupFields .field{min-width:0;margin:0}
#signupFields .field label{white-space:nowrap}
#signupFields .input-wrap{min-width:0}
#signupFields .country-wrap{min-width:0}
#signupFields .country-trigger{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-inline:8px}
#signupFields .signup-email,#signupFields .signup-country{grid-column:auto}
.main-btn,.social-btn{
  min-height:clamp(44px,11vw,50px);
  font-size:clamp(13px,3.5vw,15px);
}
@media (min-width:769px){
  .card{
    width:100%;
    max-width:460px;
    border-radius:28px;
    border:1px solid rgba(255,255,255,.1);
    height:min(100svh,900px);
    min-height:min(100svh,620px);
  }
}
@media (max-height:700px),(max-width:375px){
  .brand{margin-bottom:10px}
  .field{margin-bottom:8px}
  .tabs{margin-bottom:10px}
  .mark{font-size:clamp(34px,10vw,52px)}
  .brand h1{font-size:clamp(19px,5vw,24px)}
  #signupFields:not([hidden]){gap:5px 8px}
  #signupFields input,#signupFields .country-trigger{height:clamp(40px,8vh,46px)!important}
  .main-btn,.social-btn{min-height:42px}
  .divider{margin:8px 0}
  .social-row{gap:8px}
  .consent{margin-top:6px}
  .legal{margin-top:5px}
}
@media(max-height:600px){
  .card{justify-content:flex-start;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}
  .brand{margin-bottom:5px}
  .mark{font-size:32px}
  .brand p{margin:2px 0}
  .tabs{margin-bottom:6px}
  .tabs button{padding:7px 5px}
  #signupFields:not([hidden]){gap:3px 7px}
  #signupFields input,#signupFields .country-trigger{height:38px!important}
  .main-btn,.social-btn{min-height:38px;margin-top:6px}
  .divider{margin:5px 0}
}

/* GABO logo bounce */
@keyframes gaboLogoBounce{
  0%,100%{transform:translateY(0) scaleY(1)}
  18%{transform:translateY(-22px) scaleY(1)}
  29%{transform:translateY(0) scaleY(.85)}
  37%{transform:translateY(-10px) scaleY(1)}
  48%{transform:translateY(0) scaleY(1)}
  100%{transform:translateY(0) scaleY(1)}
}
.mark{
  display:block;
  width:max-content;
  margin:0 auto;
  transform-origin:bottom;
  animation:gaboLogoBounce 2.2s ease-in-out infinite;
}
.brand h1{
  font-size:36px!important;
  transform:scale(1.08);
  transform-origin:center;
}
.country-flag-emoji{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:27px;
  font-size:22px;
  line-height:1;
  flex:0 0 auto;
}
.country-flag-image{
  width:27px;
  height:19px;
  object-fit:cover;
  border-radius:2px;
  flex:0 0 auto;
}
.country-option{gap:10px}
.country-trigger #countryChosen{
  display:inline-flex;
  align-items:center;
  gap:8px;
  min-width:0;
  vertical-align:middle;
}
@media(prefers-reduced-motion:reduce){
  .mark{animation:none}
}

/* Signup fields: exact four-row layout */
#signupFields:not([hidden]){
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:12px;
  width:100%;
  min-width:0;
}
#signupFields .signup-row{
  grid-column:1 / -1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  min-width:0;
}
#signupFields .signup-email,
#signupFields .signup-country{
  grid-column:1 / -1;
  width:100%;
  min-width:0;
}
#signupFields .field{min-width:0;margin:0}
#signupFields .signup-email input,
#signupFields .signup-country .country-trigger{width:100%}
#signupFields .signup-country,
#signupFields .signup-country .country-wrap,
#signupFields .signup-country .country-trigger{
  width:100%;
  min-width:0;
}
#signupFields .signup-country .country-trigger{
  white-space:nowrap;
  overflow:visible;
  text-overflow:unset;
  display:block;
}
#signupFields #countryChosen{
  display:flex;
  align-items:center;
  gap:8px;
  width:100%;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
#signupFields .country-trigger{width:100%}
@media(max-width:375px){
  #signupFields:not([hidden]){gap:10px}
  #signupFields .signup-row{gap:12px}
}

/* Exact first-row name fields fix */
#signupFields > .row:nth-child(1) {
  display: grid !important;
  grid-template-columns: 1fr 1fr !important;
  gap: 12px !important;
  width: 100% !important;
}

#signupFields > .row:nth-child(1) .field {
  width: 100% !important;
  min-width: 0 !important;
}

#signupFields > .row:nth-child(1) input#f_first,
#signupFields > .row:nth-child(1) input#f_last {
  width: 100% !important;
  min-width: 0 !important;
  height: 54px !important;
  text-align: center !important;
  direction: rtl !important;
  font-weight: 700 !important;
  font-size: 16px !important;
  line-height: normal !important;
  padding: 0 !important;
  display: grid !important;
  place-items: center !important;
  place-content: center !important;
}

#signupFields > .row:nth-child(1) input#f_first::placeholder,
#signupFields > .row:nth-child(1) input#f_last::placeholder {
  text-align: center !important;
  font-weight: 600 !important;
  font-size: 15px !important;
  color: rgba(255,255,255,0.6) !important;
  opacity: 1 !important;
  width: 100% !important;
  margin: 0 auto !important;
  position: relative !important;
  left: 0 !important;
  right: 0 !important;
}

#signupFields > .row:nth-child(1) .field label {
  width: 100% !important;
  text-align: right !important;
}
</style>
</head>
<body>
<main class="shell">
<section class="card">
<header class="brand">
<div class="mark" aria-label="G">G</div>
<h1>GABO <span>LIVE</span></h1>
<p>عالمك... بلحظتك</p>
</header>

<div class="tabs">
<button id="tabLogin" class="on" type="button">تسجيل دخول</button>
<button id="tabSignup" type="button">إنشاء حساب</button>
</div>

<form id="authForm" novalidate>
<div id="loginFields">
<div class="field"><label>البريد الإلكتروني</label><input id="l_email" type="email" placeholder="example@gmail.com" dir="ltr"><div class="fieldErr" id="l_emailErr"></div></div>
<div class="field"><label>كلمة المرور</label><div class="input-wrap"><input id="f_loginPass" type="password" placeholder="أدخل كلمة المرور"><button class="pass-toggle" type="button" data-toggle="f_loginPass">إظهار</button></div><div class="fieldErr" id="l_passErr"></div></div>
<button class="forgot" id="forgotBtn" type="button">نسيت كلمة المرور؟</button>
</div>

<div id="signupFields" hidden>
<div class="row signup-row signup-name-row">
<div class="field"><label>الاسم الأول</label><input id="f_first" type="text" placeholder="اسمك"><div class="fieldErr" id="f_firstErr"></div></div>
<div class="field"><label>اللقب</label><input id="f_last" type="text" placeholder="اللقب"><div class="fieldErr" id="f_lastErr"></div></div>
</div>
<div class="field signup-email"><label>البريد الإلكتروني</label><input id="f_email" type="email" placeholder="example@gmail.com" dir="ltr"><div class="fieldErr" id="f_emailErr"></div></div>
<div class="signup-row signup-password-row">
<div class="field"><label>كلمة المرور</label><div class="input-wrap"><input id="f_pass" type="password" placeholder="6 أحرف على الأقل"><button class="pass-toggle" type="button" data-toggle="f_pass">إظهار</button></div><div class="fieldErr" id="f_passErr"></div></div>
<div class="field"><label>تأكيد كلمة المرور</label><div class="input-wrap"><input id="f_confirm" type="password" placeholder="أعد كتابة كلمة المرور"><button class="pass-toggle" type="button" data-toggle="f_confirm">إظهار</button></div><div class="fieldErr" id="f_confirmErr"></div></div>
</div>
<div class="field signup-country">
<label>الدولة</label>
<div class="country-wrap">
<select id="f_country" class="country-native-select"><option value="">اختر الدولة</option></select>
<button id="countryPicker" class="country-trigger" type="button"><span id="countryChosen">اختر الدولة</span> ▾</button>
<div class="country-menu" id="countryMenu"><input class="country-search" id="countrySearch" type="search" placeholder="ابحث عن دولة"><div class="country-options" id="countryOptions"></div><div class="country-empty" id="countryEmpty">لا توجد دولة بهذا الاسم</div></div>
</div>
<div class="fieldErr" id="f_countryErr"></div>
</div>
</div>

<button class="main-btn" id="mainBtn" type="submit">تسجيل دخول</button>
</form>

<div class="msg" id="msg"></div>
<div class="divider">أو المتابعة باستخدام</div>
<div class="social-row">
<button class="social-btn" id="googleBtn" type="button"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"> Google</button>
<button class="social-btn" id="appleBtn" type="button"><span class="apple-icon"></span> Apple</button>
</div>

<label class="consent" for="termsConsent"><input id="termsConsent" type="checkbox"><span>لقد قرأت ووافقت على <a href="/terms.html" target="_blank">شروط الخدمة</a>، <a href="/privacy.html" target="_blank">سياسة الخصوصية</a></span></label>
<div class="consentErr" id="consentErr">يجب الموافقة على الشروط والسياسات أولاً</div>
<p class="legal">GABO LIVE — تواصل، شارك، وعِش اللحظة.</p>
</section>
</main>

<script type="module">
import { getSouthArabiaFlag, getCountryRegistry } from '/assets/country-flags.js';
const SOUTH_FLAG = await getSouthArabiaFlag();
let mode='login', auth=null, db=null, authFns=null, storeFns=null, socialBusy=false;
const $=id=>document.getElementById(id);
const msg=$('msg'), mainBtn=$('mainBtn');
function setMessage(t,type=''){msg.textContent=t||'';msg.className='msg '+type}
function clearErrors(){document.querySelectorAll('.fieldErr').forEach(el=>{el.textContent='';el.classList.remove('show')});$('consentErr').classList.remove('show');setMessage('')}
function requireConsent(){if($('termsConsent').checked) return true; $('consentErr').classList.add('show'); setMessage('وافق على الشروط والسياسات أولاً','e'); return false;}
function setMode(next){mode=next; $('tabLogin').classList.toggle('on',mode==='login'); $('tabSignup').classList.toggle('on',mode==='signup'); $('loginFields').hidden=mode!=='login'; $('signupFields').hidden=mode!=='signup'; mainBtn.textContent=mode==='login'?'تسجيل دخول':'إنشاء حساب'; clearErrors();}
$('tabLogin').addEventListener('click',()=>setMode('login')); $('tabSignup').addEventListener('click',()=>setMode('signup'));
document.querySelectorAll('[data-toggle]').forEach(b=>{b.addEventListener('click',()=>{const i=$(b.dataset.toggle); i.type=i.type==='password'?'text':'password'; b.textContent=i.type==='password'?'إظهار':'إخفاء';})});

// أعلام الدول: رموز Emoji للدول، مع صورة علم الجنوب العربي المخصصة
function countryEmoji(code){
  if(!/^[a-z]{2}$/i.test(code)) return '🏳️';
  return [...code.toUpperCase()].map(ch=>String.fromCodePoint(127397+ch.charCodeAt(0))).join('');
}
const countries=(await getCountryRegistry()).map(c=>({...c,emoji:c.code==='south-arabia'?'':countryEmoji(c.code),flag:c.code==='south-arabia'?SOUTH_FLAG:c.flag}));
function makeCountryFlag(country){
  if(country.code==='south-arabia'){
    const img=document.createElement('img');
    img.src=country.flag;
    img.alt='علم الجنوب العربي';
    img.className='country-flag-image';
    return img;
  }
  const flag=document.createElement('span');
  flag.className='country-flag-emoji';
  flag.textContent=country.emoji||'🏳️';
  flag.setAttribute('aria-hidden','true');
  return flag;
}
function fillCountries(){
  const select=$('f_country'), options=$('countryOptions');
  countries.forEach(country=>{
    const o=document.createElement('option');
    o.value=country.code;
    o.textContent=(country.code==='south-arabia'?'🏴':country.emoji)+' '+country.name;
    select.appendChild(o);
    const item=document.createElement('button');
    item.type='button';
    item.className='country-option';
    item.dataset.name=country.name;
    item.append(makeCountryFlag(country));
    const name=document.createElement('span');
    name.textContent=country.name;
    item.append(name);
    item.addEventListener('click',()=>{
      select.value=country.code;
      const chosen=$('countryChosen');
      chosen.replaceChildren(makeCountryFlag(country),document.createTextNode(country.name));
      // عند اختيار أي دولة، امسح البحث حتى تظهر القائمة كاملة عند فتحها مرة أخرى.
      $('countrySearch').value='';
      options.querySelectorAll('.country-option').forEach(option=>{option.hidden=false;});
      $('countryEmpty').classList.remove('show');
      $('countryMenu').classList.remove('open');
    });
    options.appendChild(item);
  });
}
fillCountries();
function filterCountryOptions(query=''){
  const q=query.trim().toLocaleLowerCase('ar');
  let count=0;
  $('countryOptions').querySelectorAll('.country-option').forEach(item=>{
    const show=item.dataset.name.toLocaleLowerCase('ar').includes(q);
    item.hidden=!show;
    if(show) count++;
  });
  $('countryEmpty').classList.toggle('show',count===0);
}
$('countryPicker').addEventListener('click',()=>{
  const menu=$('countryMenu');
  const willOpen=!menu.classList.contains('open');
  if(willOpen){
    // كل مرة تفتح فيها القائمة ابدأ بعرض جميع الدول، حتى بعد اختيار الجنوب العربي.
    $('countrySearch').value='';
    filterCountryOptions('');
  }
  menu.classList.toggle('open',willOpen);
});
$('countrySearch').addEventListener('input',e=>filterCountryOptions(e.target.value));
document.addEventListener('click',e=>{if(!e.target.closest('.country-wrap')) $('countryMenu').classList.remove('open');});

function errorText(code){const map={'auth/email-already-in-use':'هذا البريد مسجل من قبل','auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة','auth/wrong-password':'كلمة المرور غير صحيحة','auth/user-not-found':'الحساب غير موجود','auth/weak-password':'كلمة المرور ضعيفة','auth/invalid-email':'البريد غير صحيح','auth/network-request-failed':'تحقق من اتصال الإنترنت','auth/popup-blocked':'المتصفح منع النافذة - سيتم استخدام طريقة أخرى','auth/popup-closed-by-user':'أغلقت النافذة','auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً','auth/unauthorized-domain':'النطاق غير مصرح به','auth/operation-not-allowed':'طريقة الدخول غير مفعّلة','auth/account-exists-with-different-credential':'البريد مرتبط بطريقة دخول أخرى'}; return map[code]||code;}

async function saveUserProfile(user,extra={}){const ref=storeFns.doc(db,'users',user.uid); await storeFns.setDoc(ref,{uid:user.uid,email:user.email||null,name:user.displayName||user.email?.split('@')[0]||'مستخدم',displayName:user.displayName||user.email?.split('@')[0]||'مستخدم',photo:user.photoURL||'',photoURL:user.photoURL||'',createdAt:storeFns.serverTimestamp(),banned:false,...extra},{merge:true});}

// === تهيئة Firebase - FIXED ===
async function initialize(){
  try{
    const config=await import('/firebase-config.js');
    auth=config.auth; db=config.db; await config.authReady;
    authFns=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    storeFns=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    
    // *** هذا هو حل اللوب ***
    // نعالج الرجوع من Google Redirect قبل أي شي
    try{
      const redirectResult = await authFns.getRedirectResult(auth);
      if(redirectResult && redirectResult.user){
        setMessage('تم تسجيل الدخول، جاري تحويلك...','ok');
        try{ await saveUserProfile(redirectResult.user); }
        catch(profileError){ console.error('Profile save failed after redirect sign-in:',profileError); }
        location.replace('/app/');
        return;
      }
    }catch(e){ console.log('redirect check', e); }

    // لو المستخدم مسجل دخول أصلاً حوله
    authFns.onAuthStateChanged(auth, async (user)=>{
      if(user && !socialBusy){
        // تحقق هل في صفحة تسجيل؟ اذا ايه حوله للرئيسية
        if(location.pathname.includes('login') || location.pathname==='/login.html'){
           location.href='/app/';
        }
      }
    });

  }catch(err){console.error(err); setMessage('فشل تحميل النظام، حدث الصفحة','e');}
}
initialize();

// تسجيل عادي و انشاء حساب
$('authForm').addEventListener('submit', async (e)=>{
  e.preventDefault(); if(!requireConsent()) return; clearErrors();
  if(!auth){ setMessage('النظام لم يتحمل بعد','e'); return; }
  mainBtn.disabled=true;
  try{
    if(mode==='login'){
      const email=$('l_email').value.trim(), pass=$('f_loginPass').value;
      if(!email){ $('l_emailErr').textContent='ادخل البريد'; $('l_emailErr').classList.add('show'); throw '';}
      if(!pass){ $('l_passErr').textContent='ادخل كلمة المرور'; $('l_passErr').classList.add('show'); throw '';}
      const cred=await authFns.signInWithEmailAndPassword(auth,email,pass);
      await saveUserProfile(cred.user); location.href='/app/';
    }else{
      const first=$('f_first').value.trim(), last=$('f_last').value.trim(), email=$('f_email').value.trim(), pass=$('f_pass').value, confirm=$('f_confirm').value, country=$('f_country').value;
      if(!first || !last || !email || !pass || !confirm || !country){ setMessage('اكمل جميع الحقول','e'); throw '';}
      if(pass!==confirm){ $('f_confirmErr').textContent='كلمة المرور غير متطابقة'; $('f_confirmErr').classList.add('show'); throw '';}
      const cred=await authFns.createUserWithEmailAndPassword(auth,email,pass);
      await authFns.updateProfile(cred.user,{displayName:first+' '+last});
      await saveUserProfile(cred.user,{firstName:first,lastName:last,country});
      location.href='/app/';
    }
  }catch(err){ if(err.code) setMessage(errorText(err.code),'e'); mainBtn.disabled=false; }
});

// *** تسجيل Google المصحح - بدون لوب ***
$('googleBtn').addEventListener('click', async ()=>{
  if(socialBusy) return;
  if(!requireConsent()) return;
  if(!auth || !authFns || !storeFns){ setMessage('انتظر حتى يكتمل تحميل تسجيل الدخول ثم حاول مرة أخرى','e'); return; }

  socialBusy=true;
  $('googleBtn').disabled=true;
  setMessage('جاري الاتصال بحساب Google...','');

  try{
    const provider=new authFns.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});

    // استخدم Popup مباشرة حتى لا نعتمد على الرجوع عبر نطاق firebaseapp.com
    // وهذا يتجنب مشكلة Safari/iPhone مع تخزين جلسة Redirect.
    const result=await authFns.signInWithPopup(auth,provider);

    setMessage('تم تسجيل الدخول، جاري فتح الصفحة الرئيسية...','ok');

    // لا نمنع دخول المستخدم إذا تعذر حفظ بيانات الملف الشخصي في Firestore.
    try{ await saveUserProfile(result.user); }
    catch(profileError){ console.error('Profile save failed after Google sign-in:',profileError); }

    location.replace('/app/');
  }catch(err){
    console.error('Google sign-in failed:',err);
    const code=err?.code||'';
    if(code==='auth/popup-blocked' || code==='auth/cancelled-popup-request'){
      setMessage('المتصفح منع نافذة Google. اسمح بالنوافذ المنبثقة لهذا الموقع ثم حاول مرة أخرى.','e');
    }else if(code==='auth/popup-closed-by-user'){
      setMessage('تم إغلاق نافذة Google قبل إكمال تسجيل الدخول.','e');
    }else{
      setMessage(errorText(code)||'تعذر تسجيل الدخول باستخدام Google. حاول مرة أخرى.','e');
    }
    socialBusy=false;
    $('googleBtn').disabled=false;
  }
});

$('appleBtn').addEventListener('click', async ()=>{
  if(socialBusy) return; if(!requireConsent()) return;
  socialBusy=true; setMessage('جاري فتح Apple...','');
  try{
    const provider=new authFns.OAuthProvider('apple.com');
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(isIOS){ await authFns.signInWithRedirect(auth,provider); }
    else{ const result=await authFns.signInWithPopup(auth,provider); await saveUserProfile(result.user); location.href='/app/'; }
  }catch(err){ setMessage(errorText(err.code)||'فشل تسجيل Apple','e'); socialBusy=false; }
});

$('forgotBtn').addEventListener('click', async ()=>{
  const email=$('l_email').value.trim(); if(!email){ setMessage('ادخل بريدك أولاً','e'); return; }
  try{ await authFns.sendPasswordResetEmail(auth,email); setMessage('تم ارسال رابط اعادة التعيين','ok'); }catch(err){ setMessage(errorText(err.code)||'فشل الارسال','e'); }
});
</script>
</body>
</html>
