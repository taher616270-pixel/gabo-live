<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول — GABO LIVE</title>
<link rel="stylesheet" href="/assets/style/style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 5%,rgba(124,58,237,.28),transparent 48%),#08050f;color:#fff;font-family:system-ui;padding:16px}
.login-card{width:min(470px,100%);padding:28px;background:rgba(17,12,29,.92);border:1px solid rgba(196,181,253,.18);border-radius:24px;backdrop-filter:blur(20px)}
.page{display:none}.page.active{display:block}
.input{width:100%;background:#0d0b15;color:#fff;border:1px solid #ffffff22;border-radius:13px;padding:13px;margin:8px 0;outline:none}
.input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px #7c3aed22}
.btn{width:100%;padding:13px;border-radius:13px;border:0;font-weight:800;cursor:pointer;margin-top:10px}
.btn.primary{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff}
.btn.secondary{background:rgba(255,255,255,.06);border:1px solid #ffffff18;color:#fff}
.muted{color:#a6a0b9;font-size:13px}
.brandmark{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#8b5cf6,#4c1d95);margin:0 auto 12px;font-size:24px}
</style>
</head>
<body data-page="login">

<div class="login-card">
<div class="brandmark">✦</div>
<h1 style="text-align:center;margin:0">GABO LIVE</h1>
<p class="muted" style="text-align:center;margin:8px 0 18px">ادخل بحسابك للدخول للمجتمع</p>

<!-- صفحة 1: تسجيل الدخول -->
<div class="page active" id="page-login">
<form id="loginForm">
<input class="input" id="loginEmail" type="email" placeholder="البريد الإلكتروني" required>
<input class="input" id="loginPassword" type="password" placeholder="كلمة السر" required>
<button class="btn primary" type="submit">تسجيل الدخول</button>
</form>
<button class="btn secondary" id="googleLogin">🔵 الدخول بـ Google</button>
<div style="display:flex;justify-content:space-between;margin-top:14px">
<a id="forgotPassword" style="color:#c4b5fd;cursor:pointer;font-size:13px">نسيت كلمة السر؟</a>
<a onclick="showPage('register')" style="color:#c4b5fd;cursor:pointer;font-size:13px">إنشاء حساب جديد</a>
</div>
</div>

<!-- صفحة 2: إنشاء حساب -->
<div class="page" id="page-register">
<form id="registerForm">
<input class="input" id="regEmail" type="email" placeholder="البريد الإلكتروني" required>
<input class="input" id="regPassword" type="password" placeholder="كلمة سر (6 أحرف على الأقل)" required>
<button class="btn primary" id="registerNow" type="button">إنشاء حساب</button>
</form>
<div style="text-align:center;margin-top:14px"><a onclick="showPage('login')" style="color:#aaa3bd;cursor:pointer;font-size:13px">← لديك حساب؟ سجل دخول</a></div>
</div>

<div style="text-align:center;margin-top:20px">
<a href="/" style="color:#aaa3bd;font-size:12px;text-decoration:none">← الرجوع للرئيسية</a>
</div>
</div>

<script>
function showPage(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('page-'+id).classList.add('active');
}
// ربط register form بـ login logic
document.getElementById('registerNow')?.addEventListener('click',()=>{
 const e=document.getElementById('regEmail').value;
 const p=document.getElementById('regPassword').value;
 document.getElementById('loginEmail').value=e;
 document.getElementById('loginPassword').value=p;
 document.getElementById('registerNow').click = null;
 // يحول للـ app.js
 document.querySelector('#page-login #loginEmail')?.dispatchEvent(new Event('input'));
 const evt = new CustomEvent('gabo-register',{detail:{email:e,password:p}});
 document.dispatchEvent(evt);
});
</script>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
