<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090811">
<title>GABO LIVE | تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  color-scheme:dark;
  --bg:#090811;
  --panel:#151222;
  --gold:#e8c77b;
  --purple:#8957f5;
  --text:#fbfaff;
  --muted:#aaa5ba;
  --red:#ff718c;
  --green:#63d9a1;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:20px;
  display:grid;place-items:center;
  background:radial-gradient(ellipse at 50% 0%,rgba(119,73,218,.2),transparent 42%),var(--bg);
  color:var(--text);font-family:Tajawal,Arial,sans-serif
}
.shell{width:100%;max-width:460px}
.card{
  padding:28px;border:1px solid rgba(220,190,255,.13);
  border-radius:25px;
  background:linear-gradient(155deg,#1a162a,#0f0d18);
  box-shadow:0 28px 90px #0008
}
.brand{text-align:center;margin-bottom:25px}
.mark{font-size:75px;font-weight:900;color:var(--gold);line-height:1}
.brand h1{font-family:Arial;font-size:30px;letter-spacing:3px}
.brand h1 span{color:var(--gold)}
.brand p{color:var(--muted)}
.tabs{display:flex;gap:5px;padding:5px;margin-bottom:20px;background:#08070c;border-radius:13px}
.tabs button{
  flex:1;padding:13px;border:0;border-radius:10px;
  background:transparent;color:var(--muted);
  font-family:inherit;font-weight:800;cursor:pointer
}
.tabs button.on{background:#30204d;color:var(--gold)}
.field{margin-bottom:15px}
label{display:block;margin-bottom:7px;font-weight:700;font-size:13px}
input{
  width:100%;height:50px;padding:0 13px;
  border:1px solid #ffffff20;border-radius:12px;
  background:#08070c;color:white;font:inherit;outline:none
}
input:focus{border-color:var(--purple)}
input[dir=ltr]{text-align:left}
.input-wrap{position:relative}
.pass-toggle{
  position:absolute;left:10px;top:12px;
  border:0;background:none;color:var(--gold);cursor:pointer
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.forgot{
  display:block;margin:0 0 12px auto;border:0;
  background:none;color:var(--gold);font:inherit;cursor:pointer
}
.main-btn,.social-btn{
  width:100%;min-height:50px;margin-top:10px;
  border-radius:13px;font:inherit;font-weight:800;cursor:pointer
}
.main-btn{
  color:var(--gold);border:1px solid #e8c77b88;
  background:linear-gradient(110deg,#08070c,#49306f)
}
.social-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--gold);border:1px solid #e8c77b55;
  background:linear-gradient(110deg,#08080b,#241936)
}
.social-btn img{width:20px;height:20px}
.apple-icon{font-size:22px}
button:disabled{opacity:.55}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:#ffffff20}
.msg{text-align:center;min-height:22px;margin-top:12px;font-size:13px;color:var(--muted)}
.msg.e{color:var(--red)}
.msg.ok{color:var(--green)}
.fieldErr{display:none;color:var(--red);font-size:12px;margin-top:5px}
.fieldErr.show{display:block}
.consent{display:flex;gap:9px;margin-top:18px;font-size:12px;line-height:1.8}
.consent input{width:18px;height:18px;flex:0 0 18px;margin:3px 0}
.consent a{color:#b18aff}
.consentErr{display:none;color:var(--red);font-size:12px}
.consentErr.show{display:block}
.legal{text-align:center;color:#827c91;font-size:11px;margin-top:20px}
.country-wrap{position:relative}
.country-native-select{display:none}
.country-trigger{
  width:100%;height:50px;padding:0 12px;
  text-align:right;color:white;background:#08070c;
  border:1px solid #ffffff20;border-radius:12px;font:inherit
}
.country-menu{
  display:none;position:absolute;z-index:10;top:55px;
  right:0;left:0;padding:8px;background:#151222;
  border:1px solid #e8c77b55;border-radius:12px
}
.country-menu.open{display:block}
.country-search{margin-bottom:7px}
.country-options{max-height:220px;overflow:auto}
.country-option{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:10px;border:0;background:transparent;color:white;
  text-align:right;font:inherit
}
.country-option img{width:25px;height:18px}
.country-option[hidden]{display:none}
.country-empty{display:none;padding:10px}
.country-empty.show{display:block}
@media(max-width:420px){.card{padding:19px}.row{gap:7px}}
</style>
</head>

<body>
<main class="shell">
<section class="card">

<header class="brand">
<div class="mark">G</div>
<h1>GABO <span>LIVE</span></h1>
<p>عالمك... بلحظتك</p>
</header>

<div class="tabs">
<button id="tabLogin" class="on" type="button">تسجيل دخول</button>
<button id="tabSignup" type="button">إنشاء حساب</button>
</div>

<form id="authForm" novalidate>

<div id="loginFields">
<div class="field">
<label for="l_email">البريد الإلكتروني</label>
<input id="l_email" type="email" placeholder="example@gmail.com" dir="ltr">
<div class="fieldErr" id="l_emailErr"></div>
</div>

<div class="field">
<label for="f_loginPass">كلمة المرور</label>
<div class="input-wrap">
<input id="f_loginPass" type="password" placeholder="أدخل كلمة المرور">
<button class="pass-toggle" type="button" data-toggle="f_loginPass">إظهار</button>
</div>
<div class="fieldErr" id="l_passErr"></div>
</div>

<button class="forgot" id="forgotBtn" type="button">نسيت كلمة المرور؟</button>
</div>

<div id="signupFields" hidden>

<div class="row">
<div class="field">
<label for="f_first">الاسم الأول</label>
<input id="f_first" type="text" placeholder="اسمك">
<div class="fieldErr" id="f_firstErr"></div>
</div>

<div class="field">
<label for="f_last">اللقب</label>
<input id="f_last" type="text" placeholder="اللقب">
<div class="fieldErr" id="f_lastErr"></div>
</div>
</div>

<div class="field">
<label for="f_email">البريد الإلكتروني</label>
<input id="f_email" type="email" placeholder="example@gmail.com" dir="ltr">
<div class="fieldErr" id="f_emailErr"></div>
</div>

<div class="field">
<label for="f_pass">كلمة المرور</label>
<div class="input-wrap">
<input id="f_pass" type="password" placeholder="6 أحرف على الأقل">
<button class="pass-toggle" type="button" data-toggle="f_pass">إظهار</button>
</div>
<div class="fieldErr" id="f_passErr"></div>
</div>

<div class="field">
<label for="f_confirm">تأكيد كلمة المرور</label>
<div class="input-wrap">
<input id="f_confirm" type="password" placeholder="أعد كتابة كلمة المرور">
<button class="pass-toggle" type="button" data-toggle="f_confirm">إظهار</button>
</div>
<div class="fieldErr" id="f_confirmErr"></div>
</div>

<div class="field">
<label for="countryPicker">الدولة</label>
<div class="country-wrap">

<select id="f_country" class="country-native-select">
<option value="">اختر الدولة</option>
</select>

<button id="countryPicker" class="country-trigger" type="button">
<span id="countryChosen">اختر الدولة</span> ▾
</button>

<div class="country-menu" id="countryMenu">
<input class="country-search" id="countrySearch" type="search" placeholder="ابحث عن دولة">
<div class="country-options" id="countryOptions"></div>
<div class="country-empty" id="countryEmpty">لا توجد دولة بهذا الاسم</div>
</div>
</div>
<div class="fieldErr" id="f_countryErr"></div>
</div>

</div>

<button class="main-btn" id="mainBtn" type="submit">تسجيل دخول</button>
</form>

<div class="msg" id="msg" role="status" aria-live="polite"></div>

<div class="divider">أو المتابعة باستخدام</div>

<button class="social-btn" id="googleBtn" type="button">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">
المتابعة باستخدام Google
</button>

<button class="social-btn" id="appleBtn" type="button">
<span class="apple-icon"></span>
المتابعة باستخدام Apple
</button>

<label class="consent" for="termsConsent">
<input id="termsConsent" type="checkbox">
<span>
لقد قرأت ووافقت على
<a href="/terms.html" target="_blank">شروط الخدمة</a>،
<a href="/privacy.html" target="_blank">سياسة الخصوصية</a>،
<a href="/guidelines.html" target="_blank">إرشادات السلوك</a>
</span>
</label>

<div class="consentErr" id="consentErr">يجب الموافقة على الشروط والسياسات أولاً</div>

<p class="legal">GABO LIVE — تواصل، شارك، وعِش اللحظة.</p>

</section>
</main>

<script type="module">
import { getSouthArabiaFlag, getCountryRegistry } from '/assets/country-flags.js';

const SOUTH_FLAG = await getSouthArabiaFlag();

let mode = 'login';
let auth = null;
let db = null;
let authFns = null;
let storeFns = null;
let initError = null;
let accountCreating = false;
let socialBusy = false;

const $ = id => document.getElementById(id);
const msg = $('msg');
const mainBtn = $('mainBtn');

function setMessage(text,type='') {
  msg.textContent = text || '';
  msg.className = 'msg ' + type;
}

function clearErrors() {
  document.querySelectorAll('.fieldErr').forEach(el => {
    el.textContent = '';
    el.classList.remove('show');
  });
  $('consentErr').classList.remove('show');
  setMessage('');
}

function fieldError(inputId,errorId,text) {
  $(inputId).classList.add('bad');
  $(errorId).textContent = text;
  $(errorId).classList.add('show');
}

function requireConsent() {
  if ($('termsConsent').checked) return true;

  $('consentErr').classList.add('show');
  setMessage('وافق على الشروط والسياسات أولاً','e');
  $('termsConsent').focus();
  return false;
}

function setMode(next) {
  mode = next;

  $('tabLogin').classList.toggle('on',mode === 'login');
  $('tabSignup').classList.toggle('on',mode === 'signup');

  $('loginFields').hidden = mode !== 'login';
  $('signupFields').hidden = mode !== 'signup';

  mainBtn.textContent = mode === 'login' ? 'تسجيل دخول' : 'إنشاء حساب';

  clearErrors();
}

$('tabLogin').addEventListener('click',() => setMode('login'));
$('tabSignup').addEventListener('click',() => setMode('signup'));

document.querySelectorAll('[data-toggle]').forEach(button => {
  button.addEventListener('click',() => {
    const input = $(button.dataset.toggle);
    input.type = input.type === 'password' ? 'text' : 'password';
    button.textContent = input.type === 'password' ? 'إظهار' : 'إخفاء';
  });
});

/* قائمة الدول */
const countries = (await getCountryRegistry()).map(c => ({
  ...c,
  flag: c.code === 'south-arabia' ? SOUTH_FLAG : c.flag
}));

function fillCountries() {
  const select = $('f_country');
  const options = $('countryOptions');

  countries.forEach(country => {
    const option = document.createElement('option');
    option.value = country.code;
    option.textContent = country.name;
    select.appendChild(option);

    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'country-option';
    item.dataset.code = country.code;
    item.dataset.name = country.name;

    const flag = document.createElement('img');
    flag.src = country.flag;
    flag.alt = '';

    const name = document.createElement('span');
    name.textContent = country.name;

    item.append(flag,name);

    item.addEventListener('click',() => {
      select.value = country.code;
      $('countryChosen').textContent = country.name;
      $('countryMenu').classList.remove('open');
    });

    options.appendChild(item);
  });
}

fillCountries();

$('countryPicker').addEventListener('click',() => {
  $('countryMenu').classList.toggle('open');
});

$('countrySearch').addEventListener('input',event => {
  const q = event.target.value.toLowerCase();
  let count = 0;

  document.querySelectorAll('.country-option').forEach(item => {
    const show = item.dataset.name.toLowerCase().includes(q);
    item.hidden = !show;
    if (show) count++;
  });

  $('countryEmpty').classList.toggle('show',count === 0);
});

document.addEventListener('click',event => {
  if (!event.target.closest('.country-wrap')) {
    $('countryMenu').classList.remove('open');
  }
});

/* رسائل أخطاء Firebase */
function errorText(code) {
  const map = {
    'auth/email-already-in-use':'هذا البريد مسجل من قبل',
    'auth/invalid-credential':'البريد أو كلمة المرور غير صحيحة',
    'auth/wrong-password':'كلمة المرور غير صحيحة',
    'auth/user-not-found':'الحساب غير موجود',
    'auth/weak-password':'كلمة المرور ضعيفة',
    'auth/invalid-email':'البريد الإلكتروني غير صحيح',
    'auth/network-request-failed':'تحقق من اتصال الإنترنت',
    'auth/popup-blocked':'المتصفح منع نافذة تسجيل الدخول',
    'auth/popup-closed-by-user':'أغلقت نافذة تسجيل الدخول قبل إكمال العملية',
    'auth/too-many-requests':'محاولات كثيرة، حاول لاحقاً',
    'auth/unauthorized-domain':'النطاق غير مصرح به في Firebase',
    'auth/operation-not-allowed':'طريقة الدخول غير مفعّلة في Firebase',
    'auth/account-exists-with-different-credential':'هذا البريد مرتبط بطريقة دخول أخرى',
    'auth/cancelled-popup-request':'تم إلغاء طلب تسجيل الدخول السابق'
  };

  return map[code] || '';
}

/* حفظ بيانات المستخدم */
async function saveUserProfile(user,extra={}) {
  const ref = storeFns.doc(db,'users',user.uid);

  await storeFns.setDoc(ref,{
    uid:user.uid,
    email:user.email || null,
    name:user.displayName || user.email?.split('@')[0] || 'مستخدم',
    displayName:user.displayName || user.email?.split('@')[0] || 'مستخدم',
    photo:user.photoURL || '',
    photoURL:user.photoURL || '',
    createdAt:storeFns.serverTimestamp(),
    banned:false,
    ...extra
  },{merge:true});
}

/* تهيئة Firebase */
async function initialize() {
  try {
    const config = await import('/firebase-config.js');

    auth = config.auth;
    db = config.db;

    await config.authReady;

    authFns = await import(
      'https://www.gstatic.com/firebasejs/10.12.2
