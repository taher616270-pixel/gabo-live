<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GABO LIVE - دخول</title>
<style>
:root{--bg:#08070d;--card:#13111c;--b:#232131;--v:#7c3aed;--t:#fff;--m:#a1a1aa;--err:#fb7185;--ok:#4ade80}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--t);font-family:system-ui,-apple-system;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid rgba(124,58,237,.25);border-radius:24px;padding:26px}
.logo{text-align:center;margin-bottom:22px}
.logo h1{font-size:34px;letter-spacing:.15em;font-weight:900}
.logo h1 span{color:var(--v)}
.tabs{display:flex;background:#0e0c16;border-radius:12px;padding:4px;margin-bottom:20px}
.tabs button{flex:1;padding:11px;border:none;border-radius:8px;background:transparent;color:var(--m);cursor:pointer;font-weight:700;transition:.2s}
.tabs button.on{background:var(--v);color:#fff}
label{display:block;margin:12px 0 6px;color:var(--m);font-size:13px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--b);background:#0e0d14;color:#fff;outline:none;font-size:14px;transition:.2s}
input:focus{border-color:var(--v)}
input.bad{border-color:var(--err)!important;background:rgba(251,113,133,.08)}
.row{display:flex;gap:10px}
.row>div{flex:1}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--v);color:#fff;font-weight:800;font-size:16px;cursor:pointer;margin-top:16px;transition:.2s}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ghost{background:#fff;color:#000;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.apple{background:#000;border:1px solid var(--b);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--m);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--b)}
.msg{text-align:center;font-size:13px;margin-top:12px;min-height:18px;line-height:1.4}
.msg.e{color:var(--err)} .msg.ok{color:var(--ok)}
.fieldErr{font-size:11px;color:var(--err);margin-top:4px;display:none}
.fieldErr.show{display:block}
#signupFields{display:none}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><h1>GABO <span>LIVE</span></h1></div>
  <div class="tabs">
    <button id="tabLogin" class="on">تسجيل دخول</button>
    <button id="tabSignup">إنشاء حساب</button>
  </div>

  <!-- LOGIN -->
  <div id="loginFields">
    <label>البريد الإلكتروني</label>
    <input id="l_email" type="email" placeholder="example@gmail.com" dir="ltr" autocomplete="email">
    <div class="fieldErr" id="l_emailErr"></div>
    <label>كلمة المرور</label>
    <input id="f_loginPass" type="password" placeholder="••••••••" autocomplete="current-password">
    <div class="fieldErr" id="l_passErr"></div>
  </div>

  <!-- SIGNUP -->
  <div id="signupFields">
    <div class="row">
      <div>
        <label>الاسم الأول</label>
        <input id="f_first" type="text" placeholder="" autocomplete="given-name">
        <div class="fieldErr" id="f_firstErr"></div>
      </div>
      <div>
        <label>اللقب</label>
        <input id="f_last" type="text" placeholder="" autocomplete="family-name">
        <div class="fieldErr" id="f_lastErr"></div>
      </div>
    </div>
    <label>البريد الإلكتروني</label>
    <input id="f_email" type="email" placeholder="example@gmail.com" dir="ltr" autocomplete="email">
    <div class="fieldErr" id="f_emailErr"></div>
    <label>كلمة المرور</label>
    <input id="f_pass" type="password" placeholder="••••••••" autocomplete="new-password">
    <div class="fieldErr" id="f_passErr"></div>
    <label>تأكيد كلمة المرور</label>
    <input id="f_confirm" type="password" placeholder="••••••••" autocomplete="new-password">
    <div class="fieldErr" id="f_confirmErr"></div>
  </div>

  <button class="btn" id="mainBtn">تسجيل دخول</button>
  <div class="msg" id="msg"></div>
  <div class="divider">أو</div>
  <button class="btn ghost" id="googleBtn"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google</button>
  <button class="btn apple" id="appleBtn" style="margin-top:10px"> Apple</button>
</div>

<script type="module">
import { auth, db } from '/firebase-config.js';
import { signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

let mode='login';
let googleLoading=false;
const $=s=>document.querySelector(s);
const msg=$('#msg'), mainBtn=$('#mainBtn');
const tabL=$('#tabLogin'), tabS=$('#tabSignup');
const loginF=$('#loginFields'), signupF=$('#signupFields');

function setMode(m){
  mode=m;
  tabL.classList.toggle('on',m==='login');
  tabS.classList.toggle('on',m==='signup');
  loginF.style.display=m==='login'?'block':'none';
  signupF.style.display=m==='signup'?'block':'none';
  mainBtn.textContent=m==='login'?'تسجيل دخول':'إنشاء حساب';
  clearErr();
}
function clearErr(){
  document.querySelectorAll('input').forEach(i=>i.classList.remove('bad'));
  document.querySelectorAll('.fieldErr').forEach(e=>{e.textContent=''; e.classList.remove('show')});
  msg.textContent=''; msg.className='msg';
}
function showFieldErr(inp, err, txt){
  $(inp).classList.add('bad');
  $(err).textContent=txt;
  $(err).classList.add('show');
}

tabL.onclick=()=>setMode('login');
tabS.onclick=()=>setMode('signup');

async function ensureUserDoc(u, fullName=''){
  const ref=doc(db,'users',u.uid);
  const snap=await getDoc(ref).catch(()=>null);
  if(!snap || !snap.exists()){
    await setDoc(ref,{
      email:u.email,
      name:fullName || u.displayName || u.email.split('@')[0],
      photo:u.photoURL||'',
      uid:u.uid,
      createdAt:serverTimestamp(),
      banned:false
    });
  }
}

onAuthStateChanged(auth, async u=>{
  if(u){
    try{await ensureUserDoc(u)}catch{}
    location.replace('/app/');
  }
});

function translateError(code){
  switch(code){
    case 'auth/email-already-in-use': return 'هذا الإيميل مسجل من قبل، سجل دخول';
    case 'auth/invalid-credential':
    case 'auth/wrong-password': return 'الإيميل أو كلمة المرور خطأ';
    case 'auth/user-not-found': return 'الحساب غير موجود، أنشئ حساب جديد';
    case 'auth/weak-password': return 'كلمة المرور ضعيفة - 6 أحرف على الأقل';
    case 'auth/invalid-email': return 'صيغة الإيميل غير صحيحة';
    case 'auth/network-request-failed': return 'مشكلة في الشبكة، طفّ مانع الإعلانات وحاول';
    case 'auth/popup-blocked': return 'اسمح بالنوافذ المنبثقة للمتصفح';
    case 'auth/cancelled-popup-request': return '';
    default: return '';
  }
}

mainBtn.onclick=async()=>{
  clearErr();
  if(mode==='login'){
    const email=$('#l_email').value.trim();
    const pass=$('#f_loginPass').value;
    if(!email){ showFieldErr('#l_email','#l_emailErr','اكتب الإيميل'); return; }
    if(!pass){ showFieldErr('#f_loginPass','#l_passErr','اكتب كلمة المرور'); return; }
    mainBtn.disabled=true; mainBtn.textContent='جاري...';
    try{
      await signInWithEmailAndPassword(auth,email,pass);
    }catch(e){
      mainBtn.disabled=false; mainBtn.textContent='تسجيل دخول';
      msg.textContent=translateError(e.code) || 'خطأ: '+e.code;
      msg.className='msg e';
    }
  }else{
    const first=$('#f_first').value.trim();
    const last=$('#f_last').value.trim();
    const email=$('#f_email').value.trim();
    const pass=$('#f_pass').value;
    const confirm=$('#f_confirm').value;
    let ok=true;
    if(first.length<2){ showFieldErr('#f_first','#f_firstErr','الاسم الأول مطلوب'); ok=false; }
    if(last.length<2){ showFieldErr('#f_last','#f_lastErr','اللقب مطلوب'); ok=false; }
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showFieldErr('#f_email','#f_emailErr','الإيميل غير صحيح'); ok=false; }
    if(pass.length<6){ showFieldErr('#f_pass','#f_passErr','6 أحرف على الأقل'); ok=false; }
    if(pass!==confirm){ showFieldErr('#f_confirm','#f_confirmErr','غير مطابقة'); ok=false; }
    if(!ok) return;
    mainBtn.disabled=true; mainBtn.textContent='جاري...';
    try{
      const cred=await createUserWithEmailAndPassword(auth,email,pass);
      const fullName=first+' '+last;
      await updateProfile(cred.user,{displayName:fullName});
      await ensureUserDoc(cred.user,fullName);
      msg.textContent='تم إنشاء الحساب!'; msg.className='msg ok';
    }catch(e){
      mainBtn.disabled=false; mainBtn.textContent='إنشاء حساب';
      const t=translateError(e.code);
      if(e.code==='auth/email-already-in-use'){
        msg.textContent=t; msg.className='msg e';
        setTimeout(()=>setMode('login'),1200);
      }else{
        msg.textContent=t || e.message; msg.className='msg e';
      }
    }
  }
};

$('#googleBtn').onclick=async()=>{
  if(googleLoading) return;
  googleLoading=true;
  const btn=$('#googleBtn'); btn.disabled=true;
  msg.textContent='جاري فتح Google...'; msg.className='msg';
  try{
    const p=new GoogleAuthProvider();
    p.setCustomParameters({prompt:'select_account'});
    const r=await signInWithPopup(auth,p);
    await ensureUserDoc(r.user);
  }catch(e){
    const t=translateError(e.code);
    if(t) { msg.textContent=t; msg.className='msg e'; }
    else { msg.textContent=''; }
  }finally{
    googleLoading=false; btn.disabled=false;
  }
};

$('#appleBtn').onclick=()=>{
  msg.textContent='Apple قريباً - استخدم Google'; msg.className='msg e';
};
</script>
</body>
</html>
