<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090811">
<title>GABO LIVE | استعادة كلمة المرور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#e8c77b;--purple:#8957f5;--text:#fbfaff;--muted:#aaa5ba;--red:#ff718c;--green:#63d9a1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;padding:20px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(119,73,218,.2),transparent 42%),#090811;color:var(--text);font-family:Tajawal,Arial,sans-serif}
.card{width:100%;max-width:430px;padding:clamp(22px,6vw,34px);border:1px solid #dcbeff22;border-radius:24px;background:linear-gradient(155deg,#1a162a,#0f0d18);box-shadow:0 28px 90px #0008}
.logo{text-align:center;color:var(--gold);font-size:48px;font-weight:900;line-height:1}
h1{text-align:center;font-size:25px;margin:12px 0 8px}
p{color:var(--muted);font-size:14px;line-height:1.8;text-align:center;margin:0 0 22px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
input{width:100%;height:49px;padding:0 13px;border:1px solid #ffffff25;border-radius:12px;background:#08070c;color:#fff;font:inherit;text-align:left;outline:none}
input:focus{border-color:var(--purple)}
.code-boxes{display:flex;direction:ltr;justify-content:center;gap:9px;margin:12px 0 8px}
input.code-box{flex:0 1 48px;width:48px;min-width:0;height:52px;padding:0;border:1.5px solid #ffffff55;border-radius:10px;background:#08070c;color:#fff;font-family:Arial,sans-serif;font-size:23px;font-weight:800;text-align:center;direction:ltr}
input.code-box:focus{border-color:var(--gold);box-shadow:0 0 0 2px #e8c77b22}
@media(max-width:360px){.code-boxes{gap:6px}input.code-box{flex-basis:42px;width:42px;height:48px}}
input.invalid{border-color:var(--red)}
.error{display:none;color:var(--red);font-size:12px;margin-top:6px}
.error.show{display:block}
.message{min-height:22px;margin-top:12px;text-align:center;font-size:13px;color:var(--muted)}
.message.error{color:var(--red)}.message.success{color:var(--green)}
button{width:100%;min-height:49px;margin-top:16px;border:1px solid #e8c77b88;border-radius:13px;background:linear-gradient(110deg,#08070c,#49306f);color:var(--gold);font:inherit;font-weight:800;cursor:pointer}
button:disabled{opacity:.55}\nbutton.secondary{margin-top:9px;background:transparent;border-color:#ffffff25;color:var(--muted)}[hidden]{display:none!important}
.back{display:block;margin-top:18px;text-align:center;color:var(--gold);font-size:13px;text-decoration:none}
</style>
</head>
<body>
<main class="card">
<div class="logo">G</div>
<h1>نسيت كلمة المرور؟</h1>
<p>أدخل بريدك الإلكتروني وسنرسل لك رمز تحقق مكوّنًا من 6 أرقام صالحًا لمدة 10 دقائق.</p>
<form id="resetForm" novalidate>
<section id="emailStep">
<label for="email">البريد الإلكتروني</label>
<input id="email" type="email" dir="ltr" autocomplete="email" placeholder="example@gmail.com">
<div class="error" id="emailError"></div>
<button id="sendBtn" type="submit">إرسال كود التحقق</button>
</section>
<section id="codeStep" hidden>
<label for="code">كود التحقق المكوّن من 6 أرقام</label>
<div class="code-boxes" id="codeBoxes" dir="ltr" aria-label="أدخل رمز التحقق المكون من ستة أرقام">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 1">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 2">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 3">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 4">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 5">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 6">
</div>
<input id="code" type="hidden">
<div class="error" id="codeError"></div>
<button id="verifyBtn" type="button">تأكيد الكود</button>
<div class="resend-row"><span id="resendTimer">يمكنك طلب كود جديد بعد 01:00</span><button id="resendBtn" type="button" class="resend-small" hidden>إعادة إرسال الكود</button></div>
</section>
</form>
<div class="message" id="message" role="status" aria-live="polite"></div>
<a class="back" href="/login/">العودة إلى تسجيل الدخول</a>
</main>
<script type="module">
const RESET_API_URL='PASTE_CLOUDFLARE_WORKER_URL_HERE';
const form=document.getElementById('resetForm'),email=document.getElementById('email'),code=document.getElementById('code');
const emailStep=document.getElementById('emailStep'),codeStep=document.getElementById('codeStep');
const emailError=document.getElementById('emailError'),codeError=document.getElementById('codeError');
const message=document.getElementById('message'),sendBtn=document.getElementById('sendBtn'),verifyBtn=document.getElementById('verifyBtn'),resendBtn=document.getElementById('resendBtn'),resendTimer=document.getElementById('resendTimer');
let verifiedEmail='';
let resendInterval=null;
let resendSeconds=60;
const codeInputs=[...document.querySelectorAll('.code-box')];
codeInputs.forEach((box,index)=>{
 box.addEventListener('input',()=>{
  box.value=box.value.replace(/\D/g,'').slice(-1);
  code.value=codeInputs.map(input=>input.value).join('');
  if(box.value && index<5)codeInputs[index+1].focus();
 });
 box.addEventListener('keydown',event=>{
  if(event.key==='Backspace'&&!box.value&&index>0)codeInputs[index-1].focus();
  if(event.key==='ArrowLeft'&&index<5)codeInputs[index+1].focus();
  if(event.key==='ArrowRight'&&index>0)codeInputs[index-1].focus();
 });
 box.addEventListener('paste',event=>{
  const pasted=(event.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
  if(!pasted)return;
  event.preventDefault();
  pasted.split('').forEach((digit,i)=>{if(codeInputs[i])codeInputs[i].value=digit;});
  code.value=codeInputs.map(input=>input.value).join('');
  codeInputs[Math.min(pasted.length,5)].focus();
 });
});
function startResendCountdown(){
 clearInterval(resendInterval);
 resendSeconds=60;
 resendBtn.hidden=true;
 resendBtn.disabled=false;
 resendTimer.textContent='يمكنك إعادة إرسال الكود بعد دقيقة واحدة (01:00)';
 resendInterval=setInterval(()=>{
  resendSeconds--;
  if(resendSeconds<=0){
   clearInterval(resendInterval);
   resendTimer.textContent='';
   resendBtn.hidden=false;
   return;
  }
  const mm=String(Math.floor(resendSeconds/60)).padStart(2,'0');
  const ss=String(resendSeconds%60).padStart(2,'0');
  resendTimer.textContent='يمكنك إعادة إرسال الكود بعد '+mm+':'+ss;
 },1000);
}
function showMessage(text,type=''){message.textContent=text;message.className='message '+type;}
function showError(el,text){el.textContent=text;el.classList.add('show');}
function clearErrors(){for(const el of [emailError,codeError]){el.textContent='';el.classList.remove('show');}showMessage('');}
async function callApi(payload){
 if(RESET_API_URL.includes('PASTE_')) throw new Error('worker_url_missing');
 const response=await fetch(RESET_API_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
 const data=await response.json().catch(()=>({}));
 if(!response.ok) throw new Error(data.error||'request_failed');
 return data;
}
async function sendCode(){
 clearErrors();const value=email.value.trim().toLowerCase();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)){showError(emailError,'صيغة البريد الإلكتروني غير صحيحة');email.focus();return;}
 verifiedEmail=value;
 emailStep.hidden=true;codeStep.hidden=false;code.focus();
 startResendCountdown();
 sendBtn.disabled=true;sendBtn.textContent='جاري إرسال الكود...';
 showMessage('جاري تجهيز كود التحقق وإرساله إلى بريدك الإلكتروني...');
 try{
  await callApi({action:'send',email:value});
  showMessage('إذا كان البريد مرتبطًا بحساب، فسيصلك كود من 6 أرقام. تحقق من الوارد والرسائل غير المرغوب فيها.','success');
 }catch(err){
  const messages={worker_url_missing:'ظهرت صفحة إدخال الكود، لكن خدمة الإرسال لم تُربط بعد.',service_not_configured:'ظهرت صفحة إدخال الكود، لكن إعدادات خدمة الإرسال غير مكتملة.',emailjs_delivery_failed:'تعذر إرسال الكود. تحقق من إعدادات البريد وحاول مجددًا.',please_wait_before_resending:'انتظر دقيقة قبل طلب كود جديد.',origin_not_allowed:'عنوان الموقع غير مسموح له باستخدام خدمة الكود.'};
  showMessage(messages[err.message]||'تعذر إرسال الكود الآن. حاول مرة أخرى.','error');
 }finally{sendBtn.disabled=false;sendBtn.textContent='إرسال كود التحقق';}
}
form.addEventListener('submit',event=>{event.preventDefault();if(!emailStep.hidden)sendCode();});
verifyBtn.addEventListener('click',async()=>{
 clearErrors();const value=code.value.trim();
 if(!/^\d{6}$/.test(value)){showError(codeError,'أدخل الكود المكوّن من 6 أرقام');code.focus();return;}
 verifyBtn.disabled=true;verifyBtn.textContent='جاري التحقق...';
 try{
  await callApi({action:'verify',email:verifiedEmail,code:value});
  showMessage('تم التحقق من الكود بنجاح. خطوة تعيين كلمة المرور الجديدة تحتاج استكمال ربط التحديث الآمن بحساب Firebase.','success');
 }catch(err){
  const messages={code_expired_or_missing:'انتهت صلاحية الكود أو لم يعد متاحًا. اطلب كودًا جديدًا.',wrong_code:'الكود غير صحيح. تأكد من الأرقام وحاول مرة أخرى.',too_many_attempts:'تجاوزت عدد المحاولات. اطلب كودًا جديدًا.'};
  showMessage(messages[err.message]||'تعذر التحقق من الكود. حاول مرة أخرى.','error');
 }finally{verifyBtn.disabled=false;verifyBtn.textContent='تأكيد الكود';}
});
resendBtn.addEventListener('click',async()=>{
 resendBtn.disabled=true;resendBtn.textContent='جاري الإرسال...';showMessage('جاري إرسال كود جديد إلى بريدك الإلكتروني...');
 try{
  await callApi({action:'send',email:verifiedEmail});
  code.value='';codeInputs.forEach(input=>input.value='');
  showMessage('تم طلب كود جديد. تحقق من بريدك الإلكتروني. الكود السابق لم يعد هو المطلوب.','success');
  resendBtn.textContent='إعادة إرسال الكود';
  startResendCountdown();
 }catch(err){
  const messages={please_wait_before_resending:'لم تنتهِ مهلة الانتظار بعد. حاول بعد قليل.',emailjs_delivery_failed:'تعذر إرسال الكود الآن. حاول مرة أخرى.',worker_url_missing:'خدمة إرسال الكود لم تُربط بعد.',service_not_configured:'إعدادات خدمة إرسال الكود غير مكتملة.'};
  showMessage(messages[err.message]||'تعذر إعادة إرسال الكود. حاول مرة أخرى.','error');
  resendBtn.disabled=false;resendBtn.textContent='إعادة إرسال الكود';
 }
});
</script>
</body>
</html>
