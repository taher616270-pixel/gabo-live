<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090811">
<title>GABO LIVE | استعادة كلمة المرور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--gold:#f0d28b;--gold-soft:#c9a95d;--purple:#8d68d8;--purple-bright:#a98ae9;--text:#fffdfd;--muted:#b8b1c7;--red:#ff718c;--green:#63d9a1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100vh;height:100svh;height:100dvh;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;margin:0;padding:0}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 12%,rgba(141,104,216,.18),transparent 48%),radial-gradient(ellipse at 50% 100%,rgba(201,169,93,.07),transparent 42%),#0b0912;color:var(--text);font-family:Tajawal,Arial,sans-serif}
.shell{width:100%;height:100vh;height:100svh;height:100dvh;max-width:100%;padding:0;display:flex;align-items:stretch;justify-content:center}
.card{width:100%;height:100vh;height:100svh;height:100dvh;min-height:100vh;min-height:100dvh;max-height:100vh;max-height:100dvh;max-width:100%;border-radius:0;border:0;display:flex;flex-direction:column;justify-content:center;padding:clamp(12px,4vw,24px);padding-top:max(12px,env(safe-area-inset-top));padding-bottom:max(12px,env(safe-area-inset-bottom));box-sizing:border-box;overflow:hidden;background:linear-gradient(155deg,rgba(28,23,43,.98),rgba(15,12,23,.99));position:relative}
.logo{text-align:center;color:var(--gold);font-size:clamp(40px,15vw,75px);font-weight:900;line-height:.95;margin:0 auto 17px}
h1{text-align:center;font-size:clamp(23px,6.3vw,32px);font-weight:900;letter-spacing:-.4px;margin:8px 0 7px}
p{color:var(--muted);font-size:clamp(13px,3.5vw,15px);line-height:1.8;text-align:center;margin:0 auto 24px;max-width:520px}
label{display:block;font-size:clamp(13px,3.3vw,15px);font-weight:800;margin-bottom:10px;color:#f2edf9}
input{width:100%;height:clamp(44px,11vw,50px)!important;padding:0 12px;border:1px solid rgba(191,169,226,.25);border-radius:15px;background:linear-gradient(145deg,#100d18,#09070f);color:#fff;font:inherit;font-size:16px!important;text-align:left;outline:none;min-width:0}
input:focus{border-color:var(--purple-bright);box-shadow:0 0 0 3px #a98ae926}
input.invalid{border-color:var(--red)}
.row{display:flex;gap:9px;align-items:end;width:100%;margin-bottom:10px}
.row>*{flex:1;min-width:0}
.row .field{margin:0}
.email-row,.send-row{display:block}
.send-row button{margin-top:0}
.code-row{display:block;text-align:right}
.code-entry{width:100%}
.timer-cell{width:100%;flex:1 0 100%;text-align:center;align-self:center;color:var(--muted);font-size:13px;line-height:1.5;margin-top:16px;padding:12px 14px;border:1px solid rgba(169,138,233,.18);border-radius:14px;background:linear-gradient(110deg,#171222,#100d18)}
.code-boxes{display:flex;direction:ltr;justify-content:center;gap:clamp(7px,2.2vw,11px);margin:13px auto 0;max-width:390px}
input.code-box{flex:1 1 0;width:0;min-width:0;height:clamp(50px,12vw,58px)!important;padding:0;border:1.5px solid rgba(169,138,233,.65);border-radius:14px;background:linear-gradient(155deg,#211a30,#100d18);color:#f5d58b;font-family:Arial,sans-serif;font-size:clamp(19px,5vw,24px)!important;font-weight:800;text-align:center;direction:ltr;box-shadow:inset 0 1px 0 #ffffff0b,0 5px 16px #0003}
input.code-box:focus{border-color:var(--gold);box-shadow:0 0 0 3px #e8c77b25}
.resend-row{margin-top:8px;text-align:center}
.resend-small{min-height:38px!important;margin-top:8px!important;padding:5px 16px;width:auto;border-radius:11px;font-size:13px;background:linear-gradient(110deg,#292039,#4c356a);border-color:#a98ae966}
.error{display:none;color:var(--red);font-size:12px;margin-top:5px}
.error.show{display:block}
.message{min-height:20px;margin-top:12px;text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
.message.error{color:var(--red)}.message.success{color:var(--green)}
button{width:100%;min-height:clamp(48px,12vw,56px);margin-top:16px;border:1px solid rgba(240,210,139,.75);border-radius:15px;background:linear-gradient(105deg,#171020 0%,#342344 48%,#684a91 100%);color:var(--gold);font:inherit;font-size:clamp(14px,3.7vw,16px);font-weight:900;cursor:pointer;box-shadow:0 9px 24px #0003,inset 0 1px 0 #ffffff1a;transition:transform .18s ease,filter .18s ease}
button:disabled{opacity:.55;filter:saturate(.5)}button:not(:disabled):active{transform:scale(.985)}
button.secondary{margin-top:8px;background:transparent;border-color:#ffffff25;color:var(--muted)}
[hidden]{display:none!important}
.back{display:block;margin-top:16px;text-align:center;color:var(--gold);font-size:14px;font-weight:600;text-decoration:none}
@media(max-height:700px),(max-width:375px){.logo{margin-bottom:0}.field,.row{margin-bottom:8px}.tabs{margin-bottom:10px}h1{margin-top:5px}p{margin-bottom:9px}.back{margin-top:8px}.message{margin-top:5px}}
@media(min-width:769px){.shell{align-items:center}.card{width:100%;height:auto;min-height:0;max-height:calc(100dvh - 32px);max-width:460px;border-radius:28px;border:1px solid rgba(255,255,255,.1);padding:28px;}}
@supports not (height:100dvh){html,body,.shell,.card{height:100vh}}
</style>
</head>
<body>
<div class="shell"><main class="card">
<div class="logo">G</div>
<h1>نسيت كلمة المرور؟</h1>
<p>أدخل بريدك الإلكتروني وسنرسل لك رمز تحقق مكوّنًا من 6 أرقام صالحًا لمدة 5 دقائق.</p>
<form id="resetForm" novalidate>
<section id="emailStep">
<div class="row email-row"><div class="field"><label for="f_email">البريد الإلكتروني</label><input id="f_email" type="email" dir="ltr" autocomplete="email" placeholder="example@gmail.com"></div></div>
<div class="row send-row"><div class="field"><div class="error" id="emailError"></div><button id="f_send_code" type="submit">إرسال كود التحقق</button></div></div>
</section>
<section id="codeStep" hidden>
<div class="row code-row"><div class="code-entry"><label for="f_code">كود التحقق (6 أرقام)</label>
<div class="code-boxes" id="codeBoxes" dir="ltr" aria-label="أدخل رمز التحقق المكون من ستة أرقام">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="الرقم 1">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 2">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 3">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 4">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 5">
<input class="code-box" type="text" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="الرقم 6">
</div>
<input id="f_code" type="hidden">
<div class="error" id="codeError"></div></div><div class="timer-cell"><span id="f_timer">يمكنك إعادة إرسال الكود بعد الإرسال</span><div class="resend-row"><button id="resendBtn" type="button" class="resend-small" hidden>إعادة إرسال الكود</button></div></div></div>
<button id="verifyBtn" type="button">تأكيد الكود</button>
<div id="passwordStep" hidden><div class="row password-row"><div class="field"><label for="f_new_pass">كلمة المرور الجديدة</label><input id="f_new_pass" type="password" autocomplete="new-password" placeholder="كلمة المرور الجديدة"></div><div class="field"><label for="f_new_confirm">تأكيد كلمة المرور</label><input id="f_new_confirm" type="password" autocomplete="new-password" placeholder="تأكيد كلمة المرور"></div></div><button id="savePasswordBtn" type="button">حفظ كلمة المرور الجديدة</button>
</div>
</section>
</form>
<div class="message" id="message" role="status" aria-live="polite"></div>
<a class="back" href="/login/">العودة إلى تسجيل الدخول</a>
</main></div>
<script type="module">
const RESET_API_URL='https://gabo-otp.taher616270.workers.dev/';
const form=document.getElementById('resetForm'),email=document.getElementById('f_email'),code=document.getElementById('f_code');
const emailStep=document.getElementById('emailStep'),codeStep=document.getElementById('codeStep'),passwordStep=document.getElementById('passwordStep');
const emailError=document.getElementById('emailError'),codeError=document.getElementById('codeError');
const message=document.getElementById('message'),sendBtn=document.getElementById('f_send_code'),verifyBtn=document.getElementById('verifyBtn'),resendBtn=document.getElementById('resendBtn'),resendTimer=document.getElementById('f_timer'),savePasswordBtn=document.getElementById('savePasswordBtn');
let verifiedEmail='',verificationToken='',resendInterval=null;
const codeInputs=[...document.querySelectorAll('.code-box')];
codeInputs.forEach((box,index)=>{
 box.addEventListener('input',()=>{box.value=box.value.replace(/\D/g,'').slice(-1);code.value=codeInputs.map(input=>input.value).join('');if(box.value&&index<5)codeInputs[index+1].focus();});
 box.addEventListener('keydown',event=>{if(event.key==='Backspace'&&!box.value&&index>0)codeInputs[index-1].focus();if(event.key==='ArrowLeft'&&index<5)codeInputs[index+1].focus();if(event.key==='ArrowRight'&&index>0)codeInputs[index-1].focus();});
 box.addEventListener('paste',event=>{const pasted=(event.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);if(!pasted)return;event.preventDefault();pasted.split('').forEach((digit,i)=>{if(codeInputs[i])codeInputs[i].value=digit;});code.value=codeInputs.map(input=>input.value).join('');codeInputs[Math.min(pasted.length,5)].focus();});
});
function startResendCountdown(seconds=60){
 clearInterval(resendInterval);const deadline=Date.now()+seconds*1000;resendBtn.hidden=true;resendBtn.disabled=true;
 const tick=()=>{const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));if(!left){clearInterval(resendInterval);resendTimer.textContent='يمكنك طلب رمز جديد الآن';resendBtn.hidden=false;resendBtn.disabled=false;}else resendTimer.textContent='يمكنك إعادة إرسال الرمز بعد '+left+' ثانية';};
 tick();resendInterval=setInterval(tick,1000);
}
function showMessage(text,type=''){message.textContent=text;message.className='message '+type;}
function showError(el,text){el.textContent=text;el.classList.add('show');}
function clearErrors(){for(const el of [emailError,codeError]){el.textContent='';el.classList.remove('show');}showMessage('');}
async function callApi(payload){
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),23000);
 try{
  const response=await fetch(RESET_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:controller.signal});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'REQUEST_FAILED');
  return data;
 }catch(error){
  if(error?.name==='AbortError')throw new Error('REQUEST_TIMEOUT');
  throw error;
 }finally{clearTimeout(timer);}
}
async function sendCode(){
 clearErrors();const value=email.value.trim().toLowerCase();
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(value)){showError(emailError,'صيغة البريد الإلكتروني غير صحيحة');email.focus();return;}
 try{
  sendBtn.disabled=true;sendBtn.textContent='جارٍ إرسال الرمز...';
  await callApi({action:'send_reset',email:value});
  verifiedEmail=value;emailStep.hidden=true;codeStep.hidden=false;passwordStep.hidden=true;
  codeInputs.forEach(input=>input.value='');code.value='';codeInputs[0].focus();startResendCountdown(60);
  showMessage('تم إرسال رمز التحقق إلى بريدك الإلكتروني.','success');
 }catch(err){
  const map={EMAIL_SEND_FAILED:'تعذر إرسال البريد. حاول لاحقًا.',EMAIL_SERVICE_TIMEOUT:'تأخر خادم البريد. حاول مرة أخرى بعد قليل.',REQUEST_TIMEOUT:'انتهت مهلة الاتصال. حاول مرة أخرى.',RESEND_WAIT:'انتظر دقيقة قبل طلب رمز جديد.',RATE_LIMITED:'وصلت إلى الحد المسموح لطلبات الرمز.'};
  showMessage(map[err.message]||'تعذر إرسال الرمز. تحقق من البريد وحاول مرة أخرى.','error');
 }finally{sendBtn.disabled=false;sendBtn.textContent='إرسال كود التحقق';}
}
form.addEventListener('submit',event=>{event.preventDefault();if(!emailStep.hidden)sendCode();});
verifyBtn.addEventListener('click',async()=>{
 clearErrors();const value=code.value.trim();if(!/^\d{6}$/.test(value)){showError(codeError,'أدخل الرمز المكوّن من 6 أرقام');return;}
 verifyBtn.disabled=true;verifyBtn.textContent='جارٍ التحقق...';
 try{
  const result=await callApi({action:'verify_reset',email:verifiedEmail,code:value});
  verificationToken=result.verificationToken;
  document.querySelector('.code-row').hidden=true;verifyBtn.hidden=true;passwordStep.hidden=false;
  document.getElementById('f_new_pass').focus();showMessage('تم التحقق بنجاح. أدخل كلمة المرور الجديدة.','success');
 }catch(err){
  const map={CODE_EXPIRED_OR_MISSING:'انتهت صلاحية الرمز أو لم يعد متاحًا. اطلب رمزًا جديدًا.',CODE_EXPIRED:'انتهت صلاحية الرمز. اطلب رمزًا جديدًا.',WRONG_CODE:'الرمز غير صحيح. حاول مرة أخرى.',TOO_MANY_ATTEMPTS:'تجاوزت عدد المحاولات. اطلب رمزًا جديدًا.'};
  showMessage(map[err.message]||'تعذر التحقق من الرمز. حاول مرة أخرى.','error');
 }finally{verifyBtn.disabled=false;verifyBtn.textContent='تأكيد الكود';}
});
resendBtn.addEventListener('click',async()=>{
 if(!verifiedEmail)return;
 try{resendBtn.disabled=true;await callApi({action:'send_reset',email:verifiedEmail});code.value='';codeInputs.forEach(input=>input.value='');startResendCountdown(60);showMessage('تم إرسال رمز جديد إلى بريدك.','success');}
 catch(err){resendBtn.disabled=false;const map={RESEND_WAIT:'انتظر حتى ينتهي وقت الانتظار.',RATE_LIMITED:'وصلت إلى الحد المسموح لطلبات الرمز.'};showMessage(map[err.message]||'تعذر إعادة إرسال الرمز.','error');}
});
savePasswordBtn.addEventListener('click',async()=>{
 const password=document.getElementById('f_new_pass').value,confirm=document.getElementById('f_new_confirm').value;
 if(password.length<6){showMessage('كلمة المرور يجب أن تكون 6 أحرف على الأقل.','error');return;}
 if(password!==confirm){showMessage('كلمتا المرور غير متطابقتين.','error');return;}
 if(!verificationToken){showMessage('انتهت جلسة التحقق. ابدأ طلب رمز جديد.','error');return;}
 savePasswordBtn.disabled=true;savePasswordBtn.textContent='جارٍ تحديث كلمة المرور...';
 try{
  const result=await callApi({action:'complete_reset',email:verifiedEmail,verificationToken,password});
  verificationToken='';passwordStep.hidden=true;
  showMessage(result.notificationSent?'تم تغيير كلمة المرور بنجاح. أرسلنا لك إشعارًا على بريدك.':'تم تغيير كلمة المرور بنجاح، لكن تعذر إرسال إشعار البريد.','success');
  savePasswordBtn.hidden=true;
 }catch(err){
  const map={VERIFICATION_EXPIRED:'انتهت صلاحية التحقق. اطلب رمزًا جديدًا.',FIREBASE_USER_NOT_FOUND:'لا يوجد حساب بهذا البريد.',FIREBASE_SERVICE_ACCOUNT_INVALID:'إعدادات Firebase Admin غير مكتملة.',FIREBASE_ADMIN_AUTH_FAILED:'تعذر الاتصال بخدمة Firebase. تحقق من إعدادات الخادم.',FIREBASE_PASSWORD_UPDATE_FAILED:'رفض Firebase تحديث كلمة المرور.'};
  showMessage(map[err.message]||'تعذر تحديث كلمة المرور. حاول مرة أخرى.','error');
 }finally{savePasswordBtn.disabled=false;savePasswordBtn.textContent='حفظ كلمة المرور الجديدة';}
});
</script>
</body>
</html>
