<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اشتراك الإشعارات - GABO LIVE</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;min-height:100vh;padding-bottom:90px}
.top{padding:16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--b);z-index:10}
.back{width:40px;height:40px;background:#1e1c2e;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--b);cursor:pointer;color:#fff;text-decoration:none}
.card{margin:12px;background:var(--card);border:1px solid var(--b);border-radius:18px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #1f1f2f}
.row:last-child{border:0}
.switch{position:relative;width:48px;height:28px}
.switch input{display:none}
.slider{position:absolute;inset:0;background:#2a2840;border-radius:20px;transition:.3s;cursor:pointer}
.slider:before{content:"";position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;right:3px;transition:.3s}
input:checked + .slider{background:var(--gold)}
input:checked + .slider:before{transform:translateX(-20px)}
.mainBtn{margin:16px;width:calc(100% - 32px);background:var(--gold);color:#000;padding:14px;border-radius:14px;border:0;font-weight:900;font-size:15px;cursor:pointer}
.status{margin:12px;background:#1e1c2e;border:1px solid var(--b);padding:12px;border-radius:12px;text-align:center;font-size:13px;display:none}
.status.on{display:block}
.bottomNav{position:fixed;bottom:0;left:0;right:0;background:#0f0e18;border-top:1px solid var(--b);display:flex;justify-content:space-around;padding:8px 0 10px;direction:ltr}
.bottomNav a{flex:1;text-decoration:none;color:#6b6b7a;font-size:9px;display:flex;flex-direction:column;align-items:center}
</style>
<link rel="stylesheet" href="/assets/style/gabo-theme.css">
</head>
<body>
<div class="top"><a href="/profile/" class="back">›</a><b>🔔 اشتراك الإشعارات</b></div>

<div class="card">
<div class="row"><div>تفعيل إشعارات المتصفح<br><small style="color:#8b8ba7" id="permText">جاري التحقق...</small></div><label class="switch"><input type="checkbox" id="master"><span class="slider"></span></label></div>
</div>

<div class="card">
<div class="row"><div>❤️ الإعجابات</div><label class="switch"><input type="checkbox" id="n_like" checked><span class="slider"></span></label></div>
<div class="row"><div>💬 التعليقات</div><label class="switch"><input type="checkbox" id="n_comment" checked><span class="slider"></span></label></div>
<div class="row"><div>👥 متابع جديد</div><label class="switch"><input type="checkbox" id="n_follow" checked><span class="slider"></span></label></div>
<div class="row"><div>✉️ رسائل خاصة</div><label class="switch"><input type="checkbox" id="n_dm" checked><span class="slider"></span></label></div>
<div class="row"><div>🔴 بث مباشر</div><label class="switch"><input type="checkbox" id="n_live" checked><span class="slider"></span></label></div>
</div>

<button class="mainBtn" id="saveBtn">💾 حفظ الاشتراك</button>
<button class="mainBtn" id="testBtn" style="background:#1e1c2e;color:#fff;border:1px solid var(--b);margin-top:0">🔔 جرب إشعار تجريبي</button>
<div class="status" id="status"></div>

<script type="module">
import {auth,db} from '/firebase-config.js';
import {onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {doc,getDoc,setDoc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
let cur=null, swReg=null;
const $=id=>document.getElementById(id);
const show=t=>{const s=$('status');s.textContent=t;s.classList.add('on');setTimeout(()=>s.classList.remove('on'),4000);}

async function initSW(){
  if('serviceWorker' in navigator){
    try{swReg=await navigator.serviceWorker.register('/sw.js'); console.log('SW registered');}
    catch(e){console.log('SW fail',e)}
  }
}
initSW();

function updatePerm(){
  if(!('Notification' in window)){$('permText').textContent='المتصفح لا يدعم'; return}
  const p=Notification.permission;
  if(p==='granted'){$('permText').textContent='✅ مفعل'; $('master').checked=true}
  else if(p==='denied'){$('permText').textContent='❌ مرفوض - فعله من إعدادات المتصفح'; $('master').checked=false}
  else{$('permText').textContent='⏳ اضغط للتفعيل'; $('master').checked=false}
}
updatePerm();

$('master').onchange=async()=>{
  if($('master').checked){
    if(!('Notification' in window)){alert('لا يدعم'); return}
    const perm=await Notification.requestPermission();
    updatePerm();
    if(perm==='granted') show('✅ تم تفعيل الإشعارات');
    else{show('❌ تم الرفض - شغلها من الإعدادات > سفاري > الإشعارات'); $('master').checked=false}
  }
};

onAuthStateChanged(auth, async u=>{
  if(!u){location.replace('/login/');return}
  cur=u;
  const snap=await getDoc(doc(db,'users',u.uid));
  if(snap.exists()&&snap.data().notifications){
    const n=snap.data().notifications;
    $('n_like').checked=n.like!==false;
    $('n_comment').checked=n.comment!==false;
    $('n_follow').checked=n.follow!==false;
    $('n_dm').checked=n.dm!==false;
    $('n_live').checked=n.live!==false;
  }
});

$('saveBtn').onclick=async()=>{
  const data={
    like:$('n_like').checked,comment:$('n_comment').checked,
    follow:$('n_follow').checked,dm:$('n_dm').checked,
    live:$('n_live').checked,master:$('master').checked,
    updatedAt:new Date().toISOString()
  };
  await setDoc(doc(db,'users',cur.uid),{notifications:data},{merge:true});
  localStorage.setItem('gabo_notifications_'+cur.uid, JSON.stringify(data));
  show('✅ تم حفظ اشتراك الإشعارات - سيصلك كل جديد');
};

$('testBtn').onclick=async()=>{
  if(Notification.permission!=='granted'){alert('فعل الإشعارات أولاً من الزر فوق'); return}
  // طريقة الآيفون: عن طريق Service Worker
  if(swReg){
    await swReg.showNotification('GABO LIVE 🔔',{
      body:'الإشعارات شغالة تمام! ✅ هذا إشعار تجريبي',
      icon:'/assets/south-arabia.png.JPG',
      badge:'/assets/south-arabia.png.JPG',
      vibrate:[200,100,200]
    });
    show('🔔 تم إرسال الإشعار - انظر فوق الشاشة');
  }else{
    new Notification('GABO LIVE 🔔',{body:'الإشعارات شغالة ✅'});
    show('🔔 تم إرسال الإشعار');
  }
};
</script>
</body>
</html>
