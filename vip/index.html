<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --panel:#0e0e0e; --circle:#1f1e1c;
  --gold1:#ffe3a3; --gold2:#e9b560; --gold3:#b9863a;
  --text:#f4f1ea; --muted:#8c8a85; --lock:#a8935f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{--bg:#050505}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;position:relative;padding-bottom:130px;overflow:hidden}
.hero{position:relative;height:330px;background:radial-gradient(120% 80% at 25% 35%,rgba(233,181,96,.3),transparent 60%),linear-gradient(160deg,#3a3326 0%,#141210 42%,#050505 80%);overflow:hidden}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nav{position:absolute;top:14px;inset-inline:14px;display:flex;justify-content:space-between}
.nav button{width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:20px;cursor:pointer}
.badge{position:absolute;top:100px;inset-inline-start:34px;width:112px;height:128px;filter:drop-shadow(0 0 18px rgba(233,181,96,.6));animation:float 4s ease-in-out infinite}
.vip-title{position:absolute;top:104px;inset-inline-end:22px;font-size:46px;font-weight:700;font-style:italic;letter-spacing:-1px;background:linear-gradient(110deg,#a9792f 20%,#fff3cf 40%,#e9b560 50%,#a9792f 70%);background-size:250% 100%;animation:shine 3.5s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}
.progress{padding:0 22px;margin-top:-6px}
.hint{color:var(--muted);font-size:15px;line-height:1.7}
.hint b{color:#fff;font-weight:700}
.bar{height:6px;border-radius:6px;background:#2a2a2a;margin:14px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--gold3),var(--gold1));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;direction:rtl}
.perks{margin-top:28px;border-top-left-radius:50% 26px;border-top-right-radius:50% 26px;background:linear-gradient(180deg,#151515,#070707 160px);border-top:1px solid rgba(233,181,96,.45);padding:26px 14px 10px}
.title{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px;color:var(--gold1);font-size:22px;font-weight:500}
.title::before,.title::after{content:"";width:58px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2))}
.title::after{transform:scaleX(-1)}
.title span.d{width:9px;height:9px;background:var(--gold2);transform:rotate(45deg)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 6px}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:0;background:none;color:inherit;font-family:inherit}
.item .c{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2e2b25,#141312);border:1px solid rgba(233,181,96,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.6);display:grid;place-items:center;font-size:32px;transition:transform .15s,box-shadow .3s}.item.open .c{border-color:var(--gold2);box-shadow:0 0 22px rgba(233,181,96,.45),inset 0 0 14px rgba(233,181,96,.2)}.item:not(.open) .c span{opacity:.7}
.item:active .c{transform:scale(.92)}
.item .c span{background:linear-gradient(160deg,var(--gold1),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:saturate(1.2)}
.item .n{font-size:16px;font-weight:500;color:var(--gold1);text-align:center;line-height:1.3}
.item .l{font-size:14px;color:var(--lock);display:flex;align-items:center;gap:4px;direction:ltr}
.item.open .l{color:#6fd18b}
.footer{position:fixed;bottom:0;width:100%;max-width:480px;background:rgba(16,15,13,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(233,181,96,.3);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px}
.footer p{flex:1;font-size:15px;line-height:1.6;color:#e9e6df}
.footer button{position:relative;overflow:hidden;border:0;border-radius:40px;padding:16px 30px;font:700 18px 'Tajawal',sans-serif;color:#5e3908;background:linear-gradient(90deg,#ffd982,#f5ab55);box-shadow:0 0 24px rgba(245,171,85,.45);cursor:pointer}.footer button::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:sweep 3s ease-in-out infinite}
.footer button:active{transform:scale(.97)}
.tabs{display:flex;justify-content:center;gap:8px;margin:-8px 0 24px}.tabs button{border:1px solid rgba(233,181,96,.3);background:#13110e;color:var(--lock);font:500 14px 'Tajawal',sans-serif;padding:7px 14px;border-radius:20px;cursor:pointer;direction:ltr;transition:.2s}.tabs button.on{background:linear-gradient(90deg,#ffd982,#f5ab55);color:#5e3908;border-color:transparent;font-weight:700}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes shine{to{background-position:-250% 0}}@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:#222;color:#fff;border:1px solid var(--gold3);padding:12px 20px;border-radius:14px;font-size:15px;transition:transform .3s;z-index:9;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <canvas id="fx"></canvas><div class="nav"><button aria-label="رجوع">›</button><button aria-label="المزيد">⋯</button></div>
    <svg class="badge" viewBox="0 0 112 128" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3cf"/><stop offset=".45" stop-color="#e9b560"/><stop offset="1" stop-color="#7a4f17"/></linearGradient></defs>
      <path d="M56 4 L66 20 L96 14 L104 54 L90 100 L56 124 L22 100 L8 54 L16 14 L46 20Z" fill="url(#g)" stroke="#ddd" stroke-width="2"/>
      <circle cx="56" cy="58" r="30" fill="#222" stroke="#bbb" stroke-width="3"/>
      <path d="M56 24 V86 M50 34 H62" stroke="#e5e5e5" stroke-width="6" stroke-linecap="round"/>
      <rect x="26" y="86" width="60" height="20" rx="6" fill="#444" stroke="#ccc"/>
      <text x="56" y="101" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-style="italic">VIP1</text>
    </svg>
    <div class="vip-title">VIP 1</div>
  </div>
  <div class="progress">
    <p class="hint">تحتاج إلى <b id="need">49900</b> نقطة خبرة VIP للوصول إلى VIP1، استمتع بالعديد من الامتيازات الحصرية</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="row"><span>VIP0</span><span><span id="xp">100/50000</span> الخبرة</span><span>VIP1</span></div>
  </div>
  <section class="perks">
    <div class="title"><span class="d"></span>امتيازات VIP حصرية<span class="d"></span></div>
    <div class="tabs" id="tabs"></div><div class="grid" id="grid"></div>
  </section>
  <div class="footer">
    <button id="charge">اشحن الآن</button>
    <p>استمر في الشحن للحصول على <span id="need2">49900</span> نقطة خبرة VIP، وقم بالترقية إلى VIP1</p>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// عدّل هذي القيم حسب بياناتك
var USER = { xp: 100, next: 50000, level: 0 };
var PERKS = [
  {n:"شعار الـ VIP", lv:1, i:"♦"},
  {n:"إطار الرأس", lv:1, i:"♚"},
  {n:"العرض في المقدمة", lv:1, i:"⇪"},
  {n:"عرض الزوار", lv:1, i:"☺"},
  {n:"فقاعة دردشة", lv:2, i:"✉"},
  {n:"إخفاء وقت آخر ظهور", lv:2, i:"◔"},
  {n:"خلفية مخصصة", lv:3, i:"▣"},
  {n:"هدايا حصرية", lv:3, i:"✦"},
  {n:"عدد اصدقاء أكثر", lv:4, i:"☻"},
  {n:"تأثير الدخول", lv:4, i:"✧"},
  {n:"بطاقة خيالية", lv:5, i:"❖"},
  {n:"ترحيب بصورة", lv:5, i:"☼"}
];
var LOCK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
var toast = document.getElementById('toast'), tt;
function say(m){toast.textContent=m;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('show')},1800)}
var grid = document.getElementById('grid'), tabs = document.getElementById('tabs'), view = 1;
function render(){ grid.innerHTML=''; tabs.innerHTML='';
[1,2,3,4,5].forEach(function(l){var t=document.createElement('button');t.textContent='VIP'+l;t.className=l===view?'on':'';t.onclick=function(){view=l;render()};tabs.appendChild(t)});
PERKS.forEach(function(p){
  var open = view >= p.lv;
  var b = document.createElement('button');
  b.className = 'item' + (open ? ' open' : '');
  b.innerHTML = '<div class="c"><span>'+p.i+'</span></div><div class="n">'+p.n+'</div><div class="l">VIP'+p.lv+' '+(open?'✓':LOCK)+'</div>';
  b.onclick = function(){ say(open ? 'الميزة مفعّلة: '+p.n : 'تنفتح عند VIP'+p.lv); };
  grid.appendChild(b);
});}
render();
var left = USER.next - USER.xp;
document.getElementById('need').textContent = left;
document.getElementById('need2').textContent = left;
document.getElementById('xp').textContent = USER.xp + '/' + USER.next;
setTimeout(function(){ document.getElementById('fill').style.width = Math.max(1, USER.xp/USER.next*100)+'%'; }, 150);
document.getElementById('charge').onclick = function(){ say('فتح صفحة الشحن...'); };
// جزيئات ذهبية متطايرة
(function(){var c=document.getElementById('fx'),x=c.getContext('2d'),W,H,P=[];
function rs(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}rs();addEventListener('resize',rs);
for(var i=0;i<34;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.4+.15,a:Math.random()});
function f(){x.clearRect(0,0,W,H);P.forEach(function(p){p.y-=p.v;p.a+=.02;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
x.globalAlpha=.25+.5*Math.abs(Math.sin(p.a));x.fillStyle='#ffd982';x.shadowColor='#e9b560';x.shadowBlur=8;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()});requestAnimationFrame(f)}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)f()})();
</script>
</body>
</html>
