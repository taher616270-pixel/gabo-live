<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GABO VIP</title>
<style>
:root{--bg:#07060c;--card:#161426;--b:#2a2840;--v:#7c3aed;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;padding-bottom:120px}
.top{padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--b)}
.top b{font-size:17px}
.back{background:#1e1c2e;border:1px solid var(--b);color:#fff;padding:7px 16px;border-radius:20px;text-decoration:none;font-size:13px;font-weight:700}
.hero{margin:16px;background:linear-gradient(135deg,#1a1033,#2d1a0f);border:1px solid #3a2a1a;border-radius:20px;padding:20px;text-align:center}
.hero h1{font-size:22px}
.hero p{font-size:12px;color:#a1a1aa;margin-top:6px}
.plans{margin:16px;display:flex;flex-direction:column;gap:12px}
.plan{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.plan.gold{border-color:var(--gold);background:linear-gradient(135deg,#1a160f,#161426)}
.plan b{font-size:14px}.plan span{font-size:11px;color:#a1a1aa;display:block;margin-top:2px}
.plan button{background:var(--v);border:0;color:#fff;padding:8px 14px;border-radius:10px;font-weight:800;font-size:12px}
.plan.gold button{background:var(--gold);color:#000}

/* اخفاء الشريط القديم اللي يسبب الانقلاب */
.old-bar, .extra-bar, .voice-rooms{display:none!important}
</style>
<link rel="stylesheet" href="/assets/style/gabo-theme.css">
</head>
<body>

<div class="top">
  <b>✨ GABO VIP</b>
  <a class="back" href="/profile/">رجوع ‹</a>
</div>

<div class="hero">
  <h1>👑 دائرتك المميزة</h1>
  <p>مساحة مخصصة للمميزين - الجنوب العربي</p>
  <div style="margin-top:14px;display:flex;gap:8px;justify-content:center">
    <button onclick="document.getElementById('plans').scrollIntoView({behavior:'smooth'})" style="background:var(--v);border:0;color:#fff;padding:10px 18px;border-radius:10px;font-weight:800">عرض الباقات ↓</button>
  </div>
</div>

<div class="plans" id="plans">
  <div class="plan gold">
    <div><b>⭐ VIP ذهبي</b><span>بدون إعلانات + شارة ذهبية + دخول غرف VIP</span></div>
    <button>اشترك</button>
  </div>
  <div class="plan">
    <div><b>💎 VIP ماسي</b><span>كل مميزات الذهبي + دعم فني + ظهور أعلى</span></div>
    <button>اشترك</button>
  </div>
  <div class="plan">
    <div><b>🚀 دعم الجنوب</b><span>ادعم مجتمع الجنوب العربي</span></div>
    <button>ادعم</button>
  </div>
</div>

<!-- شريط واحد فقط وثابت -->



<script type="module" src="/js/unified-bottom-nav.js"></script>
</body>
</html>
