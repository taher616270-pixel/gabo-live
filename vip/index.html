<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VIP</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505; --panel:#0e0e0e; --circle:#1f1e1c;
  --gold1:#ffe3a3; --gold2:#e9b560; --gold3:#b9863a;
  --text:#f4f1ea; --muted:#8c8a85; --lock:#a8935f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{--bg:#050505}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;position:relative;padding-bottom:130px;overflow:hidden}

/* الهيدر */
.hero{position:relative;height:330px;background:radial-gradient(120% 80% at 25% 35%,rgba(233,181,96,.3),transparent 60%),linear-gradient(160deg,#3a3326 0%,#141210 42%,#050505 80%);overflow:hidden}#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.nav{position:absolute;top:14px;inset-inline:14px;display:flex;justify-content:space-between}
.nav button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:25px;cursor:pointer;display:grid;place-items:center;line-height:1}
.nav button[aria-label="رجوع"]{font-size:29px;text-indent:-5px;padding-bottom:4px}
.badge{position:absolute;top:100px;left:34px;width:112px;height:128px;filter:drop-shadow(0 0 18px rgba(233,181,96,.6));animation:float 4s ease-in-out infinite}
.vip-title{position:absolute;top:104px;right:22px;font-size:46px;font-weight:700;font-style:italic;letter-spacing:-1px;background:linear-gradient(110deg,#a9792f 20%,#fff3cf 40%,#e9b560 50%,#a9792f 70%);background-size:250% 100%;animation:shine 3.5s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent;direction:ltr}

/* التقدم */
.progress{padding:0 22px;margin-top:-6px}
.hint{color:var(--muted);font-size:15px;line-height:1.7}
.hint b{color:#fff;font-weight:700}
.bar{height:6px;border-radius:6px;background:#2a2a2a;margin:14px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--gold3),var(--gold1));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;direction:rtl}

/* العنوان */
.perks{margin-top:28px;border-top-left-radius:50% 26px;border-top-right-radius:50% 26px;background:linear-gradient(180deg,#151515,#070707 160px);border-top:1px solid rgba(233,181,96,.45);padding:26px 14px 10px}
.title{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:26px;color:var(--gold1);font-size:22px;font-weight:500}
.title::before,.title::after{content:"";width:58px;height:1px;background:linear-gradient(90deg,transparent,var(--gold2))}
.title::after{transform:scaleX(-1)}
.title span.d{width:9px;height:9px;background:var(--gold2);transform:rotate(45deg)}

/* الشبكة */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 6px}
.item{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;border:0;background:none;color:inherit;font-family:inherit}
.item .c{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 50% 30%,#2e2b25,#141312);border:1px solid rgba(233,181,96,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.6);display:grid;place-items:center;font-size:32px;transition:transform .15s,box-shadow .3s}.item.open .c{border-color:var(--gold2);box-shadow:0 0 22px rgba(233,181,96,.45),inset 0 0 14px rgba(233,181,96,.2)}.item:not(.open) .c span{opacity:.7}
.item:active .c{transform:scale(.92)}
.item .c span{background:linear-gradient(160deg,var(--gold1),var(--gold3));-webkit-background-clip:text;background-clip:text;color:transparent;filter:saturate(1.2)}
.item .c .vip-mark{width:66px;height:66px;display:block;overflow:visible;filter:drop-shadow(0 0 5px rgba(255,211,125,.55));animation:vipMarkGlow 3s ease-in-out infinite}
.item .c .head-frame-icon{width:46px;height:46px;display:block;overflow:visible;filter:drop-shadow(0 0 6px rgba(255,211,125,.7));animation:vipMarkGlow 3s ease-in-out infinite}
@keyframes vipMarkGlow{50%{filter:drop-shadow(0 0 10px rgba(255,211,125,.9));transform:translateY(-1px)}}
.item .n{font-size:16px;font-weight:500;color:var(--gold1);text-align:center;line-height:1.3}
.item .l{font-size:14px;color:var(--lock);display:flex;align-items:center;gap:4px;direction:ltr}
.item.open .l{color:#6fd18b}

/* الشريط السفلي */
.footer{position:fixed;bottom:0;width:100%;max-width:480px;background:rgba(16,15,13,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(233,181,96,.3);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 22px calc(26px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:16px}
.footer p{flex:1;font-size:15px;line-height:1.6;color:#e9e6df}
.footer button{position:relative;overflow:hidden;border:0;border-radius:40px;padding:16px 30px;font:700 18px 'Tajawal',sans-serif;color:#5e3908;background:linear-gradient(90deg,#ffd982,#f5ab55);box-shadow:0 0 24px rgba(245,171,85,.45);cursor:pointer}.footer button::after{content:'';position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:sweep 3s ease-in-out infinite}
.footer button:active{transform:scale(.97)}

.tabs{display:flex;direction:ltr;gap:8px;margin:-8px 0 24px;overflow-x:auto;scrollbar-width:none;padding:2px 4px}.tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;border:1px solid rgba(233,181,96,.3);background:#13110e;color:var(--lock);font:500 14px 'Tajawal',sans-serif;padding:7px 14px;border-radius:20px;cursor:pointer;direction:ltr;transition:.2s}.tabs button.on{background:linear-gradient(90deg,#ffd982,#f5ab55);color:#5e3908;border-color:transparent;font-weight:700}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes shine{to{background-position:-250% 0}}@keyframes sweep{0%,60%{left:-60%}100%{left:130%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
#boom{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
#stage{position:fixed;inset:0;pointer-events:none;z-index:15}
.ban-wrap{position:absolute;inset:0;display:flex;justify-content:flex-start;align-items:center;padding-bottom:16vh;animation:bin .7s cubic-bezier(.2,1.1,.3,1) both}
.cine~.ban-wrap{align-items:flex-end;padding-bottom:22vh}
.ban-wrap.out{animation:bout .5s ease-in forwards}
.ban{position:relative;overflow:visible;display:flex;align-items:center;gap:12px;padding:calc(8px + var(--n)*1.6px) 24px;border-radius:50px;background:linear-gradient(90deg,#000c,var(--b) 50%,#000c);border:2px solid var(--a);box-shadow:0 0 calc(8px + var(--n)*5px) var(--a),inset 0 0 14px #0008;color:#fff;z-index:1}
.ban::after{content:'';position:absolute;top:0;bottom:0;width:35%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 1.8s ease-in-out infinite}
.ban .cr{color:var(--a);font-size:calc(18px + var(--n)*2px);line-height:1;text-shadow:0 0 10px var(--a);letter-spacing:-2px}
.ban b{display:block;font-size:calc(14px + var(--n)*.9px);text-shadow:0 1px 3px #000}
.ban small{font-size:12px;color:#e8e4da}
.big .ban{max-width:92vw}
.ban-wrap .ban{border-radius:50px 0 0 50px;border-right-width:0}
.ban-wrap .rays{left:auto;right:-60px;margin:-260px 0 0 0}
.rays{position:absolute;left:50%;top:50%;width:520px;height:520px;margin:-260px;border-radius:50%;background:repeating-conic-gradient(var(--a) 0 6deg,transparent 6deg 24deg);opacity:.4;-webkit-mask:radial-gradient(circle,#000 8%,transparent 66%);mask:radial-gradient(circle,#000 8%,transparent 66%);animation:spin 7s linear infinite}
.cine{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,rgba(0,0,0,.3),rgba(0,0,0,.9));animation:cin .5s both}
.cine.out{animation:cout .6s forwards}
.cine .rays{width:980px;height:980px;margin:-490px;opacity:.55}
.cine h2{position:relative;text-align:center;font-size:64px;font-style:italic;direction:ltr;background:linear-gradient(110deg,var(--a) 20%,#fff 40%,var(--a) 60%);background-size:250% 100%;animation:pop .8s cubic-bezier(.2,1.4,.3,1) both,shine 2.5s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px var(--a))}
.cine h2 small{display:block;font-size:26px;font-style:normal;letter-spacing:2px}
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
.ban .em{flex:none;width:calc(40px + var(--n)*2px);height:calc(40px + var(--n)*2px);border-radius:50%;display:grid;place-content:center;text-align:center;font:italic 700 calc(16px + var(--n)*1.2px)/1 'Tajawal',sans-serif;color:#1a1100;background:radial-gradient(circle at 35% 30%,#fff,var(--a) 55%,var(--b));box-shadow:0 0 14px var(--a)}
.em i{font-size:9px;font-style:normal;letter-spacing:1px}
.ban .tx{display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.tx u{display:flex;gap:4px;text-decoration:none;padding:3px 2px}
.tx s{width:7px;height:7px;transform:rotate(45deg);background:#ffffff26}
.tx s.on{background:var(--a);box-shadow:0 0 6px var(--a)}
.ban.spin{border-color:transparent;background:linear-gradient(90deg,#000c,var(--b) 50%,#000c) padding-box,conic-gradient(from var(--ang),var(--a),#fff,var(--b),var(--a)) border-box;animation:ang 3s linear infinite}
@keyframes ang{to{--ang:360deg}}
.ban{--fill:linear-gradient(180deg,rgba(255,255,255,.16),transparent 46%),repeating-linear-gradient(115deg,transparent 0 7px,rgba(255,255,255,.04) 7px 8px),linear-gradient(90deg,#050505f0,var(--b) 55%,#050505f0);background:var(--fill);box-shadow:0 0 calc(10px + var(--n)*5px) var(--a),inset 0 0 0 1px rgba(255,255,255,.2),inset 0 0 0 4px rgba(0,0,0,.45),inset 0 -10px 18px rgba(0,0,0,.4)}
.ban.spin{background:var(--fill),conic-gradient(from var(--ang),var(--a),#fff,var(--b),var(--a));background-clip:padding-box,padding-box,padding-box,border-box;background-origin:padding-box,padding-box,padding-box,border-box}
.ban .em{isolation:isolate;border-radius:0;clip-path:polygon(50% 0,92% 22%,92% 70%,50% 100%,8% 70%,8% 22%);width:calc(46px + var(--n)*2.4px);height:calc(52px + var(--n)*2.8px);background:conic-gradient(from 20deg,var(--a),#fff 18%,var(--b) 40%,var(--a) 60%,#fff 78%,var(--a));box-shadow:none;color:#fff;text-shadow:0 0 8px var(--a),0 1px 2px #000}
.ban .em::before{content:'';position:absolute;inset:4px;z-index:-1;clip-path:inherit;background:radial-gradient(circle at 50% 28%,rgba(255,255,255,.3),rgba(0,0,0,.7) 72%)}
.ban .tx b{font-size:calc(16px + var(--n)*1px);letter-spacing:.5px;background:linear-gradient(180deg,#fff,var(--a) 55%,var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 1px 2px #000)}
.ban .tx small{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--a)}
.ban .tx small::before,.ban .tx small::after{content:'';width:14px;height:1px;background:var(--a)}
.ban .cr{font-size:calc(22px + var(--n)*2.2px);filter:drop-shadow(0 0 8px var(--a));animation:bob 2.4s ease-in-out infinite}
.sp{position:absolute;font-style:normal;font-size:10px;color:#fff;text-shadow:0 0 6px var(--a);opacity:0;animation:tw 1.8s ease-in-out infinite;pointer-events:none}
@keyframes bob{50%{transform:translateY(-3px)}}@keyframes tw{50%{opacity:1;transform:scale(1.7) rotate(20deg)}}
.ban::after{display:none}.ban .cr{display:none}
.emb{flex:none;display:block;width:calc(70px + var(--n)*7px);height:auto;margin:calc(var(--n)*-1.5px) 0;filter:drop-shadow(0 0 calc(2px + var(--n)*1.6px) var(--a))}
.ban{padding:12px 24px 12px 18px;box-shadow:0 0 26px var(--a),inset 0 0 0 1px rgba(255,255,255,.2),inset 0 0 0 4px rgba(0,0,0,.45),inset 0 -10px 18px rgba(0,0,0,.4)}
.emb{width:96px;margin:-6px 0;filter:drop-shadow(0 0 8px var(--a))}
.ban .tx b{font-size:18px}
.ban .em{width:56px;height:62px;font-size:22px}
.lights{position:absolute;inset:0;overflow:hidden;animation:cin .4s both}
.lights.out{animation:cout .6s forwards}
.lights i{position:absolute;top:0;left:var(--x);width:var(--w);height:38vh;border-radius:4px;background:linear-gradient(180deg,transparent,var(--a),#fff 72%,transparent);filter:blur(1px) drop-shadow(0 0 10px var(--a));opacity:.85;transform:translateY(-45vh);animation:fall var(--t) linear var(--d) infinite}
@keyframes fall{to{transform:translateY(115vh)}}
.lights::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,var(--a),transparent 65%);opacity:.16}
.lights i{top:-4vh;height:108vh;width:46vw;margin-left:-23vw;border-radius:0;background:linear-gradient(180deg,var(--a),transparent 92%);clip-path:polygon(44% 0,56% 0,100% 100%,0 100%);filter:blur(6px);opacity:.4;mix-blend-mode:screen;transform:rotate(var(--r));transform-origin:50% 0;animation:swing calc(var(--t)*2) ease-in-out var(--d) infinite alternate}
@keyframes swing{to{transform:rotate(calc(var(--r)*-1))}}
.ban{padding:9px 20px 9px 12px;gap:9px}
.emb{width:80px;margin:-5px 0}
.ban .tx b{font-size:16px}
.ban .tx small{font-size:12px}
.tx s{width:6px;height:6px}
.ban .em{width:46px;height:52px;font-size:19px}
.badge{display:none}
.hero .emb{position:absolute;top:70px;left:10px;width:190px;margin:0;filter:drop-shadow(0 0 14px var(--a));animation:pop .55s cubic-bezier(.2,1.4,.3,1) both}
.vip-title{background-image:linear-gradient(110deg,var(--b) 20%,#fff 40%,var(--a) 50%,var(--b) 70%)}
.vip-title{right:44px;padding:0 14px;background-image:linear-gradient(110deg,var(--a) 25%,#fff 42%,var(--a) 55%,var(--a) 75%)}
.vip-title.vt2,.ban.tt .tx b{background-image:linear-gradient(90deg,var(--a) 0%,var(--c2) 25%,var(--a) 50%,var(--c2) 75%,var(--a) 100%);background-size:200% 100%;animation:flow 1.8s linear infinite}
.vip-title.vt2{filter:drop-shadow(0 0 12px var(--c2))}
@keyframes flow{to{background-position:200% 0}}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 85% 42%,var(--a),transparent 70%);animation:fl .7s forwards}
.shake .hero,.shake .perks{animation:shk .55s}
@keyframes bin{from{transform:translateX(120%) scale(.8);opacity:0}}@keyframes bout{to{transform:translateX(110%);opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cin{from{opacity:0}}@keyframes cout{to{opacity:0}}@keyframes pop{from{transform:scale(.3);opacity:0}}@keyframes fl{from{opacity:.75}to{opacity:0}}
@keyframes shk{20%{transform:translate(calc(var(--s)*-1px),calc(var(--s)*.5px))}40%{transform:translate(calc(var(--s)*1px),calc(var(--s)*-.5px))}60%{transform:translate(calc(var(--s)*-.7px),0)}80%{transform:translate(calc(var(--s)*.7px),0)}}
/* صفحة شعار VIP الفارغة */
.vip-blank-page{position:fixed;z-index:50;left:50%;top:50%;width:min(calc(100% - 32px),448px);height:min(72vh,620px);transform:translate(-50%,-50%);border:1px solid rgba(233,181,96,.55);border-radius:24px;background:linear-gradient(160deg,#15130f,#050505 55%);box-shadow:0 18px 60px rgba(0,0,0,.8),0 0 24px rgba(233,181,96,.12);display:none;flex-direction:column;gap:12px;padding:14px;overflow:hidden}
.vip-blank-page.show{display:flex}
.vip-blank-top{display:flex;align-items:center;gap:12px;flex:none}
.vip-blank-close{width:40px;height:40px;border:1px solid rgba(233,181,96,.35);border-radius:50%;background:#171512;color:#f4d18a;font:32px/1 Arial,sans-serif;display:grid;place-items:center;cursor:pointer;flex:none}
.vip-blank-heading{flex:1;text-align:center;color:#f4d18a;font-size:19px;font-weight:700}
.vip-notice-list{width:100%;overflow-y:auto;display:grid;direction:rtl;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;align-items:center;gap:8px 4px;padding:2px 1px 8px;scrollbar-width:thin;scrollbar-color:#9b7136 transparent}
.vip-notice-card{width:100%;min-width:0;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0;border:0;border-radius:0;background:transparent;box-shadow:none;cursor:default}
.vip-notice-name{display:block;font-size:13px;font-weight:800;line-height:1.2;text-align:center;letter-spacing:.4px;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 5px var(--tier-color))}
.vip-notice-name.single{background-image:linear-gradient(110deg,var(--tier-color) 0%,var(--tier-color) 34%,#fff 48%,var(--tier-color) 62%,var(--tier-color) 100%);background-size:250% 100%;animation:vipNameShine 2.5s linear infinite}
.vip-notice-name.duo{background-image:linear-gradient(90deg,var(--tier-color) 0%,var(--tier-accent) 25%,var(--tier-color) 50%,var(--tier-accent) 75%,var(--tier-color) 100%);background-size:200% 100%;animation:flow 1.8s linear infinite;filter:drop-shadow(0 0 5px var(--tier-color)) drop-shadow(0 0 5px var(--tier-accent))}
@keyframes vipNameShine{to{background-position:-250% 0}}
.vip-notice-card:nth-child(1){grid-column:2;grid-row:1}
.vip-notice-card:nth-child(2){grid-column:1;grid-row:2}
.vip-notice-card:nth-child(3){grid-column:2;grid-row:2}
.vip-notice-card:nth-child(4){grid-column:3;grid-row:2}
.vip-notice-card:nth-child(5){grid-column:1;grid-row:3}
.vip-notice-card:nth-child(6){grid-column:2;grid-row:3}
.vip-notice-card:nth-child(7){grid-column:3;grid-row:3}
.vip-notice-card:nth-child(8){grid-column:1;grid-row:4}
.vip-notice-card:nth-child(9){grid-column:2;grid-row:4}
.vip-notice-card:nth-child(10){grid-column:3;grid-row:4}
.vip-notice-preview{width:100%;display:flex;align-items:center;gap:12px;justify-content:center;--a:var(--tier-color);--b:var(--tier-dark);--n:var(--tier-level)}
.vip-notice-preview .emb{width:112px;max-height:100px;flex:none;margin:0;filter:drop-shadow(0 0 10px var(--a))}
.vip-notice-preview-copy{display:flex;flex-direction:column;gap:5px;min-width:0}
.vip-notice-preview-copy strong{color:var(--tier-color);font-size:17px;font-weight:900}
.vip-notice-preview-copy small{color:#fff;font-size:13px}
.vip-notice-preview-copy u{display:flex;gap:4px;text-decoration:none}
.vip-notice-preview-copy s{width:6px;height:6px;transform:rotate(45deg);background:#ffffff26}
.vip-notice-preview-copy s.on{background:var(--tier-color);box-shadow:0 0 6px var(--tier-color)}
.toast{position:fixed;top:calc(20px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-90px);background:#222;color:#fff;border:1px solid var(--gold3);padding:12px 20px;border-radius:14px;font-size:15px;transition:transform .3s;z-index:9;white-space:nowrap}
.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <canvas id="fx"></canvas><div class="nav"><button aria-label="رجوع">‹</button><button aria-label="المزيد">⋯</button></div>
    <svg class="badge" viewBox="0 0 112 128" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff3cf"/><stop offset=".45" stop-color="#e9b560"/><stop offset="1" stop-color="#7a4f17"/></linearGradient></defs>
      <path d="M56 4 L66 20 L96 14 L104 54 L90 100 L56 124 L22 100 L8 54 L16 14 L46 20Z" fill="url(#g)" stroke="#ddd" stroke-width="2"/>
      <circle cx="56" cy="58" r="30" fill="#222" stroke="#bbb" stroke-width="3"/>
      <path d="M56 24 V86 M50 34 H62" stroke="#e5e5e5" stroke-width="6" stroke-linecap="round"/>
      <rect x="26" y="86" width="60" height="20" rx="6" fill="#444" stroke="#ccc"/>
      <text x="56" y="101" text-anchor="middle" fill="#fff" font-size="14" font-weight="700" font-style="italic">VIP1</text>
    </svg>
    <div id="hb"></div><div class="vip-title" id="vt">VIP 1</div>
  </div>

  <div class="progress">
    <p class="hint">تحتاج إلى <b id="need">49900</b> نقطة خبرة VIP للوصول إلى VIP1، استمتع بالعديد من الامتيازات الحصرية</p>
    <div class="bar"><i id="fill"></i></div>
    <div class="row"><span>VIP0</span><span><span id="xp">100/50000</span> الخبرة</span><span>VIP1</span></div>
  </div>

  <section class="perks">

<script type="module">
  import { auth, db } from '/firebase-config.js';
  import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  function applyUser(user) {
    if (!user) {
      try { localStorage.removeItem('gabo_vip_username'); } catch(e) {}
      return;
    }
    const quickName = user.displayName || user.email?.split('@')[0] || 'مستخدم';
    setUser(quickName);
    try { localStorage.setItem('gabo_vip_username', quickName); } catch(e) {}

    // اقرأ الاسم الكامل في الخلفية دون تعطيل ظهور تأثير VIP
    getDoc(doc(db, 'users', user.uid)).then(profile => {
      if (!profile.exists()) return;
      const data = profile.data();
      const name = data.name || data.displayName;
      if (name) {
        setUser(name);
        try { localStorage.setItem('gabo_vip_username', name); } catch(e) {}
      }
    }).catch(error => console.error('تعذر تحديث اسم VIP من الملف الشخصي:', error));
  }

  // لا ننتظر تهيئة persistence؛ Firebase يبلغنا بالحساب فور جاهزيته
  onAuthStateChanged(auth, applyUser, error => console.error('تعذر تهيئة حساب VIP:', error));
</script>
