<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090806">
<title>GABO LIVE | VIP</title>
<style>
:root{color-scheme:dark;--gold:#e8c36b;--gold2:#fff0b4;--ink:#090806;--muted:#b8a77e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{min-height:100svh;display:flex;justify-content:center;padding:12px 10px 92px;overflow-x:hidden}
.vip-shell{position:relative;isolation:isolate;width:min(100%,430px);aspect-ratio:9/16;min-height:680px;max-height:790px;overflow:hidden;border:1px solid #9d7b37;border-radius:22px;background:
 radial-gradient(ellipse at 18% 16%,#ffffff0b 0 1px,transparent 2px),
 radial-gradient(ellipse at 82% 29%,#e8c36b26 0 1px,transparent 2px),
 radial-gradient(ellipse at 28% 68%,#ffffff12 0 1px,transparent 2px),
 radial-gradient(ellipse at 76% 82%,#e8c36b22 0 1px,transparent 2px),
 repeating-linear-gradient(117deg,transparent 0 38px,#ffffff08 39px,transparent 41px 76px),
 repeating-linear-gradient(23deg,transparent 0 57px,#d8c49a0a 58px,transparent 60px 112px),
 radial-gradient(ellipse at 50% 0,#393126 0,#171512 38%,#080807 78%);
 box-shadow:0 0 0 2px #e8c36b22,inset 0 0 70px #000,0 20px 70px #000}
.vip-shell:before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.75;background:
 radial-gradient(1.5px 1.5px at 8% 12%,#f6d98d 98%,transparent),
 radial-gradient(1px 1px at 19% 30%,#fff1c4 98%,transparent),
 radial-gradient(2px 2px at 87% 17%,#d9b45d 98%,transparent),
 radial-gradient(1px 1px at 74% 45%,#fff0bd 98%,transparent),
 radial-gradient(1.5px 1.5px at 12% 76%,#d9b45d 98%,transparent),
 radial-gradient(1px 1px at 91% 72%,#fff0bd 98%,transparent),
 radial-gradient(2px 2px at 42% 91%,#c69b43 98%,transparent)}
.vip-shell:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 15%,#fff1c40a 35%,transparent 47%),radial-gradient(ellipse at center,transparent 48%,#000b 100%)}
.inner{height:100%;min-height:680px;padding:18px 18px 20px;display:flex;flex-direction:column}
.topline{display:flex;justify-content:flex-start;align-items:center}
.back{width:34px;height:34px;border:1px solid #a98742;border-radius:50%;display:grid;place-items:center;color:var(--gold2);text-decoration:none;background:#080705a8;font-size:20px}
.emblem{width:150px;height:128px;margin:3px auto 0;display:block;filter:drop-shadow(0 0 13px #d8ad4d55)}
h1{margin:0;text-align:center;font-family:Georgia,serif;font-size:clamp(48px,14vw,66px);line-height:1.02;font-weight:900;letter-spacing:5px;background:linear-gradient(180deg,#fff7d7 0%,#e8c36b 35%,#a97824 70%,#ffe9a1 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 3px 20px #d7a94b36}
.subtitle{text-align:center;color:#d6c18b;font-size:10px;letter-spacing:3px;margin:7px 0 17px}
.progress-area{padding:0 5px}
.progress-head{display:flex;align-items:center;justify-content:space-between;color:#f3dda0;font-size:12px;font-weight:800;margin-bottom:8px}
.progress-head span:last-child{direction:ltr;font-family:Georgia,serif;letter-spacing:1px}
.progress-track{height:10px;border-radius:20px;border:1px solid #a78035;background:#100e0a;overflow:hidden;box-shadow:inset 0 2px 4px #000}
.progress-fill{height:100%;width:68%;border-radius:20px;background:linear-gradient(90deg,#80551a,#e4bd5d 45%,#fff0b0 72%,#b17c2d);box-shadow:0 0 12px #e8c36b99}
.divider{display:flex;align-items:center;gap:10px;margin:22px 0 16px;color:#f1d68c;font-weight:800;font-size:15px;white-space:nowrap}
.divider:before,.divider:after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,#c99b43,#f5e2a3)}
.divider span{position:relative;padding:0 3px;text-shadow:0 0 10px #d9ad4d66}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:1;align-content:start}
.slot{min-width:0;min-height:112px;border:1px solid #9b7736;border-radius:12px;background:linear-gradient(145deg,#15130fef,#080807f5 65%);box-shadow:inset 0 1px #fff2,0 4px 12px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;position:relative}
.slot:before{content:"";position:absolute;inset:4px;border:1px solid #d5b45a22;border-radius:8px;pointer-events:none}
.icon-ring{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;border:1px solid #e8c36b;background:radial-gradient(circle at 35% 25%,#59451f,#17120a 72%);box-shadow:0 0 13px #d5a74335,inset 0 1px #fff3;color:#f6d889}
.icon-ring svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.lock-label{display:flex;align-items:center;gap:4px;color:#f1d58e;font-size:11px;font-weight:900;letter-spacing:.8px}
.lock-label svg{width:12px;height:12px;stroke:#d6b45e;fill:none;stroke-width:1.8}
.bottom{margin-top:auto;padding-top:16px}
.charge{width:100%;height:49px;border:1px solid #ffedb1;border-radius:12px;background:linear-gradient(180deg,#fff0b4 0%,#e5bd5e 35%,#a87325 100%);color:#211707;font-size:17px;font-weight:950;letter-spacing:.5px;box-shadow:0 5px 0 #654316,0 8px 20px #d2a34233,inset 0 1px #fff9;cursor:pointer}
.charge:active{transform:translateY(2px);box-shadow:0 3px 0 #654316,0 5px 12px #d2a34233}
.toast{min-height:17px;text-align:center;margin-top:10px;color:#e4ce91;font-size:10px}
@media(max-width:360px){body{padding:6px 6px 88px}.vip-shell{min-height:650px;border-radius:17px}.inner{padding:14px 13px 16px;min-height:650px}.emblem{height:112px}.slot{min-height:101px}.grid{gap:7px}}
@media(min-height:900px){.vip-shell{max-height:790px}}
</style>
</head>
<body>
