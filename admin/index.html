<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة — GABO LIVE</title>
<style>
:root{--p:#7c3aed;--p2:#a78bfa}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,.22),transparent 48%),linear-gradient(145deg,#050407,#10091d 55%,#08060e);color:#f8f7ff;font-family:system-ui}
.wrap{width:min(1200px,calc(100% - 24px));margin:auto} .topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0}
.brand{color:#c4b5fd;font-weight:900;text-decoration:none} 
.card{background:rgba(17,12,29,.88);border:1px solid rgba(196,181,253,.18);border-radius:18px;padding:18px;margin:12px 0;backdrop-filter:blur(16px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px} 
.stat{padding:14px;border-radius:14px;background:#ffffff08;border:1px solid #ffffff15;text-align:center} .stat b{font-size:22px;color:var(--p2);display:block}
button{cursor:pointer;border-radius:12px;padding:10px 14px;border:1px solid #ffffff22;background:#211638;color:#fff}
.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);border:0} .danger{background:#2a1218;color:#ff8a8a;border-color:#ff8a8a33}
input{width:100%;background:#0d0b15;border:1px solid #ffffff22;border-radius:12px;padding:11px;color:#fff;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #ffffff12;border-radius:12px;margin:6px 0;background:#ffffff06}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar"><a class="brand" href="/">✦ GABO LIVE</a><div><span id="adminEmail" style="color:#aaa3bd;font-size:13px"></span> <button id="logout">خروج</button></div></div>

<div class="card">
<b>🌍 إنشاء المجتمعات الستة بضغطة زر</b>
<p style="color:#aaa3bd;font-size:13px">اضغط الزر مرة واحدة وينشئ كل المجتمعات في قاعدة البيانات</p>
<button id="createAll" class="primary" style="width:100%;padding:14px;font-size:16px">إنشاء المجتمعات الستة الآن</button>
<div id="commList" style="margin-top:12px"></div>
</div>

<div class="grid">
<div class="card"><b>📊 الإحصائيات</b><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px"><div class="stat"><b id="cUsers">0</b>الأعضاء</div><div class="stat"><b id="cMsgs">0</b>الرسائل</div><div class="stat"><b id="cComm">0</b>المجتمعات</div></div></div>
<div class="card"><b>➕ إضافة مجتمع جديد</b><input id="newName" placeholder="مثال: عمان"><input id="newIcon" placeholder="أيقونة مثال: 🇴🇲"><button id="addOne" class="primary" style="width:100%">إضافة</button></div>
</div>

<div class="card"><b>👥 كل الأعضاء - يظهرون تلقائياً بدون إضافة بالبريد</b><div id="usersList"></div></div>
<div class="card"><b>💬 كل الرسائل</b><div id="msgsList"></div></div>
</div>

<script type="module">
import { auth, db } from "/firebase-config.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { collection, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const commsDefault = [
 {id:'general', name:'الشات العام', icon:'🔥'},
 {id:'saudi', name:'مجتمع السعودية', icon:'🇸🇦'},
 {id:'yemen', name:'مجتمع اليمن', icon:'🇾🇪'},
 {id:'kuwait', name:'مجتمع الكويت', icon:'🇰🇼'},
 {id:'uae', name:'مجتمع الإمارات', icon:'🇦🇪'},
 {id:'bahrain', name:'مجتمع البحرين', icon:'🇧🇭'}
];

let me=null;
onAuthStateChanged(auth, u=>{
 if(!u){ location.href='/login/'; return; }
 me=u; document.getElementById('adminEmail').innerText=u.email;
 listenAll();
});

document.getElementById('logout').onclick=()=>signOut(auth).then(()=>location.href='/login/');

document.getElementById('createAll').onclick=async()=>{
 const btn=document.getElementById('createAll'); btn.innerText='جاري الإنشاء...'; btn.disabled=true;
 for(const c of commsDefault){
   await setDoc(doc(db,'communities',c.id),{...c, createdAt:serverTimestamp()});
 }
 btn.innerText='✅ تم إنشاء المجتمعات الستة'; setTimeout(()=>{btn.innerText='إنشاء المجتمعات الستة الآن'; btn.disabled=false;},2000);
};

document.getElementById('addOne').onclick=async()=>{
 const name=document.getElementById('newName').value.trim(); const icon=document.getElementById('newIcon').value.trim()||'🌍';
 if(!name) return; const id='comm_'+Date.now();
 await setDoc(doc(db,'communities',id),{name,icon,createdAt:serverTimestamp()});
 document.getElementById('newName').value=''; document.getElementById('newIcon').value='';
};

function listenAll(){
 onSnapshot(collection(db,'communities'), s=>{
   const list=document.getElementById('commList'); list.innerHTML=''; let count=0;
   s.forEach(d=>{ count++; const c=d.data(); const div=document.createElement('div'); div.className='row'; div.innerHTML=`<span>${c.icon||'🌍'} ${c.name}</span><button class="danger" data-id="${d.id}">حذف</button>`; div.querySelector('button').onclick=()=>deleteDoc(doc(db,'communities',d.id)); list.appendChild(div); });
   document.getElementById('cComm').innerText=count;
 });
 onSnapshot(collection(db,'users'), s=>{
   const list=document.getElementById('usersList'); list.innerHTML=''; let count=0;
   s.forEach(d=>{ count++; const u=d.data(); const div=document.createElement('div'); div.className='row'; div.innerHTML=`<span>🟢 ${u.name||u.email} - ${u.email}</span><div><button onclick="location.href='/app/private/?to=${u.uid}'">خاص</button> <button class="danger" data-id="${d.id}">حذف</button></div>`; div.querySelector('.danger').onclick=()=>deleteDoc(doc(db,'users',d.id)); list.appendChild(div); });
   document.getElementById('cUsers').innerText=count;
 });
 onSnapshot(collection(db,'messages'), s=>{
   document.getElementById('cMsgs').innerText=s.size;
   const list=document.getElementById('msgsList'); list.innerHTML='';
   let arr=[]; s.forEach(d=>arr.push({id:d.id,...d.data()})); arr.sort((a,b)=> (b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)); arr=arr.slice(0,30);
   arr.forEach(m=>{ const div=document.createElement('div'); div.className='row'; div.innerHTML=`<span><b>${m.name||'مجهول'}</b>: ${m.text} <small style="color:#aaa3bd">(${m.communityId})</small></span><button class="danger" data-id="${m.id}">حذف</button>`; div.querySelector('button').onclick=()=>deleteDoc(doc(db,'messages',m.id)); list.appendChild(div); });
 });
}
</script>
</body>
</html>
