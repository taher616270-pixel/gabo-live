<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>انضم كمضيف — GABO LIVE</title>
<link rel="stylesheet" href="/assets/style/style.css">
<style>
:root{color-scheme:dark;--bg:#08070d;--text:#f8f7ff}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(124,58,237,.22),transparent 48%),#08070d;color:#f8f7ff;font-family:system-ui;line-height:1.6;padding-bottom:90px}
.wrap{width:min(1180px,calc(100% - 28px));margin:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 0;position:sticky;top:0;background:rgba(8,7,13,.9);backdrop-filter:blur(12px);z-index:50}
.brand{color:#c4b5fd;font-weight:900;font-size:20px;text-decoration:none}
.btn{cursor:pointer;border-radius:12px;padding:10px 15px;border:1px solid #ffffff22;color:#fff;background:#211638;text-decoration:none;font-weight:700}
.btn.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6)}
.glass{background:rgba(17,12,29,.82);border:1px solid rgba(196,181,253,.18);border-radius:20px;backdrop-filter:blur(18px)}
.mainpanel{padding:22px}
.page{display:none}.page.active{display:block}
.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}
.input{background:#0d0b15;color:#fff;border:1px solid #ffffff22;border-radius:12px;padding:12px;width:100%;outline:none}
.input:focus{border-color:#a78bfa}
.bottom-nav{position:fixed;z-index:1000;bottom:10px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 20px));display:flex;justify-content:space-around;padding:8px;background:rgba(15,12,24,.96);border:1px solid #ffffff20;border-radius:18px}
.bottom-nav a{display:flex;flex-direction:column;align-items:center;color:#aaa3bd;text-decoration:none;padding:6px 12px;border-radius:12px;font-size:11px}
.bottom-nav a.active{color:#c4b5fd;background:#7c3aed22}
.gradient-text{background:linear-gradient(90deg,#fff,#c4b5fd 55%,#8b5cf6);-webkit-background-clip:text;color:transparent}
.eyebrow{color:#c4b5fd;font-weight:800;font-size:12px;letter-spacing:1px}
</style>
</head>
<body data-page="hosts">
<div class="wrap">
<header class="topbar">
<a class="brand" href="/">GABO LIVE ✨</a>
<a class="btn" href="/app/">دخول المجتمع</a>
</header>

<!-- صفحة 1: التعريف -->
<div class="page active" id="page-intro">
<div style="padding:40px 0;display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center">
<div>
<span class="eyebrow">BECOME A HOST</span>
<h1 style="font-size:48px;margin:10px 0">صوتك له <span class="gradient-text">مساحة</span></h1>
<p style="color:#aaa3bd;line-height:1.8">انضم لمجتمع المضيفين في GABO LIVE. افتح غرف صوتية، قدّم محتوى، واكسب تفاعل حقيقي.</p>
<button class="btn primary" onclick="showPage('form')" style="margin-top:16px">ابدأ التسجيل ↓</button>
</div>
<div class="glass mainpanel">
<h3>مميزات المضيف 🎙️</h3>
<div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
<div>✅ افتح غرف صوتية خاصة</div>
<div>✅ تحكم كامل بالمايكات</div>
<div>✅ شارة مضيف مميزة</div>
<div>✅ دعم من الإدارة</div>
</div>
</div>
</div>
</div>

<!-- صفحة 2: الفورم -->
<div class="page" id="page-form">
<form id="hostForm" class="glass mainpanel" style="max-width:600px;margin:20px auto">
<h2 style="margin-top:0">طلب تسجيل مضيف</h2>
<div class="field"><label>الاسم الكامل</label><input class="input" id="hostName" required placeholder="اسمك الكامل"></div>
<div class="field"><label>البريد الإلكتروني</label><input class="input" id="hostEmail" type="email" required placeholder="name@example.com"></div>
<div class="field"><label>رقم الجوال</label><input class="input" id="hostPhone" required placeholder="+966..."></div>
<div class="field"><label>الدولة</label>
<select id="hostCountry" class="input">
<option>السعودية</option><option>اليمن</option><option>الإمارات</option><option>الكويت</option><option>البحرين</option><option>عمان</option><option>قطر</option><option>مصر</option><option>الأردن</option><option>أخرى</option>
</select></div>
<div class="field"><label>نبذة</label><textarea id="hostDetails" class="input" placeholder="عرفنا عن نفسك" style="min-height:90px"></textarea></div>
<button class="btn primary" style="width:100%">إرسال الطلب</button>
<div style="text-align:center;margin-top:12px"><a onclick="showPage('intro')" style="color:#aaa3bd;cursor:pointer">← رجوع</a></div>
</form>
</div>

</div>

<nav class="bottom-nav">
<a href="/"><b>⌂</b><span>الرئيسية</span></a>
<a href="/app/"><b>♬</b><span>المجتمع</span></a>
<a data-page="intro" class="active" onclick="showPage('intro')"><b>♙</b><span>المضيفون</span></a>
<a href="/profile/"><b>◉</b><span>حسابي</span></a>
</nav>

<script>
function showPage(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById('page-'+id).classList.add('active');
}
</script>
<script type="module" src="/assets/app.js"></script>
</body>
</html>
