<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>انضم كمضيف — GABO LIVE</title>
<link rel="stylesheet" href="/assets/style/style.css">
<link rel="stylesheet" href="/assets/style/gabo-theme.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/app/">GABO LIVE ✨</a>
    <a class="btn sm" href="/app/">دخول المجتمع</a>
  </header>

  <section class="page active" id="page-intro">
    <div class="hero">
      <div>
        <span class="eyebrow">BECOME A HOST</span>
        <h1>صوتك له <span class="gt">مساحة</span></h1>
        <p class="muted" style="line-height:1.8">انضم لمجتمع المضيفين في GABO LIVE. افتح غرف صوتية، قدّم محتوى، واكسب تفاعل حقيقي.</p>
        <button class="btn primary" data-show="form" style="margin-top:12px">ابدأ التسجيل ↓</button>
      </div>
      <div class="card pad" style="margin:0">
        <h3 style="padding:0 0 10px;border:0;font-size:16px">مميزات المضيف 🎙️</h3>
        <div style="display:flex;flex-direction:column;gap:10px"><div>✅ افتح غرف صوتية خاصة</div><div>✅ تحكم كامل بالمايكات</div><div>✅ شارة مضيف مميزة</div><div>✅ دعم من الإدارة</div></div>
      </div>
    </div>
  </section>

  <section class="page" id="page-form">
    <form id="hostForm" class="card pad" style="max-width:600px;margin:20px auto">
      <h2 style="margin-top:0">طلب تسجيل مضيف</h2>
      <div class="field"><label>الاسم الكامل</label><input class="input" id="hostName" required placeholder="اسمك الكامل"></div>
      <div class="field"><label>البريد الإلكتروني</label><input class="input" id="hostEmail" type="email" required placeholder="name@example.com"></div>
      <div class="field"><label>رقم الجوال</label><input class="input" id="hostPhone" required inputmode="tel" placeholder="+966..."></div>
      <div class="field"><label>الدولة</label>
        <select id="hostCountry" class="input"><option>السعودية</option><option>اليمن</option><option>الإمارات</option><option>الكويت</option><option>البحرين</option><option>عمان</option><option>قطر</option><option>مصر</option><option>الأردن</option><option>أخرى</option></select></div>
      <div class="field"><label>نبذة</label><textarea class="input" id="hostDetails" maxlength="500" placeholder="عرفنا عن نفسك"></textarea></div>
      <button class="btn primary block" id="hostBtn">إرسال الطلب</button>
      <div style="text-align:center;margin-top:12px"><a data-show="intro" href="#" class="muted">← رجوع</a></div>
    </form>
  </section>
</div>

<script type="module">
import { db, boot, me, myProfile, toast, showPage, $ } from '/assets/app.js';
import { collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

await boot();
if (me) { $('#hostName').value = myProfile.name || me.displayName || ''; $('#hostEmail').value = me.email || ''; }

$('#hostForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('#hostBtn'); btn.disabled = true;
  try {
    await addDoc(collection(db, 'hosts'), {
      name: $('#hostName').value.trim(), email: $('#hostEmail').value.trim(), phone: $('#hostPhone').value.trim(),
      city: $('#hostCountry').value, details: $('#hostDetails').value.trim(),
      uid: me?.uid || null, approved: false, createdAt: serverTimestamp()
    });
    e.target.reset(); showPage('intro');
    toast('وصل طلبك ✅ بنراجعه ونتواصل معك على بريدك', 'ok');
  } catch (err) { toast('تعذر ارسال الطلب، حاول مرة ثانية', 'error'); }
  btn.disabled = false;
};
</script>

</body>
</html>
