<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GABO LIVE</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed;--muted:#8b8ba7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;padding-bottom:110px;min-height:100vh}
.top{height:56px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:50}
.tabs{display:flex;gap:8px;padding:12px 14px}
.tabs button{flex:1;background:#161426;border:1px solid var(--b);color:var(--muted);padding:12px;border-radius:14px;font-weight:800;font-size:13px}
.tabs button.on{background:var(--v);color:#fff;border-color:var(--v)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 12px}
.comm{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;text-align:center}
.flag{width:72px;height:48px;border-radius:12px;border:1px solid #2a2840;overflow:hidden;display:block;background:#000;flex-shrink:0}
.flag svg{width:100%;height:100%;display:block}
.comm b{font-size:13px;display:flex;align-items:center;gap:6px;justify-content:center}
.miniFlag{width:20px;height:13px;border-radius:3px;overflow:hidden;display:inline-flex;border:1px solid #333;flex-shrink:0}
.miniFlag svg{width:100%;height:100%;display:block}
.comm small{color:var(--muted);font-size:11px}
.createBtn{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--v);color:#fff;border:0;padding:14px 26px;border-radius:30px;font-weight:900;font-size:14px;box-shadow:0 8px 20px rgba(124,58,237,.4);z-index:999;cursor:pointer}
.bottomNav{position:fixed;bottom:0;left:0;right:0;height:84px;background:#0f0e18;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;z-index:9999;direction:ltr}
.bottomNav a{flex:1;text-decoration:none;color:#6b6b7a;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.bottomNav a.on{color:#fff}
.bottomNav a .ic{font-size:22px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.bottomNav a.plus .ic{background:var(--v);color:#fff;width:56px;height:56px;border-radius:16px;font-size:30px;margin-top:-16px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:10000;display:none;align-items:flex-end;justify-content:center;padding:12px}
.modal.on{display:flex}
.modalBox{background:#161426;border:1px solid var(--b);border-radius:20px 20px 0 0;width:100%;max-width:420px;padding:16px;max-height:90vh;overflow:auto}
.modalBox h3{text-align:center;margin-bottom:14px}
.imgPicker{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:14px}
.imgBox{width:72px;height:48px;border-radius:12px;border:1.5px dashed var(--v);overflow:hidden;background:#0f0e18;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.imgBox svg,.imgBox img{width:100%;height:100%;display:block;object-fit:cover}
.imgBox span{font-size:20px;color:var(--muted)}
.field{margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.field input{width:100%;background:#0f0e18;border:1px solid var(--b);border-radius:12px;padding:12px;color:#fff;font-size:14px}
.flagOptions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.flagOpt{width:52px;height:36px;border-radius:8px;border:2px solid var(--b);overflow:hidden;cursor:pointer;display:block}
.flagOpt.on{border-color:var(--v);box-shadow:0 0 0 2px rgba(124,58,237,.3)}
.flagOpt svg{width:100%;height:100%;display:block}
.modalBtns{display:flex;gap:8px;margin-top:14px}
.modalBtns button{flex:1;padding:12px;border-radius:12px;border:0;font-weight:900;font-size:14px;cursor:pointer}
.btnCancel{background:#1e1c2e;color:#fff;border:1px solid var(--b)!important}
.btnCreate{background:var(--v);color:#fff}
</style>
</head>
<body>
<div class="top"><b>✨ GABO LIVE</b><span>🔔</span></div>
<div class="tabs"><button class="on">المجتمعات</button><button onclick="location.href='/dm/'">شات العالم 🌍</button></div>

<div id="commPage" class="grid"></div>

<button class="createBtn" onclick="openCreate()">+ إنشاء مجتمع جديد</button>

<div id="createModal" class="modal" onclick="if(event.target===this)closeCreate()">
  <div class="modalBox">
    <h3>إنشاء مجتمع جديد</h3>
    <div class="imgPicker">
      <div class="imgBox" id="imgBox" onclick="document.getElementById('fileInput').click()">
        <span id="imgPlus">+</span>
        <img id="imgPreview" style="display:none">
      </div>
      <small style="color:var(--muted);font-size:11px">صورة مربعة بنفس حجم الأعلام 72x48</small>
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="previewImg(this)">
    </div>
    <div class="field"><label>اسم المجتمع</label><input id="commNameInput" placeholder="مثال: سواق"></div>
    <div class="field">
      <label>علم الدولة</label>
      <div class="flagOptions" id="flagOpts"></div>
    </div>
    <div class="modalBtns"><button class="btnCancel" onclick="closeCreate()">إلغاء</button><button class="btnCreate" onclick="doCreate()">إنشاء</button></div>
  </div>
</div>

<div class="bottomNav">
  <a href="/profile/"><span class="ic">👤</span><span>حسابي</span></a>
  <a href="/dm/"><span class="ic">🔒</span><span>خاص</span></a>
  <a href="#" class="plus" onclick="openCreate();return false"><span class="ic">+</span></a>
  <a href="/posts/"><span class="ic">📄</span><span>منشورات</span></a>
  <a href="/app/" class="on"><span class="ic">🏠</span><span>الرئيسية</span></a>
</div>

<script type="module">
import { auth, db } from '/firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { collection, onSnapshot, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// كل الأعلام SVG تملى المربع كامل
const FLAGS={
south:`<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="200" y="0" fill="#D71921"/><rect width="900" height="200" y="200" fill="#FFF"/><rect width="900" height="200" y="400" fill="#000"/><path d="M0 0 L380 300 L0 600 Z" fill="#4AA6E0"/><g transform="translate(125,300)"><path d="M0 -70 L20 -22 L75 -22 L32 10 L48 65 L0 32 L-48 65 L-32 10 L-75 -22 L-20 -22 Z" fill="#D71921" stroke="white" stroke-width="10" stroke-linejoin="round"/></g></svg>`,
sa:`<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="600" fill="#165D31"/><g fill="white"><text x="450" y="320" font-size="120" font-family="serif" text-anchor="middle" font-weight="700">لا إله إلا الله</text><rect x="300" y="380" width="300" height="12" fill="white"/></g></svg>`,
ye:`<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="200" y="0" fill="#CE1126"/><rect width="900" height="200" y="200" fill="#FFF"/><rect width="900" height="200" y="400" fill="#000"/></svg>`,
ae:`<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"><rect x="180" width="720" height="200" y="0" fill="#00732F"/><rect x="180" width="720" height="200" y="200" fill="#FFF"/><rect x="180" width="720" height="200" y="400" fill="#000"/><rect width="180" height="600" fill="#FF0000"/></svg>`,
om:`<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="200" y="0" fill="#FFF"/><rect width="900" height="200" y="200" fill="#DA0000"/><rect width="900" height="200" y="400" fill="#00B000"/><rect width="180" height="600" fill="#DA0000"/></svg>`,
qa:`<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="600" fill="white"/><path d="M0 0 H270 Q270 33 240 50 Q270 66 270 100 Q270 133 240 150 Q270 166 270 200 Q270 233 240 250 Q270 266 270 300 Q270 333 240 350 Q270 366 270 400 Q270 433 240 450 Q270 466 270 500 Q270 533 240 550 Q270 566 270 600 H0 Z" fill="#8D1B3D"/><path d="M270 0 H900 V600 H270 Z" fill="#8D1B3D" opacity="0"/></svg>`,
kw:`<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"><rect x="200" width="700" height="200" y="0" fill="#007A3D"/><rect x="200" width="700" height="200" y="200" fill="#FFF"/><rect x="200" width="700" height="200" y="400" fill="#CE1126"/><path d="M0 0 L200 100 L200 200 L0 300 L0 300 L200 400 L200 500 L0 600 Z" fill="#000"/></svg>`,
bh:`<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="600" fill="white"/><path d="M0 0 H260 L200 60 L260 120 L200 180 L260 240 L200 300 L260 360 L200 420 L260 480 L200 540 L260 600 H0 Z" fill="#CE1126"/></svg>`
};

const NAMES={south:'الجنوب العربي',sa:'السعودية',ye:'اليمن',ae:'الإمارات',om:'عمان',qa:'قطر',kw:'الكويت',bh:'البحرين'};

let uid=localStorage.getItem('gabo_uid')||null;
let selectedFlag='south';
let selectedImgBase64=null;

onAuthStateChanged(auth,u=>{ if(u){ uid=u.uid; localStorage.setItem('gabo_uid',u.uid); }});

window.goComm=id=>location.href=`community/index.html?id=${id}`;
window.openCreate=()=>document.getElementById('createModal').classList.add('on');
window.closeCreate=()=>document.getElementById('createModal').classList.remove('on');
window.selectFlag=(el,flag)=>{ document.querySelectorAll('.flagOpt').forEach(e=>e.classList.remove('on')); el.classList.add('on'); selectedFlag=flag; }
window.previewImg=(input)=>{ if(input.files && input.files[0]){ const reader=new FileReader(); reader.onload=e=>{ selectedImgBase64=e.target.result; const img=document.getElementById('imgPreview'); img.src=selectedImgBase64; img.style.display='block'; document.getElementById('imgPlus').style.display='none'; }; reader.readAsDataURL(input.files[0]); } }
window.doCreate=async()=>{
  const name=document.getElementById('commNameInput').value.trim();
  if(!name){ alert('اكتب اسم المجتمع'); return; }
  if(!uid){ alert('سجل دخول أول'); location.href='/login/'; return; }
  const id=name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-أ-ي]/g,'')+'-'+Date.now().toString(36).slice(-4);
  try{
    await setDoc(doc(db,'communities',id),{name:name,flag:selectedFlag,img:selectedImgBase64||null,ownerUid:uid,members:[uid],membersCount:1,banned:[],closed:false,createdAt:serverTimestamp()});
    closeCreate(); document.getElementById('commNameInput').value=''; selectedImgBase64=null; document.getElementById('imgPreview').style.display='none'; document.getElementById('imgPlus').style.display='block'; goComm(id);
  }catch(e){ alert('خطأ: '+e.message); }
}

// بناء الشبكة
const grid=document.getElementById('commPage');
function buildStatic(){
  grid.innerHTML='';
  ['south','sa','ye','ae'].forEach(id=>{
    const div=document.createElement('div'); div.className='comm'; div.onclick=()=>goComm(id);
    div.innerHTML=`<div class="flag">${FLAGS[id]}</div><b><span class="miniFlag">${FLAGS[id]}</span>${NAMES[id]}</b><small>رسمي</small>`;
    grid.appendChild(div);
  });
}
buildStatic();

// خيارات الأعلام في النافذة
const opts=document.getElementById('flagOpts');
Object.keys(FLAGS).forEach(k=>{
  const d=document.createElement('div'); d.className='flagOpt'+(k==='south'?' on':''); d.onclick=()=>selectFlag(d,k);
  d.innerHTML=FLAGS[k];
  opts.appendChild(d);
});

onSnapshot(collection(db,'communities'),snap=>{
  buildStatic();
  snap.forEach(d=>{
    if(['south','sa','ye','ae'].includes(d.id)) return;
    const data=d.data();
    const div=document.createElement('div'); div.className='comm userComm'; div.onclick=()=>goComm(d.id);
    let flagHtml=''; if(data.img){ flagHtml=`<div class="flag"><img src="${data.img}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`; }else{ flagHtml=`<div class="flag">${FLAGS[data.flag]||FLAGS['sa']}</div>`; }
    let miniFlag=`<span class="miniFlag">${FLAGS[data.flag]||FLAGS['sa']}</span>`;
    div.innerHTML=`${flagHtml}<b>${miniFlag}${data.name}</b><small>${data.membersCount||1} عضو ${data.closed?'🔒':''}</small>`;
    grid.appendChild(div);
  });
});
</script>
</body>
</html>
