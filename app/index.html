<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GABO LIVE</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed;--muted:#8b8ba7}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:system-ui;padding-bottom:96px;min-height:100vh}
.top{height:56px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:50}
.tabs{display:flex;gap:8px;padding:12px 14px}
.tabs button{flex:1;background:#161426;border:1px solid var(--b);color:var(--muted);padding:12px;border-radius:14px;font-weight:800}
.tabs button.on{background:var(--v);color:#fff;border-color:var(--v)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.comm{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;text-align:center;position:relative}
.flag{width:64px;height:40px;border-radius:8px;border:1px solid #2a2840;overflow:hidden;display:flex;background:#000}
.flag img,.flag svg{width:100%;height:100%;object-fit:cover;display:block}
.comm b{font-size:12px;display:flex;align-items:center;gap:5px;justify-content:center}
.miniFlag{width:18px;height:12px;border-radius:3px;overflow:hidden;display:inline-flex;border:1px solid #333}
.comm small{color:var(--muted);font-size:11px}
.comm .owner{position:absolute;top:6px;left:6px;background:var(--v);font-size:9px;padding:2px 6px;border-radius:6px}
.comm.create{border:1.5px dashed var(--v);justify-content:center}
.bottomNav{position:fixed;bottom:0;left:0;right:0;height:84px;background:#0f0e18;border-top:1px solid var(--b);display:flex;justify-content:space-around;align-items:flex-start;padding-top:8px;z-index:9999;direction:ltr}
.bottomNav a{flex:1;text-decoration:none;color:#6b6b7a;font-size:10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.bottomNav a.on{color:#fff}
.bottomNav a .ic{font-size:22px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.bottomNav a.plus .ic{background:var(--v);color:#fff;width:56px;height:56px;border-radius:16px;font-size:30px;margin-top:-16px}
</style>
</head>
<body>
<div class="top"><b>✨ GABO LIVE</b><span onclick="location.href='/profile/'">👤</span></div>
<div class="tabs"><button class="on">المجتمعات</button><button onclick="location.href='/dm/'">شات العالم 🌍</button></div>

<div id="commPage" class="grid">
  <!-- المجتمعات الثابتة -->
  <div class="comm" onclick="goComm('south')"><div class="flag"><svg viewBox="0 0 90 60" xmlns="http://www.w3.org/2000/svg"><rect width="90" height="20" y="0" fill="#D71921"/><rect width="90" height="20" y="20" fill="#FFF"/><rect width="90" height="20" y="40" fill="#000"/><path d="M0 0 L45 30 L0 60 Z" fill="#4AA6D0"/><polygon points="20,18 22.5,24 29,24 23.8,27.8 25.3,34 20,30 14.7,34 16.2,27.8 11,24 17.5,24" fill="#D71921"/></svg></div><b><span class="miniFlag"><svg viewBox="0 0 90 60" xmlns="http://www.w3.org/2000/svg"><rect width="90" height="20" y="0" fill="#D71921"/><rect width="90" height="20" y="20" fill="#FFF"/><rect width="90" height="20" y="40" fill="#000"/><path d="M0 0 L45 30 L0 60 Z" fill="#4AA6D0"/></svg></span>الجنوب العربي</b><small>رسمي</small></div>
  <div class="comm" onclick="goComm('sa')"><div class="flag"><img src="https://flagcdn.com/w80/sa.png"></div><b>🇸🇦 السعودية</b><small>رسمي</small></div>
  <div class="comm" onclick="goComm('ye')"><div class="flag"><img src="https://flagcdn.com/w80/ye.png"></div><b>🇾🇪 اليمن</b><small>رسمي</small></div>
  <div class="comm" onclick="goComm('ae')"><div class="flag"><img src="https://flagcdn.com/w80/ae.png"></div><b>🇦🇪 الإمارات</b><small>رسمي</small></div>
  
  <div class="comm create" onclick="createComm()"><div class="flag" style="background:#1e1c2e;justify-content:center;align-items:center;font-size:26px">+</div><b>إنشاء مجتمع جديد</b><small>الكل يقدر ينشئ</small></div>
</div>

<div class="bottomNav">
  <a href="/profile/"><span class="ic">👤</span><span>حسابي</span></a>
  <a href="/dm/"><span class="ic">🔒</span><span>خاص</span></a>
  <a href="#" class="plus" onclick="createComm();return false"><span class="ic">+</span></a>
  <a href="/posts/"><span class="ic">📄</span><span>منشورات</span></a>
  <a href="/app/" class="on"><span class="ic">🏠</span><span>الرئيسية</span></a>
</div>

<script type="module">
import { auth, db } from '/firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { collection, addDoc, onSnapshot, serverTimestamp, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

let uid = localStorage.getItem('gabo_uid') || null;
let uname = localStorage.getItem('gabo_name') || 'مستخدم';

onAuthStateChanged(auth, u=>{
  if(u){ uid=u.uid; localStorage.setItem('gabo_uid', u.uid); }
});

window.goComm = (id) => location.href = `/community/?id=${id}`;

// تحميل المجتمعات اللي انشأها الناس
const grid = document.getElementById('commPage');
onSnapshot(collection(db,'communities'), snap=>{
  // احذف القديمة اللي من الناس
  grid.querySelectorAll('.userComm').forEach(e=>e.remove());
  snap.forEach(d=>{
    const data=d.data();
    if(['south','sa','ye','ae'].includes(d.id)) return;
    const div=document.createElement('div');
    div.className='comm userComm';
    div.onclick=()=>goComm(d.id);
    const isOwner = data.ownerUid===uid;
    div.innerHTML=`
      ${isOwner?'<span class="owner">مالك</span>':''}
      <div class="flag" style="background:${data.color||'#7c3aed'};justify-content:center;align-items:center;color:#fff;font-weight:900;font-size:20px">${(data.name||'M')[0]}</div>
      <b>${data.name}</b>
      <small>${data.membersCount||0} عضو ${data.closed?'🔒 مغلق':''}</small>
    `;
    grid.insertBefore(div, grid.lastElementChild);
  });
});

window.createComm = async () => {
  if(!uid){ alert('سجل دخول أول'); location.href='/login/'; return; }
  const name = prompt('اسم المجتمع الجديد:');
  if(!name) return;
  const color = '#'+Math.floor(Math.random()*16777215).toString(16);
  const id = name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-أ-ي]/g,'') + '-' + Date.now().toString(36).slice(-4);
  try{
    await setDoc(doc(db,'communities',id),{
      name:name,
      ownerUid:uid,
      ownerName:uname,
      color:color,
      members:[uid],
      membersCount:1,
      banned:[],
      closed:false,
      createdAt:serverTimestamp()
    });
    alert('تم إنشاء '+name);
    goComm(id);
  }catch(e){ alert('خطأ: '+e.message); }
}
</script>
</body>
</html>
