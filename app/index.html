<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المجتمع — GABO LIVE</title>
<link rel="stylesheet" href="/assets/style/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/app/">GABO LIVE ✨</a>
    <div><a class="btn sm" href="/hosts/">مضيف؟</a> <button class="btn sm" id="logoutBtn">خروج</button></div>
  </header>

  <div class="seg"><button class="on" data-show="communities">🌍 المجتمعات</button><button data-show="members">👥 الأعضاء</button></div>

  <section class="page active" id="page-communities">
    <div class="card"><h3>المجتمعات</h3><div class="list" id="communityList"><div class="empty">جاري التحميل...</div></div></div>
    <div class="card"><h3 id="chatTitle">الشات العام</h3>
      <div class="msgs" id="msgsBox"></div>
      <div class="composer"><input id="msgInput" class="input" placeholder="اكتب رسالة..." maxlength="500"><button id="sendBtn" class="btn primary">↑</button></div>
    </div>
  </section>

  <section class="page" id="page-members">
    <div class="card"><h3>كل الأعضاء</h3><div class="list" id="usersList"><div class="empty">جاري التحميل...</div></div></div>
  </section>
</div>

<script type="module">
import { auth, db } from '/firebase-config.js';
import { onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import { mountChat, esc } from '/assets/app.js';

let currentUser = null;

// 1- تحقق تسجيل الدخول أول
onAuthStateChanged(auth, (user) => {
  if(!user){
    location.replace('/login/');
    return;
  }
  currentUser = user;
  initApp(user);
});

async function initApp(user){
  const $ = s => document.querySelector(s);
  const $$ = (s,r=document) => [...r.querySelectorAll(s)];

  let current = new URLSearchParams(location.search).get('c') || 'general';
  
  // شغل الشات
  try{
    const chat = mountChat({ box: $('#msgsBox'), input: $('#msgInput'), button: $('#sendBtn'), community: current, uid: user.uid });
    
    // تحميل المجتمعات
    onSnapshot(collection(db, 'communities'), snap => {
      const el = $('#communityList'); el.replaceChildren();
      if (snap.empty) { el.innerHTML = '<div class="empty">لا يوجد مجتمعات بعد</div>'; return; }
      snap.forEach(d => {
        const c = d.data(), id = c.id || d.id;
        const row = document.createElement('div');
        row.className = 'item' + (id === current ? ' active' : '');
        row.innerHTML = `<span>${esc(c.icon || '🌍')} ${esc(c.name || id)}</span><small>💬</small>`;
        if (id === current) $('#chatTitle').textContent = c.name || id;
        row.onclick = () => {
          current = id; $('#chatTitle').textContent = c.name || id;
          $$('.item', el).forEach(i => i.classList.remove('active')); row.classList.add('active');
          chat.setCommunity(id);
        };
        el.append(row);
      });
    }, err => {
      console.error(err);
      $('#communityList').innerHTML = `<div class="empty">خطأ: ${err.message}</div>`;
    });

    // تحميل الأعضاء
    onSnapshot(collection(db, 'users'), snap => {
      const el = $('#usersList'); el.replaceChildren();
      snap.forEach(d => {
        if (d.id === user.uid) return;
        const u = d.data();
        if (u.banned) return;
        const row = document.createElement('div'); row.className = 'item';
        row.innerHTML = `<span>${esc(u.name || u.email)}<br><small>${u.subscription === 'VIP' ? '♛ VIP' : ''}</small></span><small>✉</small>`;
        row.onclick = () => (location.href = '/app/private/?to=' + d.id);
        el.append(row);
      });
      if (!el.children.length) el.innerHTML = '<div class="empty">لا يوجد أعضاء آخرين بعد</div>';
    }, err => {
      console.error(err);
      $('#usersList').innerHTML = `<div class="empty">خطأ: ${err.message}</div>`;
    });

  }catch(e){
    console.error(e);
    $('#communityList').innerHTML = `<div class="empty">خطأ تحميل: ${e.message}</div>`;
  }
}

document.getElementById('logoutBtn').onclick = async () => {
  await signOut(auth);
  location.replace('/login/');
};

// تبديل التبويبات
document.querySelectorAll('[data-show]').forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll('[data-show]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById('page-'+btn.dataset.show).classList.add('active');
  };
});
</script>
</body>
</html>
