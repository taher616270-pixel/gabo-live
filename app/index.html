<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الرئيسية - GABO LIVE</title>
<style>
:root{--bg:#080810;--card:#161426;--b:#2a2840;--v:#7c3aed}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:#fff;font-family:system-ui;min-height:100vh}

.top{height:60px;background:#0f0e18;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:10}
.top b{font-size:16px}

.feed{padding:12px;display:flex;flex-direction:column;gap:12px}
.post{background:var(--card);border:1px solid var(--b);border-radius:18px;padding:14px}
.post .head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.post .avatar{width:42px;height:42px;border-radius:50%;background:#2a2840}
.post .content{font-size:14px;line-height:1.6;color:#d0d0e0}
</style>
</head>
<body>

<div class="top">
  <b>🏠 GABO LIVE</b>
  <a href="/notifications/" style="width:40px;height:40px;background:#1e1c2e;border:1px solid var(--b);border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none">🔔</a>
</div>

<div class="feed" id="feed">
  <div class="post">
    <div class="head"><div class="avatar"></div><div><b>مرحبا بك 👋</b><br><small style="color:#8b8ba7">GABO LIVE</small></div></div>
    <div class="content">هذه الصفحة الرئيسية - المنشورات ستظهر هنا</div>
  </div>
</div>

<script type="module">
import { auth } from '/firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

onAuthStateChanged(auth, u=>{
  if(!u) location.replace('/login/');
});
</script>

</body>
</html>
