<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>العام — GABO LIVE</title>
<link rel="stylesheet" href="/assets/style/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/app/">GABO LIVE ✨</a>
    <div><a class="btn sm" href="/app/">كل المجتمعات</a> <button class="btn sm" data-logout>خروج</button></div>
  </header>
  <div class="card"><h3>🔥 الشات العام</h3>
    <div class="msgs" id="msgsBox"></div>
    <div class="composer"><input id="msgInput" class="input" placeholder="اكتب رسالة..." maxlength="500"><button id="sendBtn" class="btn primary">↑</button></div>
  </div>
</div>
<script type="module">
import { boot, mountChat, $ } from '/assets/app.js';
await boot({ auth: true });
mountChat({ box: $('#msgsBox'), input: $('#msgInput'), button: $('#sendBtn'), community: 'general' });
</script>
</body>
</html>
