<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غرفة صوتية</title>
<style>
:root{--bg1:#4a3a78;--bg2:#7a4f86;--bg3:#c8706a;--glass:rgba(255,255,255,.2);--text:#fff;--green:#1f7a4a;--teal:#4fd6c0;--box:rgba(20,16,30,.55)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0912}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--text);display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;display:flex;flex-direction:column;
background:radial-gradient(1.5px 1.5px at 20% 12%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 8%,#fff8,transparent),radial-gradient(1px 1px at 40% 25%,#fff7,transparent),
linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 38%,var(--bg3) 62%,#2a1a2a 78%,#07060a 100%);
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.hill{position:absolute;inset:auto 0 0 0;height:42%;background:radial-gradient(120% 60% at 30% 100%,#000 55%,transparent 56%),radial-gradient(90% 40% at 85% 100%,#050308 60%,transparent 61%);opacity:.95;pointer-events:none}
.moon{position:absolute;top:30%;right:46%;width:46px;height:46px;border-radius:50%;box-shadow:inset -9px 0 0 #d9cfa0;opacity:.7;transform:rotate(-20deg)}
header{position:relative;z-index:2;padding:14px 14px 0;display:flex;justify-content:space-between;align-items:flex-start}
.room{display:flex;align-items:center;gap:10px;background:rgba(40,30,70,.55);border-radius:30px;padding:5px 6px 5px 12px;max-width:62%}
.room .t{flex:1;min-width:0;text-align:right}
.room b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room small{opacity:.7;font-size:13px;direction:ltr;display:block}
.ph{width:44px;height:44px;border-radius:50%;border:2px solid #fff6;flex:none;background:linear-gradient(135deg,#6a9a4a,#3a6a8a)}
.rank{width:34px;height:34px;border-radius:10px;background:#2d9d58;display:grid;place-items:center;font-weight:800;order:2}
.host{display:flex;flex-direction:column;align-items:center;font-size:10px;opacity:.9;gap:1px}
.host .ph{width:44px;height:44px;border:2px solid #c9a24a;background:linear-gradient(135deg,#222,#7a5a5a)}
.row2{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
.pill{background:rgba(40,30,70,.55);border-radius:20px;padding:7px 12px;font-size:14px}
.lv{background:var(--green);border-radius:20px;padding:6px 14px;font-weight:700;direction:ltr;font-size:15px}
.seats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding:10px 12px}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;opacity:.95;cursor:pointer}
.av{width:62px;height:62px;border-radius:50%;background:var(--glass);display:grid;place-items:center;font-size:30px;font-weight:300;color:#fff9;position:relative}
.seat.lock .av{font-size:22px}
.seat.on .av{border:2px solid #fff;color:#fff;font-weight:700;font-size:22px;box-shadow:0 0 0 7px #fff3}
.seat.speak .av{animation:p 1.1s infinite}
@keyframes p{50%{box-shadow:0 0 0 12px #fff1}}
.seat .n{opacity:.7}
.seat.on .n{display:flex;gap:4px;align-items:center;opacity:1;max-width:84px;white-space:nowrap}
.seat.on .n span{overflow:hidden;text-overflow:ellipsis}
.v{background:#2d9d58;border-radius:5px;font-size:9px;font-weight:800;padding:1px 4px;font-style:italic}
.tools{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.cnt{background:var(--box);border-radius:20px;padding:6px 12px;display:flex;gap:6px;align-items:center;font-size:14px}
.all{background:var(--box);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;display:flex;gap:10px;align-items:center}
.all i{background:#fff;color:#222;border-radius:4px;padding:1px 4px;font-style:normal;font-size:11px}
.chat{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;margin-left:56px;scrollbar-width:none}
.chat::-webkit-scrollbar{display:none}
.msg{background:var(--box);border-radius:14px;padding:8px 12px;font-size:15px;align-self:flex-start;max-width:100%;line-height:1.5}
.msg.sys{background:rgba(30,26,40,.7)}
.msg .u{color:var(--teal)}
.msg.me{background:rgba(70,150,100,.55)}
.who{display:flex;align-items:center;gap:6px;font-size:14px;opacity:.9;align-self:flex-start;flex-wrap:wrap}
.chip{background:#2c4a8a;border-radius:12px;padding:1px 8px;font-size:12px;font-weight:700}
.side{position:absolute;z-index:3;left:10px;bottom:70px;display:flex;flex-direction:column;gap:10px}
.side div{width:46px;height:50px;border-radius:12px;background:var(--box);display:grid;place-items:center;font-size:22px;position:relative}
.side small{position:absolute;bottom:2px;font-size:10px}
.bar{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:10px 14px 12px;background:#050408}
.bar button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;position:relative}
.bar .bd{position:absolute;top:-8px;right:-8px;background:#f0455a;border-radius:12px;font-size:11px;padding:1px 6px}
.bar input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;font-size:15px;outline:0;text-align:right}
.bar input::placeholder{color:#fff8}
.bar button.mic.off{opacity:.45}
button:focus-visible,input:focus-visible,.seat:focus-visible{outline:2px solid #fff}
@media(prefers-reduced-motion:reduce){.seat.speak .av{animation:none}}

.seat .av{overflow:visible}
.seat .av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.micBadge{position:absolute;right:-3px;bottom:-3px;width:23px;height:23px;border-radius:50%;display:grid;place-items:center;background:#27a66a;border:2px solid #fff;color:#fff;font-size:12px;box-shadow:0 2px 8px #0008}
.seat:not(.on) .micBadge{display:none}
.syncState{position:relative;z-index:2;font-size:10px;color:#d9f7e8;text-align:center;padding:3px 8px;opacity:.9}
.msg .u{font-weight:800}
.msg.sys{align-self:center;text-align:center;font-size:12px;color:#f5d99d}
.msg .avatarMini{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-left:5px}
.bar button:disabled{opacity:.35}

/* Public participant profile card */
.profileOverlay{position:absolute;inset:0;z-index:20;background:rgba(5,4,12,.78);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.profileOverlay[hidden]{display:none}
.profileCard{width:100%;max-width:360px;max-height:88%;overflow:auto;background:#171326;border:1px solid rgba(226,190,105,.55);border-radius:22px;box-shadow:0 18px 55px #000b;scrollbar-width:thin}
.profileCover{height:112px;background:linear-gradient(135deg,#29204c,#5b356e,#171326);overflow:hidden;position:relative}
.profileCover img{width:100%;height:100%;object-fit:cover;display:block}
.profileCover img[hidden],.profileAvatarWrap img[hidden]{display:none!important}
.profileClose{position:absolute;top:9px;left:9px;width:34px;height:34px;border:1px solid #fff5;border-radius:50%;background:#090711b8;color:#fff;font-size:20px;cursor:pointer}
.profileBody{padding:0 16px 16px}
.profileHero{display:flex;align-items:center;gap:12px;margin-top:-34px;position:relative;min-width:0}
.profileAvatarWrap{width:82px;height:82px;flex:0 0 82px;border:3px solid #171326;border-radius:23px;background:#33264f;overflow:hidden;position:relative;display:grid;place-items:center;font-size:30px;font-weight:800}
.profileAvatarWrap img{width:100%;height:100%;object-fit:cover;display:block}
.profileHeroInfo{min-width:0;flex:1;padding-top:32px}
.profileName{font-size:17px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profileBadges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
.profileBadge{font-size:10px;font-weight:800;border-radius:8px;padding:3px 7px;background:#2c2450;color:#f5d58b;border:1px solid #92733b}
.profileId{font-size:10px;color:#c9bfdc;margin-top:6px;direction:ltr;text-align:right}
.profileCountry{display:flex;align-items:center;gap:7px;margin-top:14px;font-size:12px;color:#eee;min-height:22px}
.profileCountry img{width:24px;height:16px;object-fit:cover;border-radius:3px;border:1px solid #fff4}
.profileBio{margin-top:10px;padding:10px 11px;border-radius:12px;background:#211b34;color:#e1d9ed;font-size:12px;line-height:1.7;overflow-wrap:anywhere;min-height:38px}
.profileStats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:11px}
.profileStat{background:#211b34;border:1px solid #ffffff12;border-radius:12px;text-align:center;padding:9px 4px}
.profileStat b{display:block;font-size:15px;color:#f4d58c}
.profileStat small{font-size:10px;color:#c5bad8}
.profileLeave{width:100%;margin-top:12px;padding:11px;border:1px solid #e6b85c66;border-radius:12px;background:#3a2a19;color:#ffe0a0;font-weight:800;font-size:12px;cursor:pointer}
.profileAvatarWrap.vip6-frame{overflow:visible}
.profileAvatarWrap.vip6-frame img{border-radius:18px}
.profileAvatarWrap.vip6-frame:after{content:"";position:absolute;inset:-10px;background:url('/vip/frames/VIP6.mp4.webp') center/contain no-repeat;pointer-events:none}

</style>
</head>
<body>
<div class="app">
<div class="moon"></div><div class="hill"></div>
<header>
  <div class="room">
    <div class="ph"></div>
    <div class="t"><b>سَمّـٰهِ يا أَفعّيـهُ…</b><small>ID:6521974</small></div>
    <div class="rank">3</div>
  </div>
  <div class="host"><div class="ph"></div><span>2026.11.03</span></div>
</header>
<div class="row2">
  <div class="pill">🌻 هدايا الغرفة</div>
  <div class="lv">Lv.6</div>
</div>
<main class="seats" id="seats" aria-label="مقاعد الغرفة"></main>
<div class="tools">
  <div class="cnt">👤 <span id="cnt">1</span></div>
  <div class="all"><span>⤢</span><i>ALL</i><span>⌄</span></div>
</div>
<section class="chat" id="chat" aria-live="polite"></section>
<aside class="side">
  <div>🎺<small>0%</small></div>
  <div>🎸</div>
  <div>👑</div>
</aside>
<footer class="bar">
  <button aria-label="رسائل">💬<span class="bd">99+</span></button>
  <button aria-label="هدية">🎁</button>
  <button aria-label="القائمة">☰</button>
  <input id="inp" placeholder="قل شيئاً…" autocomplete="off">
  <button aria-label="إيموجي" id="emo">☺</button>
  <button class="mic off" id="mic" aria-label="المايك">🎙</button>
  <button aria-label="الصوت" id="vol">🔊</button>
</footer>

<div class="profileOverlay" id="profileOverlay" hidden>
  <section class="profileCard" role="dialog" aria-modal="true" aria-label="الملف الشخصي">
    <div class="profileCover"><img id="roomProfileCover" alt="" hidden><button class="profileClose" id="closeRoomProfile" type="button" aria-label="إغلاق">×</button></div>
    <div class="profileBody">
      <div class="profileHero">
        <div class="profileAvatarWrap" id="roomProfileAvatarWrap"><img id="roomProfileAvatar" alt="" hidden><span id="roomProfileInitial">ع</span></div>
        <div class="profileHeroInfo">
          <div class="profileName" id="roomProfileName">الملف الشخصي</div>
          <div class="profileBadges"><span class="profileBadge" id="roomProfileVip">VIP 1</span><span class="profileBadge" id="roomProfileLevel">المستوى 1</span></div>
          <div class="profileId" id="roomProfileId">GABO ID: --------</div>
        </div>
      </div>
      <div class="profileCountry" id="roomProfileCountry">الدولة غير محددة</div>
      <div class="profileBio" id="roomProfileBio">لا توجد نبذة شخصية</div>
      <div class="profileStats">
        <div class="profileStat"><b id="roomProfileFollowers">0</b><small>المتابعون</small></div>
        <div class="profileStat"><b id="roomProfileFollowing">0</b><small>يتابع</small></div>
        <div class="profileStat"><b id="roomProfileVisitors">0</b><small>الزيارات</small></div>
      </div>
      <button class="profileLeave" id="leaveRoomSeat" type="button" hidden>مغادرة المقعد</button>
    </div>
  </section>
</div>

</div>
<script type="module">
import { auth, db } from '../../firebase-config.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  collection, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc,
  onSnapshot, serverTimestamp, query, orderBy, limit, runTransaction
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const ROOM_ID='6521974';
const roomPath='voiceRooms/'+ROOM_ID;
const membersRef=collection(db,roomPath,'members');
const seatsRef=collection(db,roomPath,'seats');
const messagesRef=collection(db,roomPath,'messages');
const seatsEl=document.getElementById('seats');
const chat=document.getElementById('chat');
const input=document.getElementById('inp');
const micButton=document.getElementById('mic');
const locked=[10,11,13];
let currentUser=null,profile={},mySeat=null,micOn=false;
let members={},seatUsers={},messagesUnsub=null,membersUnsub=null,seatsUnsub=null;
let memberRef=null,heartbeat=null,joinedNew=false,leaving=false;
const profileCache={};
const profileUnsubs={};
let activeProfileUid=null,activeProfileSeat=null;

function safeName(){return String(profile.name||profile.displayName||currentUser?.displayName||currentUser?.email?.split('@')[0]||'عضو').trim().slice(0,50)||'عضو';}
function safeAvatar(){const value=String(profile.photoURL||profile.photoUrl||profile.profilePhoto||profile.profilePicture||profile.avatarURL||profile.avatarUrl||profile.avatar||profile.photo||profile.imageURL||profile.imageUrl||currentUser?.photoURL||'');return value.length<=2000?value:'';}
function level(){const n=Number(profile.level||profile.vipLevel||1);return Number.isFinite(n)?Math.max(1,Math.min(100,Math.floor(n))):1;}
function active(data){const t=data?.lastSeen?.toMillis?.();return !!t&&Date.now()-t<75000;}
function generatedGaboId(uid){
  let hash=0;
  for(let i=0;i<uid.length;i++)hash=(hash*31+uid.charCodeAt(i))%1000000000;
  return (10000000+(hash%90000000)).toString().padStart(8,'0');
}
function publicPhoto(data){
  return String(data?.photoURL||data?.photoUrl||data?.profilePhoto||data?.profilePicture||data?.avatarURL||data?.avatarUrl||data?.avatar||data?.photo||data?.profileImage||data?.imageURL||data?.imageUrl||data?.image||'').slice(0,900000);
}
function syncProfileListeners(){
  const ids=new Set([...Object.keys(members),...Object.values(seatUsers).map(x=>x?.uid).filter(Boolean)]);
  Object.keys(profileUnsubs).forEach(uid=>{
    if(!ids.has(uid)){
      profileUnsubs[uid]();
      delete profileUnsubs[uid];
      delete profileCache[uid];
    }
  });
  ids.forEach(uid=>{
    if(profileUnsubs[uid])return;
    profileUnsubs[uid]=onSnapshot(doc(db,'users',uid),snap=>{
      profileCache[uid]=snap.exists()?snap.data():{};
      if(uid===currentUser?.uid)profile=profileCache[uid];
      render();
      if(activeProfileUid===uid)showMemberProfile({uid,...(profileCache[uid]||{})},activeProfileSeat);
    },err=>console.warn('Participant profile sync:',uid,err));
  });
}
function setProfileImage(imageId,url){
  const image=document.getElementById(imageId);
  image.onerror=()=>{image.hidden=true;};
  if(url){image.src=url;image.hidden=false;}
  else{image.removeAttribute('src');image.hidden=true;}
}
function showMemberProfile(member,seatNumber=null){
  const uid=member?.uid||'';
  const data={...(member||{}),...(profileCache[uid]||{})};
  const name=String(data.displayName||data.name||member?.name||'عضو').trim()||'عضو';
  const photo=publicPhoto(data)||publicPhoto(member)||'';
  const cover=String(data.cover||data.coverURL||data.coverUrl||'').slice(0,2000);
  const vip=Number(data.vipLevel||data.level||member?.level||1)||1;
  const userLevel=Number(data.level||data.vipLevel||member?.level||1)||1;
  const followers=Number(data.followers??data.followersList?.length??0)||0;
  const following=Number(data.following??data.followingList?.length??0)||0;
  const visitors=Number(data.visitors??0)||0;
  document.getElementById('roomProfileName').textContent=name;
  document.getElementById('roomProfileInitial').textContent=name.charAt(0)||'ع';
  document.getElementById('roomProfileId').textContent='GABO ID: '+String(data.gaboId|| (uid?generatedGaboId(uid):'--------'));
  document.getElementById('roomProfileVip').textContent='VIP '+vip;
  document.getElementById('roomProfileLevel').textContent='المستوى '+userLevel;
  document.getElementById('roomProfileBio').textContent=String(data.bio||'لا توجد نبذة شخصية');
  document.getElementById('roomProfileFollowers').textContent=String(followers);
  document.getElementById('roomProfileFollowing').textContent=String(following);
  document.getElementById('roomProfileVisitors').textContent=String(visitors);
  setProfileImage('roomProfileAvatar',photo);
  setProfileImage('roomProfileCover',cover);
  document.getElementById('roomProfileAvatarWrap').classList.toggle('vip6-frame',data.headFrame==='VIP6');
  const country=document.getElementById('roomProfileCountry');
  country.replaceChildren();
  if(data.countryFlagImg){
    const flag=document.createElement('img');flag.src=String(data.countryFlagImg);flag.alt='';country.appendChild(flag);
  }
  const countryName=document.createElement('span');
  countryName.textContent=String(data.countryName||data.country||'الدولة غير محددة');
  country.appendChild(countryName);
  const leave=document.getElementById('leaveRoomSeat');
  const canLeave=!!currentUser&&uid===currentUser.uid&&seatNumber!==null&&mySeat===seatNumber;
  leave.hidden=!canLeave;
  activeProfileUid=uid;
  activeProfileSeat=seatNumber;
  document.getElementById('profileOverlay').hidden=false;
}
function closeMemberProfile(){
  document.getElementById('profileOverlay').hidden=true;
  activeProfileUid=null;
  activeProfileSeat=null;
}
function systemMessage(text){
  if(!currentUser)return;
  addDoc(messagesRef,{uid:currentUser.uid,name:safeName(),avatar:safeAvatar(),text:String(text).slice(0,300),type:'system',createdAt:serverTimestamp()}).catch(err=>console.error('room system message',err));
}
function render(){
  seatsEl.innerHTML='';
  for(let i=1;i<=16;i++){
    const seat=document.createElement('div');seat.className='seat';seat.tabIndex=0;seat.dataset.i=String(i);
    const av=document.createElement('div');av.className='av';
    const label=document.createElement('div');label.className='n';
    const raw=seatUsers[i];
    const cached=raw?.uid?profileCache[raw.uid]||{}:{};
    const u=raw?{...raw,...cached,name:cached.displayName||cached.name||raw.name,avatar:publicPhoto(cached)||publicPhoto(raw)||publicPhoto(members[raw.uid]||{})||(raw.uid===currentUser?.uid?String(currentUser?.photoURL||''):'') ,level:cached.vipLevel||cached.level||raw.level}:null;
    if(locked.includes(i)){seat.classList.add('lock');av.textContent='🔒';label.textContent=String(i);}
    else if(u){
      seat.classList.add('on');
      if(u.avatar){const image=document.createElement('img');image.src=u.avatar;image.alt='';image.referrerPolicy='no-referrer';av.appendChild(image);}
      else av.textContent='';
      if(u.micOn){seat.classList.add('speak');const badge=document.createElement('span');badge.className='micBadge';badge.textContent='🎙';badge.title='المايك مفتوح';av.appendChild(badge);}
      const name=document.createElement('span');name.textContent=u.name||'عضو';
      const vip=document.createElement('b');vip.className='v';vip.textContent='V'+(u.level||1);
      label.append(name,vip);
    }else{av.textContent='+';label.textContent=String(i);}
    seat.append(av,label);seatsEl.appendChild(seat);
  }
  const count=Object.values(members).filter(active).length;
  document.getElementById('cnt').textContent=String(count);
  micButton.classList.toggle('off',!micOn);
  micButton.setAttribute('aria-label',micOn?'إغلاق المايك':'فتح المايك');
}
function addChatMessage(data){
  if(data.type==='system'){
    const node=document.createElement('div');node.className='msg sys';node.textContent=data.text||'';
    chat.appendChild(node);return;
  }
  const who=document.createElement('div');who.className='who';
  const chip=document.createElement('span');chip.className='chip';chip.textContent='54';
  const vip=document.createElement('b');vip.className='v';vip.textContent='V'+(data.level||1);
  const name=document.createElement('span');name.textContent=data.name||'عضو';
  if(data.avatar){const img=document.createElement('img');img.className='avatarMini';img.src=data.avatar;img.alt='';who.appendChild(img);}
  who.append(chip,vip,name);
  const body=document.createElement('div');body.className='msg';body.textContent=data.text||'';
  chat.append(who,body);
}
function renderMessages(items){
  chat.innerHTML='';
  items.forEach(addChatMessage);
  chat.scrollTop=chat.scrollHeight;
}
function listenRoom(){
  membersUnsub=onSnapshot(membersRef,snap=>{
    members={};
    snap.forEach(d=>{const data=d.data();members[d.id]=data;});
    syncProfileListeners();
    const now=Date.now();
    snap.forEach(d=>{
      const data=d.data(),seen=data.lastSeen?.toMillis?.()||0;
      if(seen&&now-seen>90000){
        deleteDoc(doc(db,roomPath,'members',d.id)).catch(()=>{});
        if(Number.isInteger(data.seat))deleteDoc(doc(db,roomPath,'seats',String(data.seat))).catch(()=>{});
      }
    });
    const mine=members[currentUser.uid];
    if(mine){mySeat=Number.isInteger(mine.seat)?mine.seat:null;micOn=!!mine.micOn;}
    render();
  },err=>showError(err));
  seatsUnsub=onSnapshot(seatsRef,snap=>{
    seatUsers={};
    const now=Date.now();
    snap.forEach(d=>{
      const data=d.data(),seen=data.lastSeen?.toMillis?.()||0;
      if(seen&&now-seen>90000){deleteDoc(d.ref).catch(()=>{});return;}
      const number=Number(d.id);
      if(number>=1&&number<=16)seatUsers[number]=data;
    });
    syncProfileListeners();
    render();
  },err=>showError(err));
  const q=query(messagesRef,orderBy('createdAt','asc'),limit(100));
  messagesUnsub=onSnapshot(q,snap=>renderMessages(snap.docs.map(d=>d.data())),err=>showError(err));
}
function showError(err){
  console.error('Voice room sync error:',err);
  systemMessage('تعذر الاتصال بالغرفة. تحقق من صلاحيات Firestore واتصال الإنترنت.');
}
async function enterRoom(user){
  currentUser=user;
  memberRef=doc(db,roomPath,'members',user.uid);
  const profileRef=doc(db,'users',user.uid);
  const profileSnap=await getDoc(profileRef);
  profile=profileSnap.exists()?profileSnap.data():{};
  // صورة الملف الشخصي تُقرأ مباشرة من users/{uid}. لا ننسخ صور Base64 الكبيرة إلى وثيقة الحضور لأن قواعد الغرفة تحد حجم avatar.
  const oldSnap=await getDoc(memberRef);
  const old=oldSnap.exists()?oldSnap.data():{};
  mySeat=Number.isInteger(old.seat)&&old.seat>=1&&old.seat<=16?old.seat:null;
  micOn=false;
  const profileAvatar=safeAvatar();
  const data={uid:user.uid,name:safeName(),avatar:profileAvatar.length<=2000?profileAvatar:'',level:level(),seat:mySeat,micOn:false,joinedAt:old.joinedAt||serverTimestamp(),lastSeen:serverTimestamp()};
  await setDoc(memberRef,data,{merge:true});
  if(mySeat!==null){
    const seatRef=doc(db,roomPath,'seats',String(mySeat));
    const seatSnap=await getDoc(seatRef);
    if(!seatSnap.exists()){
      await setDoc(seatRef,{uid:user.uid,name:data.name,avatar:data.avatar,level:data.level,micOn:false,joinedAt:data.joinedAt,lastSeen:serverTimestamp()});
    }else if(seatSnap.data().uid===user.uid){
      await updateDoc(seatRef,{micOn:false,lastSeen:serverTimestamp()});
    }else{
      mySeat=null;await updateDoc(memberRef,{seat:null});
    }
  }
  joinedNew=!oldSnap.exists();
  listenRoom();
  heartbeat=setInterval(()=>{
    if(!memberRef)return;
    updateDoc(memberRef,{lastSeen:serverTimestamp()}).catch(()=>{});
    if(mySeat!==null)updateDoc(doc(db,roomPath,'seats',String(mySeat)),{lastSeen:serverTimestamp()}).catch(()=>{});
  },20000);
  if(joinedNew)systemMessage('دخل '+safeName()+' الغرفة');
  render();
}
async function toggleSeat(number){
  if(!currentUser||locked.includes(number))return;
  const newRef=doc(db,roomPath,'seats',String(number));
  const oldSeat=mySeat;
  try{
    await runTransaction(db,async tx=>{
      const target=await tx.get(newRef);
      if(oldSeat===number){
        if(target.exists()&&target.data().uid===currentUser.uid)tx.delete(newRef);
        tx.update(memberRef,{seat:null,micOn:false,lastSeen:serverTimestamp()});
        return;
      }
      if(target.exists()&&target.data().uid!==currentUser.uid)throw new Error('هذا المقعد مشغول');
      let oldRef=null,oldSnap=null;
      if(oldSeat!==null&&oldSeat!==number){oldRef=doc(db,roomPath,'seats',String(oldSeat));oldSnap=await tx.get(oldRef);}
      if(oldRef&&oldSnap?.exists()&&oldSnap.data().uid===currentUser.uid)tx.delete(oldRef);
      const payload={uid:currentUser.uid,name:safeName(),avatar:safeAvatar(),level:level(),micOn:false,joinedAt:serverTimestamp(),lastSeen:serverTimestamp()};
      tx.set(newRef,payload);
      tx.update(memberRef,{seat:number,micOn:false,lastSeen:serverTimestamp()});
    });
    if(oldSeat===number){mySeat=null;micOn=false;systemMessage('غادر '+safeName()+' مقعد المايك');}
    else{mySeat=number;micOn=false;systemMessage('جلس '+safeName()+' على مقعد المايك');}
  }catch(err){alert(err.message==='هذا المقعد مشغول'?'هذا المقعد مشغول، اختر مقعداً آخر':'تعذر حجز المقعد: '+(err.message||'تحقق من صلاحيات Firestore'));}
}
seatsEl.addEventListener('click',e=>{
  const s=e.target.closest('.seat');if(!s)return;
  const number=Number(s.dataset.i);
  if(locked.includes(number))return;
  const occupant=seatUsers[number];
  if(occupant){showMemberProfile(occupant,number);return;}
  toggleSeat(number);
});
seatsEl.addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){
    const s=e.target.closest('.seat');
    if(s){e.preventDefault();const number=Number(s.dataset.i);if(locked.includes(number))return;const occupant=seatUsers[number];if(occupant)showMemberProfile(occupant,number);else toggleSeat(number);}
  }
});
document.getElementById('closeRoomProfile').addEventListener('click',closeMemberProfile);
document.getElementById('profileOverlay').addEventListener('click',e=>{if(e.target.id==='profileOverlay')closeMemberProfile();});
document.getElementById('leaveRoomSeat').addEventListener('click',async()=>{
  if(activeProfileSeat!==null&&mySeat===activeProfileSeat){
    const seat=activeProfileSeat;
    closeMemberProfile();
    await toggleSeat(seat);
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('profileOverlay').hidden)closeMemberProfile();});
async function sendText(){
  const text=input.value.trim();if(!text||!currentUser)return;
  input.value='';
  try{await addDoc(messagesRef,{uid:currentUser.uid,name:safeName(),avatar:safeAvatar(),level:level(),text:text.slice(0,1000),type:'text',createdAt:serverTimestamp()});}
  catch(err){input.value=text;alert('تعذر إرسال الرسالة. تحقق من صلاحيات Firestore.');console.error(err);}
}
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendText();}});
micButton.onclick=async()=>{
  if(mySeat===null){systemMessage('اجلس على مقعد أولاً لتفعيل حالة المايك');return;}
  const next=!micOn;
  try{
    const changes={micOn:next,lastSeen:serverTimestamp()};
    await updateDoc(memberRef,changes);
    await updateDoc(doc(db,roomPath,'seats',String(mySeat)),changes);
    micOn=next;render();
    systemMessage(safeName()+(next?' فعّل المايك 🎙':' أغلق المايك'));
  }catch(err){alert('تعذر تحديث حالة المايك. تحقق من صلاحيات Firestore.');console.error(err);}
};
document.getElementById('emo').onclick=()=>{input.value+='😍';input.focus();};
window.addEventListener('pagehide',()=>{
  if(leaving||!currentUser)return;leaving=true;
  if(heartbeat)clearInterval(heartbeat);
  if(mySeat!==null)deleteDoc(doc(db,roomPath,'seats',String(mySeat))).catch(()=>{});
  if(memberRef)deleteDoc(memberRef).catch(()=>{});
});
onAuthStateChanged(auth,user=>{
  if(!user){location.replace('/login/');return;}
  if(!currentUser)enterRoom(user).catch(err=>{console.error(err);alert('تعذر دخول الغرفة: '+(err.message||'تحقق من Firebase'));});
});
</script>
