<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>غرفة صوتية</title>
<style>
:root{--bg1:#4a3a78;--bg2:#7a4f86;--bg3:#c8706a;--glass:rgba(255,255,255,.2);--text:#fff;--green:#1f7a4a;--teal:#4fd6c0;--box:rgba(20,16,30,.55)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0912}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--text);display:flex;justify-content:center}
.app{position:relative;width:100%;max-width:430px;height:100%;overflow:hidden;display:flex;flex-direction:column;
background:radial-gradient(1.5px 1.5px at 20% 12%,#fff8,transparent),radial-gradient(1.5px 1.5px at 70% 8%,#fff8,transparent),radial-gradient(1px 1px at 40% 25%,#fff7,transparent),
linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 38%,var(--bg3) 62%,#2a1a2a 78%,#07060a 100%);
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.hill{position:absolute;inset:auto 0 0 0;height:42%;background:radial-gradient(120% 60% at 30% 100%,#000 55%,transparent 56%),radial-gradient(90% 40% at 85% 100%,#050308 60%,transparent 61%);opacity:.95;pointer-events:none}
.moon{position:absolute;top:30%;right:46%;width:46px;height:46px;border-radius:50%;box-shadow:inset -9px 0 0 #d9cfa0;opacity:.7;transform:rotate(-20deg)}
header{position:relative;z-index:2;padding:14px 14px 0;display:flex;justify-content:space-between;align-items:flex-start}
.room{display:flex;align-items:center;gap:10px;background:rgba(40,30,70,.55);border-radius:30px;padding:5px 6px 5px 12px;max-width:62%}
.room .t{flex:1;min-width:0;text-align:right}
.room b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.room small{opacity:.7;font-size:13px;direction:ltr;display:block}
.ph{width:44px;height:44px;border-radius:50%;border:2px solid #fff6;flex:none;background:linear-gradient(135deg,#6a9a4a,#3a6a8a)}
.rank{width:34px;height:34px;border-radius:10px;background:#2d9d58;display:grid;place-items:center;font-weight:800;order:2}
.host{display:flex;flex-direction:column;align-items:center;font-size:10px;opacity:.9;gap:1px}
.host .ph{width:44px;height:44px;border:2px solid #c9a24a;background:linear-gradient(135deg,#222,#7a5a5a)}
.row2{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:8px 14px}
.pill{background:rgba(40,30,70,.55);border-radius:20px;padding:7px 12px;font-size:14px}
.lv{background:var(--green);border-radius:20px;padding:6px 14px;font-weight:700;direction:ltr;font-size:15px}
.seats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding:10px 12px}
.seat{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;opacity:.95;cursor:pointer}
.av{width:62px;height:62px;border-radius:50%;background:var(--glass);display:grid;place-items:center;font-size:30px;font-weight:300;color:#fff9;position:relative}
.seat.lock .av{font-size:22px}
.seat.on .av{border:2px solid #fff;color:#fff;font-weight:700;font-size:22px;box-shadow:0 0 0 7px #fff3}
.seat.speak .av{animation:p 1.1s infinite}
@keyframes p{50%{box-shadow:0 0 0 12px #fff1}}
.seat .n{opacity:.7}
.seat.on .n{display:flex;gap:4px;align-items:center;opacity:1;max-width:84px;white-space:nowrap}
.seat.on .n span{overflow:hidden;text-overflow:ellipsis}
.v{background:#2d9d58;border-radius:5px;font-size:9px;font-weight:800;padding:1px 4px;font-style:italic}
.tools{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.cnt{background:var(--box);border-radius:20px;padding:6px 12px;display:flex;gap:6px;align-items:center;font-size:14px}
.all{background:var(--box);border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700;display:flex;gap:10px;align-items:center}
.all i{background:#fff;color:#222;border-radius:4px;padding:1px 4px;font-style:normal;font-size:11px}
.chat{position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px;margin-left:56px;scrollbar-width:none}
.chat::-webkit-scrollbar{display:none}
.msg{background:var(--box);border-radius:14px;padding:8px 12px;font-size:15px;align-self:flex-start;max-width:100%;line-height:1.5}
.msg.sys{background:rgba(30,26,40,.7)}
.msg .u{color:var(--teal)}
.msg.me{background:rgba(70,150,100,.55)}
.who{display:flex;align-items:center;gap:6px;font-size:14px;opacity:.9;align-self:flex-start;flex-wrap:wrap}
.chip{background:#2c4a8a;border-radius:12px;padding:1px 8px;font-size:12px;font-weight:700}
.side{position:absolute;z-index:3;left:10px;bottom:70px;display:flex;flex-direction:column;gap:10px}
.side div{width:46px;height:50px;border-radius:12px;background:var(--box);display:grid;place-items:center;font-size:22px;position:relative}
.side small{position:absolute;bottom:2px;font-size:10px}
.bar{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding:10px 14px 12px;background:#050408}
.bar button{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;position:relative}
.bar .bd{position:absolute;top:-8px;right:-8px;background:#f0455a;border-radius:12px;font-size:11px;padding:1px 6px}
.bar input{flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;font-size:15px;outline:0;text-align:right}
.bar input::placeholder{color:#fff8}
.bar button.mic.off{opacity:.45}
button:focus-visible,input:focus-visible,.seat:focus-visible{outline:2px solid #fff}
@media(prefers-reduced-motion:reduce){.seat.speak .av{animation:none}}
</style>
</head>
<body>
<div class="app">
<div class="moon"></div><div class="hill"></div>
<header>
  <div class="room">
    <div class="ph"></div>
    <div class="t"><b>سَمّـٰهِ يا أَفعّيـهُ…</b><small>ID:6521974</small></div>
    <div class="rank">3</div>
  </div>
  <div class="host"><div class="ph"></div><span>2026.11.03</span></div>
</header>
<div class="row2">
  <div class="pill">🌻 هدايا الغرفة</div>
  <div class="lv">Lv.6</div>
</div>
<main class="seats" id="seats" aria-label="مقاعد الغرفة"></main>
<div class="tools">
  <div class="cnt">👤 <span id="cnt">1</span></div>
  <div class="all"><span>⤢</span><i>ALL</i><span>⌄</span></div>
</div>
<section class="chat" id="chat" aria-live="polite"></section>
<aside class="side">
  <div>🎺<small>0%</small></div>
  <div>🎸</div>
  <div>👑</div>
</aside>
<footer class="bar">
  <button aria-label="رسائل">💬<span class="bd">99+</span></button>
  <button aria-label="هدية">🎁</button>
  <button aria-label="القائمة">☰</button>
  <input id="inp" placeholder="قل شيئاً…" autocomplete="off">
  <button aria-label="إيموجي" id="emo">☺</button>
  <button class="mic off" id="mic" aria-label="المايك">🎙</button>
  <button aria-label="الصوت" id="vol">🔊</button>
</footer>
</div>
<script>
// هذه الواجهة مستقلة حالياً؛ الصوت والرسائل ليست متصلة بخادم بعد.
var seatsEl=document.getElementById('seats'),chat=document.getElementById('chat');
var locked=[10,11,13];
var users={};
var me=null,micOn=false;
function render(){
  seatsEl.innerHTML='';
  for(var i=1;i<=16;i++){
    var s=document.createElement('div');s.className='seat';s.tabIndex=0;s.dataset.i=i;
    var av=document.createElement('div');av.className='av';
    var n=document.createElement('div');n.className='n';
    var u=users[i];
    if(locked.indexOf(i)>-1){s.classList.add('lock');av.textContent='🔒';n.textContent=i}
    else if(u){
      s.classList.add('on');av.textContent=u.img;
      var sp=document.createElement('span');sp.textContent=u.n;
      var v=document.createElement('b');v.className='v';v.textContent='V'+u.lv;
      n.appendChild(sp);n.appendChild(v);
      if(i===me&&micOn)s.classList.add('speak');
    } else {av.textContent='+';n.textContent=i}
    s.appendChild(av);s.appendChild(n);seatsEl.appendChild(s);
  }
  document.getElementById('cnt').textContent=Object.keys(users).length+1;
}
function toggle(i){
  if(users[i]&&i!==me)return;
  if(locked.indexOf(i)>-1)return;
  if(me===i){delete users[i];me=null}
  else{if(me)delete users[me];users[i]={n:'MSHAKS',img:'😎',lv:1};me=i}
  render();
}
seatsEl.addEventListener('click',function(e){var s=e.target.closest('.seat');if(s)toggle(+s.dataset.i)});
seatsEl.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();var s=e.target.closest('.seat');if(s)toggle(+s.dataset.i)}});
function add(node){chat.appendChild(node);chat.scrollTop=chat.scrollHeight}
function sys(name,text){
  var d=document.createElement('div');d.className='msg sys';
  var u=document.createElement('span');u.className='u';u.textContent='@'+name+' ';
  d.appendChild(u);d.appendChild(document.createTextNode(text));add(d);
}
function who(){
  var w=document.createElement('div');w.className='who';
  w.innerHTML='<span class="chip">54</span><b class="v">V1</b><span>MSHAKS</span>';return w;
}
document.getElementById('inp').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&this.value.trim()){
    add(who());var m=document.createElement('div');m.className='msg me';m.textContent=this.value.trim();add(m);this.value='';
  }
});
document.getElementById('mic').onclick=function(){
  if(!me){sys('النظام','اجلس على مقعد أولاً');return}
  micOn=!micOn;this.classList.toggle('off',!micOn);render();
};
document.getElementById('emo').onclick=function(){var i=document.getElementById('inp');i.value+='😍';i.focus()};
render();
</script>
</body>
</html>
