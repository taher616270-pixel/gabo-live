<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>الخاص — GABO LIVE</title>
<link rel="stylesheet" href="/assets/style/style.css">
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="/app/">GABO LIVE ✨</a>
    <span class="muted" style="font-size:12px" data-user-name></span>
  </header>

  <section class="page active" id="page-list">
    <div class="card"><h3>✉️ الخاص - كل الأعضاء</h3><div class="list" id="usersList"><div class="empty">جاري التحميل...</div></div></div>
  </section>

  <section class="page" id="page-chat">
    <div class="card">
      <h3 style="display:flex;justify-content:space-between"><span id="chatTitle">الخاص</span><a data-show="list" href="#" class="muted">✕ رجوع</a></h3>
      <div class="msgs" id="msgsBox" style="height:60vh"></div>
      <div class="composer"><input id="msgInput" class="input" placeholder="اكتب رسالة..." maxlength="500"><button id="sendBtn" class="btn primary">↑</button></div>
    </div>
  </section>
</div>

<script type="module">
import { db, boot, me, showPage, toast, esc, $ } from '/assets/app.js';
import { collection, addDoc, query, where, orderBy, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

await boot({ auth: true });

let toId = new URLSearchParams(location.search).get('to'), unsub = null;
const chatId = (a, b) => [a, b].sort().join('_');

onSnapshot(collection(db, 'users'), snap => {
  const el = $('#usersList'); el.replaceChildren();
  snap.forEach(d => {
    if (d.id === me.uid) return;
    const u = d.data(); if (u.banned) return;
    const row = document.createElement('div');
    row.className = 'item' + (d.id === toId ? ' active' : '');
    row.innerHTML = `<span><b>${esc(u.name || u.email)}</b><br><small>${esc(u.email || '')}</small></span><span>💬</span>`;
    if (d.id === toId) $('#chatTitle').textContent = u.name || u.email;
    row.onclick = () => open(d.id, u.name || u.email);
    el.append(row);
  });
  if (!el.children.length) el.innerHTML = '<div class="empty">لا يوجد أعضاء آخرين بعد</div>';
}, () => toast('تعذر تحميل الأعضاء', 'error'));

function open(id, title) {
  toId = id; $('#chatTitle').textContent = title;
  history.replaceState(null, '', '?to=' + id);
  showPage('chat'); listen();
}
function listen() {
  unsub?.();
  const q = query(collection(db, 'private_messages'), where('chatId', '==', chatId(me.uid, toId)), orderBy('createdAt', 'asc'));
  unsub = onSnapshot(q, snap => {
    const box = $('#msgsBox'); box.replaceChildren();
    if (snap.empty) box.innerHTML = '<div class="empty">ابدأ المحادثة 👋</div>';
    snap.forEach(d => {
      const m = d.data(), row = document.createElement('div');
      row.className = 'msg' + (m.from === me.uid ? ' me' : ''); row.textContent = m.text; box.append(row);
    });
    box.scrollTop = box.scrollHeight;
  }, () => toast('تعذر تحميل المحادثة', 'error'));
}
async function send() {
  const inp = $('#msgInput'), text = inp.value.trim().slice(0, 500);
  if (!text) return;
  if (!toId) return toast('اختر عضو اولا', 'error');
  inp.value = '';
  try { await addDoc(collection(db, 'private_messages'), { chatId: chatId(me.uid, toId), from: me.uid, to: toId, text, createdAt: serverTimestamp() }); }
  catch (e) { toast('تعذر الارسال', 'error'); inp.value = text; }
}
$('#sendBtn').onclick = send;
$('#msgInput').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
if (toId) { showPage('chat'); listen(); }
</script>
</body>
</html>
