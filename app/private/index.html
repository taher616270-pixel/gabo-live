<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>حسابي — GABO LIVE</title>
<link rel="stylesheet" href="/assets/style/style.css">
</head>
<body>
<div class="wrap" style="max-width:760px">
  <header class="topbar">
    <a class="brand" href="/app/">GABO LIVE ✨</a>
    <button class="btn sm" data-logout>خروج</button>
  </header>

  <div class="seg"><button class="on" data-show="profile">الملف</button><button data-show="settings">الإعدادات</button></div>

  <section class="page active" id="page-profile">
    <div class="card pad">
      <div style="display:flex;gap:16px;align-items:center">
        <div class="avatar" id="avatar">G</div>
        <div><h1 style="margin:0;font-size:24px" data-user-name>حسابي</h1><p class="muted" style="margin:4px 0">ID: <b id="gaboId">—</b> <span id="vipBadge" class="pill hidden">VIP ♛</span></p></div>
      </div>
      <form id="profileForm" style="margin-top:12px">
        <div class="field"><label>اسم العرض</label><input class="input" id="profileName" required maxlength="50" placeholder="اسمك"></div>
        <div class="field"><label>البريد الإلكتروني</label><input class="input" id="profileEmail" disabled></div>
        <div class="field"><label>نبذة عنك</label><textarea class="input" id="profileBio" maxlength="280" placeholder="اكتب نبذة قصيرة"></textarea></div>
        <button class="btn primary block" id="saveBtn">حفظ الملف 💾</button>
      </form>
    </div>
  </section>

  <section class="page" id="page-settings">
    <div class="card pad" style="display:flex;flex-direction:column;gap:10px">
      <h2 style="margin:0">الإعدادات ⚙️</h2>
      <a class="btn block" href="/vip/">♛ اشتراك VIP</a>
      <a class="btn block" href="/hosts/">🎙️ انضم كمضيف</a>
      <a class="btn primary block hidden" data-admin-only href="/admin/">🛠 لوحة الإدارة</a>
      <button class="btn danger block" data-logout>تسجيل الخروج</button>
    </div>
  </section>
</div>

<script type="module">
import { db, boot, me, myProfile, toast, $ } from '/assets/app.js';
import { doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { updateProfile } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

await boot({ auth: true });

const name = myProfile.name || me.displayName || '';
$('#profileName').value = name;
$('#profileEmail').value = me.email || '';
$('#profileBio').value = myProfile.bio || '';
$('#gaboId').textContent = myProfile.gaboId || '—';
$('#avatar').textContent = (name || me.email || 'G')[0].toUpperCase();
if (myProfile.subscription === 'VIP' && (!myProfile.subUntil || myProfile.subUntil > Date.now())) $('#vipBadge').classList.remove('hidden');

$('#profileForm').onsubmit = async e => {
  e.preventDefault();
  const btn = $('#saveBtn'), n = $('#profileName').value.trim(), bio = $('#profileBio').value.trim();
  if (!n) return toast('اكتب اسمك', 'error');
  btn.disabled = true;
  try {
    await setDoc(doc(db, 'users', me.uid), { name: n, bio, updatedAt: serverTimestamp() }, { merge: true });
    await updateProfile(me, { displayName: n });
    $$('[data-user-name]').forEach(el => (el.textContent = n));
    toast('تم حفظ الملف ✅', 'ok');
  } catch (err) { toast('تعذر الحفظ، حاول مرة ثانية', 'error'); }
  btn.disabled = false;
};
function $$(s) { return [...document.querySelectorAll(s)]; }
</script>
</body>
</html>
