<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الخاص — GABO LIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0a0812;color:#f8f7ff;font-family:system-ui}
.wrap{width:min(1200px,calc(100% - 16px));margin:auto}
.topbar{display:flex;justify-content:space-between;padding:12px 0}
.brand{color:#c4b5fd;font-weight:900;text-decoration:none}
.layout{display:grid;grid-template-columns:280px 1fr;gap:10px;height:calc(100vh - 60px)}
.card{background:rgba(17,12,29,.9);border:1px solid rgba(196,181,253,.18);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.card h3{margin:0;padding:12px;border-bottom:1px solid #ffffff12;font-size:13px;color:#aaa3bd}
.list{overflow:auto;flex:1}
.item{padding:11px 12px;cursor:pointer;border-bottom:1px solid #ffffff06}
.item.active{background:#7c3aed33}
.msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{padding:10px 12px;border-radius:14px;max-width:75%;background:#ffffff0e}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#5b21b6)}
.input-area{display:flex;gap:8px;padding:10px;border-top:1px solid #ffffff12}
input{flex:1;background:#0d0b15;border:1px solid #ffffff22;border-radius:10px;padding:11px;color:#fff}
button{border-radius:10px;padding:10px 14px;border:1px solid #ffffff22;background:#211638;color:#fff;cursor:pointer}
.primary{background:linear-gradient(135deg,#7c3aed,#5b21b6);border:0}
</style>
</head>
<body>
<div class="wrap">
<div class="topbar">
<a class="brand" href="/app/">← رجوع</a>
<span id="meName"></span>
</div>
<div class="layout">
<div class="card">
<h3>👥 كل الأعضاء</h3>
<div class="list" id="usersList"></div>
</div>
<div class="card">
<h3 id="chatTitle">اختر عضو</h3>
<div class="msgs" id="msgsBox"></div>
<div class="input-area">
<input id="msgInput" placeholder="اكتب رسالة...">
<button id="sendBtn" class="primary">إرسال</button>
</div>
</div>
</div>
</div>
<script type="module">
  import {auth,db} from "/firebase-config.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {collection,addDoc,query,where,orderBy,onSnapshot,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let me=null;
let toId=new URLSearchParams(location.search).get('to');
let unsub=null;

onAuthStateChanged(auth,u=>{
 if(!u){location.href='/login/';return;}
 me=u;
 document.getElementById('meName').innerText=u.displayName||u.email;
 listenUsers();
 if(toId) listenPrivate();
});

function listenUsers(){
 onSnapshot(collection(db,'users'),snap=>{
  const el=document.getElementById('usersList');
  el.innerHTML='';
  snap.forEach(d=>{
   const us=d.data();
   if(us.uid===me.uid) return;
   const div=document.createElement('div');
   div.className='item'+(us.uid===toId?' active':'');
   div.innerHTML=`<b>${us.name||us.email}</b><br><small>${us.email}</small>`;
   div.onclick=()=>{
    toId=us.uid;
    document.getElementById('chatTitle').innerText='تكلم مع: '+(us.name||us.email);
    history.replaceState(null,'','?to='+us.uid);
    document.querySelectorAll('#usersList .item').forEach(i=>i.classList.remove('active'));
    div.classList.add('active');
    listenPrivate();
   };
   el.appendChild(div);
  });
 });
}
  function getChatId(a,b){
 return [a,b].sort().join('_');
}

function listenPrivate(){
 if(!toId) return;
 if(unsub) unsub();
 const chatId=getChatId(me.uid,toId);
 const q=query(collection(db,'private_messages'),where('chatId','==',chatId),orderBy('createdAt','asc'));
 unsub=onSnapshot(q,snap=>{
  const box=document.getElementById('msgsBox');
  box.innerHTML='';
  snap.forEach(d=>{
   const m=d.data();
   const div=document.createElement('div');
   div.className='msg'+(m.from===me.uid?' me':'');
   div.innerText=m.text;
   box.appendChild(div);
  });
  box.scrollTop=box.scrollHeight;
 });
}

async function send(){
 const inp=document.getElementById('msgInput');
 const t=inp.value.trim();
 if(!t||!me||!toId){alert('اختر عضو أولا');return;}
 inp.value='';
 await addDoc(collection(db,'private_messages'),{
  chatId:getChatId(me.uid,toId),
  from:me.uid,
  to:toId,
  text:t,
  createdAt:serverTimestamp()
 });
}

document.getElementById('sendBtn').onclick=send;
document.getElementById('msgInput').addEventListener('keydown',e=>{
 if(e.key==='Enter') send();
});
</script>
</body>
</html>
